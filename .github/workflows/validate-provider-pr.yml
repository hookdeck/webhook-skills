name: Validate Provider PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/**'
      # The catalog check reads providers/ and runs the generator's sync code
      - 'providers/**'
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/validate-provider-pr.yml'

jobs:
  validate:
    name: Validate New Provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate new providers
        id: validate
        run: |
          chmod +x scripts/validate-provider.sh
          
          # Detect and validate new providers added in this PR
          if scripts/validate-provider.sh --detect-new; then
            echo "validation_passed=true" >> $GITHUB_OUTPUT
          else
            echo "validation_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Provider Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Re-run to capture output for summary
          if scripts/validate-provider.sh --detect-new 2>&1; then
            echo "All validations passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some validations failed. See job output for details." >> $GITHUB_STEP_SUMMARY
          fi

  # Job name kept so existing required-check settings still match
  manifest:
    name: Marketplace Manifest In Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 reached EOL on 2026-04-30; 24 also carries npm 11 (see
          # test-examples.yml for why npm 10 breaks installs).
          node-version: '24'

      - name: Check the catalog sources are complete
        run: |
          # PRs don't need to update README.md or marketplace.json: the Sync
          # Catalog workflow regenerates them after merge. This only checks it
          # can: every skill has a providers/<name>.yaml (or a curated plugin
          # in marketplace.base.json) and every provider has catalog.summary.
          ./scripts/generate-skills.sh sync --validate
