name: Sync Catalog

# README.md's provider table and .claude-plugin/marketplace.json are generated
# from providers/*.yaml, skills/*/SKILL.md and marketplace.base.json
# (scripts/skill-generator/lib/catalog.ts). Provider PRs don't touch them, so
# batches of provider PRs merge without conflicts. After each merge to main
# this regenerates both files and opens (or updates) a single PR with the
# result. If nothing changed, any open sync PR is closed.
#
# Requires: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". PRs opened with the default GITHUB_TOKEN don't
# trigger other workflows; to run CI on the sync PR, add a CATALOG_SYNC_TOKEN
# secret (a fine-grained PAT or GitHub App token with contents and
# pull-requests write access).

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'providers/**'
      - 'README.md'
      - '.claude-plugin/**'
      - 'scripts/skill-generator/**'
      - '.github/workflows/sync-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Each run regenerates from the latest main, so a newer run supersedes an older one
concurrency:
  group: sync-catalog
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate README and marketplace.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 reached EOL on 2026-04-30; 24 also carries npm 11 (see
          # test-examples.yml for why npm 10 breaks installs).
          node-version: '24'

      - name: Regenerate
        run: ./scripts/generate-skills.sh sync

      - name: Open or update the sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CATALOG_SYNC_TOKEN || github.token }}
          branch: chore/sync-catalog
          delete-branch: true
          add-paths: |
            README.md
            .claude-plugin/marketplace.json
          commit-message: 'chore: sync README and marketplace.json'
          title: 'chore: sync README and marketplace.json'
          body: |
            Regenerated by the Sync Catalog workflow after changes to main
            (`./scripts/generate-skills.sh sync`).

            README.md's provider table and `.claude-plugin/marketplace.json` are generated from
            `providers/*.yaml`, `skills/*/SKILL.md` and `scripts/skill-generator/marketplace.base.json`.
            To change a row or entry, edit those sources, not this PR. The PR is rebuilt from
            main on every merge, so it never conflicts.
