name: Test Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    name: Detect Changed Skills
    runs-on: ubuntu-latest
    outputs:
      changed_providers: ${{ steps.detect.outputs.providers }}
      shards: ${{ steps.shard.outputs.shards }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      run_all: ${{ steps.detect.outputs.run_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed providers
        id: detect
        run: |
          # On push to main, run all tests
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push to main - running all tests"
            echo "run_all=true" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Return all providers as JSON array
            PROVIDERS=$(ls -d skills/*-webhooks 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "providers=$PROVIDERS" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # On PR, detect changed skills
          echo "PR - detecting changed skills"
          echo "run_all=false" >> $GITHUB_OUTPUT
          
          # Get changed files compared to base branch
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          # Extract unique skill directories that changed
          CHANGED_PROVIDERS=$(echo "$CHANGED_FILES" | \
            grep -E '^skills/[^/]+/' | \
            sed 's|skills/\([^/]*\)/.*|\1|' | \
            sort -u | \
            grep -E '(-webhooks)$' || true)
          
          if [ -z "$CHANGED_PROVIDERS" ]; then
            echo "No skill changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "providers=[]" >> $GITHUB_OUTPUT
          else
            echo "Changed providers:"
            echo "$CHANGED_PROVIDERS"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Convert to JSON array
            PROVIDERS_JSON=$(echo "$CHANGED_PROVIDERS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "providers=$PROVIDERS_JSON" >> $GITHUB_OUTPUT
          fi

      # GitHub caps a matrix at 256 jobs, and on push to main every provider is
      # tested (270+ skills). Group providers into at most 100 shards per
      # framework; with 100 or fewer providers (most PRs) each shard is a
      # single provider, so job names stay "Express - <provider>".
      - name: Group providers into shards
        id: shard
        env:
          PROVIDERS: ${{ steps.detect.outputs.providers }}
        run: |
          COUNT=$(echo "$PROVIDERS" | jq 'length')
          SIZE=$(( (COUNT + 99) / 100 ))
          [ "$SIZE" -lt 1 ] && SIZE=1
          SHARDS=$(echo "$PROVIDERS" | jq -c --argjson size "$SIZE" '
            [ range(0; length; $size) as $i | .[$i:$i + $size]
              | { name: (if length == 1 then .[0] else "\(.[0]) … \(.[-1]) (\(length))" end),
                  providers: join(" ") } ]')
          echo "$COUNT providers in $(echo "$SHARDS" | jq length) shard(s) of up to $SIZE"
          echo "shards=$SHARDS" >> $GITHUB_OUTPUT

  test-express:
    name: Express - ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.detect-changes.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 for its bundled npm 11. npm 10 (bundled with Node 20 and 22)
          # crashes in `npm install` with "Cannot read properties of null (reading
          # 'edgesOut')" while resolving vitest's optional peer set -- see the
          # comment above test-nextjs. Node 20 is also EOL (2026-04-30).
          node-version: "24"
          cache: "npm"
          cache-dependency-path: skills/*/examples/express/package.json

      - name: Install and test
        env:
          PROVIDERS: ${{ matrix.shard.providers }}
        run: |
          failed=()
          for provider in $PROVIDERS; do
            echo "::group::$provider"
            if ! (cd "skills/$provider/examples/express" && npm install && npm test); then
              failed+=("$provider")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Express tests failed for: ${failed[*]}"
            exit 1
          fi

  # Requires npm >= 11. The Next.js examples devDepend on vitest 4.x, which declares
  # optional peer dependencies pinned to its own version (@vitest/ui,
  # @vitest/browser-playwright, @vitest/coverage-v8, ...). Now that the @vitest/* 5.x
  # line exists, npm 10's arborist resolves the wrong major while walking that peer
  # set and dies on a null node in #loadPeerSet, before a single test runs:
  #
  #   silly fetch manifest @vitest/browser-playwright@5.0.0
  #   TypeError: Cannot read properties of null (reading 'edgesOut')
  #       at #loadPeerSet (.../arborist/lib/arborist/build-ideal-tree.js:1289)
  #
  # Verified against a clean cache with `npm install vitest@4.1.10`: npm 10.9.4 fails,
  # npm 11.19.1 and 12.0.2 succeed. It is an npm bug, not a vitest one -- do not
  # "fix" it by bumping ~168 skills to vitest 5.
  test-nextjs:
    name: Next.js - ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.detect-changes.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 for its bundled npm 11. npm 10 (bundled with Node 20 and 22)
          # crashes in `npm install` with "Cannot read properties of null (reading
          # 'edgesOut')" while resolving vitest's optional peer set -- see the
          # comment above test-nextjs. Node 20 is also EOL (2026-04-30).
          node-version: "24"
          cache: "npm"
          cache-dependency-path: skills/*/examples/nextjs/package.json

      - name: Install and test
        env:
          PROVIDERS: ${{ matrix.shard.providers }}
        run: |
          failed=()
          for provider in $PROVIDERS; do
            echo "::group::$provider"
            if ! (cd "skills/$provider/examples/nextjs" && npm install && npm test); then
              failed+=("$provider")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Next.js tests failed for: ${failed[*]}"
            exit 1
          fi

  test-fastapi:
    name: FastAPI - ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.detect-changes.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: skills/*/examples/fastapi/requirements.txt

      - name: Install and test
        env:
          PROVIDERS: ${{ matrix.shard.providers }}
        run: |
          # One venv per provider, so one example's packages can't mask a
          # missing dependency in another example in the same shard
          failed=()
          for provider in $PROVIDERS; do
            echo "::group::$provider"
            venv="$RUNNER_TEMP/venv-$provider"
            if ! (cd "skills/$provider/examples/fastapi" \
                  && python -m venv "$venv" \
                  && "$venv/bin/pip" install -r requirements.txt \
                  && "$venv/bin/pytest" test_webhook.py -v); then
              failed+=("$provider")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::FastAPI tests failed for: ${failed[*]}"
            exit 1
          fi

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, test-express, test-nextjs, test-fastapi]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.has_changes }}" != "true" ]; then
            echo "No skill changes detected - tests skipped." >> $GITHUB_STEP_SUMMARY
            echo "No skill changes detected - tests skipped."
            exit 0
          fi
          
          echo "**Providers tested:** ${{ needs.detect-changes.outputs.changed_providers }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.run_all }}" = "true" ]; then
            echo "_Push to main - all providers tested_" >> $GITHUB_STEP_SUMMARY
          else
            echo "_PR - only changed providers tested_" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test-express.result }}" == "failure" ] || \
             [ "${{ needs.test-nextjs.result }}" == "failure" ] || \
             [ "${{ needs.test-fastapi.result }}" == "failure" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result:** Some tests failed" >> $GITHUB_STEP_SUMMARY
            echo "Some tests failed"
            exit 1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Result:** All tests passed!" >> $GITHUB_STEP_SUMMARY
          echo "All tests passed!"
