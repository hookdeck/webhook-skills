name: make
displayName: 'Make'
docs:
  webhooks: https://apps.make.com/http
  verification: https://apps.make.com/api-key-authentication-type
notes: >
  Automation platform (formerly Integromat); requests are built with the HTTP > Make a request
  module, like n8n and Zapier. Use the API key keychain with placement 'In the header' (query
  placement can't be checked); the key is sent as entered, including any prefix. No signature:
  requests are unsigned. Authenticate with a secret header the user adds via the HTTP module's API
  key keychain. The header name is user-chosen, so the examples read the header name from
  MAKE_WEBHOOK_HEADER (default 'Authorization') and the expected value from MAKE_WEBHOOK_SECRET (the
  exact, whole header value, including any 'Bearer ' prefix the user typed). Look the header up
  case-insensitively and compare the WHOLE value; do not strip or parse a 'Bearer ' prefix. This is
  what Hookdeck's Make source does (API key verification: header name + exact value). Missing header
  or mismatch: 401. Compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers (or on SHA-256 digests of both sides); Python uses hmac.compare_digest on
  bytes (encode both sides; never pass str, which raises on non-ASCII). SKILL.md and verification.md
  must say plainly that a static shared credential authenticates the sender, not the body, and gives
  no replay protection (no signature, no timestamp), so use HTTPS and rotate the credential if it
  leaks. Model on the n8n, zapier, brevo, assemblyai, honeybadger and coterie skills. The request
  method is user-chosen, so the examples must not be POST-only: accept POST, PUT, PATCH, DELETE and
  GET on the webhook route, and handle an empty body (e.g. GET). Body is whatever the scenario maps;
  use an illustrative {"event": ..., "data": ...} body. Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type works; parse JSON only after the credential
  check.
testScenario:
  events:
    - 'order.created'
    - 'scenario.failed'
  prompt: >
    Add an endpoint to my {framework} app that receives requests from a Make HTTP module.
    Authenticate them with the secret header from an API key keychain and handle the JSON
    payload, which has an event field such as {events}.
catalog:
  summary: 'Authenticate requests from a Make scenario''s HTTP module (unsigned: API key keychain header compared in full in constant time), route scenario payloads on a user-defined event field'
