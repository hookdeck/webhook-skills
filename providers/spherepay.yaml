name: spherepay
displayName: "SpherePay"
docs:
  webhooks: https://docs.spherepay.co/concepts/webhooks/overview
  verification: https://docs.spherepay.co/concepts/webhooks/verifying-signatures
  events: https://docs.spherepay.co/concepts/webhooks/event-catalog
notes: >
  SpherePay v2 webhooks (customer and transfer status changes), endpoints registered with POST
  /v2/webhook-endpoints. SpherePay (spherepay.co), stablecoin on- and off-ramp payments. Delivery
  (from the docs): Any 2xx within 15 seconds acknowledges. NO automatic retries: one attempt per event
  per endpoint; a failure is marked `failed` and can only be replayed manually through the Events API.
  Failures never disable the endpoint. At-least-once, unordered. SpherePay says: 'signature = hex(
  HMAC-SHA256( secret, "{timestamp}.{rawBody}" ) )' '`secret` — the endpoint's signing secret
  (`whsec_...`), returned once when you created the endpoint.' SIGNATURE SCHEME (it must match
  Hookdeck's SPHEREPAY source exactly: HMAC controller, algorithm sha256, header sphere-signature,
  encoding hex, signed_content_template "{header:sphere-timestamp}.{body}"). The Sphere-Signature
  header carries the bare lowercase hex digest, no prefix. The signature is lowercase hex HMAC-SHA256,
  keyed with the secret, over: the Sphere-Timestamp header value, then a literal ".", then the raw
  request body bytes. Build the signed message as BYTES, exactly as Hookdeck's template does: literal
  separators as UTF-8, header values as the exact header string encoded latin1 (Node
  Buffer.from(value, 'latin1'); Python value.encode('latin-1'); a header is never trimmed, parsed or
  re-formatted), and the raw body bytes as received, concatenated with Buffer.concat / b''.join. Never
  decode the body to a string and re-encode it, and never JSON.parse/JSON.stringify before verifying.
  The HMAC key is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared
  case-insensitively (as Hookdeck does): require exactly 64 hex characters, lowercase both sides (or
  decode both to bytes) before the constant-time compare. Compare the WHOLE header value as one digest
  (no list splitting, no prefix parsing). Secret: the endpoint's signing secret, used WHOLE as a plain
  UTF-8 HMAC key including its `whsec_` prefix. This is NOT Standard Webhooks (nothing is
  base64-decoded, hex digest); do not use the standardwebhooks or svix libraries and say so. Env var:
  SPHEREPAY_WEBHOOK_SECRET. Validate the signature's format before decoding it (exact length and
  alphabet), then compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it
  silently drops bad characters); Python uses hmac.compare_digest on bytes (never str) and
  base64.b64decode(..., validate=True). Missing or empty signature or signed header, malformed value
  or mismatch: 401. Timestamp window: do NOT reject old timestamps by default. Hookdeck retries and
  replays resend the original headers and timestamp, and Hookdeck itself applies no tolerance, so a
  fixed window would reject legitimate retries. Offer an opt-in tolerance (an env var such as
  SPHEREPAY_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say so in SKILL.md and verification.md
  (Sphere-Timestamp is Unix seconds, fresh on every attempt and replay). SpherePay makes ONE attempt
  per event (no automatic retries; replay through the Events API), so answer 2xx within 15 s. Events:
  dispatch on the body's `type` field. Documented event types (18): customer.created,
  customer.pending, customer.approved, customer.rejected, transfer.created, transfer.pendingFunding,
  transfer.pendingReview, transfer.fundsReceived, transfer.processing, transfer.succeeded,
  transfer.returned, transfer.pendingRefundInformation, transfer.refunded, transfer.failed (and 4
  more). Handle a few common ones and log the rest. Method: POST. Hookdeck's SpherePay source manages
  the method as POST, so the examples handle POST on the webhook route. Express examples must read the
  raw body with express.raw({ type: '*/*' }) so any content type works and the exact bytes are
  verified (Next.js: await request.arrayBuffer(); FastAPI: await request.body()); parse the body only
  after the check. PUBLISHED TEST VECTOR (verified against Hookdeck's template): the vendor's docs
  give a worked example, saved verbatim as JSON (secret, body string, headers) in
  /tmp/claude-0/-home-user/a6117e89-67f4-5ebf-9ebd-ebed152a5054/scratchpad/b14-skills/vectors/spherepay.json.
  Every example's test suite (Express, Next.js and FastAPI) must include it as a unit test: load or
  paste the exact body bytes (json.load the file, or copy the string exactly; do not pretty-print or
  re-serialise), and assert that the verifier accepts those headers and secret and computes
  4f04e86648d8f1341d431b4cfa00eaeb7c69b7b3fcee7dff97b24f95482a6be2. Add references/verification.md
  text naming the vector. Documented sample payloads (each JSON file's `body` is the payload as the
  vendor's docs show it) are in /home/user/regwt/b14-merge/samples-doc/providers/spherepay/latest/
  (customer.approved.json, transfer.succeeded.json); base the examples' test payloads on them.
  Hookdeck's source type is SPHEREPAY, labelled 'SpherePay'. Hookdeck shows this setup note for the
  source, and SKILL.md and references/setup.md must tell the user the same thing, verbatim: "Paste the
  whole secret, including the whsec_ prefix. SpherePay uses it as a plain HMAC key."
testScenario:
  events:
    - "customer.approved"
    - "transfer.succeeded"
    - "transfer.failed"
catalog:
  summary: "Verify SpherePay webhooks (`Sphere-Signature`: hex HMAC-SHA256 of `{Sphere-Timestamp}.{body}`, `whsec_` secret used as-is), handle customer and transfer events"
