name: taskade
displayName: "Taskade"
docs:
  webhooks: https://docs.taskade.com/developers/webhooks
  verification: https://docs.taskade.com/developers/webhooks#validate-delivery-signatures
notes: >
  Taskade (taskade.com), AI workspace and task management. Signed outbound webhooks are registered
  with `POST /api/v2/webhooks` (Pro and above), or in Settings > API, with a target URL, events and
  optional workspace scoping. Inbound automation webhooks and the no-code "automation + HTTP action"
  route are different surfaces and are not this row. Delivery (from the docs): target must be https,
  at most 2,048 characters after URL encoding; up to 100 event-workspace combinations per account.
  No retry, timeout or ordering is documented. SIGNATURE SCHEME (docs, #validate-delivery-signatures):
  every delivery is a POST with a JSON body and three headers. `X-Taskade-Timestamp` is the send time
  in unix seconds. `X-Taskade-Signature-V2` is `sha256=` + lowercase hex HMAC-SHA256, keyed with the
  registration `secret` (UTF-8 bytes, as-is), over the BYTES `<timestamp>.<raw body>` (the
  X-Taskade-Timestamp value, a literal period, then the raw body exactly as received, never
  re-serialized). `X-Taskade-Signature` is the older `sha256=` hex HMAC of the raw body alone; it still
  works but doesn't stop a replay. Taskade tells new receivers to check V2 and to reject a timestamp
  more than 5 minutes (300 seconds) from the local clock. Accept the signature with or without the
  `sha256=` prefix; require exactly 64 hex characters before decoding, then compare in constant time
  (Node: crypto.timingSafeEqual on equal-length Buffers; Python: hmac.compare_digest on bytes).
  Missing, malformed, mismatched or stale: 401. A copy that arrives inside the 5 minutes still passes,
  so handlers must be idempotent or record and skip repeats. Secret: the `secret` in the registration
  response, shown exactly once. Env var: TASKADE_WEBHOOK_SECRET. EVENTS: the six values the `events`
  array accepts are task.due, task.assigned, comment.created, project.created, project.assigned,
  project.joined. No delivery names its event: the body is the event's object with no envelope and
  no event header (docs: "Branch on the fields that you need, not on a type discriminator"; "If your
  handler must know which event arrived, register one URL for each event"). Classify on a top-level
  field only one event has, from the docs' Delivery payload table: taskEndDate (task.due),
  assignedNodes (task.assigned), commentBody (comment.created), creatorName (project.created),
  assigneeId (project.assigned), joinerUserId (project.joined). Never switch on an `event` or `type`
  field. The docs print field names only, no example bodies, so tests use those field names with
  placeholder values. The payloads under "Receiving Taskade events" belong to the no-code automation
  route, not to these deliveries. Method: POST. Express examples must read the raw body with
  express.raw({ type: '*/*' }) (Next.js: await request.arrayBuffer(); FastAPI: await request.body());
  parse the body only after the check. Hookdeck's source type is TASKADE, labelled 'Taskade'. Hookdeck
  shows this setup note for the source, and SKILL.md and references/setup.md must tell the user the
  same thing, verbatim: "Only webhooks registered through the Taskade public API (Pro plan and above)
  are supported. Legacy webhooks are unsigned and fail verification."
testScenario:
  events:
    - "task.due"
    - "task.assigned"
    - "project.created"
catalog:
  summary: "Verify Taskade webhooks (`X-Taskade-Signature-V2`: `sha256=` hex HMAC-SHA256 of the timestamp and raw body), handle task, comment and project events"
