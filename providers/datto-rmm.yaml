name: datto-rmm
displayName: 'Datto RMM'
docs:
  webhooks: https://rmm.datto.com/help/en/Content/3NEWUI/Setup/Integrations/GlobalWebhooks.htm
  verification: https://rmm.datto.com/help/en/Content/3NEWUI/Setup/Integrations/GlobalWebhooks.htm
notes: >
  RMM; covers Global Webhooks only (Setup > Integrations > Global Webhooks). Per-monitor webhooks
  have no header field and can't be verified; enabling Global Webhooks disables per-monitor ones. No
  signature: requests are unsigned. Authenticate with a secret header the user adds to the Global
  Webhook (Add Header). The header name is user-chosen, so the examples read the header name from
  DATTO_RMM_WEBHOOK_HEADER (default 'Authorization') and the expected value from
  DATTO_RMM_WEBHOOK_SECRET (the exact, whole header value, including any 'Bearer ' prefix the user
  typed). Look the header up case-insensitively and compare the WHOLE value; do not strip or parse a
  'Bearer ' prefix. This is what Hookdeck's Datto RMM source does (API key verification: header name
  + exact whole value). Missing header or mismatch: 401. Compare in constant time: Node checks
  lengths, then crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both
  sides); Python uses hmac.compare_digest on bytes (encode both sides; never pass str, which raises
  on non-ASCII). SKILL.md and verification.md must say plainly that a static shared credential
  authenticates the sender, not the body, and gives no replay protection (no signature, no
  timestamp), so use HTTPS and rotate the credential if it leaks. Model on the n8n, zapier, coterie
  and honeybadger skills on main (and the batch 5 iterable, oyster, fireberry and new-relic skills
  if present). Hookdeck's source type is DATTO_RMM, labelled 'Datto RMM'. Hookdeck shows this setup
  note for the source, and SKILL.md and references/setup.md must tell the user the same thing: "Use
  Global Webhooks. Per-monitor webhooks can't carry a secret header." The body is the author's
  template with [variable] substitutions (alert and device fields), with separate raised and
  resolved templates; content type JSON, text/plain or form-urlencoded. The body is a template the
  user writes; the vendor adds no event field, so the examples and test scenario use a clearly
  labelled illustrative payload. Accept non-JSON bodies. POST. Express examples must read the raw
  body with express.raw({ type: '*/*' }) so any content type works; parse the body only after the
  credential check.
testScenario:
  events:
    - 'alert raised (illustrative template)'
    - 'alert resolved (illustrative template)'
catalog:
  summary: 'Authenticate Datto RMM Global Webhooks (unsigned: a secret header compared in full in constant time), handle alert raised and resolved payloads from your template'
