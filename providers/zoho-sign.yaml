name: zoho-sign
displayName: 'Zoho Sign'
docs:
  webhooks: https://help.zoho.com/portal/en/kb/zoho-sign/admin-guide/articles/webhooks-management
  verification: https://help.zoho.com/portal/en/kb/zoho-sign/admin-guide/webhooks/articles/securing-zoho-sign-webhooks-with-hmac-authentication
notes: >
  E-signature. HMAC is opt-in per webhook (HMAC signature checkbox; you enter or generate a secret
  key, which can't be retrieved later). Header X-ZS-WEBHOOK-SIGNATURE: base64 HMAC-SHA256 of the raw
  payload keyed with the secret as UTF-8. The doc's 'HMAC SHA-256(payload+secret_key)' wording is
  misleading: a plain HMAC of the payload keyed with the secret matches the published sample (secret
  thisisthesamplekeyfortestingpurposes; the sample body literally starts with '{{', a doc typo, and
  only verifies with it included), payload+secret does not. Payload {requests: {...}, notifications:
  {operation_type, ...}}; operation_type like RequestSubmitted, RequestViewed,
  RequestSigningSuccess, RequestCompleted, RequestRejected, RequestRecalled, RequestExpired. Express
  examples must read the raw body with express.raw({ type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'RequestCompleted'
    - 'RequestSigningSuccess'
catalog:
  summary: 'Verify Zoho Sign webhook signatures (`X-ZS-WEBHOOK-SIGNATURE`, HMAC-SHA256 base64 of the raw body), handle `operation_type` events like `RequestCompleted` and `RequestSigningSuccess`'
