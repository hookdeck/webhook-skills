name: lodgix
displayName: "Lodgix"
docs:
  webhooks: https://support.lodgix.com/en/articles/15424136-webhooks
  verification: https://support.lodgix.com/en/articles/15424136-webhooks
notes: >
  Lodgix account webhooks (Modules > Integrations > Webhooks). Lodgix (lodgix.com), vacation-rental
  property management software. Delivery (from the docs): A non-2xx is retried with backoff (30 s, 5
  min, 30 min, 2 h, 6 h); a delivery ends Success, or Failed and then Exhausted. An endpoint that
  keeps failing can be disabled automatically and re-enabled from its card. Lodgix says: 'The
  signature is in the X-Lodgix-Signature header in the form sha256=<hash>, where the hash is:
  HMAC_SHA256(secret, "{X-Lodgix-Timestamp}.{raw request body}")' SIGNATURE SCHEME (it must match
  Hookdeck's LODGIX source exactly: HMAC controller, algorithm sha256, header x-lodgix-signature,
  encoding hex, signed_content_template "{header:x-lodgix-timestamp}.{body}"). The X-Lodgix-Signature
  header carries `sha256=<hex>`. The signature is lowercase hex HMAC-SHA256, keyed with the secret,
  over: the X-Lodgix-Timestamp header value, then a literal ".", then the raw request body bytes.
  Build the signed message as BYTES, exactly as Hookdeck's template does: literal separators as UTF-8,
  header values as the exact header string encoded latin1 (Node Buffer.from(value, 'latin1'); Python
  value.encode('latin-1'); a header is never trimmed, parsed or re-formatted), and the raw body bytes
  as received, concatenated with Buffer.concat / b''.join. Never decode the body to a string and
  re-encode it, and never JSON.parse/JSON.stringify before verifying. The HMAC key is the secret's
  UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared case-insensitively (as
  Hookdeck does): require exactly 64 hex characters, lowercase both sides (or decode both to bytes)
  before the constant-time compare. Strip a leading `sha256=` before validating the digest; Hookdeck's
  parser also accepts the bare digest, so accept the value with or without the prefix. Secret: the
  endpoint's secret, used as UTF-8. Env var: LODGIX_WEBHOOK_SECRET. Validate the signature's format
  before decoding it (exact length and alphabet), then compare in constant time: Node checks lengths,
  then crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig,
  'hex'|'base64') on an unvalidated value (it silently drops bad characters); Python uses
  hmac.compare_digest on bytes (never str) and base64.b64decode(..., validate=True). Missing or empty
  signature or signed header, malformed value or mismatch: 401. Timestamp window: do NOT reject old
  timestamps by default. Hookdeck retries and replays resend the original headers and timestamp, and
  Hookdeck itself applies no tolerance, so a fixed window would reject legitimate retries. Offer an
  opt-in tolerance (an env var such as LODGIX_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say so
  in SKILL.md and verification.md (X-Lodgix-Timestamp is Unix seconds). Events: the event name is in
  the X-Lodgix-Event header; message.received is the only documented event so far, and the body shape
  is undocumented, so the examples use a clearly labelled illustrative payload. Method: POST.
  Hookdeck's Lodgix source manages the method as POST, so the examples handle POST on the webhook
  route. Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type
  works and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI: await
  request.body()); parse the body only after the check. Hookdeck's source type is LODGIX, labelled
  'Lodgix'.
testScenario:
  events:
    - "message.received"
catalog:
  summary: "Verify Lodgix webhooks (`X-Lodgix-Signature`: `sha256=` hex HMAC-SHA256 of `{X-Lodgix-Timestamp}.{body}`), handle message.received events"
