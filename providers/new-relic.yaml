name: new-relic
displayName: 'New Relic'
docs:
  webhooks: https://docs.newrelic.com/docs/alerts/get-notified/notification-integrations/#webhook
  verification: https://docs.newrelic.com/docs/alerts/get-notified/notification-integrations/#custom-headers-auth-webhook
notes: >
  Observability; covers Alerts webhook destinations (workflow notifications). Use authorization:
  Basic Authentication only (Bearer Token and custom headers are alternatives and aren't covered).
  No signature. Authenticate with HTTP Basic auth, which is what Hookdeck's New Relic source
  verifies. The examples read NEW_RELIC_WEBHOOK_USERNAME and NEW_RELIC_WEBHOOK_PASSWORD, parse
  'Authorization: Basic base64(username:password)' (scheme case-insensitive, split on the first
  colon), and compare the username and the password each in constant time, evaluating both before
  deciding (no short-circuit). Missing or malformed header or mismatch: 401. Compare in constant
  time: Node checks lengths, then crypto.timingSafeEqual on equal-length Buffers (or on SHA-256
  digests of both sides); Python uses hmac.compare_digest on bytes (encode both sides; never pass
  str, which raises on non-ASCII). SKILL.md and verification.md must say plainly that a static
  shared credential authenticates the sender, not the body, and gives no replay protection (no
  signature, no timestamp), so use HTTPS and rotate the credential if it leaks. Model on the n8n,
  zapier, brevo, assemblyai, honeybadger and coterie skills. POST JSON from a Handlebars template
  the author can rewrite; the issue state isn't in a fixed field, so use an illustrative template
  body with e.g. issueId, title, state (ACTIVATED/ACKNOWLEDGED/CLOSED), priority, issuePageUrl and
  say so. Express examples must read the raw body with express.raw({ type: '*/*' }) so any content
  type works; parse JSON only after the credential check.
testScenario:
  events:
    - 'issue ACTIVATED (illustrative template)'
    - 'issue CLOSED (illustrative template)'
catalog:
  summary: 'Authenticate New Relic alert webhook destinations (unsigned Basic auth compared in constant time), handle issue activated, acknowledged and closed notifications from your template'
