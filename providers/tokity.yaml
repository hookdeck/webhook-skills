name: tokity
displayName: "Tokity"
docs:
  webhooks: https://help.tokity.com/article/5ya327c2uj
  verification: https://help.tokity.com/article/5ya327c2uj
  events: https://help.tokity.com/article/1e1w8rvqmi-data-sync-notifications
notes: >
  Tokity (tokity.com), formerly DeskDirector: client/tech portals on top of PSA ticketing
  (ConnectWise, Autotask...). Webhooks (Admin Portal > Advanced > Webhook) and Events actions both
  POST signed payloads; Delivery (from the docs): Retries, timeout and success codes are not
  documented. Events keep a 28-day run history with per-action delivery results; webhooks do not.
  Tokity's docs say: 'Custom header name is x-dd-signature.' 'byte[] secretBytes =
  Encoding.UTF8.GetBytes(secret); using HMACSHA256 hasher = new(secretBytes); ... return
  $"sha256={Convert.ToBase64String(sha256Bytes)}";' 'Read Request Body: The incoming HTTP request body
  is read as a raw payload.' From the docs (registry summary): `x-dd-signature: sha256=<base64>` =
  `sha256=` + standard Base64 of HMAC-SHA256(secret as UTF-8, raw body as UTF-8). SIGNATURE SCHEME (it
  must match Hookdeck's TOKITY source exactly: HMAC controller, algorithm "sha256", header_key
  "x-dd-signature", encoding "base64"). The x-dd-signature header carries `sha256=<base64>`. Strip a
  leading `sha256=` before validating the digest; Hookdeck's parser also accepts the bare digest, so
  accept the value with or without the prefix. The signature is standard base64 (padded) HMAC-SHA256,
  keyed with the secret, over the raw request body bytes only (no timestamp, id or other header is
  signed). Build the signed message as BYTES: the raw body bytes exactly as received, never decoded to
  a string and re-encoded, never JSON.parse/JSON.stringify'd before verifying. The HMAC key is the
  secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Base64 is compared exactly
  (case-sensitive, as Hookdeck does): require the 44-character padded standard-base64 form
  ([A-Za-z0-9+/]{43}=) and compare the strings, or the decoded bytes AND the re-encoded string, in
  constant time. Decoding alone is not enough: a value whose last character carries stray low bits
  decodes to the same bytes but Hookdeck rejects it, so the skill must reject it too. Secret: Each
  webhook registration (and each event) gets its own auto-generated secret, shown with "Display
  detail" and regenerable; used as UTF-8 bytes. Use it as UTF-8 bytes. Env var: TOKITY_WEBHOOK_SECRET.
  Validate the signature's format before decoding it (exact length and alphabet), then compare in
  constant time: Node checks lengths, then crypto.timingSafeEqual on equal-length Buffers, and never
  calls Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it silently drops bad characters);
  Python uses hmac.compare_digest on bytes (never str) and base64.b64decode(..., validate=True).
  Missing or empty signature header, malformed value or mismatch: 401. No timestamp is signed, so
  there is no replay window to check; do not invent one from unsigned headers or body fields. Events:
  there is no event-name field or header. A ticket webhook body is the ticket plus `from` (its
  previous state, null on creation), so diff to find the change; chat webhooks send an array. Method:
  POST. Hookdeck's Tokity source manages the method as POST, so the examples handle POST on the
  webhook route. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type works and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI:
  await request.body()); parse the body only after the check. Hookdeck's source type is TOKITY,
  labelled 'Tokity'.
testScenario:
  events:
    - "ticket_change"
    - "chat"
catalog:
  summary: "Verify Tokity webhooks (`x-dd-signature`: `sha256=` base64 HMAC-SHA256 of the raw body), handle ticket changes (with `from` previous state) and chat session updates"
