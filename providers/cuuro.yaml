name: 'cuuro'
displayName: 'Cuuro'
docs:
  webhooks: 'https://docs.cuuro.ai/integrations/webhooks'
  verification: 'https://docs.cuuro.ai/integrations/webhooks'
  events: 'https://docs.cuuro.ai/integrations/webhooks'
notes: >-
  Cuuro (cuuro.ai), an AI due-diligence platform for investors. API-integration webhooks report target-company
  creation and analysis creation/completion; sent by Svix. Standard Webhooks signature with svix-* headers:
  svix-id, svix-timestamp (Unix seconds), svix-signature (one or more space-separated 'v1,<base64>' entries).
  Signed content is '{svix-id}.{svix-timestamp}.{raw request body}', HMAC-SHA256, base64 output. Hookdeck
  core notes: Delivered by Svix. Header names are not documented; svix-* is the Svix default. SECRET:
  Not stated by Cuuro: the page names no secret location or format. Svix endpoint secrets are `whsec_<base64>`.
  Research: whsec_ (Svix-issued; https://docs.cuuro.ai/integrations/webhooks: 'Cuuro uses Svix to send
  our webhooks.'; prefix not printed). It starts with whsec_; the key is the base64-decoding of the part
  after whsec_. CUURO_WEBHOOK_SECRET holds the full whsec_ value. Verify with the svix library (npm 'svix',
  pip 'svix'), whose Webhook.verify reads svix-id, svix-timestamp and svix-signature and falls back to
  webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK (all three frameworks and the manual
  verifier): read the svix-* headers and, when svix-id is absent, fall back to the webhook-* headers (webhook-id,
  -timestamp, -signature), exactly as Hookdeck does; then hand the library (or manual check) the three
  values under the header names it expects (the svix library accepts either set itself, so pass it both
  sets of headers rather than only svix-*). Include a test that a delivery signed the same way but sent
  with the other prefix's headers is accepted. This matches Hookdeck's Cuuro source (Standard Webhooks,
  headers_prefix 'svix', a whsec_ secret base64-decoded after the prefix and any other secret used as
  its raw UTF-8 bytes, every v1 entry tried, other versions such as v1a ignored, no timestamp window;
  core also reads the other prefix's headers, webhook-* or svix-*). The library always enforces a fixed
  5-minute timestamp window. SKILL.md must say that Hookdeck retries and replays resend the original timestamp,
  so the library rejects late retries after 5 minutes, and point to a manual verifier in references/verification.md
  (HMAC-SHA256 over '{id}.{timestamp}.{raw body}' with the same key, compare every space-separated v1,<base64>
  entry in constant time after a length check, require the timestamp to be a plain positive integer) where
  the window can be dropped or widened. Missing headers or a bad signature: 400 or 401; handlers fail
  closed when the secret env var is unset. Verification notes: Cuuro names no headers itself; they are
  Svix's (svix-id, svix-timestamp, svix-signature). Body: {data, event}. `data.id` is the company or analysis
  id. Event type: Top-level `event` beside `data` (`{data: {id}, event}`) in all three examples. Event
  types (3 documented, list may not be exhaustive): startup.created, analysis.created, analysis.completed.
  Transport: JSON POST via Svix. Delivery: Cuuro states no acknowledgement, timeout or retry policy. Setup:
  Per API integration (Settings > Developers > integration > Webhooks): URL + events. No challenge. Express
  examples must read the raw body with express.raw({ type: '*/*' }) so any content type works and the
  exact bytes are verified; parse the body only after the check. Hookdeck's source type is CUURO, labelled
  'Cuuro'.
testScenario:
  events:
  - 'startup.created'
  - 'analysis.created'
  - 'analysis.completed'
catalog:
  summary: >-
    Verify Cuuro webhook signatures (Svix: `svix-id`, `svix-timestamp`, `svix-signature`, HMAC-SHA256,
    `whsec_` secret), handle startup.created, analysis.created and analysis.completed events
