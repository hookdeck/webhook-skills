name: modem-pay
displayName: "Modem Pay"
docs:
  webhooks: https://docs.modempay.com/documentation/core/webhooks
  verification: https://docs.modempay.com/documentation/core/webhooks#webhook-security-and-signature-validation
  events: https://docs.modempay.com/documentation/core/webhooks#event-structure
notes: >
  Modem Pay (modempay.com), a payment gateway in The Gambia (mobile money, cards, payouts; sample
  currency GMD). Docs are Mintlify pages and each has a Markdown twin: append .md to the path
  (https://docs.modempay.com/documentation/core/webhooks.md,
  https://docs.modempay.com/documentation/core/webhook-cli.md). Do not add claims the quotes below
  do not support. SETUP, verbatim: 'You can generate your unique Modem Pay webhook secret in the
  Modem Pay dashboard under Developers > Webhooks.' and 'Create a dedicated POST endpoint on your
  server to receive webhook events from Modem Pay. Ensure this endpoint is accessible over HTTPS'.
  BODY, verbatim: 'The event type is provided in the event field, while the main data is within the
  payload.' Documented sample: {"event": "charge.succeeded", "payload": {"id": "...", "type":
  "payment", "amount": 2500, "currency": "GMD", "payment_method": "qmoney", "customer": "...",
  "metadata": {}, "status": "completed", "test_mode": true, "transaction_reference": "VOAO1CFEN7",
  "payment_intent_id": "...", "createdAt": "...", "updatedAt": "...", ...}} (use a trimmed copy in
  tests, with obviously fake customer name/email/phone). The body has no event id or delivery id,
  and payload.id is the object's id, not the delivery's: dedupe on (event, payload.id) and say this
  is a suggestion, not a documented idempotency key. EVENTS, as listed on the webhooks page:
  customer.created, customer.updated, customer.deleted; payment_intent.created,
  payment_intent.cancelled, payment_intent.expired; charge.succeeded, charge.cancelled,
  charge.created, charge.updated, charge.expired; transfer.succeeded, transfer.cancelled,
  transfer.reversed, transfer.failed, transfer.flagged. The CLI page's trigger list also has
  charge.failed (and lacks payment_intent.expired, charge.expired); mention charge.failed as listed
  only by the CLI page. Handle a few in the examples (charge.succeeded, charge.updated,
  payment_intent.created, customer.created, transfer.succeeded, transfer.failed) and acknowledge
  (200) unknown events. SIGNATURE (it must match Hookdeck's MODEM_PAY source exactly: HMAC
  controller, algorithm "sha512", header_key "x-modem-signature", encoding "hex", no timestamp
  prefix): the x-modem-signature header is the bare lowercase hex HMAC-SHA512 (128 hex characters,
  no prefix such as sha512=) of the request body, keyed with the webhook secret's UTF-8 bytes as-is
  (no decoding, no prefix stripping). The vendor's own examples re-serialise the parsed JSON
  (JS: JSON.stringify(req.body); Flask: json.dumps(request.json), which uses different separators
  than JSON.stringify) before hashing; their SDK (npm modem-pay, webhooks.composeEventDetails)
  hashes the string as-is when given a string. Hookdeck hashes the raw body bytes. The examples
  must hash the RAW body bytes exactly as received, never re-serialised JSON, and SKILL.md must
  say why (re-serialising can change bytes; the raw body is what was sent). Do not use the vendor's
  Flask json.dumps pattern. Compare hex case-insensitively (Hookdeck does): require exactly 128 hex
  characters, lowercase it, then constant-time compare. Node: check the format with a regex first,
  then crypto.timingSafeEqual on equal-length Buffers; never call Buffer.from(sig, 'hex') on an
  unvalidated value. Python: hmac.compare_digest on bytes (never on str, which raises TypeError on
  non-ASCII header values). Missing or empty header, malformed value or mismatch: 401 (the vendor
  examples answer 400; say we use 401 for auth failures and either works for Modem Pay's retry
  logic since any non-2xx is a failure). There is no timestamp in the scheme, so no replay window
  exists; do not invent one. Env var: MODEM_PAY_WEBHOOK_SECRET (the vendor examples use
  MODEM_WEBHOOK_SECRET or MODEM_PAY_SECRET_HASH; mention that it's the same value). Test mode: the
  CLI ('npm install -g modem-pay-cli', 'modempay listen --forward-url=http://localhost:3000/...',
  'modempay trigger charge.succeeded') prints a test-mode signing secret; 'always use the webhook
  secret generated by the listen command', test and live secrets differ. RETRIES, verbatim: 'If
  your server fails to acknowledge a webhook event with a 200 OK HTTP response, Modem Pay will retry
  the delivery up to 3 times, with each retry spaced 10 minutes apart. A failure could be due to
  reasons such as server timeouts, network errors, or non-2xx response codes.' Respond 200 quickly
  and defer slow work. Undocumented, so do not invent: request timeout, source IPs, Content-Type
  header value (assume JSON but accept any content type), other headers. After verifying, treat
  every parsed field as untrusted: check that the body is an object, event is a string and payload
  is an object before reading into them (typeof / Array.isArray; FastAPI isinstance), so
  wrong-typed or non-JSON signed bodies get 400, never 500. Delivery: POST; Hookdeck's Modem Pay
  source manages the method as POST. Express examples must read the raw body with express.raw({
  type: '*/*' }) (Next.js: await request.arrayBuffer(); FastAPI: await request.body()); parse only
  after the check. Hookdeck's source type is MODEM_PAY, labelled 'Modem Pay': Hookdeck's source
  verifies the signature (never say 'at the edge'). Do not mention or link Standard Webhooks or
  Svix.
testScenario:
  events:
    - charge.succeeded
    - customer.created
    - transfer.succeeded
catalog:
  summary: "Verify Modem Pay webhooks (`x-modem-signature`, hex HMAC-SHA512 of the raw body), handle charge, payment intent, customer and transfer events"
