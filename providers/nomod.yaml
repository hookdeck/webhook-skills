name: 'nomod'
displayName: 'Nomod'
docs:
  webhooks: 'https://nomod.com/docs/webhooks/verifying-webhook-signatures'
  verification: 'https://nomod.com/docs/webhooks/verifying-webhook-signatures'
  events: 'https://nomod.com/docs/webhooks/how-webhooks-work'
notes: >-
  Nomod (nomod.com), a UAE payment-links and card-acceptance platform for SMEs. Webhooks report charge
  lifecycle events for the Nomod API and Nomod Hosted Checkout integration types; delivery and signing
  are Svix's (svix-* headers, Svix libraries). Standard Webhooks signature with svix-* headers: svix-id,
  svix-timestamp (Unix seconds), svix-signature (one or more space-separated 'v1,<base64>' entries). Signed
  content is '{svix-id}.{svix-timestamp}.{raw request body}', HMAC-SHA256, base64 output. Hookdeck core
  notes: Delivered by Svix. SECRET: Per webhook, in the dashboard (Settings > Tools & customisations >
  Apps & APIs > Webhooks > Signing secret). Secret format: `whsec_<base64>`; the key is the base64-decoded
  part after `whsec_` ("the base64 portion of your signing secret (the part after the whsec_ prefix)").
  Research: whsec_ (https://nomod.com/docs/webhooks/verifying-webhook-signatures: 'Compute HMAC-SHA256
  using the base64 portion of your signing secret (the part after the whsec_ prefix) as the key'). It
  starts with whsec_; the key is the base64-decoding of the part after whsec_. NOMOD_WEBHOOK_SECRET holds
  the full whsec_ value. Verify with the svix library (npm 'svix', pip 'svix'), whose Webhook.verify reads
  svix-id, svix-timestamp and svix-signature and falls back to webhook-id, webhook-timestamp and webhook-signature.
  HEADER FALLBACK (all three frameworks and the manual verifier): read the svix-* headers and, when svix-id
  is absent, fall back to the webhook-* headers (webhook-id, -timestamp, -signature), exactly as Hookdeck
  does; then hand the library (or manual check) the three values under the header names it expects (the
  svix library accepts either set itself, so pass it both sets of headers rather than only svix-*). Include
  a test that a delivery signed the same way but sent with the other prefix's headers is accepted. This
  matches Hookdeck's Nomod source (Standard Webhooks, headers_prefix 'svix', a whsec_ secret base64-decoded
  after the prefix and any other secret used as its raw UTF-8 bytes, every v1 entry tried, other versions
  such as v1a ignored, no timestamp window; core also reads the other prefix's headers, webhook-* or svix-*).
  The library always enforces a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries
  and replays resend the original timestamp, so the library rejects late retries after 5 minutes, and
  point to a manual verifier in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw body}'
  with the same key, compare every space-separated v1,<base64> entry in constant time after a length check,
  require the timestamp to be a plain positive integer) where the window can be dropped or widened. Missing
  headers or a bad signature: 400 or 401; handlers fail closed when the secret env var is unset. Verification
  notes: Raw body required ("Parsing it as JSON and re-serialising it will break the signature check").
  replay_window_seconds 300 is Nomod's instruction to receivers ("reject any request where the difference
  exceeds five minutes"). Body: {type, eventId, objectId, data}. `eventId` dedupes repeated deliveries;
  `objectId` is the charge (`ch_...`). Event type: Top-level `type` in the documented body `{type, eventId,
  objectId, data}`; the guide says to branch on it. Svix injects no type of its own, so this is Nomod's
  field. `data.events[].type` (`completed`) is the charge's own history, not the event type. Event types
  (8 documented, list may not be exhaustive): charge.created, charge.authorised, charge.completed, charge.failed,
  charge.cancelled, charge.refunded, charge.partially_refunded, charge.dispute.created. Transport: JSON
  POST via Svix; Nomod prints no Content-Type. Delivery: Return 200 fast; a slow response counts as a
  failure and is retried. Event logs kept 90 days. Setup: Per webhook: one integration type (Nomod API
  or Nomod Hosted Checkout) and one or more events; Owners and Admins only. No challenge. Express examples
  must read the raw body with express.raw({ type: '*/*' }) so any content type works and the exact bytes
  are verified; parse the body only after the check. Hookdeck's source type is NOMOD, labelled 'Nomod'.
testScenario:
  events:
  - 'charge.completed'
  - 'charge.created'
  - 'charge.authorised'
catalog:
  summary: >-
    Verify Nomod webhook signatures (`svix-signature`, Svix HMAC-SHA256, `whsec_` secret), handle
    charge.completed, charge.authorised, charge.failed and charge.refunded events
