name: spike-api
displayName: "Spike API"
docs:
  webhooks: https://docs.spikeapi.com/api-docs/webhooks
  verification: https://docs.spikeapi.com/api-docs/webhooks#signature
notes: >
  Spike API (spikeapi.com), a unified health and wearables data API. One webhook endpoint per
  application, configured in the admin console, is told about provider data updates and integration
  changes. Delivery (from the docs): Must answer exactly HTTP 200 within 30 s. Up to 10 retries with
  backoff: 5 s, 2 min, 30 min, 2 h, then every 12 h; the event is then discarded. Spike API's docs
  say: 'Each webhook event is signed using an HMAC-SHA256 signature for verification. The signature is
  included in the X-Body-Signature header.' 'The signature is computed by signing the raw request body
  as-is using a shared secret key. You can retrieve this key from the admin console.' 'if (signature
  !== hmac.digest("hex"))' From the docs (registry summary): hex(HMAC-SHA256(shared key, raw body)),
  the whole header value, no prefix (the Go, JavaScript and PHP samples all compare the bare hex
  digest). SIGNATURE SCHEME (it must match Hookdeck's SPIKE_API source exactly: HMAC controller,
  algorithm "sha256", header_key "x-body-signature", encoding "hex"). The x-body-signature header
  carries the bare lowercase hex digest, no prefix. Compare the WHOLE header value as one digest (no
  list splitting or prefix parsing). The signature is lowercase hex HMAC-SHA256, keyed with the
  secret, over the raw request body bytes only (no timestamp, id or other header is signed). Build the
  signed message as BYTES: the raw body bytes exactly as received, never decoded to a string and
  re-encoded, never JSON.parse/JSON.stringify'd before verifying. The HMAC key is the secret's UTF-8
  bytes, used as-is (not hex- or base64-decoded). Hex is compared case-insensitively (as Hookdeck
  does): require exactly 64 hex characters, lowercase both sides (or decode both to bytes) before the
  constant-time compare. Secret: A shared HMAC key retrieved from the admin console. Use it as UTF-8
  bytes. Env var: SPIKE_API_WEBHOOK_SECRET. Validate the signature's format before decoding it (exact
  length and alphabet), then compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on
  an unvalidated value (it silently drops bad characters); Python uses hmac.compare_digest on bytes
  (never str) and base64.b64decode(..., validate=True). Missing or empty signature header, malformed
  value or mismatch: 401. No timestamp is signed, so there is no replay window to check; do not invent
  one from unsigned headers or body fields. Events: the body is a JSON ARRAY of events, each with its
  own `event_type` (record_change, provider_integration_created, provider_integration_deleted); one
  delivery can batch several. Loop over every element. Method: POST. Hookdeck's Spike API source
  manages the method as POST, so the examples handle POST on the webhook route. Express examples must
  read the raw body with express.raw({ type: '*/*' }) so any content type works and the exact bytes
  are verified (Next.js: await request.arrayBuffer(); FastAPI: await request.body()); parse the body
  only after the check. Documented sample payloads (each JSON file's `body` is the payload as the
  vendor's docs show it) are in /home/user/regwt/main-ro/samples-doc/providers/spike-api/
  (latest/provider_integration_created.json, latest/record_change.json); base the examples' test
  payloads on them. Hookdeck's source type is SPIKE_API, labelled 'Spike API'.
testScenario:
  events:
    - "record_change"
    - "provider_integration_created"
    - "provider_integration_deleted"
catalog:
  summary: "Verify Spike API webhooks (`x-body-signature`: hex HMAC-SHA256 of the raw body), handle record changes and provider integration events"
