name: 'tensorlake'
displayName: 'Tensorlake'
docs:
  webhooks: 'https://docs.tensorlake.ai/webhooks/overview'
  verification: 'https://docs.tensorlake.ai/platform/webhooks/signature-verification'
  events: 'https://docs.tensorlake.ai/platform/webhooks/events'
notes: >-
  Tensorlake (tensorlake.ai), a document-ingestion and serverless sandbox / application platform. Project-scoped
  webhooks report sandbox, application and application-request lifecycle changes; Svix signs and delivers
  them. Standard Webhooks signature with svix-* headers: svix-id, svix-timestamp (Unix seconds), svix-signature
  (one or more space-separated 'v1,<base64>' entries). Signed content is '{svix-id}.{svix-timestamp}.{raw
  request body}', HMAC-SHA256, base64 output. Hookdeck core notes: Delivered by Svix. SECRET: Per destination
  (project > Webhooks > destination > Signing secret). Format `whsec_<base64>`. Research: whsec_ ("Under
  **Signing secret**, copy the value beginning with `whsec_`." https://docs.tensorlake.ai/platform/webhooks/signature-verification).
  It starts with whsec_; the key is the base64-decoding of the part after whsec_. TENSORLAKE_WEBHOOK_SECRET
  holds the full whsec_ value. Verify with the svix library (npm 'svix', pip 'svix'), whose Webhook.verify
  reads svix-id, svix-timestamp and svix-signature and falls back to webhook-id, webhook-timestamp and
  webhook-signature. HEADER FALLBACK (all three frameworks and the manual verifier): read the svix-* headers
  and, when svix-id is absent, fall back to the webhook-* headers (webhook-id, -timestamp, -signature),
  exactly as Hookdeck does; then hand the library (or manual check) the three values under the header
  names it expects (the svix library accepts either set itself, so pass it both sets of headers rather
  than only svix-*). Include a test that a delivery signed the same way but sent with the other prefix's
  headers is accepted. This matches Hookdeck's Tensorlake source (Standard Webhooks, headers_prefix 'svix',
  a whsec_ secret base64-decoded after the prefix and any other secret used as its raw UTF-8 bytes, every
  v1 entry tried, other versions such as v1a ignored, no timestamp window; core also reads the other prefix's
  headers, webhook-* or svix-*). The library always enforces a fixed 5-minute timestamp window. SKILL.md
  must say that Hookdeck retries and replays resend the original timestamp, so the library rejects late
  retries after 5 minutes, and point to a manual verifier in references/verification.md (HMAC-SHA256 over
  '{id}.{timestamp}.{raw body}' with the same key, compare every space-separated v1,<base64> entry in
  constant time after a length check, require the timestamp to be a plain positive integer) where the
  window can be dropped or widened. Missing headers or a bad signature: 400 or 401; handlers fail closed
  when the secret env var is unset. Verification notes: Tensorlake points at Svix's libraries and manual
  procedure; raw body required. Body: {event_id, event_type, event_version, occurred_at, project_id, source_id,
  source_revision, source_ordinal, data}. `event_id` is stable across retries; order by `source_revision`
  then `source_ordinal`. Event type: Top-level `event_type` of the versioned envelope `{event_id (evt_),
  event_type, event_version, occurred_at, project_id, source_id, source_revision, source_ordinal, data}`.
  Event types (12 documented, list may not be exhaustive): tensorlake.sandbox.created, tensorlake.sandbox.running,
  tensorlake.sandbox.suspended, tensorlake.sandbox.resumed, tensorlake.sandbox.terminated, tensorlake.sandbox.failed,
  tensorlake.application.created, tensorlake.application.updated, tensorlake.application.deleted, tensorlake.application.request.created,
  tensorlake.application.request.completed, tensorlake.application.request.failed. Transport: JSON POST
  via Svix. Delivery: At least once, unordered; a 2xx acknowledges the attempt. Delivery can be paused
  per destination. Setup: Per project destination (Tensorlake Cloud > Webhooks): name, HTTPS URL, selected
  event types; admins only. No challenge. Express examples must read the raw body with express.raw({ type:
  '*/*' }) so any content type works and the exact bytes are verified; parse the body only after the check.
  Hookdeck's source type is TENSORLAKE, labelled 'Tensorlake'.
testScenario:
  events:
  - 'tensorlake.sandbox.failed'
  - 'tensorlake.sandbox.created'
  - 'tensorlake.sandbox.running'
catalog:
  summary: >-
    Verify Tensorlake webhooks (delivered by Svix: `svix-id`, `svix-timestamp`, `svix-signature`, `whsec_`
    secret), handle `tensorlake.sandbox.failed`, `tensorlake.sandbox.running` and `tensorlake.application.request.completed` events
