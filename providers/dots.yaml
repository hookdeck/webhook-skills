name: 'dots'
displayName: 'Dots'
docs:
  webhooks: 'https://docs.usedots.com/references/webhooks'
  verification: 'https://docs.svix.com/receiving/verifying-payloads/how'
notes: >-
  Dots (usedots.com), a payouts API (payout links, flows, transfers, user onboarding). Webhooks are delivered
  through Svix and carry only the changed resource's id; receivers fetch the current state. Standard Webhooks
  signature with svix-* headers: svix-id, svix-timestamp (Unix seconds), svix-signature (one or more space-separated
  'v1,<base64>' entries). Signed content is '{svix-id}.{svix-timestamp}.{raw request body}', HMAC-SHA256,
  base64 output. Hookdeck core notes: Delivered by Svix. Header names are not documented; svix-* is the
  Svix default. SECRET: One signing secret per endpoint, noted when the endpoint is created in the Svix
  dashboard (reached from the Dots dashboard's API Management tab, per app or organization). Dots does
  not show its format; Svix secrets are `whsec_`-prefixed. Research: whsec_ (Svix-delivered: docs send
  users to the Svix dashboard and link Svix's verification docs; secret value itself not printed) https://docs.usedots.com/references/webhooks.
  It starts with whsec_; the key is the base64-decoding of the part after whsec_. DOTS_WEBHOOK_SECRET
  holds the full whsec_ value. Verify with the svix library (npm 'svix', pip 'svix'), whose Webhook.verify
  reads svix-id, svix-timestamp and svix-signature and falls back to webhook-id, webhook-timestamp and
  webhook-signature. HEADER FALLBACK (all three frameworks and the manual verifier): read the svix-* headers
  and, when svix-id is absent, fall back to the webhook-* headers (webhook-id, -timestamp, -signature),
  exactly as Hookdeck does; then hand the library (or manual check) the three values under the header
  names it expects (the svix library accepts either set itself, so pass it both sets of headers rather
  than only svix-*). Include a test that a delivery signed the same way but sent with the other prefix's
  headers is accepted. This matches Hookdeck's Dots source (Standard Webhooks, headers_prefix 'svix',
  a whsec_ secret base64-decoded after the prefix and any other secret used as its raw UTF-8 bytes, every
  v1 entry tried, other versions such as v1a ignored, no timestamp window; core also reads the other prefix's
  headers, webhook-* or svix-*). The library always enforces a fixed 5-minute timestamp window. SKILL.md
  must say that Hookdeck retries and replays resend the original timestamp, so the library rejects late
  retries after 5 minutes, and point to a manual verifier in references/verification.md (HMAC-SHA256 over
  '{id}.{timestamp}.{raw body}' with the same key, compare every space-separated v1,<base64> entry in
  constant time after a length check, require the timestamp to be a plain positive integer) where the
  window can be dropped or widened. Missing headers or a bad signature: 400 or 401; handlers fail closed
  when the secret env var is unset. Verification notes: Raw body is required (Svix). Body: {event}. Flat,
  ID-based bodies: `event` plus the resource's id field(s) (`payment_intent_id`, `flow_id`, `transfer_id`,
  `user_id`, `ach_account_id`, ...; user.onboarding_revoked adds `reason`), and `api_app_id` on app-originated
  webhooks sent to an organization-level endpoint. Event type: Top-level `event`, beside the resource
  id(s) (e.g. `flow_id`); every catalog example's `event` is its own name. App-originated webhooks to
  an organization-level endpoint also carry `api_app_id`. Event types (12 documented, list may not be
  exhaustive): payment_intent.updated, payment_method.updated, flow.updated, dispute.updated, payout_request.updated,
  organization.updated, app.updated, transfer.updated, payout_link.updated, user.updated, user.onboarded,
  user.onboarding_revoked. Transport: POST; each example is labelled application/json. Delivery: 2xx within
  15 s. No retry schedule or disabling policy is stated; delivery runs on Svix. Setup: Endpoints are added
  in the Svix dashboard linked from the Dots dashboard (per app, or organization-level), selecting event
  types (none selected = all events), optionally rate-limited. Dots recommends subscribing to the canonical
  .updated events and fetching the resource. No challenge or validation request is documented, so the
  row has no handshake block. Express examples must read the raw body with express.raw({ type: '*/*' })
  so any content type works and the exact bytes are verified; parse the body only after the check. Hookdeck's
  source type is DOTS, labelled 'Dots'.
testScenario:
  events:
  - 'payment_intent.updated'
  - 'payment_method.updated'
  - 'flow.updated'
catalog:
  summary: >-
    Verify Dots webhooks (delivered by Svix: `svix-id`, `svix-timestamp`, `svix-signature`, `whsec_` secret),
    handle payment, flow, dispute and payout events
