name: kit
displayName: 'Kit (ConvertKit)'
docs:
  webhooks: https://developers.kit.com/webhooks/overview
  verification: https://developers.kit.com/webhooks/verifying-signatures
  events: https://developers.kit.com/webhooks/event-types
notes: >
  Creator email marketing (formerly ConvertKit). Only new webhook endpoints (/v4/webhook_endpoints,
  app.kit.com/webhooks) are signed; legacy /v4/webhooks deliveries carry no signature. Header
  X-Kit-Signature: "t=<unix seconds>,v1=<hex>", several v1 during rotation. v1 = HMAC-SHA256 hex
  over "<t>.<raw body>" keyed with the endpoint secret, which starts with whsec_ but is used WHOLE
  as UTF-8 key bytes (NOT Standard Webhooks). The secret is used whole as a UTF-8 HMAC key. Do NOT
  use the standardwebhooks or svix libraries and do not strip or base64-decode the whsec_ prefix.
  Hookdeck retries and replays keep the original timestamp, so any timestamp freshness check must be
  opt-in via KIT_TIMESTAMP_TOLERANCE_SECONDS (default 0 = off), as the buildkite-webhooks and
  tailscale-webhooks skills do. Body is an envelope {delivery_id, events: [{id, type, created,
  data}]} with 1-100 events; dedupe on event id. Events (type) include subscriber.created,
  subscriber.activated, subscriber.unsubscribed, subscriber.bounced, subscriber.complained,
  subscriber.subscribed_to_form, subscriber.tag_added, subscriber.tag_removed. The docs list no
  purchase.created; subscriber.product_purchased is Planned and cannot be subscribed to yet.
  Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type
  verifies.
testScenario:
  events:
    - 'subscriber.created'
    - 'subscriber.tag_added'
catalog:
  summary: 'Verify Kit (ConvertKit) webhook signatures (`X-Kit-Signature` `t=<ts>,v1=<hex>`, HMAC-SHA256 over `{t}.{body}` keyed with the whole `whsec_` secret; not Standard Webhooks), handle subscriber.created, subscriber.activated, subscriber.unsubscribed and subscriber.tag_added events'
