name: kit
displayName: 'Kit (ConvertKit)'
docs:
  webhooks: https://developers.kit.com/webhooks/overview
  verification: https://developers.kit.com/webhooks/verifying-signatures
notes: >
  Creator email marketing (formerly ConvertKit). Only new webhook endpoints (/v4/webhook_endpoints,
  app.kit.com/webhooks) are signed; legacy /v4/webhooks deliveries carry no signature. Header
  X-Kit-Signature: "t=<unix seconds>,v1=<hex>", several v1 during rotation. v1 = HMAC-SHA256 hex
  over "<t>.<raw body>" keyed with the endpoint secret, which starts with whsec_ but is used WHOLE
  as UTF-8 key bytes (NOT Standard Webhooks). The secret is used whole as a UTF-8 HMAC key. Do NOT
  use the standardwebhooks or svix libraries and do not strip or base64-decode the whsec_ prefix.
  Hookdeck retries and replays keep the original timestamp, so any timestamp freshness check must be
  opt-in via KIT_TIMESTAMP_TOLERANCE_SECONDS (default 0 = off), as the buildkite-webhooks and
  tailscale-webhooks skills do. Events (type) include subscriber.created, subscriber.activated,
  subscriber.unsubscribed, subscriber.tag_added, purchase.created. Express examples must read the
  raw body with express.raw({ type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'subscriber.created'
catalog:
  summary: 'Verify Kit (ConvertKit) webhook signatures (`X-Kit-Signature` `t=<ts>,v1=<hex>`, HMAC-SHA256 over `{t}.{body}` keyed with the whole `whsec_` secret; not Standard Webhooks), handle subscriber and purchase events'
