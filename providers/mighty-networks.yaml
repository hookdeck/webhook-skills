name: mighty-networks
displayName: 'Mighty Networks'
docs:
  webhooks: https://docs.mightynetworks.com/api/webhooks
  verification: https://docs.mightynetworks.com/api/webhooks#security
notes: >
  Mighty Networks (community platform) webhooks, configured in Network settings with an API key.
  'Authentication: Configure an API key that will be included as a Bearer token in the Authorization
  header'; delivery example 'Authorization: Bearer YOUR_CONFIGURED_API_KEY'. No signature. The
  credential is the Authorization header. Hookdeck's Mighty Networks source compares the WHOLE
  Authorization header value to the configured key, so the examples read
  MIGHTY_NETWORKS_AUTHORIZATION = the full value as Mighty Networks sends it (e.g. 'Bearer <key>'),
  including any scheme prefix, and compare the whole Authorization header to it; do not strip, parse
  or base64-decode the prefix (Coterie pattern). Missing header or mismatch: 401. Compare in
  constant time: Node checks lengths, then crypto.timingSafeEqual on equal-length Buffers (or on
  SHA-256 digests of both sides); Python uses hmac.compare_digest on bytes (encode both sides; never
  pass str, which raises on non-ASCII). SKILL.md and verification.md must say plainly that a static
  shared credential authenticates the sender, not the body, and gives no replay protection (no
  signature, no timestamp), so use HTTPS and rotate the credential if it leaks. Model on the n8n,
  zapier, coterie and honeybadger skills on main. Hookdeck's source type is MIGHTY_NETWORKS,
  labelled 'Mighty Networks'. Hookdeck shows this setup note for the source, and SKILL.md and
  references/setup.md must tell the user the same thing, verbatim: "Paste "Bearer " followed by the
  API key you configured with the webhook in Mighty Networks." Body: {event_id, event_timestamp,
  event_type, payload}; event_type carries the event name with a 'Hook' suffix (PostCreatedHook)
  while the reference pages name events without it (PostCreated, MemberJoined, MemberPurchased,
  RsvpCreated, ...), so normalise by stripping a trailing 'Hook' before dispatch. Dedupe on
  event_id. Any 2xx within 10 seconds; retried up to 5 times. POST. Express examples must read the
  raw body with express.raw({ type: '*/*' }) so any content type works (and, for signatures, the
  exact bytes are verified); parse the body only after the check.
testScenario:
  events:
    - 'MemberJoined'
    - 'PostCreated'
    - 'MemberPurchased'
catalog:
  summary: 'Authenticate Mighty Networks webhooks (unsigned: the whole `Authorization: Bearer <key>` value compared in constant time), handle member, post, purchase and RSVP events'
