name: jumpcloud
displayName: 'JumpCloud'
docs:
  webhooks: https://jumpcloud.com/support/create-webhook-channels
  verification: https://jumpcloud.com/support/create-webhook-channels
notes: >
  Directory/IAM; covers Webhook Channels (Org Settings > Notifications). Authentication: None, Basic
  (username/password), Token, plus up to 25 custom headers; only Basic is covered. No signature.
  Authenticate with HTTP Basic auth, which is what Hookdeck's JumpCloud source verifies. The
  examples read JUMPCLOUD_WEBHOOK_USERNAME and JUMPCLOUD_WEBHOOK_PASSWORD, parse 'Authorization:
  Basic base64(username:password)' (scheme case-insensitive, split on the first colon), and compare
  the username and the password each in constant time, evaluating both before deciding (no
  short-circuit). Missing or malformed header or mismatch: 401. The docs don't say whether Basic
  credentials are sent preemptively. Say that the credentials must arrive on the first request: a
  401 + WWW-Authenticate challenge flow won't work through Hookdeck, which verifies the request as
  received. Compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers (or on SHA-256 digests of both sides); Python uses hmac.compare_digest on
  bytes (encode both sides; never pass str, which raises on non-ASCII). SKILL.md and verification.md
  must say plainly that a static shared credential authenticates the sender, not the body, and gives
  no replay protection (no signature, no timestamp), so use HTTPS and rotate the credential if it
  leaks. Model on the n8n, zapier, brevo, assemblyai, honeybadger and coterie skills. Body is an
  alert notification (alert_id, alert_title, category, di_event, event_description, priority,
  rule_id, status, ...); no example body or category values are documented, so mark the test payload
  illustrative. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type works; parse JSON only after the credential check.
testScenario:
  events:
    - 'alert notification (illustrative)'
catalog:
  summary: 'Authenticate JumpCloud webhook channel notifications (unsigned HTTP Basic auth compared in constant time), handle alert notifications'
