name: fourkites
displayName: 'FourKites'
docs:
  webhooks: https://docs.fourkites.com/fourkites-api-reference/webhooks
  verification: https://docs.fourkites.com/fourkites-api-reference/webhooks
notes: >
  Supply chain visibility; 'Standard Webhooks' is FourKites' licensed product name, not the
  standardwebhooks.com spec. Credentials are supplied to FourKites when subscribing: Basic, API Key
  / Auth Header, or OAuth2; only Basic is covered. No signature. Authenticate with HTTP Basic auth,
  which is what Hookdeck's FourKites source verifies. The examples read FOURKITES_WEBHOOK_USERNAME
  and FOURKITES_WEBHOOK_PASSWORD, parse 'Authorization: Basic base64(username:password)' (scheme
  case-insensitive, split on the first colon), and compare the username and the password each in
  constant time, evaluating both before deciding (no short-circuit). Missing or malformed header or
  mismatch: 401. The docs don't say whether Basic credentials are sent preemptively. Say that the
  credentials must arrive on the first request: a 401 + WWW-Authenticate challenge flow won't work
  through Hookdeck, which verifies the request as received. Compare in constant time: Node checks
  lengths, then crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both
  sides); Python uses hmac.compare_digest on bytes (encode both sides; never pass str, which raises
  on non-ASCII). SKILL.md and verification.md must say plainly that a static shared credential
  authenticates the sender, not the body, and gives no replay protection (no signature, no
  timestamp), so use HTTPS and rotate the credential if it leaks. Model on the n8n, zapier, brevo,
  assemblyai, honeybadger and coterie skills. Body has MessageType: LOAD_CREATION, LOCATION_UPDATE,
  TRACKING_UPDATE, STOP_ETA_UPDATED, STOP_ARRIVAL, STOP_DEPARTURE, STOP_AUTO_COMPLETED,
  MANUALLY_DELIVERED, ... Express examples must read the raw body with express.raw({ type: '*/*' })
  so any content type works; parse JSON only after the credential check.
testScenario:
  events:
    - 'LOAD_CREATION'
    - 'STOP_ARRIVAL'
    - 'TRACKING_UPDATE'
catalog:
  summary: 'Authenticate FourKites callbacks (unsigned HTTP Basic auth compared in constant time), handle `MessageType`s like `LOAD_CREATION`, `STOP_ARRIVAL` and `TRACKING_UPDATE`'
