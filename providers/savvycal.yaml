name: savvycal
displayName: 'SavvyCal'
docs:
  webhooks: https://developers.savvycal.com/webhooks
  verification: https://developers.savvycal.com/webhooks#securing-webhooks
notes: >
  Scheduling. Header x-savvycal-signature: HMAC-SHA256 of the raw body keyed with the webhook's
  secret (integration settings). The docs' header example is "sha256=<UPPERCASE hex>" while the
  Elixir sample compares the bare uppercase digest, so accept both: strip an optional sha256= prefix
  and compare hex case-insensitively. No timestamp, so dedupe on the payload id. Payload JSON has
  top-level type and id. Event types: event.created, event.requested, event.approved,
  event.declined, event.rescheduled, event.changed, event.canceled, event.checkout.pending,
  event.checkout.expired, event.checkout.completed, event.attendee.added, event.attendee.canceled,
  event.attendee.rescheduled, poll.response.created, poll.response.updated,
  workflow.action.triggered. Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'event.created'
    - 'event.canceled'
    - 'event.checkout.completed'
catalog:
  summary: 'Verify SavvyCal webhook signatures (`x-savvycal-signature`, HMAC-SHA256 hex of the raw body, optional `sha256=` prefix, any case), handle `event.created`, `event.rescheduled` and `event.canceled` events'
