name: stigg
displayName: 'Stigg'
docs:
  webhooks: https://docs.stigg.io/documentation/native-integrations/events/webhooks
  verification: https://docs.stigg.io/documentation/native-integrations/events/webhooks#verifying-webhook-secret
  events: https://docs.stigg.io/openapi/stigg-webhooks.yaml
notes: >
  Pricing and entitlements platform. No HMAC yet (on Stigg's roadmap): each event carries the
  webhook secret (from the webhook details page) in the Stigg-Webhooks-Secret header. Verify it
  against STIGG_WEBHOOK_SECRET. No payload signature. Verify the shared token with a constant-time
  compare (crypto.timingSafeEqual / hmac.compare_digest, hashing both sides or checking lengths
  first), like the batch 1 n8n, zapier and brevo skills. The body is JSON with the event name in
  `type` and a unique `messageId` for de-duplication (e.g. customer.created, customer.updated,
  subscription.created, subscription.updated, subscription.canceled, entitlements.updated).
  Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type
  verifies.
testScenario:
  events:
    - 'subscription.created'
    - 'customer.created'
    - 'entitlements.updated'
catalog:
  summary: 'Authenticate Stigg webhooks (unsigned: `Stigg-Webhooks-Secret` header compared with the webhook secret in constant time), handle customer.created, subscription.created, subscription.canceled and entitlements.updated events'
