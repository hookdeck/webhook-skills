name: felloh
displayName: "Felloh"
docs:
  webhooks: https://developers.felloh.com/webhooks
  verification: https://developers.felloh.com/webhooks
notes: >
  Felloh (felloh.com), payments and trust-account infrastructure for UK travel businesses. Webhooks
  are registered in the dashboard (Developer Configuration): URL, the events to listen for, optionally
  child organisations; a signing key is shown once. Delivery (from the docs): Non-2xx is a failure.
  Transaction status events are retried up to 5 times about a minute apart; refund, booking and user
  events are sent once with no retry. 30 s timeout. Logs kept 30 days. Test deliveries are never
  retried. Felloh's docs say: 'Felloh signs all webhook payloads using an HMAC-SHA256 signature
  (available when creating webhooks in dashboard). The signature is generated by hashing the full JSON
  payload with a shared secret key (the signing key shown when the webhook was created), and it is
  sent in the X-Signature HTTP header of each request.' 'const expected = crypto . createHmac (
  'sha256' , secret ) . update ( rawBody ) . digest ( 'hex' ) ;' 'The raw request body. Must not be
  parsed or modified — use the raw body as received.' From the docs (registry summary):
  hex(HMAC-SHA256(signing key, raw body)), the whole header value with no prefix (the samples compare
  timing-safe against the hex digest). SIGNATURE SCHEME (it must match Hookdeck's FELLOH source
  exactly: HMAC controller, algorithm "sha256", header_key "x-signature", encoding "hex"). The
  x-signature header carries the bare lowercase hex digest, no prefix. Compare the WHOLE header value
  as one digest (no list splitting or prefix parsing). The signature is lowercase hex HMAC-SHA256,
  keyed with the secret, over the raw request body bytes only (no timestamp, id or other header is
  signed). Build the signed message as BYTES: the raw body bytes exactly as received, never decoded to
  a string and re-encoded, never JSON.parse/JSON.stringify'd before verifying. The HMAC key is the
  secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared case-insensitively
  (as Hookdeck does): require exactly 64 hex characters, lowercase both sides (or decode both to
  bytes) before the constant-time compare. Secret: The per-webhook signing key, generated when the
  webhook is created in the dashboard and shown once. Use it as UTF-8 bytes. Env var:
  FELLOH_WEBHOOK_SECRET. Validate the signature's format before decoding it (exact length and
  alphabet), then compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it
  silently drops bad characters); Python uses hmac.compare_digest on bytes (never str) and
  base64.b64decode(..., validate=True). Missing or empty signature header, malformed value or
  mismatch: 401. No timestamp is signed, so there is no replay window to check; do not invent one from
  unsigned headers or body fields. Dashboard test deliveries carry `X-Felloh-Test: true` and are
  signed with the real key. Events: there is no event-name field or header; the events are chosen when
  the webhook is registered. Tell deliveries apart by shape (transaction vs booking objects). Method:
  POST. Hookdeck's Felloh source manages the method as POST, so the examples handle POST on the
  webhook route. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type works and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI:
  await request.body()); parse the body only after the check. Documented sample payloads (each JSON
  file's `body` is the payload as the vendor's docs show it) are in
  /home/user/regwt/main-ro/samples-doc/providers/felloh/ (latest/booking.json,
  latest/refund-status.json, latest/transaction-status.json, latest/user-create.json); base the
  examples' test payloads on them. Hookdeck's source type is FELLOH, labelled 'Felloh'.
testScenario:
  events:
    - "transaction-status"
    - "booking"
catalog:
  summary: "Verify Felloh webhook signatures (`X-Signature`, hex HMAC-SHA256 of the raw body), handle transaction-status, refund-status and booking events"
