name: fusionauth
displayName: FusionAuth
docs:
  webhooks: https://fusionauth.io/docs/events/
  events: https://fusionauth.io/docs/events/reference/
  verification: https://fusionauth.io/docs/events/webhooks/signing
notes: >
  Identity and access management platform. Uses JWT-based signature verification.
  Signing is opt-in (since 1.48.0). The X-FusionAuth-Signature-JWT header carries a JWT signed
  with a Key Master key (HMAC, RSA, EC or EdDSA) whose request_body_sha256 claim is the base64
  SHA-256 of the raw body. Asymmetric public keys are published at /.well-known/jwks.json.
testScenario:
  events:
    - user.create
    - user.login.success
catalog:
  summary: Verify FusionAuth JWT webhook signatures, handle user, login, and registration events
  marketplace:
    description: Verify FusionAuth JWT webhook signatures (RSA via JWKS), handle user, login, and registration events.
    keywords:
    - webhooks
    - fusionauth
    - auth
    - jwt
