name: 'layerswap'
displayName: 'Layerswap'
docs:
  webhooks: 'https://docs.layerswap.io/api/webhooks'
  verification: 'https://docs.layerswap.io/api/webhooks'
notes: >-
  Layerswap (layerswap.io), a crypto bridging and exchange-to-chain swap API. Webhooks push swap status
  updates per Partner Dashboard app, delivered through Svix. Standard Webhooks signature with svix-* headers:
  svix-id, svix-timestamp (Unix seconds), svix-signature (one or more space-separated 'v1,<base64>' entries).
  Signed content is '{svix-id}.{svix-timestamp}.{raw request body}', HMAC-SHA256, base64 output. Hookdeck
  core notes: Delivered by Svix. SECRET: Per app, the webhook secret shown in the Partner Dashboard's
  Webhooks section. Its format is not shown; Svix secrets are `whsec_`-prefixed. Research: whsec_ (Svix-issued;
  docs state Svix delivery but print no literal secret). It starts with whsec_; the key is the base64-decoding
  of the part after whsec_. LAYERSWAP_WEBHOOK_SECRET holds the full whsec_ value. Verify with the svix
  library (npm 'svix', pip 'svix'), whose Webhook.verify reads svix-id, svix-timestamp and svix-signature
  and falls back to webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK (all three frameworks
  and the manual verifier): read the svix-* headers and, when svix-id is absent, fall back to the webhook-*
  headers (webhook-id, -timestamp, -signature), exactly as Hookdeck does; then hand the library (or manual
  check) the three values under the header names it expects (the svix library accepts either set itself,
  so pass it both sets of headers rather than only svix-*). Include a test that a delivery signed the
  same way but sent with the other prefix's headers is accepted. This matches Hookdeck's Layerswap source
  (Standard Webhooks, headers_prefix 'svix', a whsec_ secret base64-decoded after the prefix and any other
  secret used as its raw UTF-8 bytes, every v1 entry tried, other versions such as v1a ignored, no timestamp
  window; core also reads the other prefix's headers, webhook-* or svix-*). The library always enforces
  a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries and replays resend the original
  timestamp, so the library rejects late retries after 5 minutes, and point to a manual verifier in references/verification.md
  (HMAC-SHA256 over '{id}.{timestamp}.{raw body}' with the same key, compare every space-separated v1,<base64>
  entry in constant time after a length check, require the timestamp to be a plain positive integer) where
  the window can be dropped or widened. Missing headers or a bad signature: 400 or 401; handlers fail
  closed when the secret env var is unset. Verification notes: Raw body is required ("Read the raw body
  before JSON middleware changes it"). Body: {swap, quote, deposit_actions}. A "representative shape"
  (placeholders such as `SWAP_ID`, `0x...`); `swap` carries `id`, `status`, addresses, amounts, `metadata`
  and `transactions`. Event type: The representative shape is `{swap, quote, deposit_actions}` with no
  event field; `swap.status` (e.g. `ls_transfer_pending`) is the swap's lifecycle state, not a documented
  event name, so it is not recorded as the discriminator. Transport: POST of a JSON swap object. Delivery:
  No retry schedule, timeout or ordering guarantee is documented; receivers should dedupe by swap ID and
  status and reconcile with `GET /swaps/{id}`. Setup: One or more endpoint URLs per app in the Partner
  Dashboard's Webhooks section; no per-event selection is documented. No challenge or validation request
  is documented, so the row has no handshake block. Express examples must read the raw body with express.raw({
  type: '*/*' }) so any content type works and the exact bytes are verified; parse the body only after
  the check. Hookdeck's source type is LAYERSWAP, labelled 'Layerswap'.
testScenario:
  events:
  - 'ls_transfer_pending'
  - 'completed'
  - 'refunded'
catalog:
  summary: >-
    Verify Layerswap webhook signatures (`svix-id`, `svix-timestamp`, `svix-signature`, HMAC-SHA256, `whsec_`
    secret), handle swap status updates (ls_transfer_pending, completed, failed, pending_refund, refunded)
