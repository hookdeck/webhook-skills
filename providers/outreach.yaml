name: outreach
displayName: 'Outreach'
docs:
  webhooks: https://developers.outreach.io/api/webhooks
  verification: https://developers.outreach.io/api/webhooks#authenticity-validation
notes: >
  Sales engagement platform. Webhooks are signed only when you set a secret attribute on the webhook
  (via the API); without one there is no header, and Hookdeck's Outreach source fails verification,
  so the skill must say to set a secret. Header Outreach-Webhook-Signature: bare hex HMAC-SHA256 of
  the raw body keyed with the secret. Payload is JSON:API: data {type, id, attributes,
  relationships}, meta {deliveredAt, eventName}; eventName is like prospect.created,
  prospect.updated, sequenceState.created, call.created. Express examples must read the raw body
  with express.raw({ type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'prospect.created'
    - 'prospect.updated'
catalog:
  summary: 'Verify Outreach webhook signatures (`Outreach-Webhook-Signature`, HMAC-SHA256 hex of the raw body; set a secret on the webhook), handle events like `prospect.created`'
