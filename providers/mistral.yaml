name: mistral
displayName: 'Mistral'
docs:
  webhooks: https://docs.mistral.ai/studio/audio/voice-agents/webhooks
  verification: https://docs.mistral.ai/studio/audio/voice-agents/webhooks#verify-and-handle
notes: >
  Mistral AI Studio voice agents webhooks (call lifecycle). Header x-mistral-signature:
  "hmac-sha256=<hex>", HMAC-SHA256 hex of the raw request body keyed with the endpoint signing
  secret (generated by the platform when you create the endpoint; can't be rotated) as UTF-8. Strip
  the hmac-sha256= prefix before comparing. Events are named in the body `event` field:
  call_started, call_ended, call_failed. Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'call_started'
    - 'call_ended'
    - 'call_failed'
catalog:
  summary: 'Verify Mistral voice agent webhook signatures (`x-mistral-signature`, HMAC-SHA256), handle call_started, call_ended and call_failed events'
