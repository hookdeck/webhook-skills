name: opsgenie
displayName: 'Opsgenie'
docs:
  webhooks: https://support.atlassian.com/opsgenie/docs/integrate-opsgenie-with-webhook/
  verification: https://support.atlassian.com/opsgenie/docs/integrate-opsgenie-with-webhook/
notes: >
  Incident alerting (Atlassian). Opsgenie is end-of-sale and support ends in April 2027 (customers
  are moving to Jira Service Management / Compass); SKILL.md must say so. No signature: requests are
  unsigned. Authenticate with a secret header the user adds as a custom header on the Webhook
  integration. The header name is user-chosen, so the examples read the header name from
  OPSGENIE_WEBHOOK_HEADER (default 'Authorization') and the expected value from
  OPSGENIE_WEBHOOK_SECRET (the exact, whole header value, including any 'Bearer ' prefix the user
  typed). Look the header up case-insensitively and compare the WHOLE value; do not strip or parse a
  'Bearer ' prefix. This is what Hookdeck's Opsgenie source does (API key verification: header name
  + exact value). Missing header or mismatch: 401. Compare in constant time: Node checks lengths,
  then crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both sides); Python
  uses hmac.compare_digest on bytes (encode both sides; never pass str, which raises on non-ASCII).
  SKILL.md and verification.md must say plainly that a static shared credential authenticates the
  sender, not the body, and gives no replay protection (no signature, no timestamp), so use HTTPS
  and rotate the credential if it leaks. Model on the n8n, zapier, brevo, assemblyai, honeybadger
  and coterie skills. Body has an action field: Create, Acknowledge, UnAcknowledge, AddNote,
  AddTags, RemoveTags, Close, AssignOwnership, TakeOwnership, Delete, Escalate, UpdatePriority,
  UpdateDescription, UpdateMessage, AddTeam, AddRecipient (custom actions send their own name), plus
  alert and source objects. Express examples must read the raw body with express.raw({ type: '*/*'
  }) so any content type works; parse JSON only after the credential check.
testScenario:
  events:
    - 'Create'
    - 'Acknowledge'
    - 'Close'
catalog:
  summary: 'Authenticate Opsgenie Webhook integration calls (unsigned: a secret custom header compared in full in constant time), handle alert actions like `Create`, `Acknowledge` and `Close`'
