name: quicknode
displayName: "Quicknode"
docs:
  webhooks: https://www.quicknode.com/docs/webhooks/getting-started
  verification: https://www.quicknode.com/guides/quicknode-products/streams/validating-incoming-streams-webhook-messages
notes: >
  Quicknode Streams (webhook destination) and Quicknode Webhooks, which share one signature. Quicknode
  (quicknode.com), blockchain infrastructure. Two products POST to an HTTP endpoint with the same
  X-QN-* signature: Webhooks (template-filtered on-chain events) and Streams (a dataset pipeline whose
  webhook destination delivers each block or batch). Delivery (from the docs): Streams: 2xx within the
  configured timeout (default 30 s); retries every N seconds (default 1) and pauses after N failed
  retries (default 3); blocks are delivered in sequence. Webhooks: "automatic retries for non-200
  responses", schedule unstated. Quicknode says: 'X-QN-Nonce: A unique string that prevents replay
  attacks X-QN-Signature: The HMAC signature you need to verify X-QN-Timestamp: The timestamp when the
  message was signed' 'const signatureData = nonce + timestamp + payload;' 'The HMAC is always
  computed over the decoded (uncompressed) JSON payload' SIGNATURE SCHEME (it must match Hookdeck's
  QUICKNODE source exactly: HMAC controller, algorithm sha256, header x-qn-signature, encoding hex,
  signed_content_template "{header:x-qn-nonce}{header:x-qn-timestamp}{body}"). The X-QN-Signature
  header carries the bare lowercase hex digest, no prefix. The signature is lowercase hex HMAC-SHA256,
  keyed with the secret, over: the X-QN-Nonce header value, then the X-QN-Timestamp header value, then
  the raw request body bytes. Where two parts are adjacent above there is NO separator between them.
  Build the signed message as BYTES, exactly as Hookdeck's template does: literal separators as UTF-8,
  header values as the exact header string encoded latin1 (Node Buffer.from(value, 'latin1'); Python
  value.encode('latin-1'); a header is never trimmed, parsed or re-formatted), and the raw body bytes
  as received, concatenated with Buffer.concat / b''.join. Never decode the body to a string and
  re-encode it, and never JSON.parse/JSON.stringify before verifying. The HMAC key is the secret's
  UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared case-insensitively (as
  Hookdeck does): require exactly 64 hex characters, lowercase both sides (or decode both to bytes)
  before the constant-time compare. Compare the WHOLE header value as one digest (no list splitting,
  no prefix parsing). Secret: the stream's or webhook's security token from the Quicknode dashboard,
  used as UTF-8. Env var: QUICKNODE_WEBHOOK_SECRET. Validate the signature's format before decoding it
  (exact length and alphabet), then compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on
  an unvalidated value (it silently drops bad characters); Python uses hmac.compare_digest on bytes
  (never str) and base64.b64decode(..., validate=True). Missing or empty signature or signed header,
  malformed value or mismatch: 401. Timestamp window: do NOT reject old timestamps by default.
  Hookdeck retries and replays resend the original headers and timestamp, and Hookdeck itself applies
  no tolerance, so a fixed window would reject legitimate retries. Offer an opt-in tolerance (an env
  var such as QUICKNODE_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say so in SKILL.md and
  verification.md (the X-QN-Timestamp unit is not documented; only parse it when the user opts in).
  Nonce, timestamp and body with NO separators. Payload compression (gzip) must stay OFF: Quicknode
  signs the uncompressed JSON while the wire carries gzip bytes, so a raw-body verifier (Hookdeck's
  included) fails on compressed deliveries. Store X-QN-Nonce to reject replays if you like. Events:
  there are no event types. Each stream or webhook delivers its filter's output (blocks, transactions,
  logs, matched events); the examples handle a clearly labelled illustrative payload (e.g. a Streams
  batch with `data` and `metadata`, or a Webhooks matched-transactions array) and dispatch on shape.
  Method: POST. Hookdeck's Quicknode source manages the method as POST, so the examples handle POST on
  the webhook route. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type works and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI:
  await request.body()); parse the body only after the check. Hookdeck's source type is QUICKNODE,
  labelled 'Quicknode'. Hookdeck shows this setup note for the source, and SKILL.md and
  references/setup.md must tell the user the same thing, verbatim: "Keep payload compression (gzip)
  off on the stream or webhook: Quicknode signs the uncompressed body."
testScenario:
  events:
    - "streams_block"
    - "webhook_transactions"
    - "streams_batch"
catalog:
  summary: "Verify Quicknode Streams and Webhooks deliveries (`X-QN-Signature`: hex HMAC-SHA256 of nonce + timestamp + body), handle block and transaction payloads"
