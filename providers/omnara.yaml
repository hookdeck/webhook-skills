name: 'omnara'
displayName: 'Omnara'
docs:
  webhooks: 'https://docs.omnara.com/events/webhooks'
  verification: 'https://docs.omnara.com/events/webhooks'
notes: >-
  Omnara (omnara.com), a platform for hosted AI agents. Since 2026-10-29 event webhooks are project-owned
  subscriptions (project Webhooks tab or POST /orgs/{orgID}/projects/{projectID}/event-webhooks) that send
  agents' timeline events (inputs, model outputs, tool results, context checkpoints) and tool-call updates
  to an HTTPS endpoint; the old per-agent `event_webhook` config block no longer applies. Signing per Standard
  Webhooks is opt-in. Standard Webhooks signature with webhook-* headers:
  webhook-id, webhook-timestamp (Unix seconds), webhook-signature (one or more space-separated 'v1,<base64>'
  entries). Signed content is '{webhook-id}.{webhook-timestamp}.{raw request body}', HMAC-SHA256, base64
  output. Notes: The secret is bare base64; it is pasted with a whsec_ prefix. SECRET: Receiver-chosen:
  a project-available generic secret referenced by the subscription's `signing_secret_id`, generated with
  `openssl rand -base64 32` (bare base64, no `whsec_`). Research: raw base64 ("Set `signing_secret_id`
  to a project-available generic secret generated with `openssl rand -base64 32`.", https://docs.omnara.com/events/webhooks).
  The HMAC key is the base64-decoding of the secret as Omnara shows it (no whsec_ prefix). OMNARA_WEBHOOK_SECRET
  holds the value exactly as Omnara shows it. Verify with the standardwebhooks library (npm 'standardwebhooks',
  pip 'standardwebhooks'): it strips a whsec_ prefix if present and otherwise base64-decodes the whole
  secret, so both the bare value and the whsec_-prefixed form give the same key. HEADER
  FALLBACK (all three frameworks and the manual verifier): read the webhook-* headers and, when webhook-id
  is absent, fall back to the svix-* headers (svix-id, -timestamp, -signature);
  then hand the library (or manual check) the three values under the header names it expects (for the
  standardwebhooks library, pass them as webhook-id, webhook-timestamp and webhook-signature). Include
  a test that a delivery signed the same way but sent with the other prefix's headers is accepted.
  The library always enforces a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries
  and replays resend the original timestamp, so the library rejects late retries after 5 minutes, and
  point to a manual verifier in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw body}'
  with the same key, compare every space-separated v1,<base64> entry in constant time after a length check,
  require the timestamp to be a plain positive integer) where the window can be dropped or widened. Missing
  headers or a bad signature: 400 or 401; handlers fail closed when the secret env var is unset. In a Hookdeck
  Omnara source the secret is entered as whsec_ followed by the value; SKILL.md and references/setup.md
  must say so (don't quote Hookdeck's configuration alert, which still describes the retired per-agent
  config). Conditional signing: Signing is opt-in per subscription. Deliveries carry `Webhook-Signature`
  only when the subscription's `signing_secret_id` names a signing secret; without one they still carry `Webhook-Id`
  and `Webhook-Timestamp` but cannot be verified. Verification notes: Raw body is required. Body: {event,
  data}. `data` is the event-stream object: timeline events carry ids (event, org, project, agent, turn),
  `sequence`, `event_kind` and `created_at`; tool_call_update carries a state snapshot and optional `interaction_update`.
  Event type: Top-level `event` beside `data`; timeline events also repeat the type in `data.event_kind`.
  Every example's `event` is its own type. Event types (5; the API's event_types enum lists exactly these): agent_input,
  model_output, tool_result, context_checkpoint, tool_call_update. Transport: JSON POST with `event` and
  `data`. Delivery: each delivery retries independently for up to ten minutes, with a five-second request
  timeout and exponential backoff with jitter. At-least-once, unordered. Deliveries for deleted
  projects and organizations are suppressed. Setup: a project-owned subscription (`url`, required nonempty
  `event_types` allowlist, optional `signing_secret_id`, `scope` of project, profile or agent; project
  scope includes subagents, agent scope doesn't). No challenge
  or validation request is documented, so the row has no handshake block. Express examples must read the
  raw body with express.raw({ type: '*/*' }) so any content type works and the exact bytes are verified;
  parse the body only after the check. Hookdeck's source type is OMNARA, labelled 'Omnara'.
testScenario:
  events:
  - 'agent_input'
  - 'model_output'
  - 'tool_result'
catalog:
  summary: >-
    Verify Omnara webhooks (Standard Webhooks: `webhook-id`, `webhook-timestamp`, `webhook-signature`,
    base64 secret), handle agent timeline and tool-call events
