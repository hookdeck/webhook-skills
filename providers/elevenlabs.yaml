notes: >
  Voice AI platform. Uses Standard Webhooks (Svix) format with headers:
  webhook-id, webhook-timestamp, webhook-signature. Secret format is whsec_<base64>.
  HMAC-SHA256 with base64 encoding.
testScenario:
  events:
    - voice.generation.completed
    - voice.clone.completed
catalog:
  summary: Verify ElevenLabs webhook signatures, handle call transcription events
  marketplace:
    description: Verify ElevenLabs webhook signatures (Standard Webhooks/Svix), handle call transcription events.
    keywords:
    - webhooks
    - elevenlabs
    - voice
    - ai
