name: upload-post
displayName: "Upload-Post"
docs:
  webhooks: https://docs.upload-post.com/api/webhooks
  verification: https://docs.upload-post.com/api/webhooks
notes: >
  Upload-Post webhooks (upload results, social-account changes, opt-in Instagram DMs and comments).
  Upload-Post (upload-post.com), an API for publishing to many social networks. Webhooks report upload
  results, social-account connection changes, and (opt-in) Instagram DMs and comments. Delivery (from
  the docs): One attempt per event: a 10 s timeout, refused connection or non-2xx loses it. After 5
  consecutive failures the channel pauses for 30 minutes. Upload-Post says: 'X-Upload-Post-Signature
  sha256=<hex HMAC-SHA256> — present whenever the account has a webhook_secret X-Upload-Post-Timestamp
  Unix time (seconds) when the request was signed' 'The signature is HMAC_SHA256(webhook_secret,
  "<timestamp>.<raw body>").' SIGNATURE SCHEME (it must match Hookdeck's UPLOAD_POST source exactly:
  HMAC controller, algorithm sha256, header x-upload-post-signature, encoding hex,
  signed_content_template "{header:x-upload-post-timestamp}.{body}"). The X-Upload-Post-Signature
  header carries `sha256=<hex>`. The signature is lowercase hex HMAC-SHA256, keyed with the secret,
  over: the X-Upload-Post-Timestamp header value, then a literal ".", then the raw request body bytes.
  Build the signed message as BYTES, exactly as Hookdeck's template does: literal separators as UTF-8,
  header values as the exact header string encoded latin1 (Node Buffer.from(value, 'latin1'); Python
  value.encode('latin-1'); a header is never trimmed, parsed or re-formatted), and the raw body bytes
  as received, concatenated with Buffer.concat / b''.join. Never decode the body to a string and
  re-encode it, and never JSON.parse/JSON.stringify before verifying. The HMAC key is the secret's
  UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared case-insensitively (as
  Hookdeck does): require exactly 64 hex characters, lowercase both sides (or decode both to bytes)
  before the constant-time compare. Strip a leading `sha256=` before validating the digest; Hookdeck's
  parser also accepts the bare digest, so accept the value with or without the prefix. Secret: the
  account's webhook secret, used WHOLE as a plain UTF-8 HMAC key including its `whsec_` prefix. This
  is NOT Standard Webhooks (nothing is base64-decoded, hex digest); do not use the standardwebhooks or
  svix libraries and say so. Env var: UPLOAD_POST_WEBHOOK_SECRET. Validate the signature's format
  before decoding it (exact length and alphabet), then compare in constant time: Node checks lengths,
  then crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig,
  'hex'|'base64') on an unvalidated value (it silently drops bad characters); Python uses
  hmac.compare_digest on bytes (never str) and base64.b64decode(..., validate=True). Missing or empty
  signature or signed header, malformed value or mismatch: 401. Timestamp window: do NOT reject old
  timestamps by default. Hookdeck retries and replays resend the original headers and timestamp, and
  Hookdeck itself applies no tolerance, so a fixed window would reject legitimate retries. Offer an
  opt-in tolerance (an env var such as UPLOAD_POST_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and
  say so in SKILL.md and verification.md (X-Upload-Post-Timestamp is Unix seconds). Deliveries made
  before a secret existed carry no signature header and fail. Upload-Post makes ONE attempt per event
  (10 s timeout). Events: dispatch on the body's `event` field. Documented event types (6):
  upload_completed, social_account_connected, social_account_disconnected,
  social_account_reauth_required, dm_received, comment_received. Handle a few common ones and log the
  rest. Method: POST. Hookdeck's Upload-Post source manages the method as POST, so the examples handle
  POST on the webhook route. Express examples must read the raw body with express.raw({ type: '*/*' })
  so any content type works and the exact bytes are verified (Next.js: await request.arrayBuffer();
  FastAPI: await request.body()); parse the body only after the check. Documented sample payloads
  (each JSON file's `body` is the payload as the vendor's docs show it) are in
  /home/user/regwt/b14-merge/samples-doc/providers/upload-post/latest/ (comment_received.json,
  social_account_connected.json, social_account_disconnected.json,
  social_account_reauth_required.json); base the examples' test payloads on them. Hookdeck's source
  type is UPLOAD_POST, labelled 'Upload-Post'. Hookdeck shows this setup note for the source, and
  SKILL.md and references/setup.md must tell the user the same thing, verbatim: "Paste the whole
  secret, including the whsec_ prefix. Upload-Post uses it as a plain HMAC key."
testScenario:
  events:
    - "upload_completed"
    - "social_account_connected"
    - "social_account_reauth_required"
catalog:
  summary: "Verify Upload-Post webhooks (`X-Upload-Post-Signature`: `sha256=` hex HMAC-SHA256 of `{timestamp}.{body}`, `whsec_` secret used as-is), handle upload and social-account events"
