name: 'salsa'
displayName: 'Salsa'
docs:
  webhooks: 'https://docs.salsa.dev/docs/consuming-webhooks'
  verification: 'https://docs.salsa.dev/docs/consuming-webhooks'
notes: >-
  Salsa (salsa.dev), an embedded payroll API. Webhooks report Lifecycle (employer, worker, payroll run,
  payment and document changes) and Notification events, signed per the Standard Webhooks scheme with
  Webhook-* headers. Standard Webhooks signature with webhook-* headers: webhook-id, webhook-timestamp
  (Unix seconds), webhook-signature (one or more space-separated 'v1,<base64>' entries). Signed content
  is '{webhook-id}.{webhook-timestamp}.{raw request body}', HMAC-SHA256, base64 output. SECRET: `signatureSecret`
  in the Create Webhook Endpoint response (endpoints are created via `POST /webhook-endpoints`); `whsec_`
  + base64. Rotation is through support. The response example prints "some-secret". Research: whsec_ +
  base64 ('HMAC the `signed_content` from the base64 portion of your signing secret (this is everything
  after `whsec_`)') https://docs.salsa.dev/docs/consuming-webhooks. It starts with whsec_; the key is
  the base64-decoding of the part after whsec_. SALSA_WEBHOOK_SECRET holds the full whsec_ value. Verify
  with the standardwebhooks library (npm 'standardwebhooks', pip 'standardwebhooks'), which reads webhook-id,
  webhook-timestamp and webhook-signature. HEADER FALLBACK (all three frameworks and the manual verifier):
  read the webhook-* headers and, when webhook-id is absent, fall back to the svix-* headers (svix-id,
  -timestamp, -signature), exactly as Hookdeck does; then hand the library (or manual check) the three
  values under the header names it expects (for the standardwebhooks library, pass them as webhook-id,
  webhook-timestamp and webhook-signature). Include a test that a delivery signed the same way but sent
  with the other prefix's headers is accepted. This matches Hookdeck's Salsa source (Standard Webhooks,
  headers_prefix 'webhook', a whsec_ secret base64-decoded after the prefix and any other secret used
  as its raw UTF-8 bytes, every v1 entry tried, other versions such as v1a ignored, no timestamp window;
  core also reads the other prefix's headers, webhook-* or svix-*). The library always enforces a fixed
  5-minute timestamp window. SKILL.md must say that Hookdeck retries and replays resend the original timestamp,
  so the library rejects late retries after 5 minutes, and point to a manual verifier in references/verification.md
  (HMAC-SHA256 over '{id}.{timestamp}.{raw body}' with the same key, compare every space-separated v1,<base64>
  entry in constant time after a length check, require the timestamp to be a plain positive integer) where
  the window can be dropped or widened. Missing headers or a bad signature: 400 or 401; handlers fail
  closed when the secret env var is unset. Verification notes: Raw body is required ("you should not change
  the body in any way before verifying"). Body: {data}. `data` holds `type` (the event name) and `attributes`
  (the event object, with `category` LIFECYCLE or NOTIFICATION and the entity ids). From the schema; no
  full example is published. Event type: Each reference page's webhook body schema is `{data: {type, attributes}}`
  with `data.type` exemplified by the event name; `attributes.category` is LIFECYCLE or NOTIFICATION.
  No full body example is published (the guide's samples are empty shells), so the path rests on the schema
  alone. Event types (78 documented, list may not be exhaustive): AccountingConfiguration.created, AccountingConfiguration.updated,
  Document.uploaded, Employer.AccountStanding.requirementsChanged, Employer.AccountStanding.statusChanged,
  Employer.Address.created, Employer.Address.deleted, Employer.Address.updated, Employer.PayWorkersReadiness.requirementsChanged,
  Employer.PayWorkersReadiness.statusChanged, Employer.PayrollHistory.importCompleted, Employer.PayrollHistory.provided,
  Employer.PayrollHistory.required, Employer.PayrollHistory.statusChanged, Employer.PayType.created, Employer.PayType.deleted,
  Employer.PayType.updated, Employer.TaxesSetup.updated, Employer.TimeOffType.created, Employer.TimeOffType.deleted,
  Employer.TimeOffType.updated, Employer.WorkerPayGroup.created, Employer.WorkerPayGroup.deleted, Employer.WorkerPayGroup.updated,
  Employer.awaitingRiskInsights, Employer.created, Employer.deleted, Employer.onboardingStatus, Employer.updated,
  EmployerBankAccount.Verification.statusChanged and 48 more. Transport: application/json (the reference
  requestBody media type). Each event's reference page embeds an OpenAPI document whose `webhooks` entry
  is a `post` operation. Delivery: Retries with exponential backoff (immediately, 5 s, 5 min, 30 min,
  2 h, 5 h, 10 h, 10 h); disabled endpoints get no attempts. No timeout is stated. Sandbox behaves like
  production, except Notification.workerPayday is not sent there for direct-deposit workers. Setup: Endpoints
  are created and updated via the REST API (`POST`/`PUT /webhook-endpoints`), enabled by default; no per-type
  selection is documented. No challenge or validation request is documented, so the row has no handshake
  block. Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type
  works and the exact bytes are verified; parse the body only after the check. Hookdeck's source type
  is SALSA, labelled 'Salsa'.
testScenario:
  events:
  - 'Employer.created'
  - 'AccountingConfiguration.created'
  - 'AccountingConfiguration.updated'
catalog:
  summary: >-
    Verify Salsa webhooks (Standard Webhooks: `webhook-id`, `webhook-timestamp`, `webhook-signature`,
    `whsec_` secret), handle Employer.created, Worker.updated and PayrollRun.awaitingInput events
