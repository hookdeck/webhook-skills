name: formio
displayName: 'Form.io'
docs:
  webhooks: https://help.form.io/form-building/actions/webhook-actions
  verification: https://help.form.io/form-building/actions/webhook-actions
notes: >
  Form platform; covers the Webhook action. Authorize User / Authorize Password are sent as
  Authorization: Basic base64(user:pass) (formio WebhookAction.js); Additional Headers is an
  alternative and isn't covered. No signature. Authenticate with HTTP Basic auth, which is what
  Hookdeck's Form.io source verifies. The examples read FORMIO_WEBHOOK_USERNAME and
  FORMIO_WEBHOOK_PASSWORD, parse 'Authorization: Basic base64(username:password)' (scheme
  case-insensitive, split on the first colon), and compare the username and the password each in
  constant time, evaluating both before deciding (no short-circuit). Missing or malformed header or
  mismatch: 401. Compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers (or on SHA-256 digests of both sides); Python uses hmac.compare_digest on
  bytes (encode both sides; never pass str, which raises on non-ASCII). SKILL.md and verification.md
  must say plainly that a static shared credential authenticates the sender, not the body, and gives
  no replay protection (no signature, no timestamp), so use HTTPS and rotate the credential if it
  leaks. Model on the n8n, zapier, brevo, assemblyai, honeybadger and coterie skills. The request
  method is user-chosen, so the examples must not be POST-only: accept POST, PUT, PATCH, GET and
  DELETE on the webhook route, and handle an empty body (e.g. GET). Form.io's default 'Match' method
  sends POST for creates, PUT for updates and DELETE for deletes (URL params as a query string), so
  the receiver must accept all three, and the HTTP verb is the only hint of the operation (no event
  field). Body: {request, response, submission, params}. Note in SKILL.md that Hookdeck's Form.io
  source pre-selects POST only, so PUT and DELETE must be allowed on the source. Express examples
  must read the raw body with express.raw({ type: '*/*' }) so any content type works; parse JSON
  only after the credential check.
testScenario:
  events:
    - 'submission create (POST)'
    - 'submission update (PUT)'
    - 'submission delete (DELETE)'
catalog:
  summary: 'Authenticate Form.io Webhook actions (unsigned HTTP Basic auth compared in constant time), handle submission create, update and delete requests (POST, PUT and DELETE)'
