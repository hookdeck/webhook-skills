name: payt
displayName: "Payt"
docs:
  webhooks: https://docs.paytsoftware.com/webhooks
  verification: https://docs.paytsoftware.com/webhooks/verification
notes: >
  Payt (paytsoftware.com), Dutch accounts-receivable and credit-management software. Webhooks are
  switched on per administration (Administration settings > Modules > Webhooks), all at once or per
  event, and report invoice, debtor, debt-collection case, payment-plan and PSP changes. Delivery
  (from the docs): 10 s timeout; up to 10 attempts at increasing intervals until 200 OK; frequent
  failures deactivate the webhook with an email. Order is not guaranteed; Payt suggests answering 404
  for an unknown object so the event is retried later. Payt's docs say: 'a signature is included in
  each request ... sent in the `X-PAYT-SIGNATURE` header.' 'take the secret and the body of the
  request and generate an HMAC hexdigest using the SHA256 method.' 'Make sure not to parse the body of
  the request before generating the hash, it must be calculated on the raw request body as it is
  received.' 'The secret key can be obtained on the `settings` page of the webhooks, it is shown only
  once after generating it.' From the docs (registry summary): hex(HMAC-SHA256(secret, raw body)), the
  whole header value, no prefix. The JavaScript sample decodes both sides as hex and uses
  timingSafeEqual. SIGNATURE SCHEME (it must match Hookdeck's PAYT source exactly: HMAC controller,
  algorithm "sha256", header_key "x-payt-signature", encoding "hex"). The x-payt-signature header
  carries the bare lowercase hex digest, no prefix. Compare the WHOLE header value as one digest (no
  list splitting or prefix parsing). The signature is lowercase hex HMAC-SHA256, keyed with the
  secret, over the raw request body bytes only (no timestamp, id or other header is signed). Build the
  signed message as BYTES: the raw body bytes exactly as received, never decoded to a string and
  re-encoded, never JSON.parse/JSON.stringify'd before verifying. The HMAC key is the secret's UTF-8
  bytes, used as-is (not hex- or base64-decoded). Hex is compared case-insensitively (as Hookdeck
  does): require exactly 64 hex characters, lowercase both sides (or decode both to bytes) before the
  constant-time compare. Secret: Generated on the webhook settings page and shown once; regenerating
  it rolls over asynchronously, so old and new secrets can both be seen for a while. Use it as UTF-8
  bytes. Env var: PAYT_WEBHOOK_SECRET. Validate the signature's format before decoding it (exact
  length and alphabet), then compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on
  an unvalidated value (it silently drops bad characters); Python uses hmac.compare_digest on bytes
  (never str) and base64.b64decode(..., validate=True). Missing or empty signature header, malformed
  value or mismatch: 401. No timestamp is signed, so there is no replay window to check; do not invent
  one from unsigned headers or body fields. Events: dispatch on the body's `event.event_name` field.
  Nested: the body is `{"event": {"event_name", "context", "event_time"}}`. Every example section's
  `event.event_name` is the section's event name; the payment_plan_* variants are stated to differ
  only in event_name. Documented event types (53): bundled_reminder_email_bounced,
  bundled_reminder_letter_returned, bundled_reminder_sent, bundled_reminder_invoice_performed,
  case_created, case_email_bounced, case_invoice_amount_paid, case_letter_returned, case_new_comment,
  case_paid, case_reopened, case_step_performed, case_to_bailiff, credit_limit_exceeded (and 39 more).
  Handle a few common ones and log the rest. Method: POST. Hookdeck's Payt source manages the method
  as POST, so the examples handle POST on the webhook route. Express examples must read the raw body
  with express.raw({ type: '*/*' }) so any content type works and the exact bytes are verified
  (Next.js: await request.arrayBuffer(); FastAPI: await request.body()); parse the body only after the
  check. Documented sample payloads (each JSON file's `body` is the payload as the vendor's docs show
  it) are in /home/user/regwt/main-ro/samples-doc/providers/payt/
  (latest/bundled_reminder_email_bounced.json, latest/bundled_reminder_invoice_performed.json,
  latest/bundled_reminder_letter_returned.json, latest/bundled_reminder_sent.json, ...); base the
  examples' test payloads on them. Hookdeck's source type is PAYT, labelled 'Payt'.
testScenario:
  events:
    - "invoice_created"
    - "case_created"
    - "bundled_reminder_sent"
catalog:
  summary: "Verify Payt webhooks (`x-payt-signature`: hex HMAC-SHA256 of the raw body), handle invoice, case and reminder events"
