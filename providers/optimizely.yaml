name: optimizely
displayName: "Optimizely"
docs:
  webhooks: https://docs.developers.optimizely.com/feature-experimentation/docs/configure-webhooks
  verification: https://docs.developers.optimizely.com/feature-experimentation/docs/configure-webhooks
notes: >
  Optimizely Feature Experimentation project webhooks (Settings -> Webhooks): a POST when the datafile
  of an environment updates, and change-history notifications for the entity/action pairs selected on
  the webhook. Only Feature Experimentation is in scope (not Web Experimentation or the CMS products).
  Delivery (from the docs): Nothing about timeouts or retries is documented. Optimizely's docs say:
  'The X-Hub-Signature header contains a SHA1 HMAC hex digest of the webhook payload, using the
  webhook's secret token as the key and prefixed with sha1= .' 'app.post('/webhooks/optimizely',
  bodyParser.text({ type: '*/*' }), ... const hmac = crypto.createHmac('sha1', WEBHOOK_SECRET); const
  webhookDigest = hmac.update(webhookPayload).digest('hex');' 'When you create a webhook, Feature
  Experimentation generates a secret token ... You can only view a webhook's secret token once,
  immediately after its creation.' From the docs (registry summary): Header `X-Hub-Signature:
  sha1=<hex>`. MAC = hex of HMAC-SHA1(key = the webhook secret token as a string, message = the
  payload as received; the Node sample reads it with `bodyParser.text`). The page publishes a test
  vector (secret `yIRFMTpsBcAKKRjJPCIykNo6EkNxJn_nq01-_r3S8i4`, a datafile body,
  `sha1=b2493723c6ea6973fbda41573222c8ecb1c82666`), which the registry author recomputed and matched.
  SIGNATURE SCHEME (it must match Hookdeck's OPTIMIZELY source exactly: HMAC controller, algorithm
  "sha1", header_key "x-hub-signature", encoding "hex"). The X-Hub-Signature header carries
  `sha1=<hex>`. Strip a leading `sha1=` before validating the digest; Hookdeck's parser also accepts
  the bare digest, so accept the value with or without the prefix. The signature is lowercase hex
  HMAC-SHA1, keyed with the secret, over the raw request body bytes only (no timestamp, id or other
  header is signed). Build the signed message as BYTES: the raw body bytes exactly as received, never
  decoded to a string and re-encoded, never JSON.parse/JSON.stringify'd before verifying. The HMAC key
  is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared
  case-insensitively (as Hookdeck does): require exactly 40 hex characters, lowercase both sides (or
  decode both to bytes) before the constant-time compare. Secret: Generated by Optimizely per webhook
  and viewable only once, right after creation; a lost secret means recreating the webhook. Use it as
  UTF-8 bytes. Env var: OPTIMIZELY_WEBHOOK_SECRET. Validate the signature's format before decoding it
  (exact length and alphabet), then compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on
  an unvalidated value (it silently drops bad characters); Python uses hmac.compare_digest on bytes
  (never str) and base64.b64decode(..., validate=True). Missing or empty signature header, malformed
  value or mismatch: 401. No timestamp is signed, so there is no replay window to check; do not invent
  one from unsigned headers or body fields. HMAC-SHA1 (40 hex characters). Events: dispatch on the
  body's `event` field. Top-level body field `event`, `project.<entity>_<action>` in both examples
  (`project.datafile_updated`, `project.ruleset_updated`). The subscribable events are given only as
  an entity x action table (Attribute, Audience, Flag, Rule, ... x Create, Update, Archive, Delete)
  with no wire names, so only the two shown values are recorded. For change-history events `data` is
  an ARRAY of change records (`change_type`, `entity.type`); for the datafile event it is an object.
  Documented event types (2): project.datafile_updated, project.ruleset_updated. Handle a few common
  ones and log the rest. Method: POST. Hookdeck's Optimizely source manages the method as POST, so the
  examples handle POST on the webhook route. Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type works and the exact bytes are verified (Next.js:
  await request.arrayBuffer(); FastAPI: await request.body()); parse the body only after the check.
  PUBLISHED TEST VECTOR (verified against Hookdeck's controller): the vendor's docs give a worked
  example, saved verbatim as JSON (secret, body string, headers) in
  /tmp/claude-0/-home-user/a6117e89-67f4-5ebf-9ebd-ebed152a5054/scratchpad/b910-skills/vectors/optimizely.json.
  Every example's test suite (Express, Next.js and FastAPI) must include it as a unit test: load or
  paste the exact body bytes (json.load the file, or copy the string exactly; do not pretty-print or
  re-serialise), and assert that the verifier accepts that header value
  (sha1=b2493723c6ea6973fbda41573222c8ecb1c82666) with that secret. Name the vector in
  references/verification.md. Documented sample payloads (each JSON file's `body` is the payload as
  the vendor's docs show it) are in /home/user/regwt/main-ro/samples-doc/providers/optimizely/
  (latest/project.datafile_updated.json); base the examples' test payloads on them. Hookdeck's source
  type is OPTIMIZELY, labelled 'Optimizely'.
testScenario:
  events:
    - "project.datafile_updated"
    - "project.ruleset_updated"
catalog:
  summary: "Verify Optimizely webhooks (`X-Hub-Signature`: `sha1=` hex HMAC-SHA1 of the raw body), handle datafile and change-history events"
