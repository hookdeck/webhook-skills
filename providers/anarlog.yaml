name: anarlog
displayName: 'Anarlog'
docs:
  webhooks: https://docs.anarlog.so/reference/webhooks
  verification: https://docs.anarlog.so/reference/webhooks#verify-signatures
  events: https://docs.anarlog.so/reference/webhooks#events
notes: >
  Anarlog (meeting notes). Header x-anarlog-signature: 'sha256=<hex>', HMAC-SHA256 hex of the raw
  request body keyed with the endpoint's whsec_ secret (shown once). Require and strip the sha256=
  prefix. The secret looks like whsec_... but this is NOT Standard Webhooks: the HMAC key is the whole
  secret string including whsec_, as UTF-8. Do NOT use the standardwebhooks or svix libraries and do
  not strip or base64-decode the whsec_ prefix. x-anarlog-timestamp (Unix seconds) is sent but is not
  part of the signature. Compare in constant time: in Node, check the received value is exactly 64 hex
  chars (/^[0-9a-f]{64}$/i) before any Buffer.from(x, 'hex') (invalid hex silently truncates), or
  compare the lowercase hex strings as equal-length UTF-8 Buffers with crypto.timingSafeEqual after a
  length check; in Python use hmac.compare_digest on bytes (encode both sides) so a non-ASCII header
  gives 401, not 500. Events: meeting.completed, note.enhanced, webhook.test. Deliveries only run
  while the Anarlog desktop app is open. Hookdeck setup (say this in SKILL.md's setup section and in
  references/setup.md): Paste the whole signing secret, including the whsec_ prefix. Anarlog uses it
  as a plain HMAC key. Express examples must read the raw body with express.raw({ type: '*/*' }) so
  any content type verifies.
testScenario:
  events:
    - 'meeting.completed'
    - 'note.enhanced'
catalog:
  summary: 'Verify Anarlog webhook signatures (`x-anarlog-signature` `sha256=<hex>`, HMAC-SHA256 of the raw body keyed with the whole `whsec_` secret; not Standard Webhooks), handle `meeting.completed` and `note.enhanced` events'
