name: clerk
displayName: Clerk
docs:
  webhooks: https://clerk.com/docs/integrations/webhooks/overview
  events: https://clerk.com/docs/integrations/webhooks/overview#event-types
notes: >
  User management platform. Uses Standard Webhooks (Svix) format with headers:
  webhook-id, webhook-timestamp, webhook-signature. Secret format is whsec_<base64>.
  HMAC-SHA256 with base64 encoding.
testScenario:
  events:
    - user.created
    - session.created
catalog:
  summary: Verify Clerk webhook signatures, handle user, session, and organization events
  marketplace:
    description: Verify Clerk webhook signatures (Standard Webhooks/Svix), handle user, session, and organization events.
    keywords:
    - webhooks
    - clerk
    - auth
    - users
