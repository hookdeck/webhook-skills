name: 'crossmint'
displayName: 'Crossmint'
docs:
  webhooks: 'https://docs.crossmint.com/introduction/platform/webhooks/overview'
  verification: 'https://docs.crossmint.com/introduction/platform/webhooks/verify-webhooks'
notes: >-
  Crossmint (crossmint.com), a wallets, checkout, NFT-minting, verifiable-credential and stablecoin offramp
  platform. One project-level webhook system (Svix: svix-* headers, `whsec_` secrets) carries events from
  every product. Standard Webhooks signature with svix-* headers: svix-id, svix-timestamp (Unix seconds),
  svix-signature (one or more space-separated 'v1,<base64>' entries). Signed content is '{svix-id}.{svix-timestamp}.{raw
  request body}', HMAC-SHA256, base64 output. Hookdeck core notes: Delivered by Svix. SECRET: Per endpoint,
  in the console's endpoint details (Signing Secret). Format `whsec_<base64>`: the manual section HMACs
  with "the base64 portion of your signing secret (this is the part after the `whsec_` prefix)". Research:
  whsec_ (code sample: const secret = "whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw"; https://docs.crossmint.com/introduction/platform/webhooks/verify-webhooks).
  It starts with whsec_; the key is the base64-decoding of the part after whsec_. CROSSMINT_WEBHOOK_SECRET
  holds the full whsec_ value. Verify with the svix library (npm 'svix', pip 'svix'), whose Webhook.verify
  reads svix-id, svix-timestamp and svix-signature and falls back to webhook-id, webhook-timestamp and
  webhook-signature. HEADER FALLBACK (all three frameworks and the manual verifier): read the svix-* headers
  and, when svix-id is absent, fall back to the webhook-* headers (webhook-id, -timestamp, -signature),
  exactly as Hookdeck does; then hand the library (or manual check) the three values under the header
  names it expects (the svix library accepts either set itself, so pass it both sets of headers rather
  than only svix-*). Include a test that a delivery signed the same way but sent with the other prefix's
  headers is accepted. This matches Hookdeck's Crossmint source (Standard Webhooks, headers_prefix 'svix',
  a whsec_ secret base64-decoded after the prefix and any other secret used as its raw UTF-8 bytes, every
  v1 entry tried, other versions such as v1a ignored, no timestamp window; core also reads the other prefix's
  headers, webhook-* or svix-*). The library always enforces a fixed 5-minute timestamp window. SKILL.md
  must say that Hookdeck retries and replays resend the original timestamp, so the library rejects late
  retries after 5 minutes, and point to a manual verifier in references/verification.md (HMAC-SHA256 over
  '{id}.{timestamp}.{raw body}' with the same key, compare every space-separated v1,<base64> entry in
  constant time after a length check, require the timestamp to be a plain positive integer) where the
  window can be dropped or widened. Missing headers or a bad signature: 400 or 401; handlers fail closed
  when the secret env var is unset. Verification notes: Raw body required. No tolerance is stated beyond
  "verify the signature and timestamp". Body: {type, data}. Only `type` and `data` are common. The id
  is `id` (wallets, offramp; `evt_...`, `pm-status-...`) or `actionId` (checkout V3, minting); minting
  adds startedAt/completedAt/resource, offramp a `timestamp`. Event type: Top-level `type` in every product's
  examples. The envelope around it differs by product: wallets `{id, type, data}`, checkout V3 `{actionId,
  type, data}`, minting `{actionId, startedAt, completedAt, type, data, resource}`, offramp `{id, type,
  data, timestamp}`. Event types (19 documented, list may not be exhaustive): wallets.transfer.in, wallets.transfer.out,
  wallets.signer.exported, purchase.succeeded, orders.quote.created, orders.quote.updated, orders.payment.succeeded,
  orders.payment.failed, orders.delivery.initiated, orders.delivery.completed, orders.delivery.failed,
  collections.create.succeeded, collections.update.succeeded, nfts.create.succeeded, nfts.create.failed,
  nfts.update.succeeded, credential.creation.succeeded, credential.creation.failed, payment_methods.status.updated.
  Transport: JSON POST via Svix. Delivery: 2xx within 15 s. 8 attempts: immediately, 5 s, 5 min, 30 min,
  2 h, 5 h, 10 h, 10 h; then failed, resendable from the console. At-least-once; offramp events can arrive
  out of order. Setup: Per endpoint in the console (Webhooks > Add Endpoint): URL + event types; an endpoint
  with no filter receives everything. Production and staging consoles are separate. No challenge. Express
  examples must read the raw body with express.raw({ type: '*/*' }) so any content type works and the
  exact bytes are verified; parse the body only after the check. Hookdeck's source type is CROSSMINT,
  labelled 'Crossmint'.
testScenario:
  events:
  - 'orders.delivery.completed'
  - 'wallets.transfer.in'
  - 'wallets.transfer.out'
catalog:
  summary: >-
    Verify Crossmint webhooks (delivered by Svix: `svix-id`, `svix-timestamp`, `svix-signature`, `whsec_`
    secret), handle wallet, order, purchase and NFT events
