name: infinite-giving
displayName: "Infinite Giving"
docs:
  webhooks: https://docs.infinitegiving.com/guide/webhooks/overview
  verification: https://docs.infinitegiving.com/guide/webhooks/overview
  events: https://docs.infinitegiving.com/guide/webhooks/overview
notes: >
  Infinite Giving (infinitegiving.com) is a non-cash donation platform (stock, crypto, DAF) for
  nonprofits. Partner webhooks go to integration partners after OAuth connect. Setup note (shown
  verbatim in Hookdeck): "Infinite Giving webhooks are for integration partners. Paste the signing
  secret Infinite Giving gives you at partner kickoff." Headers: X-IG-Signature (sha256=<hex>),
  X-IG-Timestamp (Unix seconds), X-IG-Event, X-IG-Webhook-Id (dedupe id). Signature is lowercase hex
  HMAC-SHA256 over the X-IG-Timestamp header value, a literal ".", then the raw body bytes, keyed with
  the partner signing secret used as UTF-8 (not decoded). Hookdeck's INFINITE_GIVING source uses the
  HMAC controller with signed_content_template "{header:x-ig-timestamp}.{body}", header x-ig-signature,
  hex; the sha256= prefix is optional and hex is case-insensitive. No timestamp window by default
  (retries and replays resend the original timestamp); the examples offer an opt-in
  INFINITE_GIVING_WEBHOOK_TOLERANCE_SECONDS. Env var INFINITE_GIVING_WEBHOOK_SECRET. Events (2):
  donation:created, donation:updated (completion is donation:updated with status "complete"); dispatch
  on the body's `event` field. Method POST. Up to 5 attempts (retries about 1m, 5m, 30m, 2h); no
  timeout stated. Manual verification only (no SDK). Express examples use express.raw({ type: '*/*' }).
  Documented sample payloads are in the registry samples-doc for infinite-giving.
testScenario:
  events:
    - "donation:created"
    - "donation:updated"
catalog:
  summary: "Verify Infinite Giving webhook signatures (`X-IG-Signature`, HMAC-SHA256 of `{X-IG-Timestamp}.{body}`), handle donation:created and donation:updated events"
  marketplace:
    description: Verify Infinite Giving partner webhook signatures (X-IG-Signature, HMAC-SHA256 over X-IG-Timestamp and the raw body), handle donation:created and donation:updated events for stock, crypto, and DAF donations.
    keywords:
    - webhooks
    - infinite-giving
    - donations
    - nonprofit
    - fundraising
