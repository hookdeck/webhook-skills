name: 'laso-finance'
displayName: 'Laso Finance'
docs:
  webhooks: 'https://docs.laso.finance/guides/agent-webhooks'
  verification: 'https://docs.laso.finance/guides/agent-webhooks'
notes: >-
  Laso Finance (laso.finance), banking, cards and payouts for AI agents. An agent registers one webhook
  URL per account via `POST /register-webhook` and receives every account notification (banking application
  status, transfers, deposits, card orders, withdrawals) as a Standard Webhooks-signed POST. Standard
  Webhooks signature with webhook-* headers: webhook-id, webhook-timestamp (Unix seconds), webhook-signature
  (one or more space-separated 'v1,<base64>' entries). Signed content is '{webhook-id}.{webhook-timestamp}.{raw
  request body}', HMAC-SHA256, base64 output. SECRET: One `whsec_` secret per account, returned only in
  the `POST /register-webhook` response; re-registering rotates it and `GET /get-webhook` never returns
  it. Research: whsec_ + base64 (register response "secret": "whsec_EXAMPLEONLYnotarealsecretAAAAAAA";
  'keyed with the base64-decoded part of the secret after whsec_') https://docs.laso.finance/guides/agent-webhooks.
  It starts with whsec_; the key is the base64-decoding of the part after whsec_. LASO_FINANCE_WEBHOOK_SECRET
  holds the full whsec_ value. Verify with the standardwebhooks library (npm 'standardwebhooks', pip 'standardwebhooks'),
  which reads webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK (all three frameworks
  and the manual verifier): read the webhook-* headers and, when webhook-id is absent, fall back to the
  svix-* headers (svix-id, -timestamp, -signature), exactly as Hookdeck does; then hand the library (or
  manual check) the three values under the header names it expects (for the standardwebhooks library,
  pass them as webhook-id, webhook-timestamp and webhook-signature). Include a test that a delivery signed
  the same way but sent with the other prefix's headers is accepted. This matches Hookdeck's Laso Finance
  source (Standard Webhooks, headers_prefix 'webhook', a whsec_ secret base64-decoded after the prefix
  and any other secret used as its raw UTF-8 bytes, every v1 entry tried, other versions such as v1a ignored,
  no timestamp window; core also reads the other prefix's headers, webhook-* or svix-*). The library always
  enforces a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries and replays resend
  the original timestamp, so the library rejects late retries after 5 minutes, and point to a manual verifier
  in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw body}' with the same key, compare
  every space-separated v1,<base64> entry in constant time after a length check, require the timestamp
  to be a plain positive integer) where the window can be dropped or widened. Missing headers or a bad
  signature: 400 or 401; handlers fail closed when the secret env var is unset. Verification notes: Raw
  body is required (the signed content uses the raw body). Body: {type, timestamp, data}. `data` carries
  `user_id`, `title`, `text` and `category` (the notification as shown to the owner). No event id in the
  body; `webhook-id` (`msg_...`) identifies the message. Event type: Top-level `type` = `notification.`
  + the notification category; `data.category` repeats the bare category. The category list is open-ended
  ("Categories include"). Event types (8 documented, list may not be exhaustive): notification.account,
  notification.transaction, notification.deposit, notification.withdrawal, notification.card, notification.giftCard,
  notification.refund, notification.balanceUpdate. Transport: POST with a JSON body to a public HTTPS
  URL. Delivery: 10 s timeout and NO retries. After 50 consecutive failures the registration is disabled
  (re-registering re-enables it). `GET /get-webhook` shows failure counters and the last attempt. Setup:
  One webhook per account, registered by API (`POST /register-webhook`, public HTTPS URL), receiving every
  notification; no per-type selection. Registering sends a signed test delivery (`notification.account`)
  and notifies the owner; `POST /delete-webhook` removes it. The test delivery is not a challenge, so
  the row has no handshake block. Express examples must read the raw body with express.raw({ type: '*/*'
  }) so any content type works and the exact bytes are verified; parse the body only after the check.
  Hookdeck's source type is LASO_FINANCE, labelled 'Laso Finance'.
testScenario:
  events:
  - 'notification.transaction'
  - 'notification.account'
  - 'notification.deposit'
catalog:
  summary: >-
    Verify Laso Finance webhooks (Standard Webhooks: `webhook-id`, `webhook-timestamp`, `webhook-signature`,
    `whsec_` secret), handle account, transaction, deposit, card and gift card notifications
