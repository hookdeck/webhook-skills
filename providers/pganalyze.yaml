name: 'pganalyze'
displayName: 'pganalyze'
docs:
  webhooks: 'https://pganalyze.com/docs/checks/webhooks'
  verification: 'https://pganalyze.com/docs/checks/webhooks'
notes: >-
  pganalyze (pganalyze.com), Postgres performance monitoring. Webhooks (Early Access) send Alerts & Check-Up
  issue state changes as Standard Webhooks-signed requests. Standard Webhooks signature with webhook-*
  headers: webhook-id, webhook-timestamp (Unix seconds), webhook-signature (one or more space-separated
  'v1,<base64>' entries). Signed content is '{webhook-id}.{webhook-timestamp}.{raw request body}', HMAC-SHA256,
  base64 output. SECRET: ONE signing secret for the whole organization, revealed in the Webhooks panel
  by members with modify permissions. Rotating it co-signs with the old and new secret for 7 days. Its
  format is not stated in text. Research: whsec_ (Add Webhook screenshot shows masked 'whsec_****…' under
  SIGNING SECRET) https://pganalyze.com/docs/checks/webhooks. It starts with whsec_; the key is the base64-decoding
  of the part after whsec_. PGANALYZE_WEBHOOK_SECRET holds the full whsec_ value. Verify with the standardwebhooks
  library (npm 'standardwebhooks', pip 'standardwebhooks'), which reads webhook-id, webhook-timestamp
  and webhook-signature. HEADER FALLBACK (all three frameworks and the manual verifier): read the webhook-*
  headers and, when webhook-id is absent, fall back to the svix-* headers (svix-id, -timestamp, -signature),
  exactly as Hookdeck does; then hand the library (or manual check) the three values under the header
  names it expects (for the standardwebhooks library, pass them as webhook-id, webhook-timestamp and webhook-signature).
  Include a test that a delivery signed the same way but sent with the other prefix's headers is accepted.
  This matches Hookdeck's pganalyze source (Standard Webhooks, headers_prefix 'webhook', a whsec_ secret
  base64-decoded after the prefix and any other secret used as its raw UTF-8 bytes, every v1 entry tried,
  other versions such as v1a ignored, no timestamp window; core also reads the other prefix's headers,
  webhook-* or svix-*). The library always enforces a fixed 5-minute timestamp window. SKILL.md must say
  that Hookdeck retries and replays resend the original timestamp, so the library rejects late retries
  after 5 minutes, and point to a manual verifier in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw
  body}' with the same key, compare every space-separated v1,<base64> entry in constant time after a length
  check, require the timestamp to be a plain positive integer) where the window can be dropped or widened.
  Missing headers or a bad signature: 400 or 401; handlers fail closed when the secret env var is unset.
  Verification notes: Raw body is required (Standard Webhooks). Body: {type, id, timestamp, version, organization,
  data}. `id` is the event id (also the webhook-id header); `data` holds `endpoint`, `issue`, `server`,
  `database`, `alertRules`, `alertDestinations`. Several issues routed to one webhook by different rules
  produce one request. Event type: Top-level `type` of the example payload (`issue.escalated`), whose
  values are the Event type column; `data.issue.state` carries the issue's state separately. No header
  carries the type. Event types (7 documented, list may not be exhaustive): issue.triggered, issue.escalated,
  issue.downgraded, issue.acknowledged, issue.reopened, issue.resolved, ping. Transport: POST with a JSON
  body to an HTTPS URL resolving to a public address; redirects are not followed. Delivery: Timeouts,
  connection/TLS errors, 5xx, 408, 425 and 429 are retried, up to 7 attempts over about 4 hours; other
  responses fail immediately; redirects are not followed. 20 consecutive failures over more than 24 h
  disable the webhook. No timeout value is given. Setup: Webhooks are added in Settings > Integrations
  (organization-wide modify permission); "Test and Add" sends a `ping` and only adds the webhook if it
  succeeds. Issues reach a webhook through Alert Destinations and Alert Rules. The `ping` is a test event,
  not a challenge to answer, so the row has no handshake block. Express examples must read the raw body
  with express.raw({ type: '*/*' }) so any content type works and the exact bytes are verified; parse
  the body only after the check. Hookdeck's source type is PGANALYZE, labelled 'pganalyze'.
testScenario:
  events:
  - 'issue.escalated'
  - 'issue.triggered'
  - 'issue.downgraded'
catalog:
  summary: >-
    Verify pganalyze webhooks (Standard Webhooks: `webhook-id`, `webhook-timestamp`, `webhook-signature`,
    `whsec_` secret), handle issue alert events
