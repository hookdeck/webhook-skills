name: 'tolt'
displayName: 'Tolt'
docs:
  webhooks: 'https://docs.tolt.com/webhooks/introduction'
  verification: 'https://docs.tolt.com/webhooks/verify'
  events: 'https://docs.tolt.com/webhooks/event-types'
notes: >-
  Tolt (tolt.com), affiliate and partner program software for SaaS: partners, referral links, referred
  customers, transactions and commissions. Endpoints are added under Settings > Webhooks with chosen events
  and delivered by Svix. Standard Webhooks signature with svix-* headers: svix-id, svix-timestamp (Unix
  seconds), svix-signature (one or more space-separated 'v1,<base64>' entries). Signed content is '{svix-id}.{svix-timestamp}.{raw
  request body}', HMAC-SHA256, base64 output. Hookdeck core notes: Delivered by Svix. SECRET: One `whsec_`
  secret per endpoint, from Settings > Webhooks. Research: whsec_ (https://docs.tolt.com/sdks/webhooks:
  "Copy your endpoint's signing secret (`whsec_...`) from **Dashboard → Settings → Webhooks**"). It starts
  with whsec_; the key is the base64-decoding of the part after whsec_. TOLT_WEBHOOK_SECRET holds the
  full whsec_ value. Verify with the svix library (npm 'svix', pip 'svix'), whose Webhook.verify reads
  svix-id, svix-timestamp and svix-signature and falls back to webhook-id, webhook-timestamp and webhook-signature.
  HEADER FALLBACK (all three frameworks and the manual verifier): read the svix-* headers and, when svix-id
  is absent, fall back to the webhook-* headers (webhook-id, -timestamp, -signature), exactly as Hookdeck
  does; then hand the library (or manual check) the three values under the header names it expects (the
  svix library accepts either set itself, so pass it both sets of headers rather than only svix-*). Include
  a test that a delivery signed the same way but sent with the other prefix's headers is accepted. This
  matches Hookdeck's Tolt source (Standard Webhooks, headers_prefix 'svix', a whsec_ secret base64-decoded
  after the prefix and any other secret used as its raw UTF-8 bytes, every v1 entry tried, other versions
  such as v1a ignored, no timestamp window; core also reads the other prefix's headers, webhook-* or svix-*).
  The library always enforces a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries
  and replays resend the original timestamp, so the library rejects late retries after 5 minutes, and
  point to a manual verifier in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw body}'
  with the same key, compare every space-separated v1,<base64> entry in constant time after a length check,
  require the timestamp to be a plain positive integer) where the window can be dropped or widened. Missing
  headers or a bad signature: 400 or 401; handlers fail closed when the secret env var is unset. Verification
  notes: Raw body is required. Body: {type, data, timestamp}. `data` is the resource as the API returns
  it plus `organization_id`; money fields are strings in cents. No event id in the body: dedupe on `svix-id`.
  Event type: Top-level `type` in a `{type, data, timestamp}` envelope; `data` is the API resource plus
  `organization_id`. Event types (10 documented, list may not be exhaustive): partner.created, partner.updated,
  link.created, link.updated, customer.created, customer.updated, transaction.created, transaction.updated,
  commission.created, commission.updated. Transport: Signed JSON POST via Svix. Delivery: Return 2xx fast;
  failed or timed-out deliveries are retried (no schedule printed). At-least-once: dedupe on svix-id.
  Unordered: keep the newest by `data.updated_at`. Setup: Per endpoint in Settings > Webhooks with chosen
  events. No challenge is documented, so the row has no handshake block. Express examples must read the
  raw body with express.raw({ type: '*/*' }) so any content type works and the exact bytes are verified;
  parse the body only after the check. Hookdeck's source type is TOLT, labelled 'Tolt'.
testScenario:
  events:
  - 'commission.created'
  - 'partner.created'
  - 'partner.updated'
catalog:
  summary: >-
    Verify Tolt webhooks (delivered by Svix: `svix-id`, `svix-timestamp`, `svix-signature`, `whsec_` secret),
    handle partner.created, customer.created, transaction.created and commission.created events
