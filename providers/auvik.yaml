name: auvik
displayName: 'Auvik'
docs:
  webhooks: https://support.auvik.com/hc/en-us/articles/216977386-Integrating-Auvik-with-a-webhook
  verification: https://support.auvik.com/hc/en-us/articles/216977386-Integrating-Auvik-with-a-webhook
notes: >
  Network monitoring; covers alert notifications from the Webhook integration (MSP dashboard) with
  the 'Header' authentication method ('An API key is provided through a custom HTTP header'). Basic
  Authentication and OAuth 2.0 aren't covered by Hookdeck's Auvik source. No signature: requests are
  unsigned. Authenticate with a secret header the user adds with Header authentication (Key and
  Value). The header name is user-chosen, so the examples read the header name from
  AUVIK_WEBHOOK_HEADER (default 'Authorization') and the expected value from AUVIK_WEBHOOK_SECRET
  (the exact, whole header value, including any 'Bearer ' prefix the user typed). Look the header up
  case-insensitively and compare the WHOLE value; do not strip or parse a 'Bearer ' prefix. This is
  what Hookdeck's Auvik source does (API key verification: header name + exact whole value). Missing
  header or mismatch: 401. Compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both sides); Python uses
  hmac.compare_digest on bytes (encode both sides; never pass str, which raises on non-ASCII).
  SKILL.md and verification.md must say plainly that a static shared credential authenticates the
  sender, not the body, and gives no replay protection (no signature, no timestamp), so use HTTPS
  and rotate the credential if it leaks. Model on the n8n, zapier, coterie and honeybadger skills on
  main (and the batch 5 iterable, oyster, fireberry and new-relic skills if present). Hookdeck's
  source type is AUVIK, labelled 'Auvik'. Hookdeck shows this setup note for the source, and
  SKILL.md and references/setup.md must tell the user the same thing: "Choose Header authentication
  on the Auvik webhook, not OAuth." Default body: {alertId, alertName, alertStatus 0/1,
  alertStatusString Triggered/Cleared, alertDescription, entityName, companyName, date, link, ...};
  an optional JSONata expression can reshape it. Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type works; parse the body only after the credential
  check.
testScenario:
  events:
    - 'Triggered'
    - 'Cleared'
catalog:
  summary: 'Authenticate Auvik alert webhooks (unsigned: a header compared in full in constant time), handle `Triggered` and `Cleared` alerts'
