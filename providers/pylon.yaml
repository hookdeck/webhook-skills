name: pylon
displayName: Pylon
docs:
  webhooks: https://docs.usepylon.com/pylon-docs/developer/webhooks
  verification: https://docs.usepylon.com/pylon-docs/developer/webhooks#verifying-webhooks
notes: >
  Pylon the B2B customer support platform (usepylon.com), NOT Pylon the solar design platform
  (getpylon.com, which signs Pylon-Webhook-Signature: hs256=...). No official SDK — verify
  manually. Webhooks are created in Settings > Integrations & dev > Webhooks and sent by workflow
  triggers and macros (Send webhook action) with a JSON body the customer writes as a template, so
  there are NO event types and no event-type field or header; the Test button sends
  {"data":{"type":"ping"}}. Every template value arrives as a string. Signing: X-Pylon-Signature-V2
  is the hex HMAC-SHA256 of X-Pylon-Timestamp + "." + the raw body, keyed with the webhook secret
  used as a UTF-8 string (do not hex-decode it); the secret is shown once at creation and can't be
  rotated. Reject timestamps more than 5 minutes from now (the docs prescribe it; retries are
  re-signed with a fresh timestamp). X-Pylon-Signature is legacy (body only, no timestamp) — mention
  it, don't implement it. Tests sent from the create dialog are unsigned. Retries: up to 3 attempts
  (about 4 s then 8 s), X-Pylon-Retry-Number on retries, 20 s timeout, at-least-once, unordered, no
  event ID header. The method defaults to POST (GET/PUT/PATCH/DELETE are selectable). Express
  examples must read the raw body with express.raw({ type: '*/*' }).
testScenario:
  events:
    - 'trigger webhook (your JSON template, e.g. issue_id and title)'
    - 'test ping ({"data":{"type":"ping"}})'
  prompt: >
    Create a {framework} webhook handler for Pylon (usepylon.com). Verify the X-Pylon-Signature-V2
    header: compute the hex HMAC-SHA256 of X-Pylon-Timestamp + "." + the raw request body using the
    webhook secret as a string, compare timing-safe, and reject timestamps more than 5 minutes from
    now. Verify against the raw body (do not parse first). Return 400 for a missing/invalid signature
    and 200 once verified. Pylon has no event types: the body is the customer's JSON template, so
    handle the {"data":{"type":"ping"}} test body and log fields from the template. If you use any
    skills to help with this, add a comment noting which skill(s) you referenced.
catalog:
  summary: Verify Pylon (usepylon.com) webhook signatures (`X-Pylon-Signature-V2`, hex HMAC-SHA256 over `timestamp.body`), handle the JSON bodies workflow triggers and macros send
  marketplace:
    description: Receive and verify Pylon webhooks (Pylon the B2B support platform, usepylon.com). Use when setting up Pylon webhook handlers, debugging Pylon signature verification (X-Pylon-Signature-V2, hex HMAC-SHA256 over X-Pylon-Timestamp + "." + body), or handling the JSON bodies Pylon workflow triggers and macros send.
