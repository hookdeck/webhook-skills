name: top-gg
displayName: "Top.gg"
docs:
  webhooks: https://docs.top.gg/webhooks/overview
  verification: https://docs.top.gg/webhooks/overview
  events: https://docs.top.gg/webhooks/events
notes: >
  Top.gg (top.gg), the Discord bot and server listing site. A project's webhook (dashboard > Webhooks)
  is told about votes. Delivery (from the docs): 2xx within 5 s. v1: up to 3 retries on timeout or
  5xx, 2^N s backoff. v0: up to 10. Top.gg's docs say: 'Every v1 webhook request includes an
  x-topgg-signature header in the format t={unix timestamp},v1={signature}.' 'Compute an HMAC SHA-256
  digest of {timestamp}.{rawBody} using your webhook secret as the key.'
  '.update(`${timestamp}.${rawBody}`) .digest('hex');' 'After saving, Top.gg generates a webhook
  secret prefixed with whs_.' From the docs (registry summary): Header `t=<unix seconds>,v1=<hex>`; v1
  = hex(HMAC-SHA256(webhook secret, `{t}.{rawBody}`)). The secret starts with `whs_` and is used
  as-is. SIGNATURE SCHEME (it must match Hookdeck's TOP_GG source exactly: HMAC controller, algorithm
  "sha256", header_key "x-topgg-signature", encoding "hex", delimiter ".", prefix_data_with_timestamp
  true). The x-topgg-signature header is `t=<timestamp>,v1=<hex>` (comma-separated key=value pairs).
  The signature is lowercase hex HMAC-SHA256, keyed with the secret, over: the t value exactly as it
  appears in the header (a string; never parse it to a number and re-format it), then a literal ".",
  then the raw request body bytes. The header may carry more than one v1= entry (for example during
  key rotation): accept the delivery if ANY v1= entry matches, and ignore other keys such as v0. A
  header with no t= value fails. Build the signed message as BYTES: the raw body bytes exactly as
  received, never decoded to a string and re-encoded, never JSON.parse/JSON.stringify'd before
  verifying. The HMAC key is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is
  compared case-insensitively (as Hookdeck does): require exactly 64 hex characters, lowercase both
  sides (or decode both to bytes) before the constant-time compare. Secret: v1: a secret prefixed
  `whs_` that Top.gg generates when the webhook URL is saved in the project dashboard. v0 (legacy): a
  shared secret entered in the bot edit form and sent verbatim in Authorization. Use it as UTF-8
  bytes. Env var: TOP_GG_WEBHOOK_SECRET. Validate the signature's format before decoding it (exact
  length and alphabet), then compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on
  an unvalidated value (it silently drops bad characters); Python uses hmac.compare_digest on bytes
  (never str) and base64.b64decode(..., validate=True). Missing or empty signature header, malformed
  value or mismatch: 401. Timestamp window: do NOT reject old timestamps by default. Hookdeck retries
  and replays resend the original headers and timestamp, and Hookdeck itself applies no tolerance, so
  a fixed window would reject legitimate retries. Offer an opt-in tolerance (an env var such as
  TOP_GG_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say so in SKILL.md and verification.md (t is
  Unix seconds). The v1 webhook secret starts with `whs_`; use the whole string as the key. Legacy v0
  webhooks send a plain Authorization secret and are not signed. Events: dispatch on the body's `type`
  field. Top-level `type` (`vote.create`, `webhook.test`); the event data is under `data`. Legacy v0
  bodies also carry `type` but with v0 values (`upvote`, `test`). Documented event types (2):
  vote.create, webhook.test. Handle a few common ones and log the rest. Method: POST. Hookdeck's
  Top.gg source manages the method as POST, so the examples handle POST on the webhook route. Express
  examples must read the raw body with express.raw({ type: '*/*' }) so any content type works and the
  exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI: await request.body());
  parse the body only after the check. Hookdeck's source type is TOP_GG, labelled 'Top.gg'. Hookdeck
  shows this setup note for the source, and SKILL.md and references/setup.md must tell the user the
  same thing, verbatim: "Only v1 webhooks, whose secret starts with whs_, are supported. Legacy v0
  webhooks aren't signed and fail verification."
testScenario:
  events:
    - "vote.create"
    - "webhook.test"
catalog:
  summary: "Verify Top.gg v1 webhook signatures (`x-topgg-signature` `t=<ts>,v1=<hex>`, HMAC-SHA256 over `{t}.{body}` keyed with the whole `whs_` secret), handle vote.create and webhook.test events"
