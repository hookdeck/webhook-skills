name: charitystack
displayName: "CharityStack"
docs:
  webhooks: https://www.charitystack.com/docs/concepts/webhooks
  verification: https://www.charitystack.com/docs/guides/webhook-verification
notes: >
  CharityStack nonprofit fundraising webhooks, registered through its API (POST /v1/webhooks). The
  create response returns the webhook secret once; it is never shown again. Every delivery carries
  X-Webhook-Signature (sha256=<hex>, HMAC-SHA256), X-Webhook-Timestamp (Unix seconds) and
  X-Webhook-ID. Signed content is the X-Webhook-Timestamp header value, a literal ".", then the raw
  body bytes, keyed with the secret's UTF-8 bytes. Hookdeck's CHARITYSTACK source is an HMAC source
  (sha256, header x-webhook-signature, hex, signed_content_template
  "{header:x-webhook-timestamp}.{body}", POST). No timestamp tolerance by default (retries and
  replays resend the original headers); the examples offer an opt-in
  CHARITYSTACK_WEBHOOK_TOLERANCE_SECONDS. No retry or timeout policy is documented. Setup note:
  "CharityStack shows the webhook secret only once, when you create the webhook. Paste it here."
  Events (dispatch on the body's `type`): donation.created, donation.updated, subscription.created,
  subscription.updated, subscription.cancelled, subscription.payment_method_updated,
  contact.created, contact.updated, form.created, form.updated.
testScenario:
  events:
    - "donation.created"
    - "subscription.created"
    - "contact.created"
catalog:
  summary: "Verify CharityStack webhooks (`X-Webhook-Signature`: `sha256=` hex HMAC-SHA256 of `{X-Webhook-Timestamp}.{body}`), handle donation, subscription, contact and form events"
