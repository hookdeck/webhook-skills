name: semble
displayName: 'Semble'
docs:
  webhooks: https://docs.semble.io/docs/webhooks/guide/
  verification: https://docs.semble.io/docs/webhooks/guide/#4-verifying-webhook-signatures
  events: https://docs.semble.io/docs/webhooks/events/
notes: >
  Semble (practice management / EHR). Header X-Webhook-Signature: 't=<unix seconds>,v1=<hex>';
  X-Webhook-Timestamp carries the same t. v1 is lowercase hex HMAC-SHA256 over '<t>.<raw body>' keyed
  with the webhook secret as UTF-8 (returned by the createWebhook GraphQL mutation). Sign with the t
  from X-Webhook-Signature (that is what Hookdeck verifies), not the separate header. t=<ts>,v1=<hex>
  header: split on ',' and trim each part (allow a space after the comma), take t and every v1
  (several are sent during secret rotation) and accept if any v1 matches; reject a header with no t or
  no v1. Compare in constant time: in Node, check the received value is exactly 64 hex chars
  (/^[0-9a-f]{64}$/i) before any Buffer.from(x, 'hex') (invalid hex silently truncates), or compare
  the lowercase hex strings as equal-length UTF-8 Buffers with crypto.timingSafeEqual after a length
  check; in Python use hmac.compare_digest on bytes (encode both sides) so a non-ASCII header gives
  401, not 500. Hookdeck retries and replays resend the original timestamp, so a 5-minute window
  rejects late retries: make the timestamp freshness check opt-in via
  SEMBLE_TIMESTAMP_TOLERANCE_SECONDS (default 0 = off), as the mercury-webhooks skill does. SKILL.md
  must say that Hookdeck retries and replays resend the original timestamp, so a 5-minute window
  rejects late retries, and point to references/verification.md, which shows where the window can be
  dropped or widened. Event types are dotted camelCase, e.g. booking.created, booking.updated,
  booking.deleted, contact.created, invoice.paid, resourceAvailability.updated; dispatch on the
  body's eventType field (body: subscriptionId, eventId, eventType, identifiers, optional metadata).
  Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type
  verifies.
testScenario:
  events:
    - 'booking.created'
    - 'invoice.paid'
catalog:
  summary: 'Verify Semble webhook signatures (`X-Webhook-Signature` `t=<ts>,v1=<hex>`, HMAC-SHA256 over `{t}.{body}`), handle `booking.created` and `invoice.paid` events'
