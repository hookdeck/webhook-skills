name: gitbook
displayName: "GitBook"
docs:
  webhooks: https://gitbook.com/docs/developers/integrations/guides/webhook
  verification: https://gitbook.com/docs/developers/integrations/guides/webhook#hmac-signature-verification
notes: >
  GitBook (gitbook.com), a documentation platform. Webhooks come from GitBook's Webhook integration,
  installed into an organization's spaces or sites, each installation with its own URL, events and
  secret. Delivery (from the docs): Network errors, 5xx and 429 are retried, max 3 attempts,
  exponential backoff with jitter from a 1 s base (1 s, 2 s, 4 s); other 4xx are not retried. No
  timeout is stated. GitBook's docs say: 'All webhook requests include an HMAC-SHA256 signature in the
  `X-GitBook-Signature` header ... X-GitBook-Signature: t=1640995200,v1=abc123def456...' '// Generate
  expected signature (our implementation uses timestamp.payload format) ... .createHmac('sha256',
  secret).update(`${timestamp}.${payload}`).digest('hex');' 'encoder.encode(`${timestamp}.${payload}`)
  ... 'X-GitBook-Signature': `t=${timestamp},v1=${signature}`, ... body: jsonPayload,' From the docs
  (registry summary): `X-GitBook-Signature: t=<unix>,v1=<hex>` where v1 = hex HMAC-SHA256(secret,
  `${timestamp}.${payload}`) over the raw body. SIGNATURE SCHEME (it must match Hookdeck's GITBOOK
  source exactly: HMAC controller, algorithm "sha256", header_key "x-gitbook-signature", encoding
  "hex", delimiter ".", prefix_data_with_timestamp true). The X-GitBook-Signature header is
  `t=<timestamp>,v1=<hex>` (comma-separated key=value pairs). The signature is lowercase hex
  HMAC-SHA256, keyed with the secret, over: the t value exactly as it appears in the header (a string;
  never parse it to a number and re-format it), then a literal ".", then the raw request body bytes.
  The header may carry more than one v1= entry (for example during key rotation): accept the delivery
  if ANY v1= entry matches, and ignore other keys such as v0. A header with no t= value fails. Build
  the signed message as BYTES: the raw body bytes exactly as received, never decoded to a string and
  re-encoded, never JSON.parse/JSON.stringify'd before verifying. The HMAC key is the secret's UTF-8
  bytes, used as-is (not hex- or base64-decoded). Hex is compared case-insensitively (as Hookdeck
  does): require exactly 64 hex characters, lowercase both sides (or decode both to bytes) before the
  constant-time compare. Secret: The installation's secret. The guide never says where it is set or
  shown (samples read it from GITBOOK_SECRET); presumably the integration's configuration. Use it as
  UTF-8 bytes. Env var: GITBOOK_WEBHOOK_SECRET. Validate the signature's format before decoding it
  (exact length and alphabet), then compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on
  an unvalidated value (it silently drops bad characters); Python uses hmac.compare_digest on bytes
  (never str) and base64.b64decode(..., validate=True). Missing or empty signature header, malformed
  value or mismatch: 401. Timestamp window: do NOT reject old timestamps by default. Hookdeck retries
  and replays resend the original headers and timestamp, and Hookdeck itself applies no tolerance, so
  a fixed window would reject legitimate retries. Offer an opt-in tolerance (an env var such as
  GITBOOK_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say so in SKILL.md and verification.md (t
  is Unix seconds). This is GitBook's Webhook integration, installed per space or site. Events:
  dispatch on the body's `type` field. Top-level `type`, the backticked name in each event heading and
  in each payload example. Documented event types (3): space_content_updated, site_view,
  page_feedback. Handle a few common ones and log the rest. Method: POST. Hookdeck's GitBook source
  manages the method as POST, so the examples handle POST on the webhook route. Express examples must
  read the raw body with express.raw({ type: '*/*' }) so any content type works and the exact bytes
  are verified (Next.js: await request.arrayBuffer(); FastAPI: await request.body()); parse the body
  only after the check. After verifying, treat every field of the parsed body as untrusted: check that
  the body and each nested field is the expected type before reading into it (Express/Next.js: typeof
  / Array.isArray; FastAPI: isinstance(x, dict) / isinstance(x, list) before .get() or iterating), so
  a wrong-typed field is ignored or answered with 400, never a 500. Never say Hookdeck verifies 'at
  the edge'; say Hookdeck's source verifies the signature. Documented sample payloads (each JSON
  file's `body` is the payload as the vendor's docs show it) are in
  /home/user/regwt/main-ro/samples-doc/providers/gitbook/ (latest/page_feedback.json,
  latest/site_view.json, latest/space_content_updated.json); base the examples' test payloads on them.
  Hookdeck's source type is GITBOOK, labelled 'GitBook'.
testScenario:
  events:
    - "space_content_updated"
    - "page_feedback"
    - "site_view"
catalog:
  summary: "Verify GitBook webhooks (`X-GitBook-Signature`: `t=`/`v1=` hex HMAC-SHA256 of `{t}.{body}`), handle content update, page feedback and site view events"
