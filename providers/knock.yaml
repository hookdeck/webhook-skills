name: knock
displayName: Knock
docs:
  webhooks: https://docs.knock.app/developer-tools/outbound-webhooks/overview
  events: https://docs.knock.app/developer-tools/outbound-webhooks/event-types
  api: https://docs.knock.app/reference
notes: >
  Notification infrastructure platform (Knock / knock.app). Outbound webhooks
  fire on message lifecycle and resource change events. Uses HMAC-SHA256 with
  base64 encoding in the `x-knock-signature` header, formatted as
  `t=<timestamp>,s=<base64-signature>`.

  CRITICAL: the timestamp is in MILLISECONDS, not seconds. Knock explicitly
  deviates from Stripe's seconds-based scheme — anyone porting a Stripe
  verifier will silently fail signature checks if they forget this. Surface
  this prominently in the verification reference.

  Signed content format: `{timestamp_ms}.{stringified_body}` (period
  separator). HMAC-SHA256 over that string using the per-endpoint signing
  secret (one secret per webhook in the dashboard — NOT the account API
  key). Always pass the raw request body; do not JSON.parse and re-serialize
  before verifying.

  Replay protection: docs recommend rejecting payloads whose timestamp is
  more than 5 minutes old. Apply this on top of the signature check.

  No SDK helper. Confirmed: @knocklabs/node (npm, v1.32.0+) and knockapi
  (PyPI, v1.25.0+) do not expose webhooks.unwrap()/constructEvent()/verify()
  — the source contains no inbound webhook verification path. The official
  JavaScript example uses crypto.createHmac directly. Manual HMAC-SHA256
  verification is the canonical path; do not pull in a third-party library.

  Event taxonomy (38 events in five groups, reorganised by Knock 2026-10-27):
  - Messages (14): message.sent, message.delivered,
    message.delivery_attempted, message.undelivered, message.bounced,
    message.complaint, message.seen, message.unseen, message.read, message.unread,
    message.archived, message.unarchived, message.interacted,
    message.link_clicked
  - Workflow runs (3): workflow_recipient_run.started,
    workflow_recipient_run.completed, workflow_recipient_run.error
  - Commits (1): commits.promoted (environments enabled only)
  - Branches (3): branch.created, branch.deleted, branch.rebased
    (environments enabled only)
  - Resources (17): audience, email_layout, guide, message_type, partial,
    reusable_request, translation and workflow each send .updated and
    .committed; goal sends only goal.updated.
  source_event_action.updated/.committed were removed: Knock no longer sends
  them and they can't be subscribed to.

  Payload base shape is `{ __typename: "Event", type, created_at, data,
  event_data }` — there is NO top-level event `id`. `data` is typed by event
  (a Message object for message events); `event_data` is null when the event
  carries no extra context. Headers also include `x-knock-event` (mirrors
  `type`) and `x-knock-environment-id`. Retries: "a handful of times" over a
  few hours on non-2xx (count/intervals not fixed); never retries 301-303 or
  400-405; respects Retry-After on 429. No event id: type + data.id repeats on
  real events (read after unread), so recommend idempotent state writes; for
  commits.promoted Knock says to dedupe on the promote group ID (data.id).
  Secret key is on the webhook's Overview tab (or secret_key, returned once,
  from Management API POST /v1/webhooks).
  Dashboard: Platform > Webhooks > Create webhook; webhooks are created in
  the current environment only.
testScenario:
  events:
    - message.sent
    - message.delivered
