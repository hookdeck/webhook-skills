name: schematic
displayName: "Schematic"
docs:
  webhooks: https://docs.schematichq.com/integrations/webhooks
  verification: https://docs.schematichq.com/integrations/webhooks#signature-verification
notes: >
  Schematic webhooks. Schematic (schematichq.com), a pricing, entitlement and feature-flag platform.
  Webhooks report company, user, catalog (features, flags, plans), billing and usage-trigger events.
  Delivery (from the docs): Any 2xx within 5 s; anything else (3xx included) fails. Eight attempts
  over ~24 h, then dropped. Endpoints with >= 90% failures across >= 25 events in 24 h are
  deactivated. Test sends carry no event_id or X-Schematic-Webhook-Id. Schematic says:
  'HMAC-SHA256(secret, rawBody + "+" + timestamp) → hex-encoded' SIGNATURE SCHEME (it must match
  Hookdeck's SCHEMATIC source exactly: HMAC controller, algorithm sha256, header
  x-schematic-webhook-signature, encoding hex, signed_content_template
  "{body}+{header:x-schematic-webhook-timestamp}"). The X-Schematic-Webhook-Signature header carries
  the bare lowercase hex digest, no prefix. The signature is lowercase hex HMAC-SHA256, keyed with the
  secret, over: the raw request body bytes, then a literal "+", then the X-Schematic-Webhook-Timestamp
  header value. Build the signed message as BYTES, exactly as Hookdeck's template does: literal
  separators as UTF-8, header values as the exact header string encoded latin1 (Node
  Buffer.from(value, 'latin1'); Python value.encode('latin-1'); a header is never trimmed, parsed or
  re-formatted), and the raw body bytes as received, concatenated with Buffer.concat / b''.join. Never
  decode the body to a string and re-encode it, and never JSON.parse/JSON.stringify before verifying.
  The HMAC key is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared
  case-insensitively (as Hookdeck does): require exactly 64 hex characters, lowercase both sides (or
  decode both to bytes) before the constant-time compare. Compare the WHOLE header value as one digest
  (no list splitting, no prefix parsing). Secret: the webhook secret from the Schematic dashboard,
  used as UTF-8. Env var: SCHEMATIC_WEBHOOK_SECRET. Validate the signature's format before decoding it
  (exact length and alphabet), then compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on
  an unvalidated value (it silently drops bad characters); Python uses hmac.compare_digest on bytes
  (never str) and base64.b64decode(..., validate=True). Missing or empty signature or signed header,
  malformed value or mismatch: 401. Timestamp window: do NOT reject old timestamps by default.
  Hookdeck retries and replays resend the original headers and timestamp, and Hookdeck itself applies
  no tolerance, so a fixed window would reject legitimate retries. Offer an opt-in tolerance (an env
  var such as SCHEMATIC_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say so in SKILL.md and
  verification.md (X-Schematic-Webhook-Timestamp is Unix seconds). Body FIRST, then a literal '+',
  then the timestamp. X-Schematic-Webhook-Signature-Version (v1) is not signed. Schematic's SDKs ship
  verify helpers; the examples verify by hand. Test sends carry no event_id or X-Schematic-Webhook-Id.
  Events: dispatch on the body's `action` (company.created, company.updated, user.created,
  plan.created, subscription.trial.ended, entitlement.limit.reached, flag.updated; 39 in all). Method:
  POST. Hookdeck's Schematic source manages the method as POST, so the examples handle POST on the
  webhook route. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type works and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI:
  await request.body()); parse the body only after the check. Hookdeck's source type is SCHEMATIC,
  labelled 'Schematic'.
testScenario:
  events:
    - "company.created"
    - "subscription.trial.ended"
    - "entitlement.limit.reached"
catalog:
  summary: "Verify Schematic webhooks (`X-Schematic-Webhook-Signature`: hex HMAC-SHA256 of `{body}+{timestamp}`), handle company, user, plan, flag and entitlement events"
