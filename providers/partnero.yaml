name: partnero
displayName: "Partnero"
docs:
  webhooks: https://docs.partnero.com/guides/webhooks/outgoing-webhooks
  verification: https://docs.partnero.com/guides/webhooks/outgoing-webhooks
notes: >
  Partnero (partnero.com), the affiliate, referral and partner program platform. Outgoing webhooks are
  added per program (Program Settings > Webhooks) or through the Webhooks API and fire on partner,
  customer, transaction and reward changes. Delivery (from the docs): Return a 2xx within 5 seconds.
  Failed deliveries are retried with backoff (immediate, 1 min, 5 min, 30 min, 2 h); after 5 failed
  attempts the webhook is marked failed in the dashboard logs. Partnero's docs say: 'Every webhook
  request includes a signature in the **`Signature`** header. It is an `HMAC-SHA256` hash of the **raw
  request body**, keyed with your webhook's signing secret' '.createHmac('sha256', WEBHOOK_SECRET) //
  your webhook's signing secret ... .digest('hex');' '$expected = hash_hmac('sha256', $raw,
  $webhookSecret);' From the docs (registry summary): Header literally named `Signature`, value a bare
  hex HMAC-SHA256 of the raw body keyed with the webhook's signing secret (Node `createHmac('sha256',
  WEBHOOK_SECRET).update(req.body).digest('hex')`, PHP `hash_hmac('sha256', $raw, $webhookSecret)`).
  No test vector. SIGNATURE SCHEME (it must match Hookdeck's PARTNERO source exactly: HMAC controller,
  algorithm "sha256", header_key "signature", encoding "hex"). The Signature header carries the bare
  lowercase hex digest, no prefix. Compare the WHOLE header value as one digest (no list splitting or
  prefix parsing). The signature is lowercase hex HMAC-SHA256, keyed with the secret, over the raw
  request body bytes only (no timestamp, id or other header is signed). Build the signed message as
  BYTES: the raw body bytes exactly as received, never decoded to a string and re-encoded, never
  JSON.parse/JSON.stringify'd before verifying. The HMAC key is the secret's UTF-8 bytes, used as-is
  (not hex- or base64-decoded). Hex is compared case-insensitively (as Hookdeck does): require exactly
  64 hex characters, lowercase both sides (or decode both to bytes) before the constant-time compare.
  Secret: The webhook's signing secret, shown when the webhook is created (its `signature` value) and
  returned by the Webhooks API. Use it as UTF-8 bytes. Env var: PARTNERO_WEBHOOK_SECRET. Validate the
  signature's format before decoding it (exact length and alphabet), then compare in constant time:
  Node checks lengths, then crypto.timingSafeEqual on equal-length Buffers, and never calls
  Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it silently drops bad characters); Python
  uses hmac.compare_digest on bytes (never str) and base64.b64decode(..., validate=True). Missing or
  empty signature header, malformed value or mismatch: 401. No timestamp is signed, so there is no
  replay window to check; do not invent one from unsigned headers or body fields. The header is
  literally named `Signature`. Events: dispatch on the body's `event` field. Top-level `event` carries
  the table value verbatim; `data` holds the event-specific fields, `webhook_key` names the
  subscription and `url` echoes the destination. No header names the type. Documented event types
  (15): partner.created, partner.updated, partner.approved, partner.rejected, partner.archived,
  partner.deleted, customer.created, customer.updated, customer.deleted, transaction.created,
  transaction.updated, transaction.deleted, reward.created, reward.approved, reward.paid. Handle a few
  common ones and log the rest. Method: POST. Hookdeck's Partnero source manages the method as POST,
  so the examples handle POST on the webhook route. Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type works and the exact bytes are verified (Next.js:
  await request.arrayBuffer(); FastAPI: await request.body()); parse the body only after the check.
  Documented sample payloads (each JSON file's `body` is the payload as the vendor's docs show it) are
  in /home/user/regwt/main-ro/samples-doc/providers/partnero/ (latest/partner.created.json); base the
  examples' test payloads on them. Hookdeck's source type is PARTNERO, labelled 'Partnero'.
testScenario:
  events:
    - "partner.created"
    - "transaction.created"
    - "reward.created"
catalog:
  summary: "Verify Partnero webhooks (`Signature`: hex HMAC-SHA256 of the raw body), handle partner, customer, transaction and reward events"
