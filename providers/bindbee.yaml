name: 'bindbee'
displayName: 'Bindbee'
docs:
  webhooks: 'https://docs.bindbee.dev/webhooks/overview'
  verification: 'https://docs.bindbee.dev/guides/webhooks/verify-signatures'
notes: >-
  Bindbee (bindbee.dev), a unified HRIS/ATS/LMS API. Webhooks are created in the dashboard and pinned
  to a version: version 2 (`2026.10.06`, current) or version 1 (`2025.01.01`, deprecated December 31,
  2026). This row covers version 2. Standard Webhooks signature with webhook-* headers: webhook-id, webhook-timestamp
  (Unix seconds), webhook-signature (one or more space-separated 'v1,<base64>' entries). Signed content
  is '{webhook-id}.{webhook-timestamp}.{raw request body}', HMAC-SHA256, base64 output. Hookdeck core
  notes: The secret is used as raw UTF-8 bytes, so it is pasted as-is. Version 2 webhooks only. SECRET:
  One organization-wide secret on the Webhooks page's Security signature card, for every webhook on both
  versions; shown without a prefix and used as raw UTF-8 bytes. Regenerating it invalidates the old one
  immediately. Research: raw string used as UTF-8 bytes ("Sign {webhook-id}.{webhook-timestamp}.{body}
  with HMAC-SHA256, keyed with the secret's UTF-8 bytes" https://docs.bindbee.dev/guides/webhooks/verify-signatures).
  The HMAC key is the secret's raw UTF-8 bytes, NOT a whsec_/base64 secret. Do NOT verify with the standardwebhooks
  or svix libraries (they base64-decode the secret, so the key would be wrong). Implement Standard Webhooks
  by hand exactly as Hookdeck's controller does: key = base64-decode of the part after 'whsec_' when the
  secret starts with whsec_, otherwise the secret's UTF-8 bytes; reject an empty key (fail closed); require
  all three headers; require the timestamp to be a plain positive integer (/^[1-9][0-9]*$/); HMAC-SHA256
  over the bytes '{id}.{timestamp}.' followed by the raw body bytes, base64; split the signature header
  on spaces and accept any 'v1,<sig>' entry that matches in constant time (Node: length check then crypto.timingSafeEqual
  on equal-length Buffers; Python: hmac.compare_digest on bytes); ignore other versions. No timestamp
  window by default, because Hookdeck retries and replays resend the original timestamp; an optional BINDBEE_WEBHOOK_TOLERANCE_SECONDS
  env var opts in. BINDBEE_WEBHOOK_SECRET holds the secret exactly as entered/shown (no whsec_ prefix
  added). HEADER FALLBACK (all three frameworks and the manual verifier): read the webhook-* headers and,
  when webhook-id is absent, fall back to the svix-* headers (svix-id, -timestamp, -signature), exactly
  as Hookdeck does; then hand the library (or manual check) the three values under the header names it
  expects. Include a test that a delivery signed the same way but sent with the other prefix's headers
  is accepted. This matches Hookdeck's Bindbee source (Standard Webhooks, headers_prefix 'webhook', a
  whsec_ secret base64-decoded after the prefix and any other secret used as its raw UTF-8 bytes, every
  v1 entry tried, other versions such as v1a ignored, no timestamp window; core also reads the other prefix's
  headers, webhook-* or svix-*). Missing headers or a bad signature: 400 or 401; handlers fail closed
  when the secret env var is unset. Hookdeck's configuration alert for this source reads exactly: "Paste
  the security signature secret as-is. Only version 2 webhooks are supported; version 1 webhooks lack
  the webhook-* headers and fail verification." SKILL.md and references/setup.md must state this requirement,
  quoting the alert verbatim. Verification notes: Raw body is required. Version 1 webhooks cannot be verified
  by this row's scheme. Body: {id, event, version, sequence, model, occurred_at, webhook, connector, data,
  sync, error}. `id` equals webhook-id and is the dedupe key; `sequence` orders events per connector;
  `model` only on data events, `error` only on sync.failed/relink_needed, `sync` absent on linked/relinked.
  The Body illustration elides nested objects (`{ … }`). Event type: Top-level `event` (version 2). `webhook.event`
  repeats it; data events add `model`. Version 1 bodies use other names (not covered). Event types (92
  documented, list may not be exhaustive): connector.linked, connector.sync.started, connector.sync.completed,
  connector.sync.failed, connector.relink_needed, connector.relinked, hris.company.created, hris.company.updated,
  hris.location.created, hris.location.updated, hris.group.created, hris.group.updated, hris.pay_group.created,
  hris.pay_group.updated, hris.payroll_code.created, hris.payroll_code.updated, hris.payroll_run_calendar.created,
  hris.payroll_run_calendar.updated, hris.employee.created, hris.employee.updated, hris.employment.created,
  hris.employment.updated, hris.compensation.created, hris.compensation.updated, hris.dependent.created,
  hris.dependent.updated, hris.bank_info.created, hris.bank_info.updated, hris.employer_benefit.created,
  hris.employer_benefit.updated and 62 more. Transport: POST with a JSON body. Delivery: Up to 4 attempts,
  1/2/4 s apart (Retry-After may stretch a wait to 5 s), 10 s timeout each; 408, 429, 5xx, timeouts and
  network errors are retried, other 4xx and 3xx are final (redirects not followed). No redelivery or replay
  after the last attempt; a failing endpoint stays enabled. One sync's events are sent one at a time in
  order; across syncs and connectors order is not guaranteed (sort by `sequence`). Setup: Webhooks are
  created in the dashboard, pinned to a version and an environment (production, development or both),
  and subscribed to events by name (no wildcards). No challenge is documented, so the row has no handshake
  block. Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type
  works and the exact bytes are verified; parse the body only after the check. Hookdeck's source type
  is BINDBEE, labelled 'Bindbee'.
testScenario:
  events:
  - 'hris.employee.created'
  - 'connector.linked'
  - 'connector.sync.started'
catalog:
  summary: >-
    Verify Bindbee webhooks (Standard Webhooks: `webhook-id`, `webhook-timestamp`, `webhook-signature`,
    secret used as raw UTF-8 bytes), handle connector, hris, ats and lms events
