name: zitadel
displayName: "ZITADEL"
docs:
  webhooks: https://zitadel.com/docs/guides/integrate/actions/testing-request-signature
  verification: https://help.zitadel.com/how-to-validate-zitadel-actions-v2-signature-with-node.js
  events: https://zitadel.com/docs/guides/integrate/actions/testing-event
notes: >
  ZITADEL (zitadel.com), an open-source identity platform (cloud and self-hosted). Delivery (from the
  docs): Per-target `timeout`. Webhook targets handle the status code but ignore the response; Async
  targets ignore both. A status outside 200-299 fails the execution (and interrupts it if
  interruptOnError). Retries are not documented. ZITADEL's docs say: 'SigningHeader =
  "ZITADEL-Signature"' 'parts = append(parts, fmt.Sprintf("%s=%s", signingVersion,
  hex.EncodeToString(computeSignature(t, payload, k)))) ... strings.Join(parts, partSeparator)
  [t=<unix>,v1=<hex>]' 'mac := hmac.New(sha256.New, []byte(signingKey)); _, _ = fmt.Fprintf(mac, "%d",
  t.Unix()); mac.Write([]byte(".")); mac.Write(payload)' 'const
  signedPayload=`${timestamp}.${req.rawBody}`; const hmac=crypto.createHmac('sha256',
  SIGNING_SECRET).update(signedPayload).digest('hex');' 'JSON: The payload is sent as JSON in the
  request body. Additionally, a signature header is sent to validate the payload.' From the docs
  (registry summary): `ZITADEL-Signature: t=<unix>,v1=<hex>` (one `v1=` per signing key) where v1 =
  hex HMAC-SHA256(target signingKey, `<t>` + `.` + raw body), per zitadel-go pkg/actions/signing.go.
  SIGNATURE SCHEME (it must match Hookdeck's ZITADEL source exactly: HMAC controller, algorithm
  "sha256", header_key "zitadel-signature", encoding "hex", delimiter ".", prefix_data_with_timestamp
  true). The ZITADEL-Signature header is `t=<timestamp>,v1=<hex>` (comma-separated key=value pairs).
  The signature is lowercase hex HMAC-SHA256, keyed with the secret, over: the t value exactly as it
  appears in the header (a string; never parse it to a number and re-format it), then a literal ".",
  then the raw request body bytes. The header may carry more than one v1= entry (for example during
  key rotation): accept the delivery if ANY v1= entry matches, and ignore other keys such as v0. A
  header with no t= value fails. Build the signed message as BYTES: the raw body bytes exactly as
  received, never decoded to a string and re-encoded, never JSON.parse/JSON.stringify'd before
  verifying. The HMAC key is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is
  compared case-insensitively (as Hookdeck does): require exactly 64 hex characters, lowercase both
  sides (or decode both to bytes) before the constant-time compare. Secret: Per target: the signingKey
  returned when the Target is created (regenerable on patch). Only PAYLOAD_TYPE_JSON targets use it.
  Use it as UTF-8 bytes. Env var: ZITADEL_WEBHOOK_SECRET. Validate the signature's format before
  decoding it (exact length and alphabet), then compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on
  an unvalidated value (it silently drops bad characters); Python uses hmac.compare_digest on bytes
  (never str) and base64.b64decode(..., validate=True). Missing or empty signature header, malformed
  value or mismatch: 401. Timestamp window: do NOT reject old timestamps by default. Hookdeck retries
  and replays resend the original headers and timestamp, and Hookdeck itself applies no tolerance, so
  a fixed window would reject legitimate retries. Offer an opt-in tolerance (an env var such as
  ZITADEL_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say so in SKILL.md and verification.md (t
  is Unix seconds). Only Actions v2 targets with the JSON payload type are covered; JWT and JWE
  payload types are verified against the instance keys and are out of scope. Events: event executions
  carry `event_type` (with `aggregateType`, `aggregateID`, `event_payload`); request/response
  executions carry `fullMethod` and function executions carry `function`. Dispatch on whichever is
  present. Method: POST. Hookdeck's ZITADEL source manages the method as POST, so the examples handle
  POST on the webhook route. Express examples must read the raw body with express.raw({ type: '*/*' })
  so any content type works and the exact bytes are verified (Next.js: await request.arrayBuffer();
  FastAPI: await request.body()); parse the body only after the check. Hookdeck's source type is
  ZITADEL, labelled 'ZITADEL'. Hookdeck shows this setup note for the source, and SKILL.md and
  references/setup.md must tell the user the same thing, verbatim: "Only Actions v2 targets with the
  JSON payload type are supported. JWT and JWE payload types aren't."
testScenario:
  events:
    - "user.human.added"
    - "session.added"
catalog:
  summary: "Verify ZITADEL webhooks (`ZITADEL-Signature`: `t=`/`v1=` hex HMAC-SHA256 of `{t}.{body}`), handle Actions v2 event executions"
