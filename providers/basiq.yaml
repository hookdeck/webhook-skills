name: 'basiq'
displayName: 'Basiq'
docs:
  webhooks: 'https://api.basiq.io/docs/webhooks'
  verification: 'https://api.basiq.io/docs/webhooks-security'
  events: 'https://api.basiq.io/reference/listeventtypes'
notes: >-
  Basiq (basiq.io), an Australian open-banking (CDR) data API: users, consents, connections, accounts
  and transactions. Webhook subscriptions are created via POST /notifications/webhooks; the event type
  list is served by GET /events/types. Standard Webhooks signature with webhook-* headers: webhook-id,
  webhook-timestamp (Unix seconds), webhook-signature (one or more space-separated 'v1,<base64>' entries).
  Signed content is '{webhook-id}.{webhook-timestamp}.{raw request body}', HMAC-SHA256, base64 output.
  SECRET: One signing secret per endpoint, `whsec_` + base64 (example `whsec_MA4V6bD7rB0Hcm2aw8ghgDeQ5UAak24DwnX0rX6`).
  Research: whsec_ ("The signing secret is the part after the whsec_ prefix." https://api.basiq.io/docs/webhooks-security).
  It starts with whsec_; the key is the base64-decoding of the part after whsec_. BASIQ_WEBHOOK_SECRET
  holds the full whsec_ value. Verify with the standardwebhooks library (npm 'standardwebhooks', pip 'standardwebhooks'),
  which reads webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK (all three frameworks
  and the manual verifier): read the webhook-* headers and, when webhook-id is absent, fall back to the
  svix-* headers (svix-id, -timestamp, -signature), exactly as Hookdeck does; then hand the library (or
  manual check) the three values under the header names it expects (for the standardwebhooks library,
  pass them as webhook-id, webhook-timestamp and webhook-signature). Include a test that a delivery signed
  the same way but sent with the other prefix's headers is accepted. This matches Hookdeck's Basiq source
  (Standard Webhooks, headers_prefix 'webhook', a whsec_ secret base64-decoded after the prefix and any
  other secret used as its raw UTF-8 bytes, every v1 entry tried, other versions such as v1a ignored,
  no timestamp window; core also reads the other prefix's headers, webhook-* or svix-*). The library always
  enforces a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries and replays resend
  the original timestamp, so the library rejects late retries after 5 minutes, and point to a manual verifier
  in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw body}' with the same key, compare
  every space-separated v1,<base64> entry in constant time after a length check, require the timestamp
  to be a plain positive integer) where the window can be dropped or widened. Missing headers or a bad
  signature: 400 or 401; handlers fail closed when the secret env var is unset. Verification notes: Raw
  body is required. Body: {eventTypeId, eventId, links}. `links.event` and `links.eventEntity` point at
  the event and the affected object; no resource data is inlined. Event type: Top-level `eventTypeId`
  in a thin notification (`eventTypeId`, `eventId`, `links.event`, `links.eventEntity`); the receiver
  fetches the event or entity from the links. Event types (15 documented, list may not be exhaustive):
  account.updated, connection.activated, connection.created, connection.deleted, connection.invalidated,
  consent.created, consent.expired, consent.reminder, consent.revoked, consent.updated, consent.warning,
  transactions.updated, user.created, user.deleted, user.updated. Transport: JSON POST to the subscribed
  URL. Delivery: Messages are kept and listable via GET /notifications/webhooks/{webhookId}/messages.
  A new subscription may take up to 15 minutes to start delivering. No retry schedule, timeout or ordering
  statement (gaps). Setup: API-managed subscriptions (POST /notifications/webhooks with URL and event
  types); test messages via POST /notifications/messages/test. No challenge is documented, so the row
  has no handshake block. Express examples must read the raw body with express.raw({ type: '*/*' }) so
  any content type works and the exact bytes are verified; parse the body only after the check. Hookdeck's
  source type is BASIQ, labelled 'Basiq'.
testScenario:
  events:
  - 'user.created'
  - 'account.updated'
  - 'connection.activated'
catalog:
  summary: >-
    Verify Basiq webhooks (Standard Webhooks: `webhook-id`, `webhook-timestamp`, `webhook-signature`,
    `whsec_` secret), handle user.created, connection.activated, consent.revoked, account.updated and transactions.updated events
