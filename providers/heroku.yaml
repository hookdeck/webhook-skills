name: heroku
displayName: Heroku
docs:
  webhooks: https://devcenter.heroku.com/articles/app-webhooks
  verification: https://devcenter.heroku.com/articles/app-webhooks
notes: >
  App webhooks. Header Heroku-Webhook-Hmac-SHA256 = base64 HMAC-SHA256 of the raw body keyed with
  the webhook secret (chosen with --secret or generated by the CLI and shown once; raw string).
  Payload has resource (api:build, api:release, dyno, api:formation, api:addon-attachment, ...),
  action (create, update, destroy) and data. Optional --authorization header is an extra.
testScenario:
  events:
    - api:release
    - api:build
catalog:
  summary: Verify Heroku app webhook signatures (`Heroku-Webhook-Hmac-SHA256`, HMAC-SHA256 base64 over the raw body), handle `api:release`, `api:build`, `api:app`, `api:dyno`, `api:formation` and `api:addon-attachment` events (`create` / `update` / `destroy`)
