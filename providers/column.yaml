name: column
displayName: "Column"
docs:
  webhooks: https://docs.column.com/markdown/working-with-the-api/events-and-webhooks
  verification: https://docs.column.com/markdown/working-with-the-api/events-and-webhooks
notes: >
  Column (column.com), the developer-facing nationally chartered bank (ACH, wires, RTP, checks, card
  issuing, loans). Webhook endpoints are created through the API or Dashboard with an `enabled_events`
  list (wildcards allowed); one endpoint per event type receives it. Delivery (from the docs): A 2xx
  within 10 s acknowledges. Failures are retried up to 25 times within 3 days with exponential
  backoff, the first a minute later. Redeliveries keep the event `id`; ordering is not guaranteed.
  Column's docs say: 'every webhook event payload is signed with a signature that is passed through as
  the HTTP header `Column-Signature`. The signature is a hash-based message authentication code (HMAC)
  with SHA-256, by applying the webhook endpoint's signing secret as the key, and the JSON payload
  (i.e., the request body) as the message.' 'Please use our raw webhook payloads without any
  modification to calculate signatures. Any pre-processing of our raw webhook payloads (e.g.,
  prettify, deserialize/serialize, trim spaces, etc.) may result in different signatures.' 'The result
  should be equal to the value of `Column-Signature` header for a valid webhook event sent by Column.'
  'OpenSSL::HMAC.hexdigest( "SHA256", Credentials.fetch(:COLUMN, ColumnService::ENVIRONMENT,
  :WEBHOOK_SECRET), request.body.read ), request.headers["Column-Signature"]' 'h :=
  hmac.New(sha256.New, []byte(webhookSecret)) h.Write(payload) computedSignature :=
  hex.EncodeToString(h.Sum(nil))' From the docs (registry summary): `Column-Signature` =
  HMAC-SHA256(endpoint signing secret, raw body). The docs never state the output encoding (hex or
  base64) and show no header value or code sample; hex is the coordinator's decision for Hookdeck's
  config, "confirmed by two production integrations (hackclub/hcb, formancehq/payments)", not a
  vendor-doc fact. No test vector. SIGNATURE SCHEME (it must match Hookdeck's COLUMN source exactly:
  HMAC controller, algorithm "sha256", header_key "column-signature", encoding "hex"). The
  Column-Signature header carries the bare lowercase hex digest, no prefix. Compare the WHOLE header
  value as one digest (no list splitting or prefix parsing). The signature is lowercase hex
  HMAC-SHA256, keyed with the secret, over the raw request body bytes only (no timestamp, id or other
  header is signed). Build the signed message as BYTES: the raw body bytes exactly as received, never
  decoded to a string and re-encoded, never JSON.parse/JSON.stringify'd before verifying. The HMAC key
  is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared
  case-insensitively (as Hookdeck does): require exactly 64 hex characters, lowercase both sides (or
  decode both to bytes) before the constant-time compare. Secret: Each endpoint's own signing secret,
  generated by Column and retrieved from the Dashboard's Webhook settings; secrets are not shared
  across endpoints. To rotate, create a new endpoint and delete the old one. Use it as UTF-8 bytes.
  Env var: COLUMN_WEBHOOK_SECRET. Validate the signature's format before decoding it (exact length and
  alphabet), then compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it
  silently drops bad characters); Python uses hmac.compare_digest on bytes (never str) and
  base64.b64decode(..., validate=True). Missing or empty signature header, malformed value or
  mismatch: 401. No timestamp is signed, so there is no replay window to check; do not invent one from
  unsigned headers or body fields. Column's docs don't state the output encoding; Hookdeck uses hex
  (lowercase, 64 characters), confirmed by production integrations. Events: dispatch on the body's
  `type` field. Top-level `type` carries the event type (`{category}.{action}` or
  `{category}.{sub_category}.{action}`); `data` is the resource at the time the event fired, `id`
  (`evnt_...`) the event id, stable across redeliveries. No header names the type;
  `Webhook-Endpoint-Id` names the endpoint. Documented event types (212): book.transfer.completed,
  book.transfer.hold_created, book.transfer.updated, book.transfer.canceled,
  ach.outgoing_transfer.initiated, ach.outgoing_transfer.manual_review,
  ach.outgoing_transfer.submitted, ach.outgoing_transfer.settled, ach.outgoing_transfer.completed,
  ach.outgoing_transfer.returned, ach.outgoing_transfer.return_dishonored,
  ach.outgoing_transfer.return_contested, ach.outgoing_transfer.canceled,
  ach.outgoing_transfer.hold_created (and 198 more). Handle a few common ones and log the rest.
  Method: POST. Hookdeck's Column source manages the method as POST, so the examples handle POST on
  the webhook route. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type works and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI:
  await request.body()); parse the body only after the check. Hookdeck's source type is COLUMN,
  labelled 'Column'.
testScenario:
  events:
    - "ach.outgoing_transfer.completed"
    - "ach.outgoing_transfer.returned"
    - "book.transfer.completed"
catalog:
  summary: "Verify Column webhooks (`Column-Signature`: hex HMAC-SHA256 of the raw body), handle ach.outgoing_transfer.completed, ach.outgoing_transfer.returned and book.transfer.completed events"
