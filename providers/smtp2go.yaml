name: smtp2go
displayName: 'SMTP2GO'
docs:
  webhooks: https://developers.smtp2go.com/docs/webhooks-overview
  verification: https://developers.smtp2go.com/docs/setup-a-webhook
notes: >
  SMTP2GO (email and SMS delivery) webhooks. Setup offers 'Authoization header - Optionally include
  a bearer or basic authorization header'; the API's auth_header_type is bearer or basic and
  auth_header_value is 'Either base64(user:pass) or a custom token'. The docs don't print the exact
  outgoing header, so tell the user to capture one delivery and set the env var to exactly what
  arrives (expected 'Bearer <token>' or 'Basic <base64>'). No signature. The credential is the
  Authorization header. Hookdeck's SMTP2GO source compares the WHOLE Authorization header value to
  the configured key, so the examples read SMTP2GO_AUTHORIZATION = the full value as SMTP2GO sends
  it (e.g. 'Bearer <token>'), including any scheme prefix, and compare the whole Authorization
  header to it; do not strip, parse or base64-decode the prefix (Coterie pattern). Missing header or
  mismatch: 401. Compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers (or on SHA-256 digests of both sides); Python uses hmac.compare_digest on
  bytes (encode both sides; never pass str, which raises on non-ASCII). SKILL.md and verification.md
  must say plainly that a static shared credential authenticates the sender, not the body, and gives
  no replay protection (no signature, no timestamp), so use HTTPS and rotate the credential if it
  leaks. Model on the n8n, zapier, coterie and honeybadger skills on main. Hookdeck's source type is
  SMTP2GO, labelled 'SMTP2GO'. Hookdeck shows this setup note for the source, and SKILL.md and
  references/setup.md must tell the user the same thing, verbatim: "Set an Authorization header on
  the SMTP2GO webhook and paste the full value, including the "Bearer " or "Basic " prefix." Body:
  'SMTP2GO sends a POST (not a GET) request to your URL with the data output type of "JSON" or "Form
  encoded"', so parse application/json and application/x-www-form-urlencoded (after the auth check).
  Flat parameters with event (processed, delivered, open, click, bounce, spam, unsubscribe, reject;
  SMS: sms_delivered, sms_failed, ...), time, sendtime, sender, rcpt, email_id, message-id. Dispatch
  on event. Retried for up to 48 hours. Express examples must read the raw body with express.raw({
  type: '*/*' }) so any content type works (and, for signatures, the exact bytes are verified);
  parse the body only after the check.
testScenario:
  events:
    - 'delivered'
    - 'bounce'
    - 'open'
catalog:
  summary: 'Authenticate SMTP2GO email and SMS webhooks (unsigned: the whole `Authorization` value compared in constant time), parse JSON or form-encoded events'
