name: 'chargeblast'
displayName: 'Chargeblast'
docs:
  webhooks: 'https://docs.chargeblast.com/api-reference/webhooks/setup'
  verification: 'https://docs.chargeblast.com/api-reference/webhooks/setup'
notes: >-
  Chargeblast (chargeblast.com), chargeback-prevention alerts (Ethoca, CDRN, RDR, TC40) and Visa Consumer
  Clarity / FPT deflections for merchants. Webhooks report alert and deflection events with svix-* signature
  headers and the type in an X-Event-Type header. Standard Webhooks signature with svix-* headers: svix-id,
  svix-timestamp (Unix seconds), svix-signature (one or more space-separated 'v1,<base64>' entries). Signed
  content is '{svix-id}.{svix-timestamp}.{raw request body}', HMAC-SHA256, base64 output. Hookdeck core
  notes: Delivered by Svix. SECRET: The webhook secret from the dashboard's settings tab, shown as `whsec_xxxxxxxxxxxx`.
  Research: whsec_ ('your webhook secret (whsec_xxxxxxxxxxxx)') https://docs.chargeblast.com/api-reference/webhooks/setup.
  It starts with whsec_; the key is the base64-decoding of the part after whsec_. CHARGEBLAST_WEBHOOK_SECRET
  holds the full whsec_ value. Verify with the svix library (npm 'svix', pip 'svix'), whose Webhook.verify
  reads svix-id, svix-timestamp and svix-signature and falls back to webhook-id, webhook-timestamp and
  webhook-signature. HEADER FALLBACK (all three frameworks and the manual verifier): read the svix-* headers
  and, when svix-id is absent, fall back to the webhook-* headers (webhook-id, -timestamp, -signature),
  exactly as Hookdeck does; then hand the library (or manual check) the three values under the header
  names it expects (the svix library accepts either set itself, so pass it both sets of headers rather
  than only svix-*). Include a test that a delivery signed the same way but sent with the other prefix's
  headers is accepted. This matches Hookdeck's Chargeblast source (Standard Webhooks, headers_prefix 'svix',
  a whsec_ secret base64-decoded after the prefix and any other secret used as its raw UTF-8 bytes, every
  v1 entry tried, other versions such as v1a ignored, no timestamp window; core also reads the other prefix's
  headers, webhook-* or svix-*). The library always enforces a fixed 5-minute timestamp window. SKILL.md
  must say that Hookdeck retries and replays resend the original timestamp, so the library rejects late
  retries after 5 minutes, and point to a manual verifier in references/verification.md (HMAC-SHA256 over
  '{id}.{timestamp}.{raw body}' with the same key, compare every space-separated v1,<base64> entry in
  constant time after a length check, require the timestamp to be a plain positive integer) where the
  window can be dropped or widened. Missing headers or a bad signature: 400 or 401; handlers fail closed
  when the secret env var is unset. Verification notes: Raw body is required. Body: {alertId, alertType,
  amount, attributes, arn, authCode, card, cardBrand, createdAt, currency, customerEmail, id, merchantId,
  provider, subprovider, transactionDate}. No envelope: the body is the alert object (main fields listed;
  full set in the Alert tab) or, for deflection.*, the deflection object (`id`, `type` = CE/FPT, `status`,
  `amount`, `currency`, `chargeId`, `customerEmail`, `fees`, `merchantId`). Event type: The X-Event-Type
  header. Neither body carries the type — alert bodies are the alert object, deflection bodies the deflection
  object (whose `type` field is the deflection product, `CE` or `FPT`, not the event type). Event types
  (8 documented, list may not be exhaustive): alert.created, alert.updated, alert.refunded, alert.matched,
  alert.will_expire, alert.within_refund_rules, deflection.created, deflection.updated. Transport: JSON
  POST; alert and deflection events use different bodies. No Content-Type is printed. Delivery: No timeout,
  retry or ordering statement. Event notes say alert.refunded can follow alert.created closely, alert.will_expire
  is sent at most once per alert and alert.within_refund_rules is not deduplicated. Setup: The webhook
  URL is set in the Chargeblast dashboard's settings tab. No per-type selection, challenge or validation
  request is documented, so the row has no handshake block. Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type works and the exact bytes are verified; parse the body
  only after the check. Hookdeck's source type is CHARGEBLAST, labelled 'Chargeblast'.
testScenario:
  events:
  - 'alert.created'
  - 'alert.updated'
  - 'alert.refunded'
catalog:
  summary: >-
    Verify Chargeblast webhook signatures (Svix: `svix-id`, `svix-timestamp`, `svix-signature`, HMAC-SHA256,
    `whsec_` secret), read the event type from `X-Event-Type`, handle alert.created, alert.updated and deflection.created events
