name: loop
displayName: Loop
docs:
  webhooks: https://docs.loop.com/developers/webhooks
  verification: https://docs.loop.com/developers/webhooks#webhook-signature-verification
  events: https://docs.loop.com/developers/webhook-event-types
notes: >
  Loop (loop.com), freight audit and logistics payments. Webhooks are delivered by Svix:
  svix-id, svix-timestamp, svix-signature; HMAC-SHA256 base64 over "<id>.<timestamp>.<raw
  body>" with the whsec_ secret (docs example whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw); sign the
  raw string body. Loop recommends deduplicating on the payload eventId, not svix-id. See the
  Webhook event types page for the list; a test event is test-event.created. Not Loop Returns
  or Loop Subscriptions (Shopify apps), different companies.
testScenario:
  events:
    - test-event.created
catalog:
  summary: Verify Loop (loop.com, freight audit and logistics payments) webhooks delivered by Svix (`svix-id`/`svix-timestamp`/`svix-signature`, HMAC-SHA256 base64 over `{id}.{timestamp}.{raw-body}` with the `whsec_` secret), deduplicate on the payload `eventId` rather than `svix-id`, and handle flat `eventType` payloads such as `payment.completed`, `receivable-invoice.finalized`, `shipment-job.rerated` and `business-exception.created`. Not Loop Returns or Loop Subscriptions
