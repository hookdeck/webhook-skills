name: 'blindpay'
displayName: 'BlindPay'
docs:
  webhooks: 'https://blindpay.com/docs/learn/webhooks'
  verification: 'https://blindpay.com/docs/learn/webhooks-verification'
  events: 'https://blindpay.com/docs/learn/webhooks-events'
notes: >-
  BlindPay (blindpay.com), a stablecoin and fiat payins/payouts API. Webhooks are configured per instance,
  delivered through Svix, and report customer, bank account, wallet, payin, payout, virtual account, transfer,
  limit-increase and payable changes. Standard Webhooks signature with svix-* headers: svix-id, svix-timestamp
  (Unix seconds), svix-signature (one or more space-separated 'v1,<base64>' entries). Signed content is
  '{svix-id}.{svix-timestamp}.{raw request body}', HMAC-SHA256, base64 output. Hookdeck core notes: Delivered
  by Svix. SECRET: Per endpoint, `whsec_<base64>`: `GET /v1/instances/{instance}/webhook-endpoints/{we_id}/secret`
  returns `{ "key": "whsec_..." }`, or dashboard > instance > Webhooks > endpoint menu > Get secret. The
  full example's secret is `whsec_plJ3nmyCDGBKInavdOK15jsl`. Research: whsec_ ("Your signing secret has
  the form `whsec_<base64>`", https://blindpay.com/docs/learn/webhooks-verification). It starts with whsec_;
  the key is the base64-decoding of the part after whsec_. BLINDPAY_WEBHOOK_SECRET holds the full whsec_
  value. Verify with the svix library (npm 'svix', pip 'svix'), whose Webhook.verify reads svix-id, svix-timestamp
  and svix-signature and falls back to webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK
  (all three frameworks and the manual verifier): read the svix-* headers and, when svix-id is absent,
  fall back to the webhook-* headers (webhook-id, -timestamp, -signature), exactly as Hookdeck does; then
  hand the library (or manual check) the three values under the header names it expects (the svix library
  accepts either set itself, so pass it both sets of headers rather than only svix-*). Include a test
  that a delivery signed the same way but sent with the other prefix's headers is accepted. This matches
  Hookdeck's BlindPay source (Standard Webhooks, headers_prefix 'svix', a whsec_ secret base64-decoded
  after the prefix and any other secret used as its raw UTF-8 bytes, every v1 entry tried, other versions
  such as v1a ignored, no timestamp window; core also reads the other prefix's headers, webhook-* or svix-*).
  The library always enforces a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries
  and replays resend the original timestamp, so the library rejects late retries after 5 minutes, and
  point to a manual verifier in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw body}'
  with the same key, compare every space-separated v1,<base64> entry in constant time after a length check,
  require the timestamp to be a plain positive integer) where the window can be dropped or widened. Missing
  headers or a bad signature: 400 or 401; handlers fail closed when the secret env var is unset. Verification
  notes: Raw body is required ("Never modify the request body before verification"). Body: {webhook_event}.
  Flat body, `webhook_event` followed by the resource's own fields (payin.complete carries `id`, `status`,
  `customer_id`, amounts, fees, bank details and tracking objects). Event type: Top-level `webhook_event`,
  followed by the resource object's own fields (flat, no wrapper). Event types (26 documented, list may
  not be exhaustive): customer.new, customer.update, customer.delete, bankAccount.new, blockchainWallet.new,
  blockchainWallet.update, tos.accept, payin.new, payin.update, payin.complete, payout.new, payout.update,
  payout.complete, virtualAccount.new, virtualAccount.complete, transfer.new, transfer.update, transfer.complete,
  wallet.new, wallet.update, wallet.inbound, limitIncrease.new, limitIncrease.update, payable.new, payable.update,
  payable.complete. Transport: JSON; the verification page's cURL illustration POSTs the raw body. Delivery:
  Non-2xx responses are retried with backoff over hours; `svix-id` is stable across retries. Events can
  be inspected and replayed (same payload) from the dashboard's Events dashboard or the Svix portal. Setup:
  Up to 25 HTTPS endpoints per instance, via `POST /v1/instances/{instance}/webhook-endpoints` or the
  dashboard; an empty `events` array subscribes to every event. No challenge or validation request is
  documented, so the row has no handshake block. Express examples must read the raw body with express.raw({
  type: '*/*' }) so any content type works and the exact bytes are verified; parse the body only after
  the check. Hookdeck's source type is BLINDPAY, labelled 'BlindPay'.
testScenario:
  events:
  - 'payin.complete'
  - 'customer.new'
  - 'customer.update'
catalog:
  summary: >-
    Verify BlindPay webhooks (delivered by Svix: `svix-id`, `svix-timestamp`, `svix-signature`, `whsec_`
    secret), handle customer, payin, payout, transfer and wallet events
