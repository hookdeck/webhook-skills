name: 'vern'
displayName: 'Vern'
docs:
  webhooks: 'https://docs.vern.so/help-center/send/webhooks'
  verification: 'https://docs.vern.so/help-center/send/webhooks'
  events: 'https://docs.vern.so/help-center/send/webhooks'
notes: >-
  Vern (vern.so), an AI data-onboarding / spreadsheet-import platform. Workbook exports with the Webhook
  option POST the cleaned rows (in batches) to endpoints configured in an embedded Svix portal; Svix signs
  them. Standard Webhooks signature with svix-* headers: svix-id, svix-timestamp (Unix seconds), svix-signature
  (one or more space-separated 'v1,<base64>' entries). Signed content is '{svix-id}.{svix-timestamp}.{raw
  request body}', HMAC-SHA256, base64 output. Hookdeck core notes: Delivered by Svix. Header names are
  not documented; svix-* is the Svix default. SECRET: Per endpoint, in the Svix portal opened from Settings
  > Webhooks. Vern prints no value; Svix endpoint secrets are `whsec_<base64>`. Research: whsec_ (inferred:
  Svix app portal embed; the literal secret is not printed). It starts with whsec_; the key is the base64-decoding
  of the part after whsec_. VERN_WEBHOOK_SECRET holds the full whsec_ value. Verify with the svix library
  (npm 'svix', pip 'svix'), whose Webhook.verify reads svix-id, svix-timestamp and svix-signature and
  falls back to webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK (all three frameworks
  and the manual verifier): read the svix-* headers and, when svix-id is absent, fall back to the webhook-*
  headers (webhook-id, -timestamp, -signature), exactly as Hookdeck does; then hand the library (or manual
  check) the three values under the header names it expects (the svix library accepts either set itself,
  so pass it both sets of headers rather than only svix-*). Include a test that a delivery signed the
  same way but sent with the other prefix's headers is accepted. This matches Hookdeck's Vern source (Standard
  Webhooks, headers_prefix 'svix', a whsec_ secret base64-decoded after the prefix and any other secret
  used as its raw UTF-8 bytes, every v1 entry tried, other versions such as v1a ignored, no timestamp
  window; core also reads the other prefix's headers, webhook-* or svix-*). The library always enforces
  a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries and replays resend the original
  timestamp, so the library rejects late retries after 5 minutes, and point to a manual verifier in references/verification.md
  (HMAC-SHA256 over '{id}.{timestamp}.{raw body}' with the same key, compare every space-separated v1,<base64>
  entry in constant time after a length check, require the timestamp to be a plain positive integer) where
  the window can be dropped or widened. Missing headers or a bad signature: 400 or 401; handlers fail
  closed when the secret env var is unset. Verification notes: The page names no header; they are Svix's.
  Body: {version, workbook_id, external_id, batch, sheets}. Flat (1.0) shown; nested (2.0) is `{version,
  workbook_id, company_name, external_id, export_mode, batch, root_sheets, data}`. Batches: ~256 KB target
  / 512 KB ceiling (flat) or up to 50 root records (nested); reassemble by batch.id / batch.index. Event
  type: The body carries no event name: both events deliver the same flat (`version` 1.0) or nested (2.0)
  workbook payload, and `version` is the export mode, not the event. Svix knows the event type, but Vern
  documents no header carrying it. Event types (2 documented, list may not be exhaustive): workbook.production.export,
  workbook.preview.export. Transport: JSON POST via Svix, one batch per delivery. Delivery: Non-2xx is
  retried by Svix on a backoff schedule; replay from the portal. Dedupe; batches may arrive in any order.
  Setup: Per endpoint in the embedded Svix portal (Settings > Webhooks): URL and one or both events. No
  challenge. Express examples must read the raw body with express.raw({ type: '*/*' }) so any content
  type works and the exact bytes are verified; parse the body only after the check. Hookdeck's source
  type is VERN, labelled 'Vern'.
testScenario:
  events:
  - 'workbook.production.export'
  - 'workbook.preview.export'
catalog:
  summary: >-
    Verify Vern webhooks (delivered by Svix: `svix-id`, `svix-timestamp`, `svix-signature`, HMAC-SHA256, `whsec_` secret),
    handle workbook.production.export and workbook.preview.export batches
