name: 'goody'
displayName: 'Goody'
docs:
  webhooks: 'https://developer.ongoody.com/webhooks/webhook-security'
  verification: 'https://developer.ongoody.com/webhooks/webhook-security'
notes: >-
  Goody (ongoody.com), a corporate gifting API (Automation API and Commerce API). Webhooks report order
  and order-batch events and are sent through Svix. Standard Webhooks signature with svix-* headers: svix-id,
  svix-timestamp (Unix seconds), svix-signature (one or more space-separated 'v1,<base64>' entries). Signed
  content is '{svix-id}.{svix-timestamp}.{raw request body}', HMAC-SHA256, base64 output. Hookdeck core
  notes: Delivered by Svix. SECRET: Per endpoint, the "Signing Secret" on the webhook's configuration
  page; `whsec_`-prefixed (every snippet's example secret is `whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw`,
  Svix's generic test value). Research: whsec_ (Svix; example secret "whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw",
  https://developer.ongoody.com/webhooks/webhook-security). It starts with whsec_; the key is the base64-decoding
  of the part after whsec_. GOODY_WEBHOOK_SECRET holds the full whsec_ value. Verify with the svix library
  (npm 'svix', pip 'svix'), whose Webhook.verify reads svix-id, svix-timestamp and svix-signature and
  falls back to webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK (all three frameworks
  and the manual verifier): read the svix-* headers and, when svix-id is absent, fall back to the webhook-*
  headers (webhook-id, -timestamp, -signature), exactly as Hookdeck does; then hand the library (or manual
  check) the three values under the header names it expects (the svix library accepts either set itself,
  so pass it both sets of headers rather than only svix-*). Include a test that a delivery signed the
  same way but sent with the other prefix's headers is accepted. This matches Hookdeck's Goody source
  (Standard Webhooks, headers_prefix 'svix', a whsec_ secret base64-decoded after the prefix and any other
  secret used as its raw UTF-8 bytes, every v1 entry tried, other versions such as v1a ignored, no timestamp
  window; core also reads the other prefix's headers, webhook-* or svix-*). The library always enforces
  a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries and replays resend the original
  timestamp, so the library rejects late retries after 5 minutes, and point to a manual verifier in references/verification.md
  (HMAC-SHA256 over '{id}.{timestamp}.{raw body}' with the same key, compare every space-separated v1,<base64>
  entry in constant time after a length check, require the timestamp to be a plain positive integer) where
  the window can be dropped or widened. Missing headers or a bad signature: 400 or 401; handlers fail
  closed when the secret env var is unset. Verification notes: Raw body is required. Body: {event_type,
  id, data}. `event_type`, `id` (the event id; the schema calls it `event_id`) and `data` (the order,
  or the order batch for order_batch.*). Event type: Top-level `event_type` beside `id` and `data` (the
  order or order batch). The schema names the event id `event_id`, but every example carries `id`. Event
  types (10 documented, list may not be exhaustive): order_batch.created, order_batch.completed, order.created,
  order.gift_opened, order.gift_accepted, order.thank_you_note_added, order.shipped, order.delivered,
  order.canceled, order.refunded. Transport: JSON examples on every event page; content type per Svix.
  Goody states no method; POST is Svix's delivery method, recorded from Svix's docs (method_evidence),
  the delivery platform's statement rather than Goody's. Delivery: Delivery logs per endpoint with manual
  re-send of failed webhooks. No retry schedule or timeout is stated. Setup: Endpoints are added in the
  Goody dashboard (Organization > Automation API or Commerce API app); Message Filtering left blank receives
  all events. No challenge or validation request is documented, so the row has no handshake block. Express
  examples must read the raw body with express.raw({ type: '*/*' }) so any content type works and the
  exact bytes are verified; parse the body only after the check. Hookdeck's source type is GOODY, labelled
  'Goody'.
testScenario:
  events:
  - 'order.created'
  - 'order_batch.created'
  - 'order_batch.completed'
catalog:
  summary: >-
    Verify Goody webhook signatures (delivered by Svix: `svix-id`, `svix-timestamp`, `svix-signature`,
    HMAC-SHA256, `whsec_` secret), handle order.created, order.gift_accepted, order.shipped and
    order_batch.completed events
