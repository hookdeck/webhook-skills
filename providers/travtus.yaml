name: 'travtus'
displayName: 'Travtus'
docs:
  webhooks: 'https://docs.travtus.com/travtus-api-and-webhook/webhook/authentication'
  verification: 'https://docs.travtus.com/travtus-api-and-webhook/webhook/authentication'
  events: 'https://docs.travtus.com/travtus-api-and-webhook/data-types-and-endpoints/task/webhooks'
notes: >-
  Travtus (travtus.com), the "Adam" AI assistant platform for residential property management. Webhooks
  report lease and task changes and deliver AI-generated replies for the Messaging API (SMS, email, web
  chat), through Svix. Endpoints are set up by Travtus support. Standard Webhooks signature with svix-*
  headers: svix-id, svix-timestamp (Unix seconds), svix-signature (one or more space-separated 'v1,<base64>'
  entries). Signed content is '{svix-id}.{svix-timestamp}.{raw request body}', HMAC-SHA256, base64 output.
  Hookdeck core notes: Delivered by Svix. SECRET: Travtus support sets up the webhook (email support@travtus.com
  with the URL) and issues a `whsec_...` secret, unique per endpoint; endpoints can also be added through
  a short-lived portal URL. Research: whsec_ ("you will receive a webhook secret (`whsec_...`) from Travtus",
  https://docs.travtus.com/travtus-api-and-webhook/webhook/authentication). It starts with whsec_; the
  key is the base64-decoding of the part after whsec_. TRAVTUS_WEBHOOK_SECRET holds the full whsec_ value.
  Verify with the svix library (npm 'svix', pip 'svix'), whose Webhook.verify reads svix-id, svix-timestamp
  and svix-signature and falls back to webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK
  (all three frameworks and the manual verifier): read the svix-* headers and, when svix-id is absent,
  fall back to the webhook-* headers (webhook-id, -timestamp, -signature), exactly as Hookdeck does; then
  hand the library (or manual check) the three values under the header names it expects (the svix library
  accepts either set itself, so pass it both sets of headers rather than only svix-*). Include a test
  that a delivery signed the same way but sent with the other prefix's headers is accepted. This matches
  Hookdeck's Travtus source (Standard Webhooks, headers_prefix 'svix', a whsec_ secret base64-decoded
  after the prefix and any other secret used as its raw UTF-8 bytes, every v1 entry tried, other versions
  such as v1a ignored, no timestamp window; core also reads the other prefix's headers, webhook-* or svix-*).
  The library always enforces a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries
  and replays resend the original timestamp, so the library rejects late retries after 5 minutes, and
  point to a manual verifier in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw body}'
  with the same key, compare every space-separated v1,<base64> entry in constant time after a length check,
  require the timestamp to be a plain positive integer) where the window can be dropped or widened. Missing
  headers or a bad signature: 400 or 401; handlers fail closed when the secret env var is unset. Hookdeck's
  configuration alert for this source reads exactly: "Travtus sets up webhooks through support@travtus.com
  and sends you the whsec_ secret. Paste it here." SKILL.md and references/setup.md must state this requirement,
  quoting the alert verbatim. Verification notes: Raw body is required ("Verify the payload exactly as
  sent"). Body: {event_type, message_id, body}. `message_id` is the Svix-assigned message id; `body` is
  the lease, task (with a `creator` object) or AI reply. Event type: Top-level `event_type` beside `message_id`
  (the Svix message id) and `body` (the lease, task or message). All three pages use the same envelope.
  Event types (7 documented, list may not be exhaustive): lease.update, task.create, task.update, task.delete,
  sms.respond, email.respond, web_chat.respond. Transport: POST with a JSON body. Delivery: 2xx within
  15 s; retries immediately, 5 s, 5 min, 30 min, 2 h, 5 h, 10 h, 10 h; an endpoint failing for 5 days
  is disabled (EndpointDisabledEvent). Manual and bulk recovery in the portal. Setup: Webhook setup is
  requested from support@travtus.com; endpoints and event types are managed in the Svix application portal
  (short-lived URL), all events when none are selected. No challenge or validation request is documented,
  so the row has no handshake block. Express examples must read the raw body with express.raw({ type:
  '*/*' }) so any content type works and the exact bytes are verified; parse the body only after the check.
  Hookdeck's source type is TRAVTUS, labelled 'Travtus'.
testScenario:
  events:
  - 'task.update'
  - 'lease.update'
  - 'task.create'
catalog:
  summary: >-
    Verify Travtus webhooks (delivered by Svix: `svix-id`, `svix-timestamp`, `svix-signature`, `whsec_`
    secret), handle lease, task, SMS and email events
