name: 'argil'
displayName: 'Argil'
docs:
  webhooks: 'https://docs.argil.ai/pages/webhook-events/introduction'
  verification: 'https://docs.argil.ai/pages/webhook-events/introduction'
  events: 'https://docs.argil.ai/pages/webhook-events/introduction'
notes: >-
  Argil (argil.ai), an AI avatar video generation platform. Webhooks report video generation and avatar
  training successes and failures, signed per Standard Webhooks. Standard Webhooks signature with webhook-*
  headers: webhook-id, webhook-timestamp (Unix seconds), webhook-signature (one or more space-separated
  'v1,<base64>' entries). Signed content is '{webhook-id}.{webhook-timestamp}.{raw request body}', HMAC-SHA256,
  base64 output. SECRET: `secret`, returned once by `POST /webhooks` (create); `whsec_` + base64 (example
  `whsec_C2FVsBQIhrscChlQIMV+b5sSYspob7oD`). Research: whsec_ (OpenAPI example for the create-webhook
  response secret: "whsec_C2FVsBQIhrscChlQIMV+b5sSYspob7oD", https://docs.argil.ai/api-reference/endpoint/webhooks.create).
  It starts with whsec_; the key is the base64-decoding of the part after whsec_. ARGIL_WEBHOOK_SECRET
  holds the full whsec_ value. Verify with the standardwebhooks library (npm 'standardwebhooks', pip 'standardwebhooks'),
  which reads webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK (all three frameworks
  and the manual verifier): read the webhook-* headers and, when webhook-id is absent, fall back to the
  svix-* headers (svix-id, -timestamp, -signature), exactly as Hookdeck does; then hand the library (or
  manual check) the three values under the header names it expects (for the standardwebhooks library,
  pass them as webhook-id, webhook-timestamp and webhook-signature). Include a test that a delivery signed
  the same way but sent with the other prefix's headers is accepted. This matches Hookdeck's Argil source
  (Standard Webhooks, headers_prefix 'webhook', a whsec_ secret base64-decoded after the prefix and any
  other secret used as its raw UTF-8 bytes, every v1 entry tried, other versions such as v1a ignored,
  no timestamp window; core also reads the other prefix's headers, webhook-* or svix-*). The library always
  enforces a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries and replays resend
  the original timestamp, so the library rejects late retries after 5 minutes, and point to a manual verifier
  in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw body}' with the same key, compare
  every space-separated v1,<base64> entry in constant time after a length check, require the timestamp
  to be a plain positive integer) where the window can be dropped or widened. Missing headers or a bad
  signature: 400 or 401; handlers fail closed when the secret env var is unset. Hookdeck's configuration
  alert for this source reads exactly: "Webhooks created before Argil added signing are unsigned. Recreate
  the webhook to get a whsec_ secret." SKILL.md and references/setup.md must state this requirement, quoting
  the alert verbatim. Conditional signing: Webhooks created since signing shipped are signed with the
  secret returned once at creation. Webhooks created before then are delivered without a signature; core's
  configuration alert says to recreate them. Verification notes: Raw body is required (Standard Webhooks).
  Body: {event, data}. `data` holds the video (`videoId`, `videoName`, `videoUrl`, `message`, `extras`,
  `renderCost`, `renderCostRefunded`) or avatar (`avatarId`, `avatarName`, `extras`) fields. Event type:
  Top-level `event` (SCREAMING_SNAKE, the same strings as the subscription enum) beside `data`. Each event
  page's example carries its own name. Event types (4 documented, list may not be exhaustive): AVATAR_TRAINING_SUCCESS,
  AVATAR_TRAINING_FAILED, VIDEO_GENERATION_SUCCESS, VIDEO_GENERATION_FAILED. Transport: POST of a JSON
  `{event, data}` body to the callback URL. Delivery: 2xx within 10 s (redirects not followed); retries
  after 30 s, 2 min, 10 min, 1 h, 6 h, then every 12 h for 3 days; 410 disables the webhook, as do 3 days
  of failures (owner emailed). At-least-once, unordered. Setup: Webhooks are managed through the API (list,
  create with a callback URL and an `events` list, update, delete); one webhook can subscribe to several
  events. No challenge or validation request is documented, so the row has no handshake block. Express
  examples must read the raw body with express.raw({ type: '*/*' }) so any content type works and the
  exact bytes are verified; parse the body only after the check. Hookdeck's source type is ARGIL, labelled
  'Argil'.
testScenario:
  events:
  - 'VIDEO_GENERATION_SUCCESS'
  - 'AVATAR_TRAINING_SUCCESS'
  - 'AVATAR_TRAINING_FAILED'
catalog:
  summary: >-
    Verify Argil webhook signatures (Standard Webhooks: `webhook-id`, `webhook-timestamp`, `webhook-signature`,
    HMAC-SHA256, `whsec_` secret), handle VIDEO_GENERATION_SUCCESS and AVATAR_TRAINING_SUCCESS events
