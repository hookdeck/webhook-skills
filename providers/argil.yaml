name: argil
displayName: Argil
docs:
  webhooks: https://docs.argil.ai/pages/webhook-events/introduction
  verification: https://docs.argil.ai/pages/webhook-events/introduction
  events: https://docs.argil.ai/pages/webhook-events/introduction
  createWebhook: https://docs.argil.ai/api-reference/endpoint/webhooks.create
notes: >
  Argil (argil.ai) AI avatar video generation platform. Webhooks are signed per Standard Webhooks:
  webhook-id, webhook-timestamp (Unix seconds), webhook-signature (space-separated "v1,<base64>"
  entries). HMAC-SHA256 base64 over "<webhook-id>.<webhook-timestamp>.<raw body>" keyed with the
  base64-decoded part of the whsec_ secret returned once by POST /webhooks (create). Webhooks
  created before signing shipped are unsigned and must be recreated (Hookdeck's alert: "Webhooks
  created before Argil added signing are unsigned. Recreate the webhook to get a whsec_ secret.").
  Body is {event, data} with SCREAMING_SNAKE events: AVATAR_TRAINING_SUCCESS,
  AVATAR_TRAINING_FAILED, VIDEO_GENERATION_SUCCESS, VIDEO_GENERATION_FAILED. Hookdeck applies no
  timestamp window; the standardwebhooks library enforces 5 minutes, so late Hookdeck retries
  need the manual verifier.
testScenario:
  events:
    - VIDEO_GENERATION_SUCCESS
    - AVATAR_TRAINING_SUCCESS
catalog:
  summary: Verify Argil AI avatar video webhooks (`webhook-id`/`webhook-timestamp`/`webhook-signature`, Standard Webhooks HMAC-SHA256 base64, `whsec_` secret), handle VIDEO_GENERATION_SUCCESS and AVATAR_TRAINING_SUCCESS events
