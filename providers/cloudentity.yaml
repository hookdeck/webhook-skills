name: cloudentity
displayName: 'Cloudentity (SecureAuth)'
docs:
  webhooks: https://docs.secureauth.com/iam/set-up-webhooks
  verification: https://docs.secureauth.com/iam/set-up-webhooks
notes: >
  Identity platform: Cloudentity is now SecureAuth (cloudentity.com redirects to secureauth.com);
  keep the cloudentity name and say so. Covers SecureAuth Connect workspace webhooks: batches of
  audit events. The Webhook API Key is generated by SecureAuth and shown once at creation: 'Each
  webhook invocation contains an X-API-Key HTTP header with the unique Webhook API Key'. No
  signature. Cloudentity (SecureAuth) sends the webhook API key as plain text in the vendor-fixed
  'X-API-Key' header. Hookdeck's Cloudentity (SecureAuth) source compares that header's WHOLE value
  (header name case-insensitive) to the configured key, so the examples read
  CLOUDENTITY_WEBHOOK_API_KEY and compare the whole 'X-API-Key' value to it in constant time.
  Missing header or mismatch: 401. Compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both sides); Python uses
  hmac.compare_digest on bytes (encode both sides; never pass str, which raises on non-ASCII).
  SKILL.md and verification.md must say plainly that a static shared credential authenticates the
  sender, not the body, and gives no replay protection (no signature, no timestamp), so use HTTPS
  and rotate the credential if it leaks. Model on the n8n, zapier, coterie and honeybadger skills on
  main (and the batch 5 iterable, oyster, fireberry and new-relic skills if present). Hookdeck's
  source type is CLOUDENTITY, labelled 'Cloudentity (SecureAuth)'. Body: JSON with audit_events[],
  each with an event type in its payload/action (e.g. user.created, user.authenticated,
  client.created; check the docs). The HTTP method isn't stated; Hookdeck's source accepts POST
  only. Express examples must read the raw body with express.raw({ type: '*/*' }) so any content
  type works; parse the body only after the credential check.
testScenario:
  events:
    - 'user.created'
    - 'user.authenticated'
    - 'group.created'
catalog:
  summary: 'Authenticate Cloudentity (SecureAuth) webhooks (unsigned: the `X-API-Key` webhook key compared in constant time), handle batched `audit_events` like `user.created` and `user.authenticated`'
