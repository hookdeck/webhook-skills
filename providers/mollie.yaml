name: mollie
displayName: Mollie
docs:
  webhooks: https://docs.mollie.com/reference/webhooks-new
  verification: https://docs.mollie.com/reference/webhooks-new#manual-signature-verification
  overview: https://docs.mollie.com/reference/webhooks
notes: >
  European payments platform with TWO webhook systems; cover both. (1) Classic webhooks
  (a `webhookUrl` set per payment/order/subscription/payment link) are NOT signed: a POST
  with a single application/x-www-form-urlencoded body parameter `id` (e.g. tr_xxxx). Do
  not trust the payload — fetch the resource (GET /v2/payments/{id}) with your API key to
  read the authoritative status. Always return 200 quickly, including for unknown/deleted
  ids. (2) Next-gen webhooks (subscriptions created in Dashboard > Developers > Webhooks or
  POST /v2/webhooks with eventTypes) POST a JSON event (resource "event", id, type,
  entityId, createdAt, _links, optional _embedded.entity) signed with
  `X-Mollie-Signature: sha256=<hex>`: HMAC-SHA256 of the unaltered raw body keyed with the
  webhook signing secret (UTF-8). Strip the `sha256=` prefix and compare timing-safe.
  For 24h after a secret rotation the header is sent twice (one per secret); Node joins
  repeated headers with ", " so split and accept any match. Mollie recommends separate
  URLs for the two systems; only next-gen carries X-Mollie-Signature. Docs conflict on
  whether the signing secret is user-provided or Mollie-generated (the Create webhook API
  returns `webhookSecret`); do not assert either. Event types: payment.*,
  payment-link.paid, sales-invoice.*, payout.*, balance-transaction.created,
  business-account-transfer.* are global; refund.*, chargeback.*, capture.*, dispute.*,
  file.*, connect-balance-transfer.*, unmatched-credit-transfer.* are beta.
sdks:
  npm:
    - "@mollie/api-client"
testScenario:
  events:
    - payment status update
    - payment.paid
  prompt: >
    Create a {framework} webhook handler for Mollie that supports both webhook systems:
    classic webhooks (unsigned, form-encoded `id` only; fetch the payment from the Mollie
    API to determine its real status rather than trusting the body, then return 200) and
    next-gen webhooks (verify the X-Mollie-Signature `sha256=` HMAC-SHA256 of the raw body
    with the webhook signing secret, accepting either of two signatures during rotation).
    If you use any skills to help with this, add a comment noting which skill(s) you
    referenced.
catalog:
  summary: Verify next-gen Mollie webhooks (X-Mollie-Signature HMAC-SHA256) and handle unsigned classic webhooks by fetching payment status from the API (fetch-to-confirm)
  marketplace:
    description: Handle unsigned Mollie webhooks with the fetch-to-confirm pattern, retrieving authoritative payment status from the Mollie API by id.
    keywords:
    - webhooks
    - mollie
    - payments
    - billing
