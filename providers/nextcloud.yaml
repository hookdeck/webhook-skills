name: nextcloud
displayName: 'Nextcloud'
docs:
  webhooks: https://docs.nextcloud.com/server/latest/admin_manual/webhook_listeners/index.html
  verification: https://docs.nextcloud.com/server/latest/admin_manual/webhook_listeners/index.html
notes: >
  Self-hosted collaboration; covers the webhook_listeners app (registered by an admin with the OCS
  API POST /ocs/v2.php/apps/webhook_listeners/api/v1/webhooks: httpMethod, uri, event, authMethod
  'header', authData {header: value}). No signature: requests are unsigned. Authenticate with a
  secret header the user adds with authMethod 'header' and authData (merged into the request
  headers). The header name is user-chosen, so the examples read the header name from
  NEXTCLOUD_WEBHOOK_HEADER (default 'Authorization') and the expected value from
  NEXTCLOUD_WEBHOOK_SECRET (the exact, whole header value, including any 'Bearer ' prefix the user
  typed). Look the header up case-insensitively and compare the WHOLE value; do not strip or parse a
  'Bearer ' prefix. This is what Hookdeck's Nextcloud source does (API key verification: header name
  + exact whole value). Missing header or mismatch: 401. Compare in constant time: Node checks
  lengths, then crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both
  sides); Python uses hmac.compare_digest on bytes (encode both sides; never pass str, which raises
  on non-ASCII). SKILL.md and verification.md must say plainly that a static shared credential
  authenticates the sender, not the body, and gives no replay protection (no signature, no
  timestamp), so use HTTPS and rotate the credential if it leaks. Model on the n8n, zapier, coterie
  and honeybadger skills on main (and the batch 5 iterable, oyster, fireberry and new-relic skills
  if present). Hookdeck's source type is NEXTCLOUD, labelled 'Nextcloud'. The request method is
  user-chosen, so the examples must not be POST-only: accept POST, PUT, PATCH, GET and DELETE
  (httpMethod is a free string) on the webhook route (Next.js: export a handler for each), and
  handle an empty body. Say in SKILL.md and setup.md that Hookdeck's Nextcloud source pre-selects
  POST without managing the method, so any other method the sender uses must also be allowed on the
  source. Body: {event: {class, ...}, user: {uid, displayName}, time}; event.class like
  OCP\Files\Events\Node\NodeCreatedEvent, NodeWrittenEvent, NodeDeletedEvent,
  OCP\Calendar\Events\CalendarObjectCreatedEvent. Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type works; parse the body only after the credential
  check.
testScenario:
  events:
    - 'OCP\Files\Events\Node\NodeCreatedEvent'
    - 'OCP\Files\Events\Node\NodeWrittenEvent'
    - 'OCP\Files\Events\Node\NodeDeletedEvent'
catalog:
  summary: 'Authenticate Nextcloud webhook_listeners requests (unsigned: a secret header compared in full in constant time, any HTTP method), handle `event.class` events like `NodeCreatedEvent` and `NodeWrittenEvent`'
