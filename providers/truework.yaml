name: truework
displayName: 'Truework'
docs:
  webhooks: https://www.truework.com/docs/api-reference/webhooks
  verification: https://www.truework.com/docs/api-reference/webhooks/security
notes: >
  Income and employment verification. Each webhook has an authentication token (webhook settings)
  sent raw in the X-Truework-Token header. Verify it against TRUEWORK_WEBHOOK_TOKEN. No payload
  signature. Verify the shared token with a constant-time compare (crypto.timingSafeEqual /
  hmac.compare_digest, hashing both sides or checking lengths first), like the batch 1 n8n, zapier
  and brevo skills. A recreated webhook gets a new token. Events: order.completed and
  verification_request.state.change (confirmed against the docs; payload is
  {version, hook:{id,event,target}, data:{order_id,...}}). Express examples must read the raw body
  with express.raw({ type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'order.completed'
    - 'verification_request.state.change'
catalog:
  summary: 'Authenticate Truework webhooks (`X-Truework-Token` header compared with the webhook token in constant time, no payload signature), handle `order.completed` and `verification_request.state.change` events'
