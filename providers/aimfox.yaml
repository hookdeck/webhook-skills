name: aimfox
displayName: 'Aimfox'
docs:
  webhooks: https://docs.aimfox.com/#/webhook-docs
  verification: https://docs.aimfox.com/#/webhook-docs
notes: >
  LinkedIn automation; covers workspace webhooks (beta). The UI calls it 'Authentication Header'
  (Basic or a custom header like a Bearer token); the API stores a free-form headers object (e.g.
  {"Authorization": "Bearer 123"}). No signature: requests are unsigned. Authenticate with a secret
  header the user adds to the webhook (Authentication Header). The header name is user-chosen, so
  the examples read the header name from AIMFOX_WEBHOOK_HEADER (default 'Authorization') and the
  expected value from AIMFOX_WEBHOOK_SECRET (the exact, whole header value, including any 'Bearer '
  prefix the user typed). Look the header up case-insensitively and compare the WHOLE value; do not
  strip or parse a 'Bearer ' prefix. This is what Hookdeck's Aimfox source does (API key
  verification: header name + exact whole value). Missing header or mismatch: 401. Compare in
  constant time: Node checks lengths, then crypto.timingSafeEqual on equal-length Buffers (or on
  SHA-256 digests of both sides); Python uses hmac.compare_digest on bytes (encode both sides; never
  pass str, which raises on non-ASCII). SKILL.md and verification.md must say plainly that a static
  shared credential authenticates the sender, not the body, and gives no replay protection (no
  signature, no timestamp), so use HTTPS and rotate the credential if it leaks. Model on the n8n,
  zapier, coterie and honeybadger skills on main (and the batch 5 iterable, oyster, fireberry and
  new-relic skills if present). Hookdeck's source type is AIMFOX, labelled 'Aimfox'. If the user
  generates a Basic value in Aimfox, the whole 'Basic ...' string is the value. Body has event_type,
  e.g. new_connection, accepted, new_reply, message, account_logged_out. Retries up to 6 times with
  exponential backoff. POST. Express examples must read the raw body with express.raw({ type: '*/*'
  }) so any content type works; parse the body only after the credential check.
testScenario:
  events:
    - 'new_connection'
    - 'new_reply'
    - 'accepted'
catalog:
  summary: 'Authenticate Aimfox webhooks (unsigned: the authentication header compared in full in constant time), handle `event_type`s like `new_connection`, `new_reply` and `accepted`'
