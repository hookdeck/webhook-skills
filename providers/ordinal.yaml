name: ordinal
displayName: Ordinal
docs:
  webhooks: https://docs.tryordinal.com/integrations/webhooks/introduction
  events: https://docs.tryordinal.com/integrations/webhooks/event-types
  api: https://docs.tryordinal.com/
notes: >
  IDENTITY: Ordinal is tryordinal.com — the social-media / LinkedIn content planning,
  approval and scheduling platform for marketing teams. App at
  https://app.tryordinal.com, docs at https://docs.tryordinal.com, REST API base
  https://app.tryordinal.com/api/v1. Hookdeck's ORDINAL source type is for this Ordinal
  (docs.tryordinal.com/integrations/webhooks/introduction, www.tryordinal.com). This is
  NOT Ordinals (the Bitcoin inscription protocol / ord), NOT Ordinal Stats or Ordinal
  Labs. There is NO official Ordinal npm or pip SDK; verification uses the Standard
  Webhooks libraries (npm `standardwebhooks`, PyPI `standardwebhooks`), which Ordinal's
  docs recommend.

  SIGNING (re-verified 2026-11-27; the docs page was last modified 2026-11-26). The
  2026-09-28 version of this skill said Ordinal signed nothing; that is no longer true.
  The introduction's "Verify deliveries" section says "Every delivery is signed." Headers:
  webhook-id ("Stable id for this event. The same id is sent again on a retry."),
  webhook-timestamp (Unix seconds, when the delivery was signed), webhook-signature ("One
  or more space-separated signatures, each `v1,<base64>`") and webhook-topic (the event
  type, NOT covered by the signature — never trust it). Signature =
  base64(HMAC-SHA256(key, `{webhook-id}.{webhook-timestamp}.{raw body}`)); key = the
  signing secret with `whsec_` removed, base64-decoded. During a rotation the header can
  carry two signatures and a match on any is valid. The library's verify throws when
  webhook-timestamp is more than five minutes from now. Raw body required: express.raw,
  request.text(), request.body().

  SECRET: `signingSecret` (whsec_...) is returned only by POST /webhooks; GET and list
  omit it; the dashboard's webhook configure page shows it later. One per webhook. How to
  start a rotation is not documented.

  CUSTOM HEADERS: the webhook's optional `headers` field ("Optional custom headers to
  include in webhook requests") still exists and adds static headers to every delivery.
  Present it only as an optional extra check, never as a substitute for the signature.

  MANAGEMENT API (bearer workspace API key): GET/POST /webhooks, GET/PATCH/DELETE
  /webhooks/{id}. POST body: name, url, description, topics (string[]), headers. Create
  response: id, name, url, topics, signingSecret, createdAt.

  ENVELOPE: {"type", "data", "createdAt"}; any 2xx acknowledges. No event id in the body:
  dedupe on webhook-id. Undocumented: retry schedule/attempts, timeout, ordering, source
  IPs, User-Agent, test/ping event.

  EVENTS — 24 topics. data key per family: social_profile.* -> data.profile; post.* ->
  data.post except post.comment.created / post.inline_comment.created -> data.comment and
  post.approval.* -> data.approval; campaign.approval.* -> data.approval; invite.* ->
  data.invite; linkedin.monitoring.comment.{created,edited,deleted} -> data.comment;
  linkedin.monitoring.mention.created -> data.mention. comment.edited is not sent for
  personal profiles. Personal profile comments are polled (daily, every 30 min for 8 h
  after Ordinal publishes, and on Refresh Comments), so they can arrive up to a day late.
  Comment events carry `profile` (type Organization or User); `companyPage` is
  deprecated. Mixed separators: publish_failed, reconnect_needed, permanently_deleted,
  inline_comment. Per-event docs pages now live under a family folder, e.g.
  /integrations/webhooks/posts/post-published and
  /integrations/webhooks/linked-in-monitoring/linkedin-monitoring-comment-created.
testScenario:
  events:
    - post.published
    - post.publish_failed
    - post.approval.requested
catalog:
  summary: Receive and verify Ordinal (tryordinal.com) social-media content planning webhooks, signed per **Standard Webhooks** (`webhook-id`, `webhook-timestamp`, `webhook-signature`) with a `whsec_` secret, then unwrap the `{ type, data, createdAt }` envelope for `post.published`, `post.publish_failed`, `post.approval.requested`, `post.comment.created` and `linkedin.monitoring.comment.created`. Not Bitcoin Ordinals
