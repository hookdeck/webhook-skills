name: cursor
displayName: Cursor
docs:
  webhooks: https://docs.cursor.com/account/cloud-agent-webhooks
notes: >
  AI code editor. Uses x-webhook-signature header with HMAC-SHA256 (hex encoded).
  Signature format is sha256=<hex_digest>. Cloud Agent webhooks notify of
  agent status changes (ERROR, FINISHED).
testScenario:
  events:
    - FINISHED
    - ERROR
catalog:
  summary: Verify Cursor Cloud Agent webhook signatures, handle agent status events
  marketplace:
    description: Verify Cursor Cloud Agent webhook signatures (HMAC-SHA256), handle agent status events.
    keywords:
    - webhooks
    - cursor
    - ai
    - agents
