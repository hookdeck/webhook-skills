name: jamf-pro
displayName: 'Jamf Pro'
docs:
  webhooks: https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Configuring_a_Webhook
  verification: https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Configuring_a_Webhook
notes: >
  Apple device management; covers webhooks with Header Authentication ('Requires key value pairs in
  JSON format', e.g. {"Authorization": "Bearer <token>"}). Basic auth, mTLS and the Hash Signature
  option aren't covered by Hookdeck's Jamf Pro source (the Hash Signature header and signed content
  aren't publicly documented). No signature: requests are unsigned. Authenticate with a secret
  header the user adds with Header Authentication (the JSON key is the header name). The header name
  is user-chosen, so the examples read the header name from JAMF_PRO_WEBHOOK_HEADER (default
  'Authorization') and the expected value from JAMF_PRO_WEBHOOK_SECRET (the exact, whole header
  value, including any 'Bearer ' prefix the user typed). Look the header up case-insensitively and
  compare the WHOLE value; do not strip or parse a 'Bearer ' prefix. This is what Hookdeck's Jamf
  Pro source does (API key verification: header name + exact whole value). Missing header or
  mismatch: 401. Compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers (or on SHA-256 digests of both sides); Python uses hmac.compare_digest on
  bytes (encode both sides; never pass str, which raises on non-ASCII). SKILL.md and verification.md
  must say plainly that a static shared credential authenticates the sender, not the body, and gives
  no replay protection (no signature, no timestamp), so use HTTPS and rotate the credential if it
  leaks. Model on the n8n, zapier, coterie and honeybadger skills on main (and the batch 5 iterable,
  oyster, fireberry and new-relic skills if present). Hookdeck's source type is JAMF_PRO, labelled
  'Jamf Pro'. Hookdeck shows this setup note for the source, and SKILL.md and references/setup.md
  must tell the user the same thing: "Choose Header Authentication on the Jamf Pro webhook and enter
  the same header name and value here." Body: {webhook: {id, name, webhookEvent, eventTimestamp},
  event: {...}}; webhookEvent like ComputerAdded, ComputerCheckIn, ComputerInventoryCompleted,
  MobileDeviceEnrolled, JSSStartup. A webhook can send JSON or XML: say JSON is assumed. POST.
  Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type
  works; parse the body only after the credential check.
testScenario:
  events:
    - 'ComputerAdded'
    - 'ComputerInventoryCompleted'
    - 'MobileDeviceEnrolled'
catalog:
  summary: 'Authenticate Jamf Pro webhooks (unsigned: a Header Authentication header compared in full in constant time), handle `webhookEvent`s like `ComputerAdded` and `MobileDeviceEnrolled`'
