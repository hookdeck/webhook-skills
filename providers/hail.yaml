name: hail
displayName: 'Hail'
docs:
  webhooks: https://hail.so/docs/webhooks
  verification: https://hail.so/docs/webhooks
  events: https://hail.so/docs/webhooks
notes: >
  Hail (email and SMS API). Header X-Hail-Signature: 't=<unix>,v1=<hex>'; v1 is hex HMAC-SHA256 over
  f'{t}.' + raw request bytes, keyed with the signing secret (returned once at create). The secret
  looks like whsec_... but this is NOT Standard Webhooks: the HMAC key is the whole secret string
  including whsec_, as UTF-8. Do NOT use the standardwebhooks or svix libraries and do not strip or
  base64-decode the whsec_ prefix. t=<ts>,v1=<hex> header: split on ',' and trim each part (allow a
  space after the comma), take t and every v1 (several are sent during secret rotation) and accept if
  any v1 matches; reject a header with no t or no v1. Compare in constant time: in Node, check the
  received value is exactly 64 hex chars (/^[0-9a-f]{64}$/i) before any Buffer.from(x, 'hex') (invalid
  hex silently truncates), or compare the lowercase hex strings as equal-length UTF-8 Buffers with
  crypto.timingSafeEqual after a length check; in Python use hmac.compare_digest on bytes (encode both
  sides) so a non-ASCII header gives 401, not 500. Hookdeck retries and replays resend the original
  timestamp, so a 5-minute window rejects late retries: make the timestamp freshness check opt-in via
  HAIL_TIMESTAMP_TOLERANCE_SECONDS (default 0 = off), as the mercury-webhooks skill does. SKILL.md
  must say that Hookdeck retries and replays resend the original timestamp, so a 5-minute window
  rejects late retries, and point to references/verification.md, which shows where the window can be
  dropped or widened. Reproduce the docs' example in the tests: secret whsec_example, body
  {"id":"evt_123","type":"email.received","data":{"id":"em_1"}}, header
  t=1700000000,v1=72f7940d13ca8528cf655a04e82dabfe90a531e239241fda9bdff72980d33a4a (with the window
  off). Events (body type): email.received, email.delivered, email.bounced, email.opened,
  email.clicked, sms.received, sms.delivered, call.completed and more. Hookdeck setup (say this in
  SKILL.md's setup section and in references/setup.md): Paste the whole signing secret, including any
  whsec_ prefix. Hail uses it as a plain HMAC key. Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'email.received'
    - 'email.bounced'
    - 'sms.received'
catalog:
  summary: 'Verify Hail webhook signatures (`X-Hail-Signature` `t=<ts>,v1=<hex>`, HMAC-SHA256 over `{t}.{body}`, whole `whsec_` secret as the key), handle `email.received`, `email.bounced`, `sms.received`, and `call.completed` events'
