name: mailersend
displayName: MailerSend
docs:
  webhooks: https://developers.mailersend.com/api/v1/account/webhooks
  verification: https://developers.mailersend.com/api/v1/account/webhooks#security
  events: https://developers.mailersend.com/api/v1/account/webhooks
  api: https://developers.mailersend.com/api/v1/webhooks
notes: >
  Transactional email and SMS API from the MailerLite group. NOT MailerLite (the
  marketing-email product, separate API and separate webhook scheme), NOT Mailgun,
  Mailchimp or Resend. Signature is a `Signature` header (exactly that — no X- prefix,
  no vendor prefix) containing the BARE lowercase hex HMAC-SHA256 of the RAW request
  body, keyed with the per-webhook Signing Secret generated when the webhook is created
  (NOT the API token). No timestamp, no nonce, no version prefix, no `t=,v1=` element
  list, no field concatenation — the body alone is signed. Not Standard Webhooks.
  CRITICAL: MailerSend sends a URL-validation request on webhook create/update that must
  return 2xx or the webhook will not save. It has type `webhook.test`, a DIFFERENT
  envelope carrying `message` instead of `data`, and is signed with the FIXED, PUBLICLY
  DOCUMENTED secret `test_Am3L1GuOIc4blLUuHqAPxxwkZaJyEk8G` rather than the webhook's own
  signing secret. Handlers must accept both secrets, but because the test secret is public
  a test-secret signature must only ever authorise a `webhook.test` payload — never
  privileged work. Real envelope is {type, created_at, data}. Email webhooks have a
  payload `version`: 2 (flat data with `recipient`, `message_id`, `email_id`) is the
  dashboard default; 1 (nested data.email) stops working on 2026-12-01 and is still the
  create-webhook API's default, so send "version": 2. `created_at` has TWO formats in
  the doc examples: microsecond ISO-8601 with Z on most events, and space-separated
  `2025-08-05 22:27:14` on sender_identity.verified, maintenance.*, inbound_forward.failed,
  email_single.verified, email_list.verified and bulk_email.completed.
  `data.meta` is an empty ARRAY `[]` when empty (not an object), which breaks naive typed
  deserialisation. `data.type` is the bare activity name (`sent`) without the `activity.`
  prefix. Delivery: respond within 3 seconds or the attempt fails; exponential backoff
  retries for ~3 days. SEPARATELY, a webhook whose endpoint "stays down too long" is
  auto-paused and must be re-enabled from the dashboard — the docs never tie that threshold
  to the retry window, so do not assert they are the same deadline. 4xx other than 429 and
  DNS failures are never retried. No delivery-id header, no source-IP allowlist, no X-MailerSend-*
  headers — dedupe on type plus data.id (data.id alone is shared by the unique and
  non-unique open/click events, and maintenance, inbound, on-hold and reputation events
  have none). The official Node SDK's MailerSendUtils.verifyWebHook is exported, reads
  the `Signature` header and guards the length in current releases (3.9.0); it throws on
  missing inputs. The Python SDK documents no verification helper. SMS webhooks
  (SMS -> Webhooks, /v1/sms-webhooks) use an identical security model and add sms.sent,
  sms.delivered, sms.failed. WhatsApp webhooks (dashboard only, one per sender) use the
  same scheme and add whatsapp.sent, whatsapp.delivered, whatsapp.read, whatsapp.failed,
  whatsapp.inbound; no webhook.test ping is documented for them. Inbound Routing is a separate
  surface with its own `secret` field and is out of scope. Events: activity.sent,
  activity.delivered, activity.soft_bounced, activity.hard_bounced, activity.deferred
  (paid plans only), activity.opened, activity.opened_unique, activity.clicked,
  activity.clicked_unique, activity.unsubscribed, activity.spam_complaint,
  activity.suppressed (paid plans only), activity.survey_opened, activity.survey_submitted, sender_identity.verified,
  maintenance.start, maintenance.end, inbound_forward.failed, inbound_message.rejected,
  email_single.verified, email_list.created, email_list.verified, bulk_email.completed,
  recipient.on_hold_added, recipient.on_hold_removed, domain.reputation_changed,
  account.reputation_changed, plus webhook.test.
sdks:
  npm: ["mailersend"]
  pip: ["mailersend"]
testScenario:
  events:
    - activity.delivered
    - activity.hard_bounced
catalog:
  summary: Verify MailerSend webhooks (`Signature` header, HMAC-SHA256 hex over the raw body), handle the `webhook.test` URL-validation ping and activity.sent, activity.delivered, activity.hard_bounced, activity.opened, activity.clicked, and activity.spam_complaint events
