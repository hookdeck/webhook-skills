name: qonto
displayName: "Qonto"
docs:
  webhooks: https://docs.qonto.com/api-reference/business-api/webhooks/setup
  verification: https://docs.qonto.com/api-reference/business-api/webhooks/setup
notes: >
  Qonto (qonto.com), the European business bank. Business API webhooks: a subscription (`POST
  /v2/webhook_subscriptions`) names a `callback_url` and one or more `types` (`v1/transactions`,
  `v1/cards`, ...), and Qonto POSTs each matching event, signed with the subscription's secret.
  Delivery (from the docs): A 2xx within 1 second succeeds. Anything slower is a failure and is
  retried with exponential backoff for a few days until acknowledged. Events from before a
  subscription are not sent. Qonto's docs say: 'The `callback_url` will be called with a `POST`
  request containing a `X-Qonto-Signature` header. ... The signature header follows the format
  `t={timestamp},v1={signature}`.' 'Recreate the signed payload: `{timestamp}.{raw_request_body}` *
  Compute HMAC-SHA256 of the signed payload using your webhook secret as the key' 'Secret key for
  verifying webhook signatures. If not provided, one will be generated example:
  whsec_VuvcYxzMbryt1UBytq58jtGBxCgbQdzX/c0vj5ZLjUA= (minLength: 32, maxLength: 128)' From the docs
  (registry summary): Header `X-Qonto-Signature: t=<unix seconds>,v1=<hex>`. MAC = lowercase hex of
  HMAC-SHA256(key = the subscription secret used as a plain string, message = `<t>.<raw body>`). The
  page's test data reproduces: secret `test-secret`, body `{"test":"data"}`, t=1704110400 gives
  `56aff06dc227db80d6568a5070f912c601c31f20451745d257cbc0b5dfa93805` (recomputed by the registry
  author). SIGNATURE SCHEME (it must match Hookdeck's QONTO source exactly: HMAC controller, algorithm
  "sha256", header_key "x-qonto-signature", encoding "hex", delimiter ".", prefix_data_with_timestamp
  true). The X-Qonto-Signature header is `t=<timestamp>,v1=<hex>` (comma-separated key=value pairs).
  The signature is lowercase hex HMAC-SHA256, keyed with the secret, over: the t value exactly as it
  appears in the header (a string; never parse it to a number and re-format it), then a literal ".",
  then the raw request body bytes. The header may carry more than one v1= entry (for example during
  key rotation): accept the delivery if ANY v1= entry matches, and ignore other keys such as v0. A
  header with no t= value fails. Build the signed message as BYTES: the raw body bytes exactly as
  received, never decoded to a string and re-encoded, never JSON.parse/JSON.stringify'd before
  verifying. The HMAC key is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is
  compared case-insensitively (as Hookdeck does): require exactly 64 hex characters, lowercase both
  sides (or decode both to bytes) before the constant-time compare. Secret: One secret per
  subscription, 32-128 characters. Either supplied in the create request or generated by Qonto, and
  returned only once in the create response. The schema example looks like a Standard Webhooks
  `whsec_` secret (`whsec_VuvcYxzMbryt1UBytq58jtGBxCgbQdzX/c0vj5ZLjUA=`), but the test data keys with
  a plain string and the steps say "your webhook secret as the key": the whole string is the key,
  nothing is stripped or base64-decoded. Use it as UTF-8 bytes. Env var: QONTO_WEBHOOK_SECRET.
  Validate the signature's format before decoding it (exact length and alphabet), then compare in
  constant time: Node checks lengths, then crypto.timingSafeEqual on equal-length Buffers, and never
  calls Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it silently drops bad characters);
  Python uses hmac.compare_digest on bytes (never str) and base64.b64decode(..., validate=True).
  Missing or empty signature header, malformed value or mismatch: 401. Timestamp window: do NOT reject
  old timestamps by default. Hookdeck retries and replays resend the original headers and timestamp,
  and Hookdeck itself applies no tolerance, so a fixed window would reject legitimate retries. Offer
  an opt-in tolerance (an env var such as QONTO_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say
  so in SKILL.md and verification.md (t is Unix seconds; Qonto documents no tolerance). The secret
  looks like a Standard Webhooks `whsec_` secret but it is NOT one: use the WHOLE string, including
  `whsec_`, as a plain UTF-8 HMAC key (nothing is stripped or base64-decoded; hex digest). Do not use
  the standardwebhooks or svix libraries and say so. Qonto expects a 2xx within 1 second, so
  acknowledge first and process later. Events: dispatch on the body's `type` field. Top-level body
  field `type` carries the SUBSCRIPTION type (`v1/<resource>`), the unit a subscription selects; every
  one of the 17 type pages shows an example whose `type` equals the page title. What happened to the
  resource is `data.event` (`created`, `updated`, `settled`, ...). The pages' "Supported events" lists
  are not consistent about its spelling: transactions, cards, memberships, organizations and
  payment-links list prefixed names (`transactions.created`, `cards.locked`) while their own examples
  carry the bare value (`"event": "created"`); the other pages list bare values. The bare form is what
  every example shows, but no page reconciles the two (see the `discriminator.sub_path` gap). The full
  event is (`type`, `data.event`). Documented event types (17): v1/transactions, v1/accounts,
  v1/organizations, v1/memberships, v1/consent-revocations, v1/cards, v1/payment-links,
  v1/payment-links-connections, v1/beneficiaries, v1/client-invoices, v1/terminal-payments,
  v1/clients, v1/products, v1/transfers (and 3 more). Handle a few common ones and log the rest.
  Method: POST. Hookdeck's Qonto source manages the method as POST, so the examples handle POST on the
  webhook route. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type works and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI:
  await request.body()); parse the body only after the check. PUBLISHED TEST VECTOR (verified against
  Hookdeck's controller): the vendor's docs give a worked example, saved verbatim as JSON (secret,
  body string, headers) in
  /tmp/claude-0/-home-user/a6117e89-67f4-5ebf-9ebd-ebed152a5054/scratchpad/b910-skills/vectors/qonto.json.
  Every example's test suite (Express, Next.js and FastAPI) must include it as a unit test: load or
  paste the exact body bytes (json.load the file, or copy the string exactly; do not pretty-print or
  re-serialise), and assert that the verifier accepts that header value
  (t=1704110400,v1=56aff06dc227db80d6568a5070f912c601c31f20451745d257cbc0b5dfa93805) with that secret.
  Name the vector in references/verification.md. Documented sample payloads (each JSON file's `body`
  is the payload as the vendor's docs show it) are in
  /home/user/regwt/main-ro/samples-doc/providers/qonto/ (v1/v1.accounts.json,
  v1/v1.beneficiaries.json, v1/v1.cards.json, v1/v1.clients.json, ...); base the examples' test
  payloads on them. Hookdeck's source type is QONTO, labelled 'Qonto'. Hookdeck shows this setup note
  for the source, and SKILL.md and references/setup.md must tell the user the same thing, verbatim:
  "Paste the whole secret, including the whsec_ prefix. Qonto uses it as a plain HMAC key."
testScenario:
  events:
    - "v1/transactions"
    - "v1/cards"
    - "v1/transfers"
catalog:
  summary: "Verify Qonto webhooks (`X-Qonto-Signature`: `t=`/`v1=` hex HMAC-SHA256 of `{t}.{body}`), handle transaction, card and transfer events"
