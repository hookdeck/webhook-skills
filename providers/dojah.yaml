name: dojah
displayName: "Dojah"
docs:
  webhooks: https://docs.dojah.io/api-reference/core-concepts/webhooks-signatures
  verification: https://docs.dojah.io/api-reference/core-concepts/webhooks-signatures
  events: https://docs.dojah.io/api-reference/core-concepts/webhooks-signatures
notes: >
  Dojah (dojah.io), an African identity verification, KYC/KYB and AML platform. A callback URL is
  subscribed per service (kyc_widget, sms, address, AML Monitoring) and environment, with POST
  /api/v1/webhook/subscribe or the dashboard. Delivery (from the docs): Respond 200 to acknowledge.
  Retries and timeout are not documented. For hosted flows the webhook, not the client callback, is
  the authoritative result. Dojah's docs say: 'Events from Dojah carry the x-dojah-signature header.
  Its value is a HMAC SHA256 signature of the event payload, signed with the webhook secret for that
  subscription' 'expected = hmac.new(SECRET, body, hashlib.sha256).hexdigest()' 'Hash the payload
  exactly as received. Re-serialising the JSON can reorder keys or change spacing, which produces a
  different signature, so hash the raw request body.' 'Every delivery carries both signature headers,
  so pick whichever fits your stack' From the docs (registry summary): hex(HMAC-SHA256(subscription
  webhook secret, raw body)), the whole header value. SIGNATURE SCHEME (it must match Hookdeck's DOJAH
  source exactly: HMAC controller, algorithm "sha256", header_key "x-dojah-signature", encoding
  "hex"). The x-dojah-signature header carries the bare lowercase hex digest, no prefix. Compare the
  WHOLE header value as one digest (no list splitting or prefix parsing). The signature is lowercase
  hex HMAC-SHA256, keyed with the secret, over the raw request body bytes only (no timestamp, id or
  other header is signed). Build the signed message as BYTES: the raw body bytes exactly as received,
  never decoded to a string and re-encoded, never JSON.parse/JSON.stringify'd before verifying. The
  HMAC key is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared
  case-insensitively (as Hookdeck does): require exactly 64 hex characters, lowercase both sides (or
  decode both to bytes) before the constant-time compare. Secret: The per-subscription webhook secret
  from the Secret column on Developers > Webhooks, not the API secret key. Use it as UTF-8 bytes. Env
  var: DOJAH_WEBHOOK_SECRET. Validate the signature's format before decoding it (exact length and
  alphabet), then compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it
  silently drops bad characters); Python uses hmac.compare_digest on bytes (never str) and
  base64.b64decode(..., validate=True). Missing or empty signature header, malformed value or
  mismatch: 401. No timestamp is signed, so there is no replay window to check; do not invent one from
  unsigned headers or body fields. Dojah also sends x-dojah-signature-v2 (a static hash of the secret,
  no payload); verify only x-dojah-signature. The key is the per-subscription webhook secret, not the
  API secret key. Events: there is no event-name field or header; the URL is subscribed to one
  service. Dispatch on `verification_status` / `status`. Method: POST. Hookdeck's Dojah source manages
  the method as POST, so the examples handle POST on the webhook route. Express examples must read the
  raw body with express.raw({ type: '*/*' }) so any content type works and the exact bytes are
  verified (Next.js: await request.arrayBuffer(); FastAPI: await request.body()); parse the body only
  after the check. Hookdeck's source type is DOJAH, labelled 'Dojah'. Hookdeck shows this setup note
  for the source, and SKILL.md and references/setup.md must tell the user the same thing, verbatim:
  "Paste the webhook secret from Developers > Webhooks, not your API secret key."
testScenario:
  events:
    - "kyc_widget"
    - "Completed"
    - "Failed"
catalog:
  summary: "Verify Dojah webhook signatures (`x-dojah-signature`, HMAC-SHA256 hex of the raw body), handle kyc_widget verification_status results (Completed, Failed, Abandoned)"
