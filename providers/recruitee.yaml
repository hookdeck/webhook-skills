name: recruitee
displayName: Recruitee
docs:
  webhooks: https://docs.recruitee.com/docs/webhooks
  verification: https://docs.recruitee.com/docs/webhooks
  events: https://docs.recruitee.com/docs/webhooks
notes: >
  Recruiting software / applicant tracking system. Custom HMAC scheme (NOT Standard
  Webhooks). The X-Recruitee-Signature header is the hex-encoded HMAC-SHA256 of the
  RAW request body keyed with the webhook secret (Settings > Apps and Plugins >
  Webhooks), with no prefix and no timestamp. The docs publish a test vector
  (secret DuP4ej5yyJB5TIrIEI/dCtJN7sHj with a candidate_moved body). Payload is
  { id, attempt_count, created_at, event_type, event_subtype, payload }; the event
  name is in the body, not a header. Event types: new_candidate, candidate_assigned,
  candidate_moved (subtypes stage_changed, disqualified, requalified),
  candidate_deleted, offer_published, offer_unpublished, offer_updated. There is no
  candidate_disqualified event type: disqualification is candidate_moved with
  event_subtype disqualified. On Verify and create (and the Test button) Recruitee
  sends {"test":true}, which only needs a 200. Any status other than 200 counts as a
  failure and is retried up to nine times (1m, 3m, 10m, 45m, 2h, 5h, 10h, 24h, 48h);
  requests time out after 10 seconds. The retry reuses the same id with a higher
  attempt_count, so dedupe on id. No official SDK. Set RECRUITEE_WEBHOOK_SECRET.
testScenario:
  events:
    - new_candidate
    - candidate_moved
    - candidate_assigned
catalog:
  summary: Verify Recruitee webhook signatures (`X-Recruitee-Signature`, HMAC-SHA256 hex over the raw body), handle new_candidate, candidate_moved, and candidate_assigned events
