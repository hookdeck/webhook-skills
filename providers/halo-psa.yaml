name: halo-psa
displayName: 'HaloPSA'
docs:
  webhooks: https://www.usehalo.com/guides/838
  verification: https://www.usehalo.com/guides/838
notes: >
  PSA/ITSM (HaloPSA, also HaloITSM and HaloCRM); covers standard webhooks with Basic Authentication
  (the only auth option). No signature. Authenticate with HTTP Basic auth, which is what Hookdeck's
  HaloPSA source verifies. The examples read HALO_PSA_WEBHOOK_USERNAME and
  HALO_PSA_WEBHOOK_PASSWORD, parse 'Authorization: Basic base64(username:password)' (scheme
  case-insensitive, accept only the strict base64 alphabet and decode strictly, e.g. validate=True
  in Python, so valid credentials followed by junk are rejected; split on the first colon), and
  compare the username and the password each in constant time, evaluating both before deciding (no
  short-circuit). Missing or malformed header or mismatch: 401. The docs don't say whether Basic
  credentials are sent preemptively. Say that the credentials must arrive on the first request:
  Hookdeck never sends a 401 + WWW-Authenticate challenge, it verifies the request as received.
  Compare in constant time: Node checks lengths, then crypto.timingSafeEqual on equal-length Buffers
  (or on SHA-256 digests of both sides); Python uses hmac.compare_digest on bytes (encode both
  sides; never pass str, which raises on non-ASCII). SKILL.md and verification.md must say plainly
  that a static shared credential authenticates the sender, not the body, and gives no replay
  protection (no signature, no timestamp), so use HTTPS and rotate the credential if it leaks. Model
  on the n8n, zapier, coterie and honeybadger skills on main (and the batch 5 iterable, oyster,
  fireberry and new-relic skills if present). Hookdeck's source type is HALO_PSA, labelled
  'HaloPSA'. Hookdeck shows this setup note for the source, and SKILL.md and references/setup.md
  must tell the user the same thing: "Choose Basic Authentication on the Halo webhook." Notification
  events like New Ticket Logged, Ticket Updated, Ticket Reassigned; the payload carries an event
  name property but the field name isn't documented in text, so label example payloads illustrative;
  batching sends a JSON array. The Method setting also offers GET (for retrieving data), but
  notifications are POSTs and Hookdeck's source accepts POST only. Express examples must read the
  raw body with express.raw({ type: '*/*' }) so any content type works; parse the body only after
  the credential check.
testScenario:
  events:
    - 'New Ticket Logged (illustrative payload)'
    - 'Ticket Updated (illustrative payload)'
catalog:
  summary: 'Authenticate HaloPSA webhooks (unsigned HTTP Basic auth compared in constant time), handle ticket notification events'
