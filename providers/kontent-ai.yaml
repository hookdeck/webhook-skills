name: kontent-ai
displayName: Kontent.ai
docs:
  webhooks: https://kontent.ai/learn/docs/webhooks/webhooks/typescript
  verification: https://kontent.ai/learn/docs/webhooks/webhooks/typescript
  events: https://kontent.ai/learn/docs/webhooks/webhooks/typescript
notes: >
  Webhooks are created in Environment settings > Webhooks (or the Management API), each for
  published or preview data. X-Kontent-ai-Signature = base64 HMAC-SHA256 of the raw body keyed with
  the webhook's Secret as text (it looks like base64; don't decode it). The JS webhook-helper
  rewrites runs of CR/LF to CRLF before hashing, which only repairs bodies whose line endings were
  changed after receipt; hashing the raw bytes as received works (the .NET helper does that).
  Older webhooks may send the legacy X-KC-Signature header instead. Body {notifications: [{data:
  {system}, message: {environment_id, object_type, action, delivery_slot}}]}. Object types
  content_item, asset, content_type, language, taxonomy. 20X = success; 60 s timeout; retries
  at 1, 2, 4, 8, 16, 32, 60 min then hourly for up to 3 days; delivered in order. Hookdeck source
  type KONTENT_AI (HMAC sha256 base64 on x-kontent-ai-signature; legacy X-KC-Signature not
  covered; verification optional; no timestamp window).
testScenario:
  events:
    - content_item.published
    - asset.metadata_changed
catalog:
  summary: Verify Kontent.ai webhooks (`X-Kontent-ai-Signature` base64 HMAC-SHA256 of the raw body keyed with the webhook Secret), handle content item, asset, type, language and taxonomy notifications
