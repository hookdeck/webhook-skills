name: 'hexclave'
displayName: 'Hexclave'
docs:
  webhooks: 'https://docs.hexclave.com/guides/apps/webhooks/overview'
  verification: 'https://docs.hexclave.com/guides/apps/webhooks/overview'
notes: >-
  Hexclave (hexclave.com, formerly Stack Auth; the docs text still says "Stack"), an open-source auth
  and user-management platform. Webhooks report user, team, team-membership and team-permission changes,
  delivered through Svix. Standard Webhooks signature with svix-* headers: svix-id, svix-timestamp (Unix
  seconds), svix-signature (one or more space-separated 'v1,<base64>' entries). Signed content is '{svix-id}.{svix-timestamp}.{raw
  request body}', HMAC-SHA256, base64 output. Hookdeck core notes: Delivered by Svix. SECRET: Per endpoint,
  in the endpoint details on the dashboard's Webhooks section. Hexclave does not show its format; Svix
  secrets are `whsec_`-prefixed. Research: whsec_ (Svix-issued; backend sends via svix.message.create,
  https://github.com/hexclave/hexclave/blob/dev/apps/backend/src/lib/webhooks.tsx). It starts with whsec_;
  the key is the base64-decoding of the part after whsec_. HEXCLAVE_WEBHOOK_SECRET holds the full whsec_
  value. Verify with the svix library (npm 'svix', pip 'svix'), whose Webhook.verify reads svix-id, svix-timestamp
  and svix-signature and falls back to webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK
  (all three frameworks and the manual verifier): read the svix-* headers and, when svix-id is absent,
  fall back to the webhook-* headers (webhook-id, -timestamp, -signature), exactly as Hookdeck does; then
  hand the library (or manual check) the three values under the header names it expects (the svix library
  accepts either set itself, so pass it both sets of headers rather than only svix-*). Include a test
  that a delivery signed the same way but sent with the other prefix's headers is accepted. This matches
  Hookdeck's Hexclave source (Standard Webhooks, headers_prefix 'svix', a whsec_ secret base64-decoded
  after the prefix and any other secret used as its raw UTF-8 bytes, every v1 entry tried, other versions
  such as v1a ignored, no timestamp window; core also reads the other prefix's headers, webhook-* or svix-*).
  The library always enforces a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries
  and replays resend the original timestamp, so the library rejects late retries after 5 minutes, and
  point to a manual verifier in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw body}'
  with the same key, compare every space-separated v1,<base64> entry in constant time after a length check,
  require the timestamp to be a plain positive integer) where the window can be dropped or widened. Missing
  headers or a bad signature: 400 or 401; handlers fail closed when the secret env var is unset. Verification
  notes: Raw body is required (every handler verifies the raw text body). Body: {type, data}. `type` (the
  event name) and `data` (the affected object), per the overview example and every OpenAPI schema. Event
  type: Top-level `type` beside `data` (the user, team, membership or permission object). The overview
  example's `type` is team.created, and each OpenAPI schema exemplifies `type` with its own name. Event
  types (10 documented, list may not be exhaustive): user.created, user.updated, user.deleted, team.created,
  team.updated, team.deleted, team_membership.created, team_membership.deleted, team_permission.created,
  team_permission.deleted. Transport: POST with a JSON payload. Delivery: No retry schedule, timeout or
  ordering statement; delivery runs on Svix. Setup: Endpoints are created in the dashboard's Webhooks
  section. No challenge or validation request is documented, so the row has no handshake block. Express
  examples must read the raw body with express.raw({ type: '*/*' }) so any content type works and the
  exact bytes are verified; parse the body only after the check. Hookdeck's source type is HEXCLAVE, labelled
  'Hexclave'.
testScenario:
  events:
  - 'team.created'
  - 'user.created'
  - 'user.updated'
catalog:
  summary: >-
    Verify Hexclave webhook signatures (delivered by Svix: `svix-id`, `svix-timestamp`, `svix-signature`,
    HMAC-SHA256, `whsec_` secret), handle user.created, user.updated and team.created events
