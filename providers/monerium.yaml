name: 'monerium'
displayName: 'Monerium'
docs:
  webhooks: 'https://docs.monerium.com/private'
  verification: 'https://docs.monerium.com/private'
notes: >-
  Monerium (monerium.com), an EMI issuing euro e-money tokens on-chain with IBANs; orders move money between
  IBANs and wallets. Webhook subscriptions are created via POST /webhooks with a URL, the integrator's
  own secret and event types. Standard Webhooks signature with webhook-* headers: webhook-id, webhook-timestamp
  (Unix seconds), webhook-signature (one or more space-separated 'v1,<base64>' entries). Signed content
  is '{webhook-id}.{webhook-timestamp}.{raw request body}', HMAC-SHA256, base64 output. Hookdeck core
  notes: The integrator generates the whsec_ secret when registering the webhook. SECRET: Integrator-generated:
  `'whsec_' + crypto.randomBytes(32).toString('base64')`, sent to Monerium when registering, and kept
  for verification. Research: whsec_ (integrator-generated; https://docs.monerium.com/private: const secret
  = 'whsec_' + crypto.randomBytes(32).toString('base64')). It starts with whsec_; the key is the base64-decoding
  of the part after whsec_. MONERIUM_WEBHOOK_SECRET holds the full whsec_ value. Verify with the standardwebhooks
  library (npm 'standardwebhooks', pip 'standardwebhooks'), which reads webhook-id, webhook-timestamp
  and webhook-signature. HEADER FALLBACK (all three frameworks and the manual verifier): read the webhook-*
  headers and, when webhook-id is absent, fall back to the svix-* headers (svix-id, -timestamp, -signature),
  exactly as Hookdeck does; then hand the library (or manual check) the three values under the header
  names it expects (for the standardwebhooks library, pass them as webhook-id, webhook-timestamp and webhook-signature).
  Include a test that a delivery signed the same way but sent with the other prefix's headers is accepted.
  This matches Hookdeck's Monerium source (Standard Webhooks, headers_prefix 'webhook', a whsec_ secret
  base64-decoded after the prefix and any other secret used as its raw UTF-8 bytes, every v1 entry tried,
  other versions such as v1a ignored, no timestamp window; core also reads the other prefix's headers,
  webhook-* or svix-*). The library always enforces a fixed 5-minute timestamp window. SKILL.md must say
  that Hookdeck retries and replays resend the original timestamp, so the library rejects late retries
  after 5 minutes, and point to a manual verifier in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw
  body}' with the same key, compare every space-separated v1,<base64> entry in constant time after a length
  check, require the timestamp to be a plain positive integer) where the window can be dropped or widened.
  Missing headers or a bad signature: 400 or 401; handlers fail closed when the secret env var is unset.
  Hookdeck's configuration alert for this source reads exactly: "You create the secret when you register
  the webhook: generate whsec_ followed by base64 random bytes, send it to Monerium and paste the same
  value here." SKILL.md and references/setup.md must state this requirement, quoting the alert verbatim.
  Verification notes: Raw body is required. Body: {type, data}. Inferred from the handler (`event.type`,
  `event.data` with `id`, `state`, `meta`); not a printed body. Event type: Top-level `type` per the guide's
  handler; the order is in `data` (`id`, `state`, `meta`). Only the handler code shows this; no payload
  example is printed. Event types (3 documented, list may not be exhaustive): order.created, order.updated,
  subscription.created. Transport: JSON POST (the handler reads it with express.raw({ type: 'application/json'
  })). Delivery: Anything but 200 OK is retried up to 10 times over 12 hours with exponential backoff;
  dedupe on webhook-id. No schedule, timeout or ordering statement. Setup: POST /webhooks with `url`,
  the integrator's `secret` and `types` (e.g. order.created, order.updated); a subscription.created event
  follows and must be answered 200 to activate. Profile approval is notified by email, not webhook. Express
  examples must read the raw body with express.raw({ type: '*/*' }) so any content type works and the
  exact bytes are verified; parse the body only after the check. Hookdeck's source type is MONERIUM, labelled
  'Monerium'.
testScenario:
  events:
  - 'order.updated'
  - 'order.created'
  - 'subscription.created'
catalog:
  summary: >-
    Verify Monerium webhooks (Standard Webhooks: `webhook-id`, `webhook-timestamp`, `webhook-signature`,
    `whsec_` secret), handle order and subscription events
