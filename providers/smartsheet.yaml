name: smartsheet
displayName: Smartsheet
docs:
  webhooks: https://developers.smartsheet.com/api/smartsheet/guides/webhooks
  verification: https://developers.smartsheet.com/api/smartsheet/guides/webhooks/webhook-callbacks
  events: https://developers.smartsheet.com/api/smartsheet/webhook-event-types
notes: >
  Work management. Callbacks carry Smartsheet-Hmac-SHA256: hex HMAC-SHA256 of the raw request body
  keyed with the webhook's sharedSecret (assigned by Smartsheet on creation); compare case-insensitively.
  Verification handshake: requests with a Smartsheet-Hook-Challenge header must be answered with 200 and
  the value echoed in the Smartsheet-Hook-Response response header (or JSON {"smartsheetHookResponse": ...}).
  It happens on enable and is ongoing (about once every 100 callbacks); handle it before signature checks
  because challenge requests may be unsigned. Callbacks have scopeObjectId and an events array of
  objectType + eventType (row.created, row.updated, row.deleted, cell.updated, sheet.updated). Status
  change callbacks carry newWebhookStatus instead of events. Express examples read the raw body with
  express.raw({ type: '*/*' }). No official webhook verification helper in the SDKs.
testScenario:
  events:
    - row.created
    - cell.updated
    - sheet.updated
catalog:
  summary: Verify Smartsheet webhook signatures (`Smartsheet-Hmac-SHA256`, HMAC-SHA256 hex of the raw body), answer the `Smartsheet-Hook-Challenge` handshake, handle row.created, cell.updated and sheet.updated events
