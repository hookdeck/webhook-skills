name: teachfloor
displayName: "Teachfloor"
docs:
  webhooks: https://docs.teachfloor.com/docs/webhooks/security
  verification: https://docs.teachfloor.com/docs/webhooks/security
notes: >
  Teachfloor (teachfloor.com), a cohort-based learning platform. Endpoints are added under Developers
  > Webhooks with chosen events, and report course, module, element and member events. Delivery (from
  the docs): 2xx within 10 s. 3 attempts in total (initial + 2 retries) at 10^attempt s: 10 s, then
  100 s. Teachfloor's docs say: 'signature = hash_hmac('sha256', json_payload, secret) ... The
  signature is sent in the Teachfloor-Signature header.' '$payload = $request->getContent(); ...
  $generated = hash_hmac('sha256', $payload, $secret); ... .digest('hex');' 'Use raw request body (not
  parsed JSON)' From the docs (registry summary): hex(HMAC-SHA256(signing secret, raw body)), the
  whole header value, no prefix (`hash_hmac('sha256', json_payload, secret)`; the PHP and Node samples
  compare it directly). SIGNATURE SCHEME (it must match Hookdeck's TEACHFLOOR source exactly: HMAC
  controller, algorithm "sha256", header_key "teachfloor-signature", encoding "hex"). The
  teachfloor-signature header carries the bare lowercase hex digest, no prefix. Compare the WHOLE
  header value as one digest (no list splitting or prefix parsing). The signature is lowercase hex
  HMAC-SHA256, keyed with the secret, over the raw request body bytes only (no timestamp, id or other
  header is signed). Build the signed message as BYTES: the raw body bytes exactly as received, never
  decoded to a string and re-encoded, never JSON.parse/JSON.stringify'd before verifying. The HMAC key
  is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared
  case-insensitively (as Hookdeck does): require exactly 64 hex characters, lowercase both sides (or
  decode both to bytes) before the constant-time compare. Secret: Per endpoint: Developers > Webhooks
  > endpoint > Reveal Signing Secret. Use it as UTF-8 bytes. Env var: TEACHFLOOR_WEBHOOK_SECRET.
  Validate the signature's format before decoding it (exact length and alphabet), then compare in
  constant time: Node checks lengths, then crypto.timingSafeEqual on equal-length Buffers, and never
  calls Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it silently drops bad characters);
  Python uses hmac.compare_digest on bytes (never str) and base64.b64decode(..., validate=True).
  Missing or empty signature header, malformed value or mismatch: 401. No timestamp is signed, so
  there is no replay window to check; do not invent one from unsigned headers or body fields. Events:
  dispatch on the body's `type` field. Top-level `type` in the envelope `id`, `type`, `created_at`,
  `data`. Documented event types (11): course.created, course.updated, course.completed, course.join,
  module.created, module.updated, element.created, element.updated, element.deleted,
  element.completed, member.login. Handle a few common ones and log the rest. Method: POST. Hookdeck's
  Teachfloor source manages the method as POST, so the examples handle POST on the webhook route.
  Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type works
  and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI: await
  request.body()); parse the body only after the check. Documented sample payloads (each JSON file's
  `body` is the payload as the vendor's docs show it) are in
  /home/user/regwt/main-ro/samples-doc/providers/teachfloor/ (latest/course.join.json,
  latest/element.completed.json); base the examples' test payloads on them. Hookdeck's source type is
  TEACHFLOOR, labelled 'Teachfloor'.
testScenario:
  events:
    - "course.join"
    - "course.completed"
    - "member.login"
catalog:
  summary: "Verify Teachfloor webhooks (`teachfloor-signature`: hex HMAC-SHA256 of the raw body), handle course, module, element and member events"
