name: fountain
displayName: "Fountain"
docs:
  webhooks: https://developer.fountain.com/reference/webhooks
  verification: https://developer.fountain.com/reference/webhooks
notes: >
  Fountain (fountain.com), hourly-workforce hiring. Fountain Hire webhooks (Company Settings ->
  Webhooks) report screening events (stage transitions, Checkr/Onfido background-check status) with
  the applicant, and Post-Hire events (worker activated/deactivated, documents uploaded/approved) with
  the worker. Delivery (from the docs): A failed request is retried 2 times. A webhook failing more
  than 10 times in 24 hours is disabled until fixed and re-enabled. No timeout is stated; asynchronous
  processing is recommended. Fountain's docs say: 'every payload is signed with a signature that is
  passed through the header X-OBIQ-SIGNATURE-V2 . The signature is Hex encoded and can be replicated
  by applying HMAC-SHA-256 to the webhook's request body using your Fountain Hire Private API token as
  a secret.' 'signature = OpenSSL::HMAC.hexdigest(OpenSSL::Digest::SHA256.new, YOUR_API_TOKEN, body)'
  'It is possible to change request body to applicant ID via Admin Tools. ... If generating Check
  Signature from Body leads to a mismatch please try generating Check Signature from applicant ID.'
  From the docs (registry summary): Header `X-OBIQ-SIGNATURE-V2: <hex>`. MAC = hex of HMAC-SHA256(key
  = the account's Fountain Hire Private API token, message = the request body). An account can be
  switched (via Fountain's Admin Tools) to sign the APPLICANT ID instead of the body; the docs say to
  try that when a body signature mismatches. SIGNATURE SCHEME (it must match Hookdeck's FOUNTAIN
  source exactly: HMAC controller, algorithm "sha256", header_key "x-obiq-signature-v2", encoding
  "hex"). The X-OBIQ-SIGNATURE-V2 header carries the bare lowercase hex digest, no prefix. Compare the
  WHOLE header value as one digest (no list splitting or prefix parsing). The signature is lowercase
  hex HMAC-SHA256, keyed with the secret, over the raw request body bytes only (no timestamp, id or
  other header is signed). Build the signed message as BYTES: the raw body bytes exactly as received,
  never decoded to a string and re-encoded, never JSON.parse/JSON.stringify'd before verifying. The
  HMAC key is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded). Hex is compared
  case-insensitively (as Hookdeck does): require exactly 64 hex characters, lowercase both sides (or
  decode both to bytes) before the constant-time compare. Secret: The Fountain Hire Private API token
  (API settings), i.e. the account's API credential, not a webhook-specific secret: rotating the API
  token rotates the webhook key. Use it as UTF-8 bytes. Env var: FOUNTAIN_WEBHOOK_SECRET. Validate the
  signature's format before decoding it (exact length and alphabet), then compare in constant time:
  Node checks lengths, then crypto.timingSafeEqual on equal-length Buffers, and never calls
  Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it silently drops bad characters); Python
  uses hmac.compare_digest on bytes (never str) and base64.b64decode(..., validate=True). Missing or
  empty signature header, malformed value or mismatch: 401. No timestamp is signed, so there is no
  replay window to check; do not invent one from unsigned headers or body fields. The key is the
  account's Fountain Hire Private API token (rotating the token rotates the webhook key). Accounts
  switched to applicant-ID signing are NOT supported: those signatures fail, as in Hookdeck. Events:
  there is no event-name field or header. A screening delivery is `{applicant: {...}}` (with `stage`
  and `background_checks`); a Post-Hire delivery is the flat worker object. Dispatch on the shape.
  Method: POST. Hookdeck's Fountain source manages the method as POST, so the examples handle POST on
  the webhook route. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type works and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI:
  await request.body()); parse the body only after the check. Documented sample payloads (each JSON
  file's `body` is the payload as the vendor's docs show it) are in
  /home/user/regwt/main-ro/samples-doc/providers/fountain/ (latest/applicant.json,
  latest/worker.json); base the examples' test payloads on them. Hookdeck's source type is FOUNTAIN,
  labelled 'Fountain'. Hookdeck shows this setup note for the source, and SKILL.md and
  references/setup.md must tell the user the same thing, verbatim: "Paste your Fountain Hire private
  API token. Only the default body signing is supported: accounts switched to applicant ID signing
  fail verification."
testScenario:
  events:
    - "applicant"
    - "worker"
catalog:
  summary: "Verify Fountain webhooks (`X-OBIQ-SIGNATURE-V2`: hex HMAC-SHA256 of the raw body), handle applicant screening and Post-Hire worker events"
