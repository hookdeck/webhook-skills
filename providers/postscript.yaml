name: postscript
displayName: 'Postscript'
docs:
  webhooks: https://developers.postscript.io/docs/configuring-webhooks
  verification: https://developers.postscript.io/reference/get-webhook-signing-token
notes: >
  SMS marketing for Shopify. Despite its name, Postscript-Signature is NOT an HMAC of the body: it
  carries the account's fixed webhook signing token from GET /api/v2/webhooks/token ('Tokens fixed
  MD5 hashes and can be compared to the Postscript-Signature request header'). Say this clearly. No
  signature. Postscript sends the account signing token as plain text in the vendor-fixed
  'Postscript-Signature' header. Hookdeck's Postscript source compares that header's WHOLE value
  (header name case-insensitive) to the configured key, so the examples read
  POSTSCRIPT_WEBHOOK_TOKEN and compare the whole 'Postscript-Signature' value to it in constant
  time. Missing header or mismatch: 401. Compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both sides); Python uses
  hmac.compare_digest on bytes (encode both sides; never pass str, which raises on non-ASCII).
  SKILL.md and verification.md must say plainly that a static shared credential authenticates the
  sender, not the body, and gives no replay protection (no signature, no timestamp), so use HTTPS
  and rotate the credential if it leaks. Model on the n8n, zapier, coterie and honeybadger skills on
  main (and the batch 5 iterable, oyster, fireberry and new-relic skills if present). Hookdeck's
  source type is POSTSCRIPT, labelled 'Postscript'. Hookdeck shows this setup note for the source,
  and SKILL.md and references/setup.md must tell the user the same thing: "Paste the token returned
  by GET /api/v2/webhooks/token." Subscriptions are created with POST /api/v2/webhooks, one event
  each: shop.incoming_message, shop.subscriber.opt_in, shop.subscriber.opt_out, shop.email_collected
  (body has event and resource_type). Non-200 or slow responses are retried. POST. Express examples
  must read the raw body with express.raw({ type: '*/*' }) so any content type works; parse the body
  only after the credential check.
testScenario:
  events:
    - 'shop.subscriber.opt_in'
    - 'shop.incoming_message'
    - 'shop.subscriber.opt_out'
catalog:
  summary: 'Authenticate Postscript webhooks (unsigned: the `Postscript-Signature` account token, not an HMAC, compared in constant time), handle `event`s like `shop.subscriber.opt_in` and `shop.incoming_message`'
