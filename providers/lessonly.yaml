name: lessonly
displayName: 'Lessonly'
docs:
  webhooks: https://docs.lessonly.com/
  verification: https://docs.lessonly.com/
notes: >
  Training platform, now Seismic Learning (keep the Lessonly name, mention the rename). Only one
  webhook: lesson completed, configured with the company settings API (PUT /api/v1/company_settings:
  lesson_completed_callback_url and lesson_completed_callback_authorization, e.g. 'Tm93IGlzIHRo').
  No signature. The credential is the Authorization header. Hookdeck's Lessonly source compares the
  WHOLE Authorization header value to the configured key, so the examples read
  LESSONLY_AUTHORIZATION = the full value as Lessonly sends it (e.g. 'Bearer <token>'), including
  any 'Bearer '/'Basic ' scheme prefix, and compare the whole Authorization header to it; do not
  strip, parse or base64-decode the prefix (Coterie pattern).
  lesson_completed_callback_authorization is sent verbatim as the Authorization value (no scheme is
  added); if the user includes a 'Bearer ' prefix it is part of the value. Missing header or
  mismatch: 401. Compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers (or on SHA-256 digests of both sides); Python uses hmac.compare_digest on
  bytes (encode both sides; never pass str, which raises on non-ASCII). SKILL.md and verification.md
  must say plainly that a static shared credential authenticates the sender, not the body, and gives
  no replay protection (no signature, no timestamp), so use HTTPS and rotate the credential if it
  leaks. Model on the n8n, zapier, coterie and honeybadger skills on main (and the batch 5 iterable,
  oyster, fireberry and new-relic skills if present). Hookdeck's source type is LESSONLY, labelled
  'Lessonly'. Hookdeck shows this setup note for the source, and SKILL.md and references/setup.md
  must tell the user the same thing: "Paste the Authorization value exactly as set in Lessonly,
  including any "Bearer " or "Basic " prefix." The payload isn't documented on the API reference:
  use a clearly labelled illustrative lesson-completed JSON body and say so. Express examples must
  read the raw body with express.raw({ type: '*/*' }) so any content type works; parse the body only
  after the credential check.
testScenario:
  events:
    - 'lesson completed'
catalog:
  summary: 'Authenticate Lessonly (Seismic Learning) lesson-completed callbacks (unsigned: the whole `Authorization` value compared in constant time)'
