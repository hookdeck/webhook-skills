name: pennylane
displayName: 'Pennylane'
docs:
  webhooks: https://pennylane.readme.io/docs/webhooks
  verification: https://pennylane.readme.io/docs/authorization
  events: https://pennylane.readme.io/docs/list-of-events
notes: >
  Pennylane (French accounting), webhooks in Beta. Header X-Pennylane-Signature: 't=<unix
  seconds>,v1=<hex>'; v1 is hex HMAC-SHA256 of '{t}.{raw_request_body}' keyed with the subscription
  secret (returned only once in the create-subscription API response; scope
  companies:webhook_subscriptions:all). t=<ts>,v1=<hex> header: split on ',' and trim each part (allow
  a space after the comma), take t and every v1 (several are sent during secret rotation) and accept
  if any v1 matches; reject a header with no t or no v1. Compare in constant time: in Node, check the
  received value is exactly 64 hex chars (/^[0-9a-f]{64}$/i) before any Buffer.from(x, 'hex') (invalid
  hex silently truncates), or compare the lowercase hex strings as equal-length UTF-8 Buffers with
  crypto.timingSafeEqual after a length check; in Python use hmac.compare_digest on bytes (encode both
  sides) so a non-ASCII header gives 401, not 500. Hookdeck retries and replays resend the original
  timestamp, so a 5-minute window rejects late retries: make the timestamp freshness check opt-in via
  PENNYLANE_TIMESTAMP_TOLERANCE_SECONDS (default 0 = off), as the mercury-webhooks skill does.
  SKILL.md must say that Hookdeck retries and replays resend the original timestamp, so a 5-minute
  window rejects late retries, and point to references/verification.md, which shows where the window
  can be dropped or widened. Events: customer_invoice.e_invoicing_status_updated, dms_file.created,
  supplier_invoice.e_invoicing_received. Express examples must read the raw body with express.raw({
  type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'customer_invoice.e_invoicing_status_updated'
    - 'dms_file.created'
    - 'supplier_invoice.e_invoicing_received'
catalog:
  summary: 'Verify Pennylane webhook signatures (`X-Pennylane-Signature` `t=<ts>,v1=<hex>`, HMAC-SHA256 over `{t}.{body}`), handle `customer_invoice.e_invoicing_status_updated`, `dms_file.created` and `supplier_invoice.e_invoicing_received` events'
