name: hostaway
displayName: 'Hostaway'
docs:
  webhooks: https://support.hostaway.com/hc/en-us/articles/360009022653-Using-Hostaway-Webhooks
  verification: https://api.hostaway.com/documentation
notes: >
  Hostaway (vacation rental software) unified webhook (Settings > Integrations) and the legacy
  reservation and message webhooks. 'login ... Login for basic auth (if login and password provided
  we'll send basic auth header) password ... Password for basic auth'; both are optional. The help
  article returns 403 to curl; https://r.jina.ai/<url> can read it. No signature. Authenticate with
  HTTP Basic auth, which is what Hookdeck's Hostaway source verifies. The examples read
  HOSTAWAY_WEBHOOK_USERNAME and HOSTAWAY_WEBHOOK_PASSWORD, parse 'Authorization: Basic
  base64(username:password)' (scheme case-insensitive, accept only the strict base64 alphabet and
  decode strictly, e.g. validate=True in Python, so valid credentials followed by junk are rejected;
  split on the first colon), and compare the username and the password each in constant time,
  evaluating both before deciding (no short-circuit). Missing or malformed header or mismatch: 401.
  SKILL.md and setup.md must say that Hookdeck never sends a 401 challenge (no WWW-Authenticate
  round trip), so the credentials must arrive with each request. Compare in constant time: Node
  checks lengths, then crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both
  sides); Python uses hmac.compare_digest on bytes (encode both sides; never pass str, which raises
  on non-ASCII). SKILL.md and verification.md must say plainly that a static shared credential
  authenticates the sender, not the body, and gives no replay protection (no signature, no
  timestamp), so use HTTPS and rotate the credential if it leaks. Model on the n8n, zapier, coterie
  and honeybadger skills on main. Hookdeck's source type is HOSTAWAY, labelled 'Hostaway'. Hookdeck
  shows this setup note for the source, and SKILL.md and references/setup.md must tell the user the
  same thing, verbatim: "Set a login and password on the Hostaway webhook. Webhooks without them
  send nothing to verify." Methods: Hostaway's docs don't name the HTTP method or the body format.
  The examples must not be POST-only: accept GET, POST, PUT, PATCH and DELETE on the webhook route
  (Express: app.all or one route per method; Next.js: export a handler for each; FastAPI: api_route
  with those methods), check the credential first for every method, and handle an empty body. Say in
  SKILL.md and setup.md that Hookdeck's Hostaway source pre-selects POST without managing the
  method, so any other method the sender uses must also be allowed on the source. Body: the unified
  webhook payload is not documented field by field; events include reservation.created,
  reservation.updated, message.received, task.created, task.updated. Use a clearly labelled
  illustrative payload and read the event name defensively (e.g. event, eventType or object/action
  fields), logging unknown shapes. 20-second timeout; transient failures retried up to 3 times. Only
  ports 80/443. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type works (and, for signatures, the exact bytes are verified); parse the body only after
  the check.
testScenario:
  events:
    - 'reservation.created (illustrative payload)'
    - 'message.received (illustrative payload)'
catalog:
  summary: 'Authenticate Hostaway webhooks (HTTP Basic auth from the webhook''s login and password, compared in constant time), handle reservation, message and task events'
