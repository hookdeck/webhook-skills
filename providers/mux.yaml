name: mux
displayName: Mux
docs:
  webhooks: https://www.mux.com/docs/core/listen-for-webhooks
  verification: https://www.mux.com/docs/core/verify-webhook-signatures
notes: >
  Video API. Header mux-signature: t=<timestamp>,v1=<signature>. Signature = HMAC-SHA256 hex of
  "<timestamp>.<raw body>" with the endpoint's signing secret (different per endpoint).
  Default tolerance 5 minutes. Official Node SDK @mux/ts (renamed from the deprecated
  @mux/mux-node) provides webhooks.verifySignature / unwrap; mux-python has no webhook helper.
testScenario:
  events:
    - video.asset.ready
    - video.asset.errored
catalog:
  summary: Verify Mux webhook signatures (`mux-signature` header, `t=<timestamp>,v1=<sig>`, HMAC-SHA256 hex over `<timestamp>.<raw_body>`), handle video.asset.ready, video.asset.errored, video.upload.asset_created, and video.live_stream events
