name: kibana
displayName: 'Kibana'
docs:
  webhooks: https://www.elastic.co/docs/reference/kibana/connectors-kibana/webhook-action-type
  verification: https://www.elastic.co/docs/reference/kibana/connectors-kibana/webhook-action-type
notes: >
  Elastic Kibana Webhook connector (alerting rule actions; not Webhook - Case Management). 'The
  authentication type: none, basic, SSL, or OAuth 2.0 authentication. ... If you choose basic
  authentication, you must provide a user name and password.' Kibana builds the Basic header into
  every request. Custom headers and OAuth 2.0 are not covered by Hookdeck's Kibana source; say so.
  No signature. Authenticate with HTTP Basic auth, which is what Hookdeck's Kibana source verifies.
  The examples read KIBANA_WEBHOOK_USERNAME and KIBANA_WEBHOOK_PASSWORD, parse 'Authorization: Basic
  base64(username:password)' (scheme case-insensitive, accept only the strict base64 alphabet and
  decode strictly, e.g. validate=True in Python, so valid credentials followed by junk are rejected;
  split on the first colon), and compare the username and the password each in constant time,
  evaluating both before deciding (no short-circuit). Missing or malformed header or mismatch: 401.
  SKILL.md and setup.md must say that Hookdeck never sends a 401 challenge (no WWW-Authenticate
  round trip), so the credentials must arrive with each request. Compare in constant time: Node
  checks lengths, then crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both
  sides); Python uses hmac.compare_digest on bytes (encode both sides; never pass str, which raises
  on non-ASCII). SKILL.md and verification.md must say plainly that a static shared credential
  authenticates the sender, not the body, and gives no replay protection (no signature, no
  timestamp), so use HTTPS and rotate the credential if it leaks. Model on the n8n, zapier, coterie
  and honeybadger skills on main. Hookdeck's source type is KIBANA, labelled 'Kibana'. Hookdeck
  shows this setup note for the source, and SKILL.md and references/setup.md must tell the user the
  same thing, verbatim: "Choose Basic authentication on the Kibana Webhook connector." Methods:
  'POST (default) PUT ... PATCH ... GET ... DELETE (Generally available since 9.3)'. The examples
  must not be POST-only: accept GET, POST, PUT, PATCH and DELETE on the webhook route (Express:
  app.all or one route per method; Next.js: export a handler for each; FastAPI: api_route with those
  methods), check the credential first for every method, and handle an empty body. Say in SKILL.md
  and setup.md that Hookdeck's Kibana source pre-selects POST without managing the method, so any
  other method the sender uses must also be allowed on the source. The body is defined by the
  sender's own configuration and there is no vendor event field, so the examples and test scenario
  use a clearly labelled illustrative payload. The body is the rule action's mustache template (e.g.
  {"rule": "{{rule.name}}", "status": "{{alert.actionGroup}}", "context": "{{context.message}}"});
  show one in setup.md. Parse JSON when it parses, otherwise keep the raw text. Express examples
  must read the raw body with express.raw({ type: '*/*' }) so any content type works (and, for
  signatures, the exact bytes are verified); parse the body only after the check.
testScenario:
  events:
    - 'rule action fired (illustrative payload)'
    - 'rule recovered (illustrative payload)'
catalog:
  summary: 'Authenticate Kibana Webhook connector requests (HTTP Basic auth compared in constant time), accept the configured method, handle rule action templates'
