name: 'privy'
displayName: 'Privy'
docs:
  webhooks: 'https://docs.privy.io/api-reference/webhooks/overview'
  verification: 'https://docs.privy.io/api-reference/webhooks/overview#webhook-signing-key'
  events: 'https://docs.privy.io/api-reference/webhooks/overview#webhook-events-reference'
notes: >-
  Privy (privy.io), auth and embedded-wallet infrastructure: users, wallets, transactions, wallet actions,
  intents, usage charges and yield. Endpoints are added under Configuration > Webhooks in the Privy Dashboard
  (production webhooks need the Enterprise plan). Delivered by Svix. Standard Webhooks signature with
  svix-* headers: svix-id, svix-timestamp (Unix seconds), svix-signature (one or more space-separated
  'v1,<base64>' entries). Signed content is '{svix-id}.{svix-timestamp}.{raw request body}', HMAC-SHA256,
  base64 output. Hookdeck core notes: Delivered by Svix. SECRET: The webhook signing secret from the dashboard
  (PRIVY_WEBHOOK_SIGNING_SECRET). Privy never prints its format; Svix signing secrets are `whsec_`-prefixed.
  Research: whsec_ (Svix-delivered; docs do not print the prefix: "Privy uses svix for webhooks infrastructure"
  https://docs.privy.io/api-reference/webhooks/overview). It starts with whsec_; the key is the base64-decoding
  of the part after whsec_. PRIVY_WEBHOOK_SECRET holds the full whsec_ value. Verify with the svix library
  (npm 'svix', pip 'svix'), whose Webhook.verify reads svix-id, svix-timestamp and svix-signature and
  falls back to webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK (all three frameworks
  and the manual verifier): read the svix-* headers and, when svix-id is absent, fall back to the webhook-*
  headers (webhook-id, -timestamp, -signature), exactly as Hookdeck does; then hand the library (or manual
  check) the three values under the header names it expects (the svix library accepts either set itself,
  so pass it both sets of headers rather than only svix-*). Include a test that a delivery signed the
  same way but sent with the other prefix's headers is accepted. This matches Hookdeck's Privy source
  (Standard Webhooks, headers_prefix 'svix', a whsec_ secret base64-decoded after the prefix and any other
  secret used as its raw UTF-8 bytes, every v1 entry tried, other versions such as v1a ignored, no timestamp
  window; core also reads the other prefix's headers, webhook-* or svix-*). The library always enforces
  a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries and replays resend the original
  timestamp, so the library rejects late retries after 5 minutes, and point to a manual verifier in references/verification.md
  (HMAC-SHA256 over '{id}.{timestamp}.{raw body}' with the same key, compare every space-separated v1,<base64>
  entry in constant time after a length check, require the timestamp to be a plain positive integer) where
  the window can be dropped or widened. Missing headers or a bad signature: 400 or 401; handlers fail
  closed when the secret env var is unset. Verification notes: Raw body is required (Svix). Body: {type}.
  Flat: `type` plus the event's own top-level fields (e.g. `user`, `wallet_id`); no `data` wrapper. Event
  type: Top-level `type` (OpenAPI: every webhook schema has `type` with a one-value enum equal to the
  webhook name, "The type of webhook event."), alongside the event's own fields; there is no `data` wrapper.
  Event types (70 documented, list may not be exhaustive): wallet.deposit_account.deposit_started, wallet.deposit_account.deposit_completed,
  wallet.deposit_account.deposit_failed, organization.kyb.updated, user.kyc.updated, user.created, user.authenticated,
  user.linked_account, user.unlinked_account, user.updated_account, user.transferred_account, user.wallet_created,
  user.deleted, transaction.broadcasted, transaction.confirmed, transaction.execution_reverted, transaction.still_pending,
  transaction.failed, transaction.replaced, transaction.provider_error, user_operation.completed, wallet.funds_deposited,
  wallet.funds_withdrawn, wallet.private_key_export, wallet.recovery_setup, wallet.recovered, wallet.archived,
  wallet.restored, wallet_action.swap.created, wallet_action.swap.succeeded and 40 more. Transport: JSON
  POST via Svix (the OpenAPI declares application/json request bodies). Delivery: At least once. Non-2xx
  (3xx included) is retried on the schedule above; after the last attempt the message is failed and can
  be retried manually. Endpoints failing for 5 consecutive days are disabled. Dedupe on `idempotency_key`
  where present. No ordering statement. Setup: Per endpoint in the dashboard, with selected event types;
  HTTPS only. A "Test webhook" button sends `{"type": "privy.test", "message": "Hello, World!"}`. No challenge
  is documented, so the row has no handshake block. Express examples must read the raw body with express.raw({
  type: '*/*' }) so any content type works and the exact bytes are verified; parse the body only after
  the check. Hookdeck's source type is PRIVY, labelled 'Privy'.
testScenario:
  events:
  - 'user.created'
  - 'transaction.confirmed'
  - 'wallet.funds_deposited'
catalog:
  summary: >-
    Verify Privy webhook signatures (`svix-id`, `svix-timestamp`, `svix-signature`, HMAC-SHA256, `whsec_`
    secret), handle user.created, transaction.confirmed and wallet.funds_deposited events
