name: 'swipelux'
displayName: 'Swipelux'
docs:
  webhooks: 'https://docs.swipelux.com/integration/webhooks'
  verification: 'https://docs.swipelux.com/integration/webhooks'
  events: 'https://docs.swipelux.com/api-reference/webhooks/transfer-state-changed'
notes: >-
  Swipelux (swipelux.com), a stablecoin and fiat on/off-ramp, accounts and transfers platform (API v3).
  Webhooks report customer, capability, application, recipient, destination, account and transfer changes;
  new integrations are delivered by Svix. Standard Webhooks signature with svix-* headers: svix-id, svix-timestamp
  (Unix seconds), svix-signature (one or more space-separated 'v1,<base64>' entries). Signed content is
  '{svix-id}.{svix-timestamp}.{raw request body}', HMAC-SHA256, base64 output. Hookdeck core notes: Delivered
  by Svix. SECRET: Per endpoint, revealed in the Svix app portal reached through `GET /v3/webhooks/portal`
  (API key with `webhooks:write`; the link expires after an hour). Swipelux does not print the secret's
  form; Svix secrets are `whsec_`-prefixed. Research: whsec_ (Svix-issued; secret retrieved from the Svix
  app portal via GET /v3/webhooks/portal; docs show no literal value). It starts with whsec_; the key
  is the base64-decoding of the part after whsec_. SWIPELUX_WEBHOOK_SECRET holds the full whsec_ value.
  Verify with the svix library (npm 'svix', pip 'svix'), whose Webhook.verify reads svix-id, svix-timestamp
  and svix-signature and falls back to webhook-id, webhook-timestamp and webhook-signature. HEADER FALLBACK
  (all three frameworks and the manual verifier): read the svix-* headers and, when svix-id is absent,
  fall back to the webhook-* headers (webhook-id, -timestamp, -signature), exactly as Hookdeck does; then
  hand the library (or manual check) the three values under the header names it expects (the svix library
  accepts either set itself, so pass it both sets of headers rather than only svix-*). Include a test
  that a delivery signed the same way but sent with the other prefix's headers is accepted. This matches
  Hookdeck's Swipelux source (Standard Webhooks, headers_prefix 'svix', a whsec_ secret base64-decoded
  after the prefix and any other secret used as its raw UTF-8 bytes, every v1 entry tried, other versions
  such as v1a ignored, no timestamp window; core also reads the other prefix's headers, webhook-* or svix-*).
  The library always enforces a fixed 5-minute timestamp window. SKILL.md must say that Hookdeck retries
  and replays resend the original timestamp, so the library rejects late retries after 5 minutes, and
  point to a manual verifier in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw body}'
  with the same key, compare every space-separated v1,<base64> entry in constant time after a length check,
  require the timestamp to be a plain positive integer) where the window can be dropped or widened. Missing
  headers or a bad signature: 400 or 401; handlers fail closed when the secret env var is unset. Hookdeck's
  configuration alert for this source reads exactly: "Only new Swipelux webhook integrations, delivered
  by Svix, are supported. Legacy integrations use a different scheme and fail verification." SKILL.md
  and references/setup.md must state this requirement, quoting the alert verbatim. Verification notes:
  Raw body is required ("Keep the raw body available until verification completes"). Body: {id, type,
  createdAt, attempt, resource, data}. `id` is the event id (dedupe key); `attempt` is not a dedupe key
  or retry counter; `resource` locates the object; `data.object` is its state and `data.previous` the
  changed fields. Event type: Top-level `type` in a v3 envelope `{id, type, createdAt, attempt, resource
  {type, id}, data {object, previous}}`; every spec example's `type` is its own name. `resource.type`
  names the object kind (e.g. `transfer`), not the event. Event types (12 documented, list may not be
  exhaustive): customer.created, customer.updated, customer.archived, capability.created, capability.status_changed,
  application.status_changed, recipient.status_changed, destination.status_changed, account.created, account.status_changed,
  account.details_changed, transfer.state_changed. Transport: application/json (the spec's requestBody
  media type). Every operation in the spec's `webhooks` section is a `post`; Swipelux's prose states no
  method, so the quote is Svix's (method_evidence), the delivery platform's statement rather than Swipelux's.
  Delivery: At least once; duplicates, delays and reordering are normal. Failed deliveries can be retried
  and windows replayed from the portal. No retry schedule or timeout is stated. Setup: Endpoints via `POST
  /v3/webhooks` with an `events` list (v3 names), updated with `PATCH` (replaces the whole selection).
  No challenge or validation request is documented, so the row has no handshake block. Express examples
  must read the raw body with express.raw({ type: '*/*' }) so any content type works and the exact bytes
  are verified; parse the body only after the check. Hookdeck's source type is SWIPELUX, labelled 'Swipelux'.
testScenario:
  events:
  - 'transfer.state_changed'
  - 'customer.created'
  - 'customer.updated'
catalog:
  summary: >-
    Verify Swipelux webhooks (delivered by Svix: `svix-id`, `svix-timestamp`, `svix-signature`, `whsec_`
    secret), handle customer, account and transfer events
