name: buildkite
displayName: Buildkite
docs:
  webhooks: https://buildkite.com/docs/apis/webhooks/pipelines
  verification: https://buildkite.com/docs/apis/webhooks/pipelines#webhook-signature
notes: >
  CI/CD. The webhook Token is sent either as plain text in X-Buildkite-Token (default) or as
  X-Buildkite-Signature: timestamp=<unix>,signature=<hex HMAC-SHA256 of "<timestamp>.<body>">.
  Hookdeck verifies token mode only (X-Buildkite-Token compared to the token), so the skill
  should lead with token mode (constant-time compare) and document signature mode as the
  alternative. X-Buildkite-Event names the event: ping, build.scheduled, build.running,
  build.finished, job.started, job.finished, agent.connected.
testScenario:
  events:
    - build.finished
    - ping
catalog:
  summary: Verify Buildkite webhooks (`X-Buildkite-Token` plain-text token by default, or `X-Buildkite-Signature` HMAC-SHA256 hex over `{timestamp}.{body}` keyed with the token), handle `ping`, `build.scheduled`, `build.running`, `build.failing`, `build.finished`, `job.started`, `job.finished`, and `agent.connected` events
