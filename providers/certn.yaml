name: certn
displayName: 'Certn'
docs:
  webhooks: https://centric-api-docs.certn.co/#webhooks
  verification: https://centric-api-docs.certn.co/#webhooks
  events: https://centric-api-docs.certn.co/#webhooks
notes: >
  CertnCentric (Certn's current API). The legacy API (docs.certn.co/api, Certn-Signature t=/v1= over
  '{t}.{body}', applicant-object payloads) was turned off on 2026-08-05 and its webhooks send nothing;
  don't generate code for it. centric-api-docs.certn.co renders client-side; the same Webhooks text is
  in https://centric-api-docs.certn.co/openapi.json under info.description. Endpoint verification is
  required: when a URL is added (and periodically after), Certn sends GET <url>?challenge=<value>; return
  200 with the value as the body within 10 seconds (Certn's examples set Content-Type text/plain and
  X-Content-Type-Options nosniff), or Certn disables the webhook and emails the account. Every example
  must handle GET and POST on the same path, with no signature check on the GET. Events are POSTs with
  X-Signature: lowercase hex HMAC-SHA256 of the raw body, keyed with the signing key provided when the
  webhook configuration is created (used as given, UTF-8); no timestamp, no prefix, no rotation scheme
  documented. In Node, check the value is exactly 64 hex chars before an equal-length
  crypto.timingSafeEqual; in Python use hmac.compare_digest on bytes. Dispatch on body event_type:
  CASE_STATUS_CHANGED, CHECK_STATUS_CHANGED (triggered_check, and action_required_resolution when the
  check is CLIENT_ACTION_REQUIRED), CASE_REPORT_READY, CASE_INPUT_CLAIMS_AUTOMATICALLY_GENERATED. Respond
  200 within 10 seconds; retries use exponential backoff for about 2 hours; events can arrive out of
  order; deduplicate on event_id. Webhook configurations are per region (CA, UK, AU). Hookdeck setup
  (say this in SKILL.md's setup section and in references/setup.md): create a Certn source and paste
  the signing key. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type verifies.
testScenario:
  events:
    - CASE_STATUS_CHANGED
    - CHECK_STATUS_CHANGED
    - CASE_REPORT_READY
    - CASE_INPUT_CLAIMS_AUTOMATICALLY_GENERATED
catalog:
  summary: 'Answer CertnCentric''s `GET ?challenge=` endpoint verification, verify `X-Signature` (hex HMAC-SHA256 of the raw body), and handle `CASE_STATUS_CHANGED`, `CHECK_STATUS_CHANGED`, `CASE_REPORT_READY` and `CASE_INPUT_CLAIMS_AUTOMATICALLY_GENERATED`'
