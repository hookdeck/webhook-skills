name: nexthink
displayName: 'Nexthink'
docs:
  webhooks: https://docs.nexthink.com/platform/configuring_nexthink/bringing-data-into-your-nexthink-instance/integrating-nexthink-with-third-party-tools/outbound-connectors/webhooks
  verification: https://docs.nexthink.com/platform/configuring_nexthink/bringing-data-into-your-nexthink-instance/integrating-nexthink-with-third-party-tools/outbound-connectors/connector-credentials
notes: >
  Digital employee experience; covers outbound-connector webhooks that use a Bearer token connector
  credential (the Header prefix is configured manually, usually 'Bearer'; a custom prefix like
  'CwsAuth bearer=' gives 'Authorization: CwsAuth bearer=<token>'). Basic and OAuth credentials
  aren't covered by Hookdeck's Nexthink source. No signature. The credential is the Authorization
  header. Hookdeck's Nexthink source compares the WHOLE Authorization header value to the configured
  key, so the examples read NEXTHINK_AUTHORIZATION = the full value as Nexthink sends it (e.g.
  'Bearer <token>'), including any 'Bearer '/'Basic ' scheme prefix, and compare the whole
  Authorization header to it; do not strip, parse or base64-decode the prefix (Coterie pattern).
  Missing header or mismatch: 401. Compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both sides); Python uses
  hmac.compare_digest on bytes (encode both sides; never pass str, which raises on non-ASCII).
  SKILL.md and verification.md must say plainly that a static shared credential authenticates the
  sender, not the body, and gives no replay protection (no signature, no timestamp), so use HTTPS
  and rotate the credential if it leaks. Model on the n8n, zapier, coterie and honeybadger skills on
  main (and the batch 5 iterable, oyster, fireberry and new-relic skills if present). Hookdeck's
  source type is NEXTHINK, labelled 'Nexthink'. Hookdeck shows this setup note for the source, and
  SKILL.md and references/setup.md must tell the user the same thing: "Choose the Bearer token
  credential type for the webhook and paste the whole Authorization value here, including "Bearer
  "." The request method is user-chosen, so the examples must not be POST-only: accept POST, PUT and
  PATCH (the webhook Method dropdown) on the webhook route (Next.js: export a handler for each), and
  handle an empty body. Say in SKILL.md and setup.md that Hookdeck's Nexthink source pre-selects
  POST without managing the method, so any other method the sender uses must also be allowed on the
  source. The payload is the author's JSON template with {{variable}} placeholders from the NQL data
  model (e.g. {{alert.monitor.name}}); The body is a template the user writes; the vendor adds no
  event field, so the examples and test scenario use a clearly labelled illustrative payload.
  Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type
  works; parse the body only after the credential check.
testScenario:
  events:
    - 'alert triggered (illustrative template)'
    - 'alert recovered (illustrative template)'
catalog:
  summary: 'Authenticate Nexthink outbound-connector webhooks (unsigned: the whole `Authorization` Bearer value compared in constant time), handle the alert and workflow payloads your template sends'
