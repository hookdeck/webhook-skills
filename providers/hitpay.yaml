name: hitpay
displayName: 'HitPay'
docs:
  webhooks: https://docs.hitpayapp.com/apis/guide/events
notes: >
  HitPay (payments) event webhooks registered under Developers > Webhooks. Header Hitpay-Signature:
  hex HMAC-SHA256 of the raw JSON body keyed with that webhook endpoint's salt (shown on the webhook's
  detail view). Legacy payment-request and charge callbacks (form-encoded, an hmac field in the
  payload, keyed with the API-key salt) are a different scheme and are NOT covered; say so. Compare in
  constant time: in Node, check the received value is exactly 64 hex chars (/^[0-9a-f]{64}$/i) before
  any Buffer.from(x, 'hex') (invalid hex silently truncates), or compare the lowercase hex strings as
  equal-length UTF-8 Buffers with crypto.timingSafeEqual after a length check; in Python use
  hmac.compare_digest on bytes (encode both sides) so a non-ASCII header gives 401, not 500. The event
  arrives in two headers, Hitpay-Event-Object (charge, payout, invoice, order, transfer) and
  Hitpay-Event-Type (created, updated, ...); the body carries no event name. Dispatch on
  '{Hitpay-Event-Object}.{Hitpay-Event-Type}'; events include charge.created, charge.updated,
  order.created, invoice.created, transfer.paid, transfer.failed, payout.created. Hookdeck setup (say
  this in SKILL.md's setup section and in references/setup.md): Only HitPay App webhooks (Developers >
  Webhooks), which send a HitPay-Signature header, are supported. Paste that webhook's salt. Legacy
  payment-request callbacks aren't supported. Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'charge.created'
    - 'order.created'
catalog:
  summary: 'Verify HitPay event webhook signatures (`Hitpay-Signature`, HMAC-SHA256 hex of the raw body keyed with the webhook salt), handle `charge.created` and `order.created` events'
