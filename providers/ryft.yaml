name: ryft
displayName: "Ryft"
docs:
  webhooks: https://developer.ryftpay.com/documentation/get_started/webhooks
  verification: https://developer.ryftpay.com/documentation/get_started/webhooks#webhook-authorization
notes: >
  Ryft (ryftpay.com), a UK/EU payments platform for marketplaces and platforms (sub-accounts, payouts,
  subscriptions, FX conversions). One webhook endpoint per account, managed in the Ryft Portal or the
  Webhook API. Delivery (from the docs): A 200 within 1.5 s; otherwise retried after 0, 1, 5, 10, 10
  and 10 minutes (6 attempts). Ryft's docs say: 'you can use the Signature header included in each
  request. ... HMAC-SHA256 hash the raw response body. Compare the resulting hash to the value in the
  Signature header.' 'byte[] secretBytes = Encoding.ASCII.GetBytes(secret); ... return
  BitConverter.ToString(hash).Replace("-", string.Empty).ToLowerInvariant();' 'const string payload =
  "{\"amount\": 500, \"currency\": \"GBP\"}"; const string secretKey = "abcdef4455"; const string
  signature = "12443c521a6900579d09b1b29cf17b679f7745eb32a8018e46f44bb27103f865";
  verifier.IsValid(...).ShouldBeTrue();' From the docs (registry summary): `Signature: <hex>` =
  lowercase hex HMAC-SHA256(webhook secret as ASCII, raw body as UTF-8). Bare value. The guide names
  neither the encoding nor the key bytes; both come from Ryft's .NET SDK verifier. SIGNATURE SCHEME
  (it must match Hookdeck's RYFT source exactly: HMAC controller, algorithm "sha256", header_key
  "signature", encoding "hex"). The Signature header carries the bare lowercase hex digest, no prefix.
  Compare the WHOLE header value as one digest (no list splitting or prefix parsing). The signature is
  lowercase hex HMAC-SHA256, keyed with the secret, over the raw request body bytes only (no
  timestamp, id or other header is signed). Build the signed message as BYTES: the raw body bytes
  exactly as received, never decoded to a string and re-encoded, never JSON.parse/JSON.stringify'd
  before verifying. The HMAC key is the secret's UTF-8 bytes, used as-is (not hex- or base64-decoded).
  Hex is compared case-insensitively (as Hookdeck does): require exactly 64 hex characters, lowercase
  both sides (or decode both to bytes) before the constant-time compare. Secret: The webhook
  endpoint's secret. Use it as UTF-8 bytes. Env var: RYFT_WEBHOOK_SECRET. Validate the signature's
  format before decoding it (exact length and alphabet), then compare in constant time: Node checks
  lengths, then crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig,
  'hex'|'base64') on an unvalidated value (it silently drops bad characters); Python uses
  hmac.compare_digest on bytes (never str) and base64.b64decode(..., validate=True). Missing or empty
  signature header, malformed value or mismatch: 401. No timestamp is signed, so there is no replay
  window to check; do not invent one from unsigned headers or body fields. The header is the generic
  `Signature`. Events: dispatch on the body's `eventType` field. Top-level `eventType` in every
  payload example, equal to the event line it is listed under (37 examples, all consistent). `data`
  holds the resource; `deliveryStatus` is delivery metadata. Documented event types (36):
  Account.created, Account.updated, Person.created, Person.updated, Person.deleted,
  PayoutMethod.created, PayoutMethod.updated, PayoutMethod.deleted, Payout.created,
  Payout.status_updated, PaymentSession.captured, PaymentSession.capture_failed,
  PaymentSession.approved, PaymentSession.declined (and 22 more). Handle a few common ones and log the
  rest. Method: POST. Hookdeck's Ryft source manages the method as POST, so the examples handle POST
  on the webhook route. Express examples must read the raw body with express.raw({ type: '*/*' }) so
  any content type works and the exact bytes are verified (Next.js: await request.arrayBuffer();
  FastAPI: await request.body()); parse the body only after the check. After verifying, treat every
  field of the parsed body as untrusted: check that the body and each nested field is the expected
  type before reading into it (Express/Next.js: typeof / Array.isArray; FastAPI: isinstance(x, dict) /
  isinstance(x, list) before .get() or iterating), so a wrong-typed field is ignored or answered with
  400, never a 500. Never say Hookdeck verifies 'at the edge'; say Hookdeck's source verifies the
  signature. PUBLISHED TEST VECTOR (verified against Hookdeck's controller): the vendor's docs give a
  worked example, saved verbatim as JSON (secret, body string, headers) in
  /tmp/claude-0/-home-user/a6117e89-67f4-5ebf-9ebd-ebed152a5054/scratchpad/b910-skills/vectors/ryft.json.
  Every example's test suite (Express, Next.js and FastAPI) must include it as a unit test: load or
  paste the exact body bytes (json.load the file, or copy the string exactly; do not pretty-print or
  re-serialise), and assert that the verifier accepts that header value
  (12443c521a6900579d09b1b29cf17b679f7745eb32a8018e46f44bb27103f865) with that secret. Name the vector
  in references/verification.md. Documented sample payloads (each JSON file's `body` is the payload as
  the vendor's docs show it) are in /home/user/regwt/main-ro/samples-doc/providers/ryft/
  (latest/Conversion.created.json, latest/Conversion.updated.json); base the examples' test payloads
  on them. Hookdeck's source type is RYFT, labelled 'Ryft'.
testScenario:
  events:
    - "PaymentSession.captured"
    - "Payout.created"
    - "Account.updated"
catalog:
  summary: "Verify Ryft webhooks (`Signature`: hex HMAC-SHA256 of the raw body), handle payment session, account, payout and dispute events"
