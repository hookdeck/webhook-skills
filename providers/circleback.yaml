name: circleback
displayName: 'Circleback'
docs:
  webhooks: https://circleback.ai/docs/support/automations/export-meeting-data-with-webhooks
notes: >
  Circleback (AI meeting notes) automation webhooks. Header x-signature: bare hex HMAC-SHA256 of the
  raw request body keyed with the signing secret shown in the automation's webhook step, as UTF-8.
  Compare in constant time: in Node, check the received value is exactly 64 hex chars
  (/^[0-9a-f]{64}$/i) before any Buffer.from(x, 'hex') (invalid hex silently truncates), or compare
  the lowercase hex strings as equal-length UTF-8 Buffers with crypto.timingSafeEqual after a length
  check; in Python use hmac.compare_digest on bytes (encode both sides) so a non-ASCII header gives
  401, not 500. There are no event types: each delivery is one meeting export (notes, action items,
  attendees, transcript per the automation's settings). Express examples must read the raw body with
  express.raw({ type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'meeting export'
catalog:
  summary: 'Verify Circleback automation webhook signatures (`x-signature`, HMAC-SHA256 hex of the raw body), handle meeting export payloads'
