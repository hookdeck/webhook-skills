name: paypercut
displayName: "Paypercut"
docs:
  webhooks: https://docs.paypercut.io/docs/introduction/start-developing/webhooks
  verification: https://docs.paypercut.io/docs/introduction/start-developing/webhooks
  events: https://docs.paypercut.io/docs/introduction/start-developing/webhook-events/index.md
notes: >
  Paypercut (paypercut.io), the payments platform (checkout, payment intents, connected accounts,
  payouts, identity verification). Webhook endpoints are configured in the Merchant Dashboard or with
  the Webhooks API, each with `enabled_events`, a fixed `api_version` and an optional `connect` flag
  for connected accounts. Delivery (from the docs): 2xx means processed; a 500 is retried (schedule
  undocumented). The page advises returning 2xx only after processing and deduping on
  `Paypercut-Delivery-Id`. Paypercut's docs say: '| `Paypercut-Signature` | Signature used to verify
  authenticity |' 't=1768991448,v1=51844041050a81c3a22a15e3e6cb29167d4265f7068764671a488027931f3630'
  'Concatenate it with the raw request body using a dot (.) timestamp.raw_body 3. Compute the
  HMAC-SHA256 of this string using your webhook endpoint secret 4. Encode the result as hexadecimal'
  'mac := hmac.New(sha256.New, []byte(webhookSecret))' From the docs (registry summary):
  `Paypercut-Signature: t=<unix seconds>,v1=<hex>`; v1 = hex HMAC-SHA256(endpoint secret, "<t>.<raw
  body>"). The Node samples key with the secret string as-is. The page's format line prints
  `t=,v1=<hex_signature>` with the timestamp placeholder missing; the example `t=1768991448,v1=...`
  shows the real shape. No test vector. SIGNATURE SCHEME (it must match Hookdeck's PAYPERCUT source
  exactly: HMAC controller, algorithm "sha256", header_key "paypercut-signature", encoding "hex",
  delimiter ".", prefix_data_with_timestamp true). The Paypercut-Signature header is
  `t=<timestamp>,v1=<hex>` (comma-separated key=value pairs). The signature is lowercase hex
  HMAC-SHA256, keyed with the secret, over: the t value exactly as it appears in the header (a string;
  never parse it to a number and re-format it), then a literal ".", then the raw request body bytes.
  The header may carry more than one v1= entry (for example during key rotation): accept the delivery
  if ANY v1= entry matches, and ignore other keys such as v0. A header with no t= value fails. Build
  the signed message as BYTES: the raw body bytes exactly as received, never decoded to a string and
  re-encoded, never JSON.parse/JSON.stringify'd before verifying. The HMAC key is the secret's UTF-8
  bytes, used as-is (not hex- or base64-decoded). Hex is compared case-insensitively (as Hookdeck
  does): require exactly 64 hex characters, lowercase both sides (or decode both to bytes) before the
  constant-time compare. Secret: The webhook endpoint's own secret (dashboard or Webhooks API); the
  page recommends rotating it at least quarterly. Use it as UTF-8 bytes. Env var:
  PAYPERCUT_WEBHOOK_SECRET. Validate the signature's format before decoding it (exact length and
  alphabet), then compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it
  silently drops bad characters); Python uses hmac.compare_digest on bytes (never str) and
  base64.b64decode(..., validate=True). Missing or empty signature header, malformed value or
  mismatch: 401. Timestamp window: do NOT reject old timestamps by default. Hookdeck retries and
  replays resend the original headers and timestamp, and Hookdeck itself applies no tolerance, so a
  fixed window would reject legitimate retries. Offer an opt-in tolerance (an env var such as
  PAYPERCUT_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say so in SKILL.md and verification.md (t
  is Unix seconds; Paypercut recommends 300 seconds). Dedupe on the `Paypercut-Delivery-Id` header.
  Events: dispatch on the body's `type` field. Only the docs' own payload-validation sample shows the
  body shape: it requires `type` (a string, "Invalid event type format" otherwise) and `data`, and the
  catalogue adds a top-level `account` for connected-account events. No delivered body is shown, so
  `type` holding the catalogue identifier is the reading of that sample, not an observed value.
  `Paypercut-Event-Id` carries the event id; no header names the type. Documented event types (29):
  checkout_session.completed, payment.succeeded, payment.failed, payment_intent.authorized,
  payment_intent.captured, account.created, account.updated, account.capability.requested,
  account.capability.updated, account.external_account.created, account.external_account.updated,
  person.created, person.updated, person.deleted (and 15 more). Handle a few common ones and log the
  rest. Methods: Paypercut's docs don't name the HTTP method. Hookdeck's Paypercut source pre-selects
  POST without managing the method (the user can change it). The examples must NOT be POST-only:
  accept GET, POST, PUT, PATCH and DELETE on the webhook route (Express: app.all or one route per
  method; Next.js: export a handler for each; FastAPI: api_route with those methods), verify the
  signature first for every method, and treat a missing body as empty bytes (a GET with no body is verified over zero bytes, and once verified it is acknowledged
  with 200, not rejected as invalid JSON). Say in SKILL.md and setup.md that Hookdeck's Paypercut source pre-selects
  POST without managing the method, so any other method the sender uses must also be allowed on the
  source. Express examples must read the raw body with express.raw({ type: '*/*' }) so any content
  type works and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI: await
  request.body()); parse the body only after the check. Hookdeck's source type is PAYPERCUT, labelled
  'Paypercut'.
testScenario:
  events:
    - "payment.succeeded"
    - "checkout_session.completed"
    - "payout.paid"
catalog:
  summary: "Verify Paypercut webhooks (`Paypercut-Signature`: `t=`/`v1=` hex HMAC-SHA256 of `{t}.{body}`), handle payment, checkout, account and payout events"
