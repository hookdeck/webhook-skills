name: prometheus-alertmanager
displayName: 'Prometheus Alertmanager'
docs:
  webhooks: https://prometheus.io/docs/alerting/latest/configuration/
  verification: https://prometheus.io/docs/alerting/latest/configuration/
notes: >
  Prometheus Alertmanager webhook receivers (webhook_configs). The receiver's http_config sets the
  Authorization header on every request. Its authorization option '# Sets the authentication type. [
  type: <string> | default: Bearer ]' with credentials (or credentials_file) sends 'Authorization:
  Bearer <credentials>'; that is what Hookdeck's Prometheus Alertmanager source checks (API key on
  authorization with value_prefix 'Bearer '). The env var prefix is ALERTMANAGER. No signature.
  Prometheus Alertmanager sends 'Authorization: Bearer <secret>'. Hookdeck's Prometheus Alertmanager
  source is API key verification on the authorization header with value_prefix 'Bearer '
  (hookdeck/core#6046 head 8c48f55d): the user stores just the secret, and the scheme matches in any
  case (auth schemes are case-insensitive, RFC 9110). So the examples read the BARE secret from
  ALERTMANAGER_WEBHOOK_SECRET (if the configured value itself starts with 'Bearer ',
  case-insensitively, strip it, as core does), require the Authorization header to start with
  'Bearer ' compared case-insensitively, and compare the rest to the secret in constant time. Do not
  trim or otherwise alter the secret. Show an alertmanager.yml receiver with url and
  http_config.authorization (type: Bearer, credentials_file). basic_auth also sets Authorization
  ('Basic <base64(user:pass)>'); core's alert names it because core first compares the whole header
  to the stored value, so it only works if the user stores the whole 'Basic ...' value. Mention that
  in setup.md, but the examples cover the Bearer form. oauth2 is not supported. Missing header,
  wrong scheme or mismatch: 401. Compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both sides); Python uses
  hmac.compare_digest on bytes (encode both sides; never pass str, which raises on non-ASCII).
  SKILL.md and verification.md must say plainly that a static shared credential authenticates the
  sender, not the body, and gives no replay protection (no signature, no timestamp), so use HTTPS
  and rotate the credential if it leaks. Model on the n8n, zapier, coterie and honeybadger skills on
  main. Hookdeck's source type is PROMETHEUS_ALERTMANAGER, labelled 'Prometheus Alertmanager'.
  Hookdeck shows this setup note for the source, and SKILL.md and references/setup.md must tell the
  user the same thing, verbatim: "Set basic_auth, or authorization with the default Bearer type, in
  the webhook receiver's http_config. OAuth 2.0 is not supported." Body: the version 4 JSON
  {version: '4', groupKey, truncatedAlerts, status, receiver, groupLabels, commonLabels,
  commonAnnotations, externalURL, alerts: [{status, labels, annotations, startsAt, endsAt,
  generatorURL, fingerprint}]}. status is firing or resolved (a state, not an event type); loop over
  alerts[]. Use groupKey plus the alert fingerprints to deduplicate (notifications repeat per
  group_interval/repeat_interval). POST. Express examples must read the raw body with express.raw({
  type: '*/*' }) so any content type works (and, for signatures, the exact bytes are verified);
  parse the body only after the check.
testScenario:
  events:
    - 'firing'
    - 'resolved'
catalog:
  summary: 'Authenticate Prometheus Alertmanager webhook receivers (unsigned: `Authorization: Bearer <credentials>` from http_config, compared in constant time), handle firing and resolved alert groups'
