name: ultravox
displayName: "Ultravox"
docs:
  webhooks: https://docs.ultravox.ai/webhooks/overview
  verification: https://docs.ultravox.ai/webhooks/securing-webhooks
  events: https://docs.ultravox.ai/webhooks/available-webhooks
notes: >
  Ultravox Realtime account webhooks (call lifecycle). Ultravox (ultravox.ai), a realtime voice-AI
  platform. Delivery (from the docs): A 2xx (204 recommended) confirms receipt. Errors (4xx or 5xx)
  and unavailability are retried 10 times, from about 30 s and doubling each time. Duplicates can
  occur. Ultravox says: 'Concatenate the raw request body with the timestamp. Create an HMAC-SHA256
  hash of this concatenated string using your webhook secret as the key.' 'The
  X-Ultravox-Webhook-Signature header may contain multiple signatures separated by commas.' SIGNATURE
  SCHEME (it must match Hookdeck's ULTRAVOX source exactly: HMAC controller, algorithm sha256, header
  x-ultravox-webhook-signature, encoding hex, signed_content_template
  "{body}{header:x-ultravox-webhook-timestamp}"). The X-Ultravox-Webhook-Signature header carries the
  bare lowercase hex digest, no prefix. The signature is lowercase hex HMAC-SHA256, keyed with the
  secret, over: the raw request body bytes, then the X-Ultravox-Webhook-Timestamp header value. Where
  two parts are adjacent above there is NO separator between them. Build the signed message as BYTES,
  exactly as Hookdeck's template does: literal separators as UTF-8, header values as the exact header
  string encoded latin1 (Node Buffer.from(value, 'latin1'); Python value.encode('latin-1'); a header
  is never trimmed, parsed or re-formatted), and the raw body bytes as received, concatenated with
  Buffer.concat / b''.join. Never decode the body to a string and re-encode it, and never
  JSON.parse/JSON.stringify before verifying. The HMAC key is the secret's UTF-8 bytes, used as-is
  (not hex- or base64-decoded). Hex is compared case-insensitively (as Hookdeck does): require exactly
  64 hex characters, lowercase both sides (or decode both to bytes) before the constant-time compare.
  Compare the WHOLE header value as one digest (no list splitting, no prefix parsing). Secret: the
  webhook's secret (auto-generated or user-provided when the webhook is created), used as UTF-8. Env
  var: ULTRAVOX_WEBHOOK_SECRET. Validate the signature's format before decoding it (exact length and
  alphabet), then compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on an unvalidated value (it
  silently drops bad characters); Python uses hmac.compare_digest on bytes (never str) and
  base64.b64decode(..., validate=True). Missing or empty signature or signed header, malformed value
  or mismatch: 401. Timestamp window: do NOT reject old timestamps by default. Hookdeck retries and
  replays resend the original headers and timestamp, and Hookdeck itself applies no tolerance, so a
  fixed window would reject legitimate retries. Offer an opt-in tolerance (an env var such as
  ULTRAVOX_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say so in SKILL.md and verification.md
  (X-Ultravox-Webhook-Timestamp is ISO 8601; Ultravox's example rejects anything older than 1 minute).
  Body FIRST, then the timestamp, NO separator. Like Hookdeck's Ultravox source, compare the WHOLE
  signature header to one expected digest: a webhook with several secrets sends a comma-separated list
  and fails, and one without a secret is unsigned and fails. Ultravox recommends answering 204.
  Events: dispatch on the body's `event` field. Documented event types (4): call.started, call.joined,
  call.ended, call.billed. Handle a few common ones and log the rest. Method: POST. Hookdeck's
  Ultravox source manages the method as POST, so the examples handle POST on the webhook route.
  Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type works
  and the exact bytes are verified (Next.js: await request.arrayBuffer(); FastAPI: await
  request.body()); parse the body only after the check. Hookdeck's source type is ULTRAVOX, labelled
  'Ultravox'. Hookdeck shows this setup note for the source, and SKILL.md and references/setup.md must
  tell the user the same thing, verbatim: "Give the Ultravox webhook exactly one secret and paste it
  here. A webhook without a secret is unsigned, and one with several secrets sends a list of
  signatures, so both fail verification."
testScenario:
  events:
    - "call.started"
    - "call.ended"
    - "call.billed"
catalog:
  summary: "Verify Ultravox webhooks (`X-Ultravox-Webhook-Signature`: hex HMAC-SHA256 of the body followed by `X-Ultravox-Webhook-Timestamp`), handle call started, joined, ended and billed events"
