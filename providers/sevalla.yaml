name: sevalla
displayName: 'Sevalla'
docs:
  webhooks: https://docs.sevalla.com/developer-tools/webhooks
  verification: https://docs.sevalla.com/developer-tools/webhooks#verify-requests
notes: >
  Sevalla (app, static site and database hosting). IMPORTANT: despite its name and the whsec_
  prefix, svl-signature is NOT a signature and NOT Standard Webhooks. Sevalla says: 'The
  svl-signature header contains the webhook's signing secret itself, not a hash of the body. To
  check that a request comes from Sevalla, compare the header with the secret you stored, in
  constant time' and 'The svl-signature header carries the webhook's signing secret (whsec_ followed
  by 30 characters).' Say this plainly in SKILL.md and verification.md: there is no HMAC to compute
  and the svix/standardwebhooks libraries must not be used. No signature: requests are unsigned.
  Sevalla sends the webhook's signing secret itself (whsec_ followed by 30 characters) as plain text
  in the svl-signature header on every request. The examples read SEVALLA_WEBHOOK_SECRET, look the
  svl-signature header up case-insensitively and compare its WHOLE value to the secret. This is what
  Hookdeck's Sevalla source does (API key verification, header svl-signature, exact whole value).
  Missing header or mismatch: 401. Compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both sides); Python uses
  hmac.compare_digest on bytes (encode both sides; never pass str, which raises on non-ASCII).
  SKILL.md and verification.md must say plainly that a static shared credential authenticates the
  sender, not the body, and gives no replay protection (no signature, no timestamp), so use HTTPS
  and rotate the credential if it leaks. Model on the n8n, zapier, coterie and honeybadger skills on
  main. Hookdeck's source type is SEVALLA, labelled 'Sevalla'. Hookdeck shows this setup note for
  the source, and SKILL.md and references/setup.md must tell the user the same thing, verbatim:
  "Paste the whole secret, including the whsec_ prefix. When you roll the secret, update it here
  when the new one becomes active." The secret is generated by Sevalla. When the secret is rolled,
  deliveries keep carrying the old secret until the activation time, then the new one, so update the
  stored value then. Body: {webhook_id, event_id, event_delivery_id, type, data}; type in upper
  snake case: APP_CREATE, APP_DEPLOY, APP_UPDATE, APP_DELETE, STATIC_SITE_DEPLOY, DATABASE_CREATE,
  ... Dispatch on type; dedupe on event_id. Any 2xx succeeds; retried up to 10 times over about 2
  days. POST, application/json. Express examples must read the raw body with express.raw({ type:
  '*/*' }) so any content type works (and, for signatures, the exact bytes are verified); parse the
  body only after the check. Documented sample payloads (each JSON file's `body` is the payload as
  the vendor's docs show it) are in /home/user/regwt/b13-merge/samples-doc/providers/sevalla/latest/
  (APP_DEPLOY.json); base the examples' test payloads on them.
testScenario:
  events:
    - 'APP_DEPLOY'
    - 'STATIC_SITE_DEPLOY'
    - 'APP_DELETE'
catalog:
  summary: 'Authenticate Sevalla webhooks (`svl-signature` carries the whsec_ secret itself, not a signature: compared in constant time), handle APP_DEPLOY, STATIC_SITE_DEPLOY and other app and static site events'
