name: paytabs
displayName: "PayTabs"
docs:
  webhooks: https://support.paytabs.com/en/support/solutions/articles/60000718961
  verification: https://support.paytabs.com/en/support/solutions/articles/60000718961
notes: >
  PayTabs (paytabs.com), a MENA payment gateway. A payment request's callback URL and the profile's
  IPN listener URL receive the full transaction as JSON with a `Signature` header: hex(HMAC-SHA256(profile
  ServerKey, raw body)), bare lowercase hex, no timestamp. There is no event name; dispatch on `tran_type`
  (Sale, Refund) and `payment_result.response_status` (A = authorised). Only callback/IPN requests are
  covered, not the browser Return URL. Hookdeck source type PAYTABS (HMAC, sha256, header `signature`, hex).
testScenario:
  events:
    - "Sale"
    - "Refund"
catalog:
  summary: "Verify PayTabs webhooks (`Signature`: hex HMAC-SHA256 of the raw body), handle Sale and Refund transaction callbacks (IPN)"
