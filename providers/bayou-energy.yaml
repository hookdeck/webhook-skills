name: 'bayou-energy'
displayName: 'Bayou Energy'
docs:
  webhooks: 'https://docs.bayou.energy/reference/how-to-set-up-webhooks'
  verification: 'https://docs.bayou.energy/reference/verifying-webhook-signatures'
notes: >-
  Bayou Energy (bayou.energy), a utility-data API that retrieves customers' utility bills and interval
  data. Webhooks report bill discovery/updates, readiness of the initial bill and interval pulls, and
  credential status; signed per the Standard Webhooks spec (webhook-* headers). Standard Webhooks signature
  with webhook-* headers: webhook-id, webhook-timestamp (Unix seconds), webhook-signature (one or more
  space-separated 'v1,<base64>' entries). Signed content is '{webhook-id}.{webhook-timestamp}.{raw request
  body}', HMAC-SHA256, base64 output. SECRET: One secret per company, in the dashboard under Settings
  below the Webhook URL. Format `whsec_<base64>` (the page's example and test vector use `whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw`);
  key = base64-decode after stripping `whsec_`. Research: whsec_ (https://docs.bayou.energy/reference/verifying-webhook-signatures:
  dashboard screenshot shows 'Webhook signing secret whsec_…'; 'strip the whsec_ prefix from your secret
  and base64-decode the remainder'). It starts with whsec_; the key is the base64-decoding of the part
  after whsec_. BAYOU_ENERGY_WEBHOOK_SECRET holds the full whsec_ value. Verify with the standardwebhooks
  library (npm 'standardwebhooks', pip 'standardwebhooks'), which reads webhook-id, webhook-timestamp
  and webhook-signature. HEADER FALLBACK (all three frameworks and the manual verifier): read the webhook-*
  headers and, when webhook-id is absent, fall back to the svix-* headers (svix-id, -timestamp, -signature),
  exactly as Hookdeck does; then hand the library (or manual check) the three values under the header
  names it expects (for the standardwebhooks library, pass them as webhook-id, webhook-timestamp and webhook-signature).
  Include a test that a delivery signed the same way but sent with the other prefix's headers is accepted.
  This matches Hookdeck's Bayou Energy source (Standard Webhooks, headers_prefix 'webhook', a whsec_ secret
  base64-decoded after the prefix and any other secret used as its raw UTF-8 bytes, every v1 entry tried,
  other versions such as v1a ignored, no timestamp window; core also reads the other prefix's headers,
  webhook-* or svix-*). The library always enforces a fixed 5-minute timestamp window. SKILL.md must say
  that Hookdeck retries and replays resend the original timestamp, so the library rejects late retries
  after 5 minutes, and point to a manual verifier in references/verification.md (HMAC-SHA256 over '{id}.{timestamp}.{raw
  body}' with the same key, compare every space-separated v1,<base64> entry in constant time after a length
  check, require the timestamp to be a plain positive integer) where the window can be dropped or widened.
  Missing headers or a bad signature: 400 or 401; handlers fail closed when the secret env var is unset.
  Verification notes: Verification is optional for the receiver (deliveries are sent either way). replay_window_seconds
  300 is Bayou's instruction ("more than 5 minutes from the current time"). Body: {event, object}. `object`
  is the bill or customer. Event type: Top-level `event` beside `object` (`{event, object}`) on every
  reference example. Event types (7 documented, list may not be exhaustive): new_bill, updated_bill, bills_ready,
  intervals_ready, customer_has_filled_credentials, new_unparsed_bill, customer_must_reauthenticate. Transport:
  JSON POST to the company's single webhook URL. Delivery: Deliveries are sent whether or not the receiver
  verifies; no retry policy is stated. Setup: One webhook URL per company (dashboard settings); every
  listed webhook goes there. No challenge. Express examples must read the raw body with express.raw({
  type: '*/*' }) so any content type works and the exact bytes are verified; parse the body only after
  the check. Hookdeck's source type is BAYOU_ENERGY, labelled 'Bayou Energy'.
testScenario:
  events:
  - 'new_bill'
  - 'updated_bill'
  - 'bills_ready'
catalog:
  summary: >-
    Verify Bayou Energy webhooks (Standard Webhooks: `webhook-id`, `webhook-timestamp`, `webhook-signature`,
    `whsec_` secret), handle new bill, updated bill, bills ready and intervals ready events
