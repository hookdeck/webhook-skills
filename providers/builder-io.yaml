name: builder-io
displayName: 'Builder.io'
docs:
  webhooks: https://www.builder.io/c/docs/webhooks
  verification: https://www.builder.io/c/docs/webhooks
notes: >
  Visual CMS. No signature: requests are unsigned. Authenticate with a secret header the user adds
  to the webhook (+ Custom Header). The header name is user-chosen, so the examples read the header
  name from BUILDER_IO_WEBHOOK_HEADER (default 'Authorization') and the expected value from
  BUILDER_IO_WEBHOOK_SECRET (the exact, whole header value, including any 'Bearer ' prefix the user
  typed). Look the header up case-insensitively and compare the WHOLE value; do not strip or parse a
  'Bearer ' prefix. This is what Hookdeck's Builder.io source does (API key verification: header
  name + exact value). Missing header or mismatch: 401. Compare in constant time: Node checks
  lengths, then crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both
  sides); Python uses hmac.compare_digest on bytes (encode both sides; never pass str, which raises
  on non-ASCII). SKILL.md and verification.md must say plainly that a static shared credential
  authenticates the sender, not the body, and gives no replay protection (no signature, no
  timestamp), so use HTTPS and rotate the credential if it leaks. Model on the n8n, zapier, brevo,
  assemblyai, honeybadger and coterie skills. Body: {newValue, previousValue, operation, modelName};
  operation is publish, unpublish, archive, delete, scheduledStart or scheduledEnd. Express examples
  must read the raw body with express.raw({ type: '*/*' }) so any content type works; parse JSON
  only after the credential check.
testScenario:
  events:
    - 'publish'
    - 'unpublish'
    - 'delete'
catalog:
  summary: 'Authenticate Builder.io webhooks (unsigned: a secret custom header compared in full in constant time), handle content `operation`s like `publish`, `unpublish` and `delete`'
