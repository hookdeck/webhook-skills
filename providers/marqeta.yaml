name: marqeta
displayName: Marqeta
docs:
  webhooks: https://www.marqeta.com/docs/developer-guides/about-webhooks
  verification: https://www.marqeta.com/docs/developer-guides/signature-verification
  events: https://www.marqeta.com/docs/core-api/event-types
notes: >
  Webhooks are created with POST /webhooks (up to 10 active per program). HTTP Basic auth is
  required on every webhook (config.basic_auth_username 1-50 chars, basic_auth_password 20-50 with
  digit, lower, upper, symbol). Optional X-Marqeta-Signature = lowercase hex HMAC-SHA256
  (HMAC_SHA_256) or legacy HMAC-SHA1 (HMAC_SHA_1) of the raw body keyed with config.secret; after
  switching algorithms, retries signed the old way arrive for up to two weeks. Credentials and
  secret are masked in API responses. Body is keyed by type, up to 10 per message: transactions,
  cardtransitions, usertransitions, businesstransitions, chargebacktransitions,
  digitalwallettokentransitions, cardactions, ...; ping body {"pings":[{"token":"marqeta","payload":
  "healthcheck"}]}. Only HTTP 200 succeeds; 10 retries with powers-of-4 backoff up to ~12 days; pings
  aren't retried. Dedupe on each notification's token; order by created_time. Hookdeck source type
  MARQETA (BASIC_AUTH; X-Marqeta-Signature not checked; verification optional; no timestamp window).
testScenario:
  events:
    - transaction.authorization
    - cardtransition.fulfillment.issued
catalog:
  summary: Authenticate Marqeta webhooks (required Basic auth, optional `X-Marqeta-Signature` hex HMAC-SHA256/SHA1 of the raw body), answer pings, handle batched transaction and card transition notifications
