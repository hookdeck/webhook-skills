name: agentcard
displayName: 'Agentcard'
docs:
  webhooks: https://docs.agentcard.com/webhooks/overview
  verification: https://docs.agentcard.com/webhooks/overview#verify-the-signature
  events: https://docs.agentcard.com/webhooks/cards/overview
  api: https://docs.agentcard.com/api-reference/webhook-endpoints/secret
notes: >
  Agentcard (virtual cards for AI agents). Header AgentCard-Signature: 't=<unix seconds>,v1=<hex>'; v1
  is hex HMAC-SHA256 over '<t>.<raw body>' keyed with the endpoint's secret. The secret looks like
  whsec_... but this is NOT Standard Webhooks: the HMAC key is the whole secret string including
  whsec_, as UTF-8. Do NOT use the standardwebhooks or svix libraries and do not strip or
  base64-decode the whsec_ prefix. t=<ts>,v1=<hex> header: split on ',' and trim each part (allow a
  space after the comma), take t and every v1 (several are sent during secret rotation) and accept if
  any v1 matches; reject a header with no t or no v1. Compare in constant time: in Node, check the
  received value is exactly 64 hex chars (/^[0-9a-f]{64}$/i) before any Buffer.from(x, 'hex') (invalid
  hex silently truncates), or compare the lowercase hex strings as equal-length UTF-8 Buffers with
  crypto.timingSafeEqual after a length check; in Python use hmac.compare_digest on bytes (encode both
  sides) so a non-ASCII header gives 401, not 500. Hookdeck retries and replays resend the original
  timestamp, so a 5-minute window rejects late retries: make the timestamp freshness check opt-in via
  AGENTCARD_TIMESTAMP_TOLERANCE_SECONDS (default 0 = off), as the mercury-webhooks skill does.
  SKILL.md must say that Hookdeck retries and replays resend the original timestamp, so a 5-minute
  window rejects late retries, and point to references/verification.md, which shows where the window
  can be dropped or widened. A legacy X-AgentCard-Signature: sha256=<hex> header signs the body alone;
  Hookdeck uses AgentCard-Signature, so the examples verify AgentCard-Signature only and say the
  legacy header is not used. Events include card.created, card.updated, card.closed,
  transaction.authorized, approval.requested, checkout_authorization.approved, balance.low. Hookdeck
  setup (say this in SKILL.md's setup section and in references/setup.md): Paste the endpoint's whole
  secret, including the whsec_ prefix. Agentcard uses it as a plain HMAC key. Express examples must
  read the raw body with express.raw({ type: '*/*' }) so any content type verifies.
testScenario:
  events:
    - 'card.created'
    - 'transaction.authorized'
    - 'approval.requested'
catalog:
  summary: 'Verify Agentcard webhook signatures (`AgentCard-Signature` `t=<ts>,v1=<hex>`, HMAC-SHA256 over `{t}.{body}` keyed with the whole `whsec_` secret; not Standard Webhooks), handle `card.created`, `transaction.authorized`, `approval.requested`, and `balance.low` events'
