name: chatim
displayName: "Chatim"
docs:
  webhooks: https://chatim.app/en/documentation/webhooks/
  verification: https://chatim.app/en/documentation/webhooks/
notes: >
  Chatim (chatim.app) chat-widget webhooks, created per project in the dashboard. Chatim (chatim.app),
  a website chat widget and chatbot builder. Delivery (from the docs): 2xx is success; 4xx is a
  permanent failure (no retry); 5xx and timeouts (30 s) are retried after 1 min, 5 min, 30 min, 2 h
  and 24 h, then marked failed. A webhook is disabled after 10 consecutive failures and re-enabled
  from the dashboard. Delivery history is kept 30 days. Chatim says: 'The signature is computed as
  HMAC-SHA256(secret, timestamp + "." + payload) and sent in the X-Chatim-Signature header.' 'expected
  = 'sha256=' + hmac.new( secret.encode(), f'{timestamp}.{body}'.encode(), hashlib.sha256
  ).hexdigest()' SIGNATURE SCHEME (it must match Hookdeck's CHATIM source exactly: HMAC controller,
  algorithm sha256, header x-chatim-signature, encoding hex, signed_content_template
  "{header:x-chatim-timestamp}.{body}"). The X-Chatim-Signature header carries `sha256=<hex>`. The
  signature is lowercase hex HMAC-SHA256, keyed with the secret, over: the X-Chatim-Timestamp header
  value, then a literal ".", then the raw request body bytes. Build the signed message as BYTES,
  exactly as Hookdeck's template does: literal separators as UTF-8, header values as the exact header
  string encoded latin1 (Node Buffer.from(value, 'latin1'); Python value.encode('latin-1'); a header
  is never trimmed, parsed or re-formatted), and the raw body bytes as received, concatenated with
  Buffer.concat / b''.join. Never decode the body to a string and re-encode it, and never
  JSON.parse/JSON.stringify before verifying. The HMAC key is the secret's UTF-8 bytes, used as-is
  (not hex- or base64-decoded). Hex is compared case-insensitively (as Hookdeck does): require exactly
  64 hex characters, lowercase both sides (or decode both to bytes) before the constant-time compare.
  Strip a leading `sha256=` before validating the digest; Hookdeck's parser also accepts the bare
  digest, so accept the value with or without the prefix. Secret: the webhook secret from the Chatim
  dashboard, used as UTF-8. Env var: CHATIM_WEBHOOK_SECRET. Validate the signature's format before
  decoding it (exact length and alphabet), then compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers, and never calls Buffer.from(sig, 'hex'|'base64') on
  an unvalidated value (it silently drops bad characters); Python uses hmac.compare_digest on bytes
  (never str) and base64.b64decode(..., validate=True). Missing or empty signature or signed header,
  malformed value or mismatch: 401. Timestamp window: do NOT reject old timestamps by default.
  Hookdeck retries and replays resend the original headers and timestamp, and Hookdeck itself applies
  no tolerance, so a fixed window would reject legitimate retries. Offer an opt-in tolerance (an env
  var such as CHATIM_WEBHOOK_TOLERANCE_SECONDS, unset or 0 = off) and say so in SKILL.md and
  verification.md (X-Chatim-Timestamp is Unix seconds; Chatim's examples use 300 s). Chatim's Node
  example signs JSON.stringify(req.body); its troubleshooting section says to sign the raw body, which
  is what Hookdeck does. Chatim treats a 4xx as a permanent failure (no retry), so only answer 4xx for
  a bad signature. Events: dispatch on the body's `event` field. Documented event types (6):
  chat.started, chat.message.received, chat.form.submitted, chat.closed, chat.assigned, chat.handoff.
  Handle a few common ones and log the rest. Method: POST. Hookdeck's Chatim source manages the method
  as POST, so the examples handle POST on the webhook route. Express examples must read the raw body
  with express.raw({ type: '*/*' }) so any content type works and the exact bytes are verified
  (Next.js: await request.arrayBuffer(); FastAPI: await request.body()); parse the body only after the
  check. Hookdeck's source type is CHATIM, labelled 'Chatim'.
testScenario:
  events:
    - "chat.started"
    - "chat.message.received"
    - "chat.closed"
catalog:
  summary: "Verify Chatim webhooks (`X-Chatim-Signature`: `sha256=` hex HMAC-SHA256 of `{X-Chatim-Timestamp}.{body}`), handle chat started, message, form, closed, assigned and handoff events"
