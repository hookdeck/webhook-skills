name: maximizer
displayName: 'Maximizer'
docs:
  webhooks: https://developer.maximizer.com/docs/webhooks
  verification: https://developer.maximizer.com/reference/post_v1-targets
notes: >
  CRM; organization webhooks via the Webhooks API: a target (POST /v1/targets, Endpoint.Headers
  [{Key, Value}], max 10 targets) plus Entity/Op subscriptions. No signature: requests are unsigned.
  Authenticate with a secret header the user adds to the target's Endpoint.Headers. The header name
  is user-chosen, so the examples read the header name from MAXIMIZER_WEBHOOK_HEADER (default
  'Authorization') and the expected value from MAXIMIZER_WEBHOOK_SECRET (the exact, whole header
  value, including any 'Bearer ' prefix the user typed). Look the header up case-insensitively and
  compare the WHOLE value; do not strip or parse a 'Bearer ' prefix. This is what Hookdeck's
  Maximizer source does (API key verification: header name + exact whole value). Missing header or
  mismatch: 401. Compare in constant time: Node checks lengths, then crypto.timingSafeEqual on
  equal-length Buffers (or on SHA-256 digests of both sides); Python uses hmac.compare_digest on
  bytes (encode both sides; never pass str, which raises on non-ASCII). SKILL.md and verification.md
  must say plainly that a static shared credential authenticates the sender, not the body, and gives
  no replay protection (no signature, no timestamp), so use HTTPS and rotate the credential if it
  leaks. Model on the n8n, zapier, coterie and honeybadger skills on main (and the batch 5 iterable,
  oyster, fireberry and new-relic skills if present). Hookdeck's source type is MAXIMIZER, labelled
  'Maximizer'. Body: a JSON ARRAY of webhook objects with Entity (AbEntry, Opportunity, Lead, ...)
  and Op (Create, Update, Delete). Targets must answer 200 OK within 2 seconds, so respond before
  slow work. POST. Express examples must read the raw body with express.raw({ type: '*/*' }) so any
  content type works; parse the body only after the credential check.
testScenario:
  events:
    - 'AbEntry.Create'
    - 'Opportunity.Update'
    - 'Lead.Delete'
catalog:
  summary: 'Authenticate Maximizer CRM webhooks (unsigned: a target header compared in full in constant time), handle `Entity`/`Op` changes like `AbEntry` create and `Opportunity` update'
