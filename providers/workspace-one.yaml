name: workspace-one
displayName: 'Workspace ONE (Omnissa)'
docs:
  webhooks: https://docs.omnissa.com/SystemSettings-V2406/EventNotificationsSystemSettings
  verification: https://docs.omnissa.com/SystemSettings-V2406/EventNotificationsSystemSettings
notes: >
  Omnissa (formerly VMware) Workspace ONE UEM Event Notifications only. The notification has Target
  URL, User Name, Password and Format (JSON or XML); it uses basic user authentication. No
  signature. Authenticate with HTTP Basic auth, which is what Hookdeck's Workspace ONE source
  verifies. The examples read WORKSPACE_ONE_WEBHOOK_USERNAME and WORKSPACE_ONE_WEBHOOK_PASSWORD,
  parse 'Authorization: Basic base64(username:password)' (scheme case-insensitive, split on the
  first colon), and compare the username and the password each in constant time, evaluating both
  before deciding (no short-circuit). Missing or malformed header or mismatch: 401. The docs don't
  say whether Basic credentials are sent preemptively. Say that the credentials must arrive on the
  first request: a 401 + WWW-Authenticate challenge flow won't work through Hookdeck, which verifies
  the request as received. Compare in constant time: Node checks lengths, then
  crypto.timingSafeEqual on equal-length Buffers (or on SHA-256 digests of both sides); Python uses
  hmac.compare_digest on bytes (encode both sides; never pass str, which raises on non-ASCII).
  SKILL.md and verification.md must say plainly that a static shared credential authenticates the
  sender, not the body, and gives no replay protection (no signature, no timestamp), so use HTTPS
  and rotate the credential if it leaks. Model on the n8n, zapier, brevo, assemblyai, honeybadger
  and coterie skills. Events (UI labels): Check-in/Check-out, Device Attribute Change, Device
  Compliance Status Change, Device Compromised Status Change, Device Delete, Device Enrollment,
  Device Unenrolled Enterprise Wipe, Device Wipe. No payload is documented on the page; use a
  clearly labelled illustrative JSON body (e.g. EventType, DeviceId, EnrollmentUserName) and accept
  XML. Express examples must read the raw body with express.raw({ type: '*/*' }) so any content type
  works; parse JSON only after the credential check.
testScenario:
  events:
    - 'Device Enrollment'
    - 'Device Compliance Status Change'
catalog:
  summary: 'Authenticate Workspace ONE UEM event notifications (unsigned HTTP Basic auth compared in constant time), handle device enrollment, compliance and wipe events'
