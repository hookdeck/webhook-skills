    notes: >
      Neon Auth webhooks. IMPORTANT: NOT Svix and NOT HMAC — do not force-fit an HMAC template or
      the svix package. Neon signs each webhook with asymmetric EdDSA (Ed25519) as a detached JWS,
      so there is NO shared secret: verify with the public key from
