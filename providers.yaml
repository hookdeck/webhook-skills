  - name: shipbob
    displayName: ShipBob
    docs:
      webhooks: https://developer.shipbob.com/2026-01/webhooks
      verification: https://developer.shipbob.com/2026-01/webhooks#verifying-signatures
    notes: >
      Fulfillment platform. Uses the Standard Webhooks (Svix) scheme: headers
      webhook-id, webhook-timestamp, webhook-signature; HMAC-SHA256 over
      "{webhook-id}.{webhook-timestamp}.{body}", base64-encoded. Signing secret is
      whsec_<base64> — strip the whsec_ prefix and base64-decode the remainder for
      the raw HMAC key. webhook-signature holds space-delimited "v1,<sig>" entries;
      match the v1 entry with a timing-safe compare against the RAW body. The event
      topic arrives in the x-webhook-topic header (dotted names like order.shipped;
      legacy 1.0/2.0 used shipbob-topic with underscores). Subscribe via
      POST /2026-01/webhook with {topics: [...], url}; requires webhooks_write plus
      the read scope per topic (orders_read/fulfillments_read, returns_read,
      receiving_read, billing_read). No official SDK; Node uses the standardwebhooks
      package, Python verifies manually. Common topics: order.shipped,
      order.shipment.delivered, order.shipment.tracking.updated, return.created,
      wro.created, billing.charge.created.
    testScenario:
      events:
        - order.shipped
        - order.shipment.delivered
  - name: shiphero
    displayName: ShipHero
    docs:
      webhooks: https://developer.shiphero.com/webhooks/
      verification: https://developer.shiphero.com/webhooks/#webhook_verification
    notes: >
      Warehouse management / fulfillment platform. Signs each webhook with
      HMAC-SHA256 over the RAW JSON request body, base64-encoded, sent in the
      x-shiphero-hmac-sha256 header. The key is the app's shared_signature_secret,
      returned ONCE by the webhook_create GraphQL mutation. Verify by recomputing
      base64(HMAC-SHA256(rawBody, secret)) and constant-time comparing (plain HMAC
      of the raw body — NOT payload-concatenated-with-account-id). NOT Standard
      Webhooks compliant (no webhook-id/webhook-timestamp/webhook-signature). There
      is no topic header — dispatch on the payload's webhook_type field. Register
      one webhook per event type via webhook_create (name = exact Title Case
      webhook type string, url, shop_name); ShipHero does NOT queue events while a
      webhook is disabled (they are discarded). Delivery: ~10s timeout (20s for
      Generate Label), up to 5 retries per trigger, no delivery SLA; also sends
      X-Shiphero-Message-ID for dedup. Expects a 2xx with body
      {"code":"200","Status":"Success"}. Webhook type names (Title Case): Order
      Allocated, Shipment Update, Inventory Update, Inventory Change, Order
      Canceled, Order Deallocated, Order Packed Out, PO Update, Return Update, Tote
      Complete, Tote Cleared, Package Added, Capture Payment, Generate Label, Print
      Barcode, Automation Rules, Shipment ASN, Work Order Status Update. No official
      SDKs — verify manually in every framework.
    testScenario:
      events:
        - Order Allocated
        - Shipment Update
  - name: shipstation
    displayName: ShipStation
    docs:
      webhooks: https://help.shipstation.com/hc/en-us/articles/360025856252-ShipStation-Webhooks
      verification: https://www.shipengine.com/docs/webhooks/#validating-webhooks
    notes: >
      ShipStation V1 webhooks (ssapi.shipstation.com) send THIN payloads: just
      resource_url + resource_type; you must GET the resource_url with Basic auth (API
      key/secret) to fetch data, subject to the V1 rate limit of 40 req/min per key
      (429 + X-Rate-Limit-Reset). V1 offers NO signature verification (no secret/HMAC)
      — endpoint URL secrecy plus fetching via the authed resource_url is the trust
      model. Not Standard Webhooks. Subscribe via POST /webhooks/subscribe (target_url,
      event, optional store_id, friendly_name) or UI (Settings > Integrations >
      Webhooks). V1 events (complete list of 6): ORDER_NOTIFY, ITEM_ORDER_NOTIFY,
      SHIP_NOTIFY, ITEM_SHIP_NOTIFY, FULFILLMENT_SHIPPED, FULFILLMENT_REJECTED. V1
      retry behavior is undocumented. The newer ShipStation API V2
      (docs.shipstation.com, api.shipstation.com/v2) is ShipEngine-based: different
      events (batch, track, rate, report_complete...) and RSA-SHA256 signature headers
      (x-shipengine-rsa-sha256-key-id/-signature, x-shipengine-timestamp, JWKS at
      https://api.shipengine.com/jwks); ShipEngine retries 2x ~30 min apart after a 10s
      ack window. Skill should target V1 (the Hookdeck source) and note V2. No official
      npm/pip SDKs (shipengine packages target ShipEngine).
    testScenario:
      events:
        - ORDER_NOTIFY
        - SHIP_NOTIFY
  - name: shopify
    displayName: Shopify
    docs:
      webhooks: https://shopify.dev/docs/apps/build/webhooks
      events: https://shopify.dev/docs/api/admin-rest/current/resources/webhook
      verification: https://shopify.dev/docs/apps/build/webhooks/subscribe/https#step-5-verify-the-webhook
    notes: >
      E-commerce platform. Uses X-Shopify-Hmac-SHA256 header with HMAC-SHA256 (base64 encoded).
      Secret is the API secret key from Shopify Partners dashboard.
      Common events: orders/create, orders/paid, products/update.
    testScenario:
      events:
        - orders/create
        - orders/paid

  - name: shopline
    displayName: SHOPLINE
    docs:
      webhooks: https://developer.shopline.com/docs/apps/api-instructions-for-use/webhooks/overview/
      verification: https://developer.shopline.com/docs/apps/api-instructions-for-use/generate-and-verify-signatures/
    notes: >
      E-commerce platform. The SHOPLINE Open Platform (developer.shopline.com, English) is a
      Shopify clone. Webhooks are signed with HMAC-SHA256 of the RAW request body keyed by the
      app secret (Developer Center > App credentials); the signature is in the
      X-Shopline-Hmac-Sha256 header. *** ENCODING VERIFIED (Jul 2026, live products/create
      delivery on api_version v20240601): the digest is LOWERCASE HEX, 64 chars — confirmed by
      recomputing HMAC-SHA256 over the raw body with the app secret and matching the header
      exactly. The docs' header example shows base64 (Shopify-style) and is MISLEADING; the
      "stray" hex code sample is the correct one. Handlers may accept both as a safety net, but
      expect hex. *** Constant-time compare against the raw un-parsed body. This is NOT the Standard
      Webhooks spec. Other headers: X-Shopline-Topic, X-Shopline-Shop-Domain, X-Shopline-Shop-Id,
      X-Shopline-Merchant-Id, X-Shopline-API-Version, X-Shopline-Webhook-Id (stable across resends,
      use for idempotency). Topics use Shopify-style slash format (orders/create, products/update,
      collect/delete). NOTE: api_version is REQUIRED in the webhook-creation body — omitting it
      returns 400 "The required property 'api_version' is missing from the object"; deliveries echo
      it back in X-Shopline-Api-Version. Subscribe via the Admin REST API
      POST https://{handle}.myshopline.com/admin/openapi/{version}/webhooks.json with
      {topic, address, api_version}. Gotchas: 5s response timeout; up to 19 retries over 48h then
      the subscription is auto-removed. No official published SDK — verify manually.
    testScenario:
      events:
        - orders/create
        - products/update
        - collect/delete

  - name: slack
    displayName: Slack
    docs:
      webhooks: https://docs.slack.dev/apis/events-api/
      verification: https://docs.slack.dev/authentication/verifying-requests-from-slack
      events: https://docs.slack.dev/reference/events
    notes: >
      Communications platform. Slack Events API uses X-Slack-Signature header
      formatted as "v0=<hex_sha256>" plus an X-Slack-Request-Timestamp header. Signed
      content is the literal UTF-8 string: "v0:" + timestamp + ":" + raw_body (the
      version, timestamp, and raw body joined by colons). Signing key is the Signing
      Secret from your Slack App's Basic Information page. Reject if timestamp
      differs from local time by more than 5 minutes (replay protection). The
      url_verification challenge must be echoed back during initial endpoint setup.
      Common events: message, app_mention, reaction_added, team_join,
      member_joined_channel, app_home_opened.
    testScenario:
      events:
        - app_mention
        - message

  - name: solidgate
    displayName: Solidgate
    docs:
      webhooks: https://docs.solidgate.com/payments/integrate/webhooks/
      verification: https://docs.solidgate.com/payments/integrate/webhooks/#security
    notes: >
      Payment orchestrator. NOT Standard Webhooks. Two headers: "merchant" = webhook
      public key (prefix wh_pk_) and "signature" = the HMAC. Construct the signed
      message as publicKey + rawBody + publicKey, compute HMAC-SHA512 with the webhook
      secret key (wh_sk_), take the lowercase HEX digest, then base64-encode that HEX
      STRING (the double-encode quirk: base64 of the hex text, NOT the raw digest
      bytes — matches the official SDKs). Use the exact raw JSON body (no
      re-serialization) or verification fails. Webhook keys (wh_pk_/wh_sk_) are a
      separate pair from API keys, set in Hub > Developers; endpoints/events under
      Developers > Channels. Event type is in the solidgate-event-type header;
      solidgate-event-id is for idempotency. Return 2xx within 30s; retries 8 times at
      15m, 30m, 1h, 2h, 4h, 8h, 16h, 24h. Common events: card_gate.order.updated,
      card_gate.chargeback.received, card_gate.fraud_alert.received,
      subscription.updated.v2 (the .v2 suffix is real), alt_gate.order.updated.
    testScenario:
      events:
        - card_gate.order.updated
        - subscription.updated.v2

  - name: statsig
    displayName: Statsig
    docs:
      webhooks: https://docs.statsig.com/integrations/event_webhook
      verification: https://docs.statsig.com/integrations/event_webhook#webhook-signature
    notes: >
      Feature flags and experimentation platform. The Event Webhook (surfaced as
      the "Generic Webhook" integration) DOES sign requests using a Slack/Stripe-style
      HMAC-SHA256 scheme (NOT the Standard Webhooks spec). Two headers:
      X-Statsig-Request-Timestamp and X-Statsig-Signature. Build the basestring by
      joining version + timestamp + raw body with colons: "v0:{timestamp}:{raw_body}".
      Compute HMAC-SHA256(signing_secret, basestring), hex-encode, prefix with "v0="
      and compare to X-Statsig-Signature. IMPORTANT: the timestamp is in MILLISECONDS
      (13 digits). Use the RAW, unparsed body. The signing secret is on the Webhook
      integration card in Project Settings > Integrations. Payloads are JSON batches:
      exposures arrive as a top-level array; config changes are wrapped as
      {"data": [...]} with metadata type/name/description/action (action e.g.
      "created", "updated"). Setup: Project Settings > Integrations > Generic Webhook,
      enter destination URL, use Event Filtering to pick Exposures vs Config Changes.
      No official webhook-verification SDK; docs give HMAC pseudo-code. Retry behavior
      not documented. REQUIRED HANDSHAKE: on save, Statsig POSTs
      {"data":{"event":"url_verification","verification_code":"..."}} and the endpoint
      must reply 200 with {"verification_code":"<same value>"} or the webhook silently
      never registers (no events, no log entries). Answer the handshake before
      enforcing signature verification — it only echoes a caller-supplied value.
    testScenario:
      events:
        - config_change
        - exposure

  - name: stripe
    displayName: Stripe
    docs:
      webhooks: https://docs.stripe.com/webhooks
      verification: https://docs.stripe.com/webhooks/signatures
      events: https://docs.stripe.com/api/events/types
    notes: >
      Payment platform. Uses Stripe-Signature header with HMAC-SHA256 (hex encoded).
      Signature format includes timestamp (t) and signature (v1). Secret starts with whsec_.
      Always use raw request body for verification. Common events: checkout.session.completed,
      payment_intent.succeeded, customer.subscription.created.
    testScenario:
      events:
        - payment_intent.succeeded
        - checkout.session.completed

  - name: tally
    displayName: Tally
    docs:
      webhooks: https://tally.so/help/webhooks
      verification: https://tally.so/help/webhooks
    notes: >
      Form builder. Webhooks are free on all plans and fire a single event type,
      FORM_RESPONSE, on each form submission. Signing is OPTIONAL: when a signing
      secret is set (per-webhook, in the form's Integrations tab, or via the API
      signingSecret field), requests carry a Tally-Signature header (case-insensitive)
      whose value is base64(HMAC-SHA256(signingSecret, rawJsonBody)). No timestamp
      scheme; NOT Standard Webhooks. Always HMAC the raw request body, not re-serialized
      JSON. If no secret is set, requests are unsigned — handlers must handle that case.
      Endpoint must return 2XX within 10s; retries 5m -> 30m -> 1h -> 6h -> 1d. No official SDK.
      Answers live in data.fields. No official SDK.
    testScenario:
      events:
        - FORM_RESPONSE
  - name: strava
    displayName: Strava
    docs:
      webhooks: https://developers.strava.com/docs/webhooks/
      verification: https://developers.strava.com/docs/webhooks/
      events: https://developers.strava.com/docs/webhooks/
    notes: >
      Fitness activity platform (Webhook Events API / push subscriptions). Events are
      NOT cryptographically signed — there is no per-event signature or HMAC header.
      Authenticity is established once at subscription time via a GET handshake: POST to
      https://www.strava.com/api/v3/push_subscriptions with client_id, client_secret,
      callback_url, and a self-chosen verify_token; Strava immediately GETs the
      callback_url with hub.mode=subscribe, hub.challenge=<random>, and
      hub.verify_token=<your token>. Confirm hub.verify_token matches and respond within
      2 seconds with HTTP 200 and JSON body {"hub.challenge":"<echoed value>"} (exact key
      name, with the dot). Event POSTs carry object_type (activity|athlete), aspect_type
      (create|update|delete), object_id, owner_id, subscription_id, event_time, and
      updates. Only ONE subscription per API application. Payloads are thin (object_id
      only) — fetch full data via the REST API. Ack every event with 200 within 2s or
      Strava retries (up to 3 total attempts). No official SDK (all client libraries are
      community). Not Standard Webhooks.
    testScenario:
      events:
        - activity create
        - athlete deauthorization
  - name: telnyx
    displayName: Telnyx
    docs:
      webhooks: https://developers.telnyx.com/docs/messaging/messages/receiving-webhooks
      verification: https://support.telnyx.com/en/articles/4334722-how-to-leverage-webhooks
      events: https://developers.telnyx.com/docs/messaging/messages/receiving-webhooks
    notes: >
      Communications platform (SMS, MMS, voice, Verify). Webhook API v2 signs every event
      with an Ed25519 public-key signature (NOT HMAC and NOT the Standard Webhooks spec).
      Two headers: telnyx-signature-ed25519 (base64 signature) and telnyx-timestamp (unix
      seconds). Reconstruct the signed message as "{telnyx-timestamp}|{raw_body}" and verify
      against the base64 Ed25519 signature using your account public key from Mission Control
      > Account Settings > Keys & Credentials > Public Key (per-account, not per-profile).
      Use the exact raw body; re-serializing JSON breaks verification. Enforce a 300s (5 min)
      timestamp tolerance to block replays. Endpoints must return 2xx within 2000ms or Telnyx
      retries with backoff then fails over to the failover URL. NOTE: the pinned telnyx SDKs
      (Node telnyx@7, Python telnyx) expose client.webhooks.unwrap() but wire it to the
      standardwebhooks library, which does NOT match Telnyx's Ed25519 scheme — verify manually
      with tweetnacl (Node) / PyNaCl (Python). Common events: message.received, message.sent,
      message.finalized.
    testScenario:
      events:
        - message.sent
        - message.finalized
  - name: supabase
    displayName: Supabase
    docs:
      webhooks: https://supabase.com/docs/guides/database/webhooks
      verification: https://supabase.com/docs/guides/auth/auth-hooks
      events: https://supabase.com/docs/guides/auth/auth-hooks
    notes: >
      Open-source Postgres backend platform (database, auth, storage, edge
      functions). NOT a Hookdeck first-class source type — use a generic
      WEBHOOK/HTTP source. Do not confuse with Supabase Realtime/Queues
      (websocket/in-database, not webhooks), Firebase, or Neon. Supabase emits
      outbound HTTP through TWO surfaces with DIFFERENT security models; the
      skill must cover both and must not conflate them.
      (A) DATABASE WEBHOOKS — a wrapper around Postgres triggers calling the
      pg_net extension asynchronously. Created in Dashboard > Integrations >
      Webhooks or in SQL via supabase_functions.http_request(url, method,
      headers_json, params_json, timeout_ms); method is POST or GET. Events are
      the three table events only: INSERT, UPDATE, DELETE, all fired AFTER the
      row change. Payload top-level fields are exactly {type, table, schema,
      record, old_record}; type is the UPPERCASE discriminator; INSERT has
      old_record null, DELETE has record null; record/old_record mirror the
      user-defined table columns. CRITICAL: there is NO signature, NO HMAC, NO
      signing secret and NO Supabase-specific verification header for this
      surface — do NOT fabricate an x-supabase-signature header or an HMAC
      verifier. Authentication is whatever the developer puts in the headers
      JSON (normally Authorization: Bearer <token>), compared in constant time
      on the receiver. No documented delivery id and no documented retry policy;
      pg_net is fire-and-forget within timeout_ms and delivery history is
      queryable in the database's net schema. Idempotency is the receiver's
      responsibility (dedupe on a primary key in record).
      (B) AUTH HOOKS (HTTP Hooks) — signed, following the Standard Webhooks spec
      exactly: headers webhook-id, webhook-timestamp (integer UNIX seconds) and
      webhook-signature (SPACE-DELIMITED list of v1,<base64sig> entries to allow
      zero-downtime rotation; accept if ANY matches). Secret is issued as
      "v1,whsec_<base64-secret>"; strip the leading "v1,whsec_" and
      base64-DECODE the remainder to raw bytes for the HMAC key — using the
      base64 string itself is the classic bug and rejects every real delivery.
      Signed content is "{webhook-id}.{webhook-timestamp}.{raw_body}" over the
      EXACT raw bytes; signature is standard (not base64url) base64 of
      HMAC-SHA256; timestamp tolerance is 5 minutes in EITHER direction;
      constant-time compare. Reference libraries: npm standardwebhooks, PyPI
      standardwebhooks; Supabase's own example imports standardwebhooks@1.0.0
      and does .replace('v1,whsec_', ''). Config env var names are plural (e.g.
      SEND_SMS_HOOK_SECRETS) for pipe-delimited rotating secrets. Six hooks:
      before_user_created (Free, Pro) { metadata: {uuid, time, name,
      ip_address}, user }; custom_access_token (Free, Pro) { user_id, claims,
      authentication_method }; send_sms (Free, Pro) { user, sms: { otp } };
      send_email (Free, Pro) { user, email_data: { token, token_hash,
      redirect_to, email_action_type, site_url, token_new, token_hash_new,
      old_email, old_phone, provider, factor_type } }; mfa_verification_attempt
      (Teams/Enterprise) { factor_id, user_id, valid }; and
      password_verification_attempt (Teams/Enterprise) { user_id, valid }. The
      "list of available Hooks" table lower on the auth-hooks page omits
      before_user_created, but the plan table at the top includes it and it has
      its own docs page — six is correct. Auth Hooks are REQUEST/RESPONSE, not
      fire-and-forget: the response body changes auth behaviour (mfa/password:
      { decision: "reject" | "continue", message, should_logout_user };
      custom_access_token: return the claims for the JWT; send_email/send_sms:
      you send the message and return {}; before_user_created: {} allows,
      an error object rejects signup). Errors are responses >= 400; retry-able
      ones (429, 503) get up to THREE retries with a two-second back-off inside
      a 5-second total budget for the whole invocation, so the handler must be
      fast. Errors from a Postgres Hook (pg-functions://postgres/<schema>/<fn>)
      are NOT retry-able, and that variant sends no HTTP at all.
      Do NOT assert any source-IP allowlist or user-agent value — Supabase
      documents none for either surface.
    testScenario:
      events:
        - INSERT
        - UPDATE
        - DELETE
  - name: synctera
    displayName: Synctera
    docs:
      webhooks: https://docs.synctera.com/docs/webhooks-guide
      verification: https://docs.synctera.com/docs/webhooks-guide
      events: https://docs.synctera.com/v1/reference/listevents-1
    notes: >
      Banking-as-a-Service (BaaS) platform. Custom HMAC scheme — NOT Standard
      Webhooks (no webhook-id/webhook-timestamp/webhook-signature). Two HTTP
      headers: Synctera-Signature (the signature) and Request-Timestamp (POSIX
      seconds). Verify by computing HMAC-SHA256(secret, "{Request-Timestamp}.{raw_body}")
      and hex-encoding; the "." is a LITERAL separator between the timestamp and
      the RAW body. GOTCHA: the signing secret is NOT the API key — generate it via
      POST /v0/webhook_secrets (empty body) and store the returned "secret". During
      secret rotation (rolling secret), Synctera-Signature may contain TWO
      "."-delimited signature strings — check the body against EACH and accept if
      either matches. Reject if Request-Timestamp is >5 minutes from now (replay
      protection); timestamp is in SECONDS, not milliseconds. Verify against the RAW
      body — do not JSON.parse first. Create endpoints via POST /v0/webhooks (url,
      enabled_events[], is_enabled, description, metadata). Event names use
      <resource>.[<sub-resource>.]<action> (ACCOUNT.UPDATED, CARD.CREATED,
      TRANSACTION.CREATED, TRANSACTION.UPDATED, DISPUTE.CREATED, ...) and support
      wildcards like CUSTOMER.* (auto-subscribes to future events under the
      resource). Respond 200 within 5s or it retries (exponential backoff up to
      ~55h); events retained 60 days. Test with POST /v0/webhooks/trigger. Only
      official client is Go (github.com/synctera/client-libraries-go) — no npm/pip,
      so Node.js and Python verify manually. Set SYNCTERA_WEBHOOK_SECRET env var.
    testScenario:
      events:
        - ACCOUNT.UPDATED
        - CARD.CREATED
        - TRANSACTION.CREATED
  - name: treezor
    displayName: Treezor
    docs:
      webhooks: https://docs.treezor.com/guide/webhooks/introduction.html
      verification: https://docs.treezor.com/guide/webhooks/integrity-checks.html
    notes: >
      European Banking-as-a-Service (BaaS) platform with a heavy SCA/KYC event surface.
      Custom HMAC scheme — NOT Standard Webhooks (Svix) — and the signature is a BODY
      FIELD, not an HTTP header. Each webhook JSON body carries object_payload plus
      object_payload_signature. Verify by computing HMAC-SHA256 over the CANONICALIZED
      object_payload using the Treezor-provided webhook_secret, then base64-encoding,
      and comparing (timing-safe) to object_payload_signature. GOTCHA: the payload must
      be canonicalized first to match PHP's default json_encode — compact separators,
      forward slashes escaped (/ -> \/), and non-ASCII escaped to lowercase \uXXXX
      (é -> é). This is signed over the re-serialized object_payload, NOT the raw
      request body. Webhooks are delivered with a text/plain MIME type (JSON parsers
      keyed on application/json will skip them — read raw text and JSON.parse yourself).
      Return 200 on success; return a 5xx to trigger retries (every minute, up to 30
      attempts). Delivery is chronological but NOT order-guaranteed, and duplicates are
      possible (same webhook_id) — dedupe on webhook_id, compare webhook_created_at.
      Subscribe via API on a DIFFERENT host: POST /settings/hooks on
      https://webhook.api.treezor.co (prod) / https://webhook.sandbox.treezor.co
      (sandbox); manage events via /settings/hooks/{uuid}/events. Subscriptions start
      PENDING and may require Treezor activation. The webhook_secret is provided by the
      Treezor Account Manager (no self-service dashboard); Sandbox and Production use
      different secrets. Event names are object.action (payin.create, payout.update,
      cardtransaction.create, wallet.create, user.kycreview, ...; some camelCase /
      multi-segment objects like sca.wallet.create, qes.created). No official SDKs —
      verify manually. Set TREEZOR_WEBHOOK_SECRET env var.
    testScenario:
      events:
        - payin.create
        - cardtransaction.create
        - user.kycreview
  - name: trello
    displayName: Trello
    docs:
      webhooks: https://developer.atlassian.com/cloud/trello/guides/rest-api/webhooks/
      verification: https://developer.atlassian.com/cloud/trello/guides/rest-api/webhooks/#webhook-signatures
    notes: >
      Signature: x-trello-webhook header = base64(HMAC-SHA1(rawBody + callbackURL,
      OAuth application secret)). Gotchas: SHA1 (not SHA256), and the callbackURL is
      concatenated to the body EXACTLY as provided at webhook creation before hashing.
      The secret is the API "OAuth1.0 secret" from the Power-Up admin page. Does NOT
      follow the Standard Webhooks spec. Webhooks are created via API only (POST
      /1/tokens/{token}/webhooks with idModel + callbackURL); at creation Trello sends
      an HTTP HEAD request to the callbackURL and creation fails unless it returns 200
      (invalid SSL cert also fails; missing cert does not). Delivery failures retry 3
      times with backoff (30s, 60s, 120s); a webhook is auto-disabled after ~30 days of
      consecutive failures (>1000 failures). Payloads contain action (with action.type),
      model (the watched object), and webhook objects. No official npm/pip SDK (official
      offerings are browser-side only).
    testScenario:
      events:
        - createCard
        - updateCard
        - commentCard
  - name: tiktok
    displayName: TikTok
    docs:
      webhooks: https://developers.tiktok.com/doc/webhooks-overview
      verification: https://developers.tiktok.com/doc/webhooks-verification
      events: https://developers.tiktok.com/doc/webhooks-events
    notes: >
      TikTok for Developers webhooks (Login Kit / Content Posting / Data Portability) —
      NOT TikTok Shop, which is a separate partner portal with a different signature scheme
      (see the tiktok-shop provider). Events POST as JSON over HTTPS to the callback URL
      registered in the developer app. Signature is in the TikTok-Signature header with value
      format "t=<unix_ts>,s=<sig>". Signature = HMAC-SHA256 hex over signed_payload =
      "<timestamp>" + "." + raw_request_body, keyed with the app's client_secret (there is no
      separate webhook secret). Verify against the RAW body and reject stale timestamps to
      prevent replay (no explicit tolerance window documented — 5 min is a sane default). This
      is NOT the Standard Webhooks spec, though structurally similar. Payload fields:
      client_key, event, create_time (int64 epoch seconds), user_openid (absent on
      portability.download.ready), content (a serialized JSON string — parse separately).
      Delivery is best-effort at-least-once with retries up to 72h (exponential backoff);
      endpoints must be idempotent. Only four events exist (verified): authorization.removed,
      video.upload.failed, video.publish.completed (NOT .complete; there is no
      video.publish.failed), portability.download.ready. Configure the HTTPS callback URL and
      subscribed events in the developer portal; no official webhook SDK, so verify manually.
    testScenario:
      events:
        - authorization.removed
        - video.publish.completed
        - portability.download.ready
  - name: tiktok-shop
    displayName: TikTok Shop
    docs:
      webhooks: https://partner.tiktokshop.com/docv2/page/tts-webhooks-overview
      verification: https://partner.tiktokshop.com/docv2/page/configuration-guide
    notes: >
      Signature arrives in the HTTP Authorization header (no "Bearer" prefix) as a
      lowercase-hex HMAC-SHA256: sign base = app_key + raw_request_body, key = app_secret.
      Verify against the raw body exactly as received; this scheme is distinct from TikTok
      Shop's API request signing and does NOT follow the Standard Webhooks spec (no
      timestamp in the signature, so no replay protection). Configure per shop in Partner
      Center (App & Service > app > Basic Information > Developing > Webhook URL / Event
      subscriptions) or via Events API PUT/GET/DELETE
      https://open-api.tiktokglobalshop.com/event/202309/webhooks. Endpoint must be HTTPS on
      a domain (no IP, no custom port), TLS 1.2+, and return HTTP 200 with empty body within
      3 seconds; 401 signals rejected signature. Delivery is at-least-once with 4 retries
      after failure (2 min, 30 min, 3 h, 12 h) then gives up — dedupe on
      tts_notification_id; docs recommend polling reconciliation. Payload metadata: type
      (numeric — unreliable, branch on subscribed event_type instead), tts_notification_id,
      shop_id, timestamp, data. NOTE: partner docs are a client-side React app — plain HTTP
      fetches get an empty shell; use a JS-rendering browser.
    testScenario:
      events:
        - ORDER_STATUS_CHANGE
        - PACKAGE_UPDATE
        - PRODUCT_STATUS_CHANGE
  - name: svix
    displayName: Svix
    docs:
      webhooks: https://docs.svix.com/receiving/introduction
      verification: https://docs.svix.com/receiving/verifying-payloads/how
    notes: >
      Svix is webhook infrastructure used by many upstream services; "SVIX" verification
      applies to any provider delivering webhooks via Svix. Requests carry svix-id,
      svix-timestamp, and svix-signature headers. Signature =
      base64(HMAC-SHA256(key, "{svix-id}.{svix-timestamp}.{raw_body}")) where key is the
      base64-DECODED portion of the secret after the "whsec_" prefix. svix-signature may
      hold multiple space-delimited "v1,<sig>" entries for secret rotation — match ANY;
      strip the "v1," prefix before constant-time compare. Svix libraries reject timestamps
      more than 5 minutes off (past or future); verify against the raw request body only.
      Scheme is the basis of the Standard Webhooks spec; some senders use interchangeable
      webhook-id / webhook-timestamp / webhook-signature header names (Professional/
      Enterprise-tier option) — accept both. Event types/payloads are defined by the
      upstream service (browsable in that sender's Svix App Portal); common envelope
      convention is {"type": "<event.name>", "data": {...}} but not enforced.
    testScenario:
      events:
        - generic.event.created
        - generic.event.updated
    sdks:
      npm: [svix]
      pip: [svix]

  - name: twilio
    displayName: Twilio
    docs:
      webhooks: https://www.twilio.com/docs/usage/webhooks
      verification: https://www.twilio.com/docs/usage/webhooks/webhooks-security
      events: https://www.twilio.com/docs/usage/webhooks/messaging-webhooks
    notes: >
      Communications platform (SMS, voice, WhatsApp). Uses X-Twilio-Signature header
      with HMAC-SHA1 (base64 encoded). For application/x-www-form-urlencoded webhooks,
      sign the full URL + each POST parameter name+value sorted alphabetically. For
      JSON webhooks, append the SHA-256 hash of the raw body to the URL as a bodySHA256
      query parameter and sign that URL only. Signing key is your Twilio Auth Token.
      Official SDKs: twilio (Node) and twilio (Python) provide validateRequest /
      RequestValidator. Common events: incoming SMS (Messaging webhook), incoming voice
      call (Voice URL), message status callback (queued, sent, delivered, failed),
      recording status.
    testScenario:
      events:
        - incoming SMS
        - message status callback

  - name: usps
    displayName: USPS
    docs:
      webhooks: https://developers.usps.com/subscriptions-trackingv3r2
      verification: https://developers.usps.com/subscriptions-trackingv3r2
      events: https://developers.usps.com/trackingv3
    notes: >
      United States Postal Service Subscriptions - Tracking API (v3.2). You create a
      subscription (POST /subscriptions) with a listenerURL, filterProperties (by
      Mailer ID or trackingNumber), an eventType filter (currently only ALL_UPDATES),
      and an optional 32-char secret; USPS then POSTs notifications to the listener.
      Subscription management uses OAuth2 client-credentials (token endpoint
      https://api.usps.com/oauth2/v3/token) but the OAuth token is NOT sent on
      delivery. Per-message verification is OPTIONAL: supply a 32-char secret and USPS
      sends Base64(HMAC-SHA256(secret, timestamp + payload)) in the X-HMAC header
      (deprecated alias hmac-header); and/or IP-allowlist the USPS source IPs. The
      notification envelope is {subscriptionId, subscriptionType (e.g. "TRACKING"),
      timestamp, payload, links}; payload is a STRINGIFIED JSON that must be parsed,
      and the HMAC is computed over the envelope timestamp concatenated with the raw
      payload string (do not re-serialize). No official SDK. No documented delivery
      retry; an unreachable listener is set to SUSPENDED, and subscriptions auto-delete
      after 30 days of inactivity (warning at 25). Max 10 listener URLs per Home CRID.
      The "event types" are really two payload schemas: Tracking Subscription Event
      (tracking summary + trackingEvents) and Scan Event Extract Subscription Event (a
      single raw scan record). Common tracking statuses inside the tracking payload:
      Out for Delivery, Delivered, Available for Pickup.
    testScenario:
      events:
        - Tracking Subscription Event
        - Scan Event Extract Subscription Event
  - name: uber
    displayName: Uber
    docs:
      webhooks: https://developer.uber.com/docs/eats/guides/webhooks
      verification: https://developer.uber.com/docs/eats/guides/webhooks#webhook-security
      events: https://developer.uber.com/docs/eats/guides/webhooks
    notes: >
      Uber Eats webhooks are signed with the X-Uber-Signature header: a lowercased
      hex HMAC-SHA256 of the raw request body, keyed with the app's CLIENT SECRET
      (not a dedicated webhook secret). Verify against the exact raw body bytes
      before parsing. The event type is in the JSON body's event_type field (no
      event-type header). Configure one Primary Webhook URL per integration in the
      Developer Dashboard (Webhooks tab; Basic Auth or OAuth). Respond HTTP 200 with
      an empty body to ack; retries fire on 500/502/503/504, timeouts, and network
      errors with backoff (10s, 30s, 60s, 120s, then exponential, up to ~7 attempts).
      No official webhook SDK. NOTE: Uber Direct (Deliveries) webhooks differ — they
      use x-uber-signature / x-postmates-signature keyed with a dedicated per-webhook
      Signing Key (not the client secret), created in the Uber Direct Dashboard. Not
      Standard Webhooks. Common events: orders.notification, orders.cancel,
      orders.failure, orders.release, orders.scheduled.notification,
      order.fulfillment_issues.resolved, store.provisioned, store.deprovisioned,
      store.status.changed.
    testScenario:
      events:
        - orders.notification
        - orders.cancel
        - store.provisioned
  - name: utila
    displayName: Utila
    docs:
      webhooks: https://docs.utila.io/reference/webhooks
      verification: https://docs.utila.io/reference/webhooks
      events: https://docs.utila.io/reference/webhooks
    notes: >
      Utila is a digital-asset operations platform. Webhooks are configured per vault
      in the Console (Vault Settings -> Webhooks). Verification is ASYMMETRIC, not HMAC:
      Utila signs each delivery with an RSA-4096 PRIVATE key using SHA-512 + PSS padding,
      base64-encoded, sent in the x-utila-signature header. Verify with Utila's PEM-encoded
      RSA-4096 PUBLIC key from the Console — there is NO shared secret. Verify over the RAW
      body. NOT Standard Webhooks (no webhook-id/webhook-timestamp). No timestamp header, so
      no built-in replay protection — dedupe on the event id. Endpoint must return HTTP 200;
      failed deliveries retry with exponential back-off for up to 24h then are discarded.
      Payloads are THIN (id, vault, type, resourceType, resource, optional details) — fetch
      full detail via the Utila API/Stream using the resource path. Event names are
      SCREAMING_SNAKE_CASE, exactly five: TRANSACTION_CREATED, TRANSACTION_STATE_UPDATED,
      WALLET_CREATED, WALLET_ADDRESS_CREATED, TRANSACTION_AML_SCREENING_RESULT_READY. The
      npm @utila/api package is documented but does not currently resolve on the public
      registry (documented-but-not-installable); no pip SDK — verify manually with platform
      crypto (Node crypto, Python cryptography).
    testScenario:
      events:
        - TRANSACTION_CREATED
        - TRANSACTION_STATE_UPDATED
        - WALLET_ADDRESS_CREATED
  - name: twitch
    displayName: Twitch
    docs:
      webhooks: https://dev.twitch.tv/docs/eventsub/handling-webhook-events/
      verification: https://dev.twitch.tv/docs/eventsub/handling-webhook-events/#verifying-the-event-message
      events: https://dev.twitch.tv/docs/eventsub/eventsub-subscription-types/
    notes: >
      Verify via Twitch-Eventsub-Message-Signature = "sha256=" + hex HMAC-SHA256(secret,
      Twitch-Eventsub-Message-Id + Twitch-Eventsub-Message-Timestamp + raw body);
      timing-safe compare, reject with 4xx on mismatch. Secret is set per subscription
      (10-100 ASCII chars) when creating via POST /helix/eventsub/subscriptions with an
      app access token (user tokens rejected for webhook transport); callback must be
      HTTPS on port 443. Twitch-Eventsub-Message-Type is notification |
      webhook_callback_verification | revocation: for webhook_callback_verification
      respond 200 with the raw challenge string (text/plain, not JSON-wrapped); for
      revocation (user_removed, authorization_revoked, notification_failures_exceeded,
      version_removed) return 2xx. Respond within a few seconds or the subscription gets
      revoked after repeated failures; at-least-once delivery — dedupe on message ID and
      reject timestamps older than 10 minutes. Subscriptions have a cost model
      (max_total_cost, typically 10000; user-authorized subs cost 0). channel.follow
      requires version 2 with a moderator_user_id condition; channel.update is v2. Does
      NOT follow the Standard Webhooks spec. No official SDK; twurple (npm) and
      twitchAPI (pip) are community libraries.
    testScenario:
      events:
        - stream.online
        - channel.follow
        - channel.subscribe
  - name: typeform
    displayName: Typeform
    docs:
      webhooks: https://www.typeform.com/developers/webhooks/
      verification: https://www.typeform.com/developers/webhooks/secure-your-webhooks/
    notes: >
      Signature: Typeform-Signature header = "sha256=" + base64(HMAC-SHA256(raw body,
      secret)). Note base64 encoding (not hex) — a common gotcha; verification requires the
      raw, unparsed request body. Secret is set per-webhook via the UI (form Connect >
      Webhooks > Edit > Add a Secret) or the Webhooks API (PUT
      /forms/{form_id}/webhooks/{tag} with url, enabled, secret, verify_ssl, event_types).
      Does NOT follow the Standard Webhooks spec. Payload has event_type, event_id, and a
      form_response object with an answers array (unanswered/logic-skipped fields omitted).
      Retries: 410/404 disables immediately; 429/408/503/423 retried every 2-3 min for 10
      hours; other failures retried ~5 times with growing intervals; auto-disabled at 100%
      failure rate over 24h. Endpoint must be https (no self-signed certs).
      form_response_partial requires the partial-submit-points form feature (may be
      plan-gated).
    testScenario:
      events:
        - form_response
    sdks:
      npm: ["@typeform/api-client"]
  - name: twitter
    displayName: Twitter/X
    docs:
      webhooks: https://docs.x.com/x-api/webhooks/introduction
      verification: https://docs.x.com/x-api/webhooks/quickstart
      events: https://docs.x.com/x-api/account-activity/introduction
    notes: >
      HMAC-SHA256 over the raw request body using the app's consumer secret (API secret key)
      as the HMAC key; signature is base64-encoded, prefixed with "sha256=", and sent in the
      x-twitter-webhooks-signature header. Compare with constant-time comparison. Does NOT
      follow the Standard Webhooks spec and there is no timestamp in the scheme, so no replay
      protection. Challenge-Response Check (CRC): X sends GET <webhook_url>?crc_token=... at
      registration, roughly hourly, and on demand (PUT /2/webhooks/:webhook_id triggers one);
      you must reply within the timeout with JSON {"response_token": "sha256=" +
      base64(HMAC-SHA256(consumer_secret, crc_token))} or the webhook is marked invalid and
      delivery stops. Use the consumer secret, not the bearer/access token. Webhooks are
      configured via the V2 Webhooks API (POST/GET/DELETE /2/webhooks with OAuth2 App-Only
      bearer auth); per-user subscriptions via POST
      /2/account_activity/webhooks/:webhook_id/subscriptions/all (OAuth 1.0a user context).
      Endpoint must be public HTTPS with no port in the URL and respond within 10 seconds.
      Requires an approved developer account; Account Activity API tiers: Pay-Per-Use
      (1 webhook, 3 subscriptions) or Enterprise (5+ webhooks, 5000+ subscriptions).
      Retry-on-failure behavior is not documented for v2 — treat delivery as at-most-once.
    testScenario:
      events:
        - tweet_create_events
        - favorite_events
        - direct_message_events

  - name: vercel
    displayName: Vercel
    docs:
      webhooks: https://vercel.com/docs/observability/webhooks
      events: https://vercel.com/docs/observability/webhooks#event-types
    notes: >
      Platform for deploying web applications. Uses x-vercel-signature header with HMAC-SHA1
      (hex encoded). Uses raw request body for signature verification.
      Common events: deployment.created, deployment.succeeded, project.created.
    testScenario:
      events:
        - deployment.created
        - deployment.succeeded

  - name: walmart
    displayName: Walmart
    docs:
      webhooks: https://developer.walmart.com/us-marketplace/docs/notifications-overview
      verification: https://developer.walmart.com/us-marketplace/docs/security-and-authenticity
      events: https://developer.walmart.com/us-marketplace/docs/get-event-types
    notes: >
      Walmart Marketplace performance webhooks. HMAC-SHA256 with a shared webhook secret.
      Headers (case-insensitive): WM_SEC.TIMESTAMP (Unix epoch seconds), WM_SEC.SIGNATURE
      (base64 HMAC-SHA256), WM_SEC.KEY_ID (optional, for rotation). The signature is NOT over
      the raw body directly: build a canonical string
      "<METHOD>\n<PATH_AND_QUERY>\n<WM_SEC.TIMESTAMP>\n<SHA256_HEX_OF_RAW_BODY>", then
      signature = base64(HMAC_SHA256(secret, string_to_sign)); compare timing-safe. Requires the
      raw body (SHA256 lowercase hex). Enforce a ~5 min replay window and dedupe by delivery id;
      return 2xx within 3s after a durable write. Do NOT implement the legacy SHA256WithRSA
      request-signing scheme (WM_SEC.AUTH_SIGNATURE / WM_CONSUMER.*) — that is for outbound seller
      calls to Walmart, not inbound webhook verification. No official SDK.
    testScenario:
      events:
        - PO_CREATED
        - INVENTORY_OOS
  - name: vercel-log-drains
    displayName: Vercel Log Drains
    docs:
      webhooks: https://vercel.com/docs/drains/reference/logs
      verification: https://vercel.com/docs/drains/security
    notes: >
      HTTP log drain deliveries (not Vercel webhooks): POST over HTTPS, logs batched per
      request as a JSON array or NDJSON (syslog no longer offered). Verification:
      x-vercel-signature header = HMAC-SHA1 hex digest of the raw request body using the
      drain's signature secret (auto-generated, editable under Team Settings > Drains) —
      SHA1, not SHA256. NOT Standard Webhooks. Endpoint handshake: when a drain is
      created/tested, the endpoint must return 200 OK with an x-vercel-verify response
      header echoing the verification token; the initial verification request is NOT
      signed. Log sources: static, lambda, edge, build, external, firewall (plus redirect
      in delivered payloads); environments production/preview; per-drain sampling rules.
      Pro/Enterprise plans only; usage-billed. Vercel emails and flags the drain as
      errored if >80% of deliveries fail or >50 failures in an hour; no per-batch retry
      schedule is documented. Configure via dashboard (Team Settings > Drains, "Logs"
      data type) or REST API POST /v1/drains with delivery {encoding: json|ndjson,
      secret, headers}; legacy /v1/log-drains and /v2/integrations/log-drains are
      deprecated. Optional gzip compression and custom auth headers. Message fields may
      truncate over 256 KB; statusCode -1 means the lambda crashed.
    testScenario:
      events:
        - lambda source, ndjson format (batched runtime function logs)
        - build source, json array format (build step stdout logs)
    sdks:
      npm: ["@vercel/sdk"]

  - name: webflow
    displayName: Webflow
    docs:
      webhooks: https://developers.webflow.com/data/docs/working-with-webhooks
      verification: https://developers.webflow.com/data/docs/working-with-webhooks#validating-request-signatures
    notes: >
      Website builder and CMS platform. Uses x-webflow-signature and x-webflow-timestamp headers
      with HMAC-SHA256 (hex encoded). Signed content format is timestamp:body. Only webhooks
      created via OAuth apps or API include signature headers; dashboard-created webhooks do not.
      Common events: form_submission, site_publish, ecomm_new_order, collection_item_created.
    testScenario:
      events:
        - form_submission
        - ecomm_new_order

  - name: wechat
    displayName: WeChat Pay
    docs:
      webhooks: https://pay.weixin.qq.com/doc/global/v3/en/4012356564
      verification: https://pay.weixin.qq.com/doc/global/v3/en/4012357149
    notes: >
      WeChat Pay APIv3 (Global/English endpoint). Notifications are signed asymmetrically
      (SHA256withRSA), NOT HMAC and NOT Standard Webhooks. Verify with the WeChat Pay platform
      public key selected by the Wechatpay-Serial header, over the message
      "{timestamp}\n{nonce}\n{body}\n" (each line terminated by \n, body = raw bytes); the
      signature (Wechatpay-Signature) is Base64. Headers: Wechatpay-Signature, Wechatpay-Timestamp,
      Wechatpay-Nonce, Wechatpay-Serial. Enforce a 5-minute timestamp tolerance. The notification
      "resource" is SEPARATELY encrypted: resource_type "encrypt-resource",
      algorithm AEAD_AES_256_GCM, with ciphertext (Base64, 16-byte auth tag appended), nonce
      (12-byte IV), and associated_data. Decrypt resource.ciphertext with the 32-byte APIv3 key
      using AES-256-GCM to recover the transaction/refund JSON — the SIGNED body is the ciphertext
      envelope, so verify first, then decrypt. Config: notify_url is set per API request (not a
      dashboard); the platform cert/public key is downloaded and rotated by serial via
      GET /v3/certificates (itself AES-GCM encrypted), with new certs published ~24h ahead — key
      your store by Wechatpay-Serial. Acknowledge with HTTP 200/204 and body
      {"code":"SUCCESS","message":"OK"}; retries run ~15s..6h over ~24h, so handle idempotently and
      re-verify the order amount before fulfilling. The Global endpoint defines ONLY
      TRANSACTION.SUCCESS, REFUND.SUCCESS, and REFUND.CLOSED — do NOT document the mainland-China-only
      REFUND.ABNORMAL. Official SDKs (wechatpay-node-v3, wechatpay-axios-plugin, wechatpayv3) exist,
      but manual verification with standard crypto libraries is used in the examples for transparency
      and testability.
    testScenario:
      events:
        - TRANSACTION.SUCCESS
        - REFUND.SUCCESS
      prompt: >
        Create a {framework} webhook handler for WeChat Pay (APIv3, Global/English endpoint). Verify
        the Wechatpay-Signature header: reconstruct the message "{timestamp}\n{nonce}\n{body}\n" from
        Wechatpay-Timestamp, Wechatpay-Nonce, and the RAW body, Base64-decode the signature, and
        verify SHA256withRSA against the WeChat Pay platform public key matched by Wechatpay-Serial.
        Enforce a 5-minute timestamp tolerance. Then decrypt the encrypted resource
        (AEAD_AES_256_GCM) with the 32-byte APIv3 key to recover the JSON, dispatch on event_type
        (TRANSACTION.SUCCESS, REFUND.SUCCESS, REFUND.CLOSED), and acknowledge with HTTP 200 and body
        {"code":"SUCCESS","message":"OK"}. Do NOT use HMAC or the Standard Webhooks spec. If you use
        any skills to help with this, add a comment noting which skill(s) you referenced.

  - name: whatsapp
    displayName: WhatsApp
    docs:
      webhooks: https://developers.facebook.com/documentation/business-messaging/whatsapp/webhooks/overview
      verification: https://developers.facebook.com/documentation/business-messaging/whatsapp/webhooks/create-webhook-endpoint/
      events: https://developers.facebook.com/documentation/business-messaging/whatsapp/webhooks/reference/messages
    notes: >
      Meta signs POST payloads with X-Hub-Signature-256: "sha256=" + lowercase hex
      HMAC-SHA256 of the raw JSON request body, keyed with the app secret; compute over the
      exact raw bytes received (Meta may escape unicode). Endpoint must also answer a GET
      verification handshake: when hub.mode=subscribe and hub.verify_token matches, respond
      200 with the hub.challenge value as the body. Does NOT follow the Standard Webhooks
      spec. All payloads are wrapped as {object: "whatsapp_business_account", entry: [{id,
      changes: [{value, field}]}]}; the "field" property names the subscription — inbound
      user messages arrive in value.messages[], outbound status updates
      (sent/delivered/read/failed) in value.statuses[], both under field "messages".
      Configure in Meta App Dashboard > WhatsApp > Configuration, or via the Graph API
      /subscriptions edge with object=whatsapp_business_account. Gotchas: requests may batch
      up to 1000 updates; payloads up to 3 MB; failed deliveries retried with decreasing
      frequency for up to 7 days and retries go to every subscribed app — dedupe by
      message/event id; valid TLS cert required; some webhooks only fire in Live mode.
      Events are subscription fields, not dotted event names.
    testScenario:
      events:
        - messages
        - message_template_status_update
    sdks:
      npm: [whatsapp]

  - name: woocommerce
    displayName: WooCommerce
    docs:
      webhooks: https://developer.woocommerce.com/docs/webhooks/
      events: https://developer.woocommerce.com/docs/webhooks/#webhook-topics
    notes: >
      E-commerce platform for WordPress. Uses X-WC-Webhook-Signature header with HMAC-SHA256
      (base64 encoded). Secret is configured per webhook in WooCommerce admin. Additional headers
      include X-WC-Webhook-Topic, X-WC-Webhook-Resource, X-WC-Webhook-Event, X-WC-Webhook-Source,
      X-WC-Webhook-ID, and X-WC-Webhook-Delivery-ID. Common events: order.created, order.updated,
      product.created, customer.created.
    testScenario:
      events:
        - order.created
        - order.updated

  - name: wix
    displayName: Wix
    docs:
      webhooks: https://dev.wix.com/docs/build-apps/develop-your-app/api-integrations/events-and-webhooks/about-webhooks
      verification: https://dev.wix.com/docs/build-apps/develop-your-app/access/authentication/verify-requests-received-from-wix
      events: https://dev.wix.com/docs/api-reference
    notes: >
      Website builder and app platform (self-hosted / self-managed apps). Each webhook's
      entire request body is a JWT signed by Wix with RS256 — there are NO signature headers
      and it is NOT Standard Webhooks. Verify the JWT with your app's per-app RSA PUBLIC KEY
      from the app dashboard (Webhooks > Get Public Key, or View ID & keys); there is no global
      JWKS. Verify against the raw, unparsed body. The official @wix/sdk verifies and decodes
      via client.webhooks.process() (AppStrategy with appId + publicKey); no official Python SDK,
      so verify manually with PyJWT. Decoded JWT is nested: outer { data, iat, exp } -> data is a
      JSON string { eventType, instanceId, data } -> inner data is a JSON string with the event
      payload (id, entityId, ...). Initial delivery timeout ~1250 ms then up to 12 retries over
      hours, so events arrive out of order and duplicated — dedupe on the event id and return 200
      fast. Common events: wix.ecom.v1.order_created, wix.ecom.v1.order_approved,
      wix.ecom.v1.order_updated, wix.ecom.v1.order_canceled.
    testScenario:
      events:
        - wix.ecom.v1.order_created
        - wix.ecom.v1.order_canceled
  - name: zendesk
    displayName: Zendesk
    docs:
      webhooks: https://developer.zendesk.com/documentation/webhooks/creating-and-monitoring-webhooks/
      verification: https://developer.zendesk.com/documentation/webhooks/verifying/
      events: https://developer.zendesk.com/api-reference/webhooks/event-types/webhook-event-types/
    notes: >
      Signature: HMAC-SHA256, base64-encoded, signed content = timestamp + raw body (no
      separator); headers X-Zendesk-Webhook-Signature and
      X-Zendesk-Webhook-Signature-Timestamp. Secret via GET
      /api/v2/webhooks/{webhook_id}/signing_secret (reset with POST; Admin Center "Reveal
      secret" also works); test webhooks use the static secret
      dGhpc19zZWNyZXRfaXNfZm9yX3Rlc3Rpbmdfb25seQ==. Does NOT follow the Standard Webhooks
      spec. Two models: event subscriptions (zen:event-type:* names across ticket, user,
      organization, article, community post, agent availability domains) vs. webhooks
      connected to triggers/automations (custom JSON payload defined in the trigger); a
      webhook subscribed to events cannot also be connected to a trigger. Raw body required
      (some requests, e.g. GET/DELETE methods, have no body). Retries: 409 up to 3x;
      429/503 honored if retry-after < 60s; 12s timeout with up to 5 retries; circuit
      breaker pauses delivery at 70% error rate or 1,000+ errors in 5 min. Endpoint auth
      options (API key, basic, bearer) are separate from and additional to signature
      verification. No official npm/pip SDK for verification — docs show inline crypto
      examples.
    testScenario:
      events:
        - zen:event-type:ticket.created
        - zen:event-type:user.created

