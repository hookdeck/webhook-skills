  - name: alipay
    displayName: Alipay
    docs:
      webhooks: https://docs.antom.com/ac/cashierpay/notifications
      verification: https://docs.alipayplus.com/alipayplus/alipayplus/api_acq_tile/signature
    notes: >
      Alipay's global products — Antom (Cashier Payment / AMS) and Alipay+ — deliver
      asynchronous notifications signed with an asymmetric RSA256 (SHA256withRSA) scheme,
      NOT HMAC and NOT Standard Webhooks. Each request carries Signature
      ("algorithm=RSA256,keyVersion=<n>,signature=<sig>"), Client-Id, and Request-Time headers.
      The signed content is exactly two lines: "<HTTP-METHOD> <URI>\n<Client-Id>.<Request-Time>.<RawBody>"
      (method + path on line one; client id, request time, and the raw body joined by single
      periods on line two). Verify with SHA256withRSA against Antom/Alipay+'s public key from the
      Dashboard. Encoding gotcha: the signature is base64URL encoded (URL-safe alphabet) and is
      often additionally percent-encoded on the wire — URL-decode, normalize, then base64-decode.
      Unusually, the acknowledgement is itself signed: respond HTTP 200 with body
      {"result":{"resultCode":"SUCCESS","resultStatus":"S","resultMessage":"Success"}} plus
      Client-Id, Response-Time, and a Signature built the same way over
      "<HTTP-METHOD> <URI>\n<Client-Id>.<Response-Time>.<Body>" using YOUR merchant private key.
      Use the raw unparsed body throughout. Notify URL is set per-call via
      paymentNotifyUrl / refundNotifyUrl. On a missing/invalid ack Antom retries ~8 times over 24h.
      Notifications distinguish via a notifyType field (PAYMENT_RESULT, CAPTURE_RESULT, REFUND_RESULT,
      AUTHORIZATION_RESULT, DISPUTE_CREATED/DISPUTE_JUDGED) plus result.resultStatus (S/F/U) — there is
      no "type" field. The legacy openapi/MAPI scheme (openapi.alipay.com, global.alipay.com:
      form-encoded params with sign & sign_type=RSA2, reply "success") is a distinct older vintage
      and is not what this skill implements.
    testScenario:
      events:
        - PAYMENT_RESULT
        - REFUND_RESULT

  - name: alchemy
    displayName: Alchemy
    docs:
      webhooks: https://www.alchemy.com/docs/reference/webhooks-overview
      verification: https://www.alchemy.com/docs/reference/notify-api-quickstart#webhook-signature--security
    notes: >
      Web3 developer platform. Alchemy Notify webhooks push real-time onchain events. Verify with the
      X-Alchemy-Signature header: HMAC-SHA256 (hex) over the RAW request body (never the JSON-reparsed
      body), keyed with the per-webhook signing key (copied from the top-right of the webhook's detail
      page in the Notify dashboard, or fetched via the Notify API). Single header, no webhook-id/timestamp
      — NOT Standard Webhooks compliant. Compare with a timing-safe equality check. The signing key is
      per-webhook, distinct from the app Auth Token used for the Notify API / alchemy-sdk. The alchemy-sdk
      npm package (NotifyNamespace) manages webhook CRUD but does NOT provide signature verification —
      implement HMAC manually. Webhooks are scoped per chain/network. Retries use exponential backoff up
      to ~10 min (Free/PAYG) or ~1 hr (Enterprise). Optional IP allowlist: 54.236.136.17, 34.237.24.169.
      Webhook type enum: ADDRESS_ACTIVITY, MINED_TRANSACTION, DROPPED_TRANSACTION, NFT_ACTIVITY,
      NFT_METADATA_UPDATE, GRAPHQL (= Custom Webhook).
    sdks:
      npm:
        - "alchemy-sdk"
    testScenario:
      events:
        - ADDRESS_ACTIVITY
        - MINED_TRANSACTION

