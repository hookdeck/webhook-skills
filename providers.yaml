      (cache keys by kid). Headers: X-Neon-Signature (detached JWS "header..signature" with an EMPTY
      middle section), X-Neon-Signature-Kid, X-Neon-Timestamp (Unix ms), X-Neon-Event-Type,
      X-Neon-Event-Id (idempotency), X-Neon-Delivery-Attempt (1-3). CRITICAL gotcha: the signing
      input uses DOUBLE base64url encoding — signingInput = header + "." +
      base64url(timestamp + "." + base64url(rawBody)); a naive "{timestamp}.{body}" reconstruction
      fails. Verify against the RAW body bytes and enforce a timestamp tolerance (e.g. 5 min).
      Events: send.otp (blocking), send.magic_link (blocking), user.before_create (blocking),
      user.created (non-blocking), phone_number.verified (non-blocking). Blocking events pause the
      auth flow until a 2xx — respond fast. No off-the-shelf verification SDK: use node:crypto (Node)
      or cryptography/PyJWT (Python).
    testScenario:
      events:
        - user.created
        - user.before_create
      prompt: >
        Create a {framework} webhook handler for Neon Auth. Verify the EdDSA (Ed25519) detached JWS
        signature: parse X-Neon-Signature ("header..signature"), fetch the public key from
        ${NEON_AUTH_URL}/.well-known/jwks.json by X-Neon-Signature-Kid, reconstruct the signing input
