        - APPLICATION_AUTHORIZED
        - ENTITLEMENT_CREATE

  - name: ebay
    displayName: eBay
    docs:
      webhooks: https://developer.ebay.com/api-docs/commerce/notification/overview.html
      verification: https://developer.ebay.com/marketplace-account-deletion
      events: https://developer.ebay.com/api-docs/commerce/notification/resources/topic/methods/getTopics
    notes: >
      eBay Notification API (Commerce). Does NOT use HMAC and does NOT follow Standard
      Webhooks. Two mechanisms: (1) Endpoint challenge on destination save — eBay sends
      GET <endpoint>?challenge_code=... and you must return HTTP 200 with JSON
      {"challengeResponse": "<hex>"} where hex = SHA-256(challengeCode + verificationToken
      + endpoint); the concatenation order is mandatory and endpoint must be the exact URL
      eBay calls. verificationToken is 32-80 chars, [A-Za-z0-9_-]. (2) Per-notification
      ECDSA signature — the x-ebay-signature header is Base64-encoded JSON {alg, kid,
      signature, digest}; use kid to fetch the public key via getPublicKey
      (GET /commerce/notification/v1/public_key/{kid}, needs an OAuth app token), then
      verify the Base64 ECDSA signature (digest SHA-1) over the RAW request body. Cache the
      public key ~1 hour keyed by kid. Ack with a 2xx (204) within the retry window or the
      app keyset can be disabled. Official Node SDK: event-notification-nodejs-sdk
      (EventNotificationSDK.process / validateEndpoint). Topic arrives at metadata.topic;
      the required topic is MARKETPLACE_ACCOUNT_DELETION (configure in Developer Portal →
      Application Keys → Alerts and Notifications), other topics via the Notification API
      (topics + destinations + subscriptions).
    testScenario:
      events:
        - MARKETPLACE_ACCOUNT_DELETION
        - ITEM_PRICE_REVISION
  - name: docusign
    displayName: DocuSign
    docs:
      webhooks: https://developers.docusign.com/platform/webhooks/connect/
      verification: https://developers.docusign.com/platform/webhooks/connect/validate/
      events: https://developers.docusign.com/platform/webhooks/connect/event-triggers/
    notes: >
      DocuSign Connect signs webhooks with HMAC-SHA256 over the raw request body,
      base64-encoded, sent in X-DocuSign-Signature-1..N headers (one per active secret,
      up to 100 keys; x-authorization-digest names the algorithm; only one header needs
      to match). Does NOT follow the Standard Webhooks spec. Alternative/additional
      security: HTTP Basic auth on the listener URL, mutual TLS, and X.509 message
      signing. Configure in eSignature Admin (Settings > Connect) as account-level
      configurations, or per-envelope via the eventNotification API; use JSON with
      deliveryMode SIM (Send Individual Messages) and eventData version restv2.1 —
      legacy XML SIM was retired May 2023. Gotchas: verify against the exact raw body;
      envelope documents/recipient data only included if eventData.include options are
      enabled; failed deliveries (HTTP >= 400) retried with exponential backoff starting
      ~5 minutes and doubling for up to 15 days, with manual republish via API/admin
      Failures log. SDKs manage Connect configs and eventNotification but provide no
      signature-verification helper.
    testScenario:
      events:
        - envelope-sent
        - envelope-completed
        - recipient-completed
    sdks:
      npm: [docusign-esign]
      pip: [docusign-esign]

  - name: elevenlabs
    displayName: ElevenLabs
    docs:
      webhooks: https://elevenlabs.io/docs/overview/administration/webhooks
    notes: >
      Voice AI platform. Uses Standard Webhooks (Svix) format with headers:
      webhook-id, webhook-timestamp, webhook-signature. Secret format is whsec_<base64>.
      HMAC-SHA256 with base64 encoding.
    testScenario:
      events:
        - voice.generation.completed
        - voice.clone.completed

  - name: enode
    displayName: Enode
    docs:
      webhooks: https://developers.enode.com/docs/webhooks
      verification: https://developers.enode.com/docs/webhooks
      events: https://developers.enode.com/api/reference#webhooks
    notes: >
      Unified API for EVs, chargers, home batteries, HVAC, solar inverters and smart meters.
      Signs each delivery with HMAC-SHA1 (NOT SHA256) — the signature is in the x-enode-signature
      header formatted "sha1=<hex-digest>" (lowercase hex) computed over the RAW UTF-8 JSON body
      keyed with the per-webhook secret. Does NOT follow the Standard Webhooks (Svix) spec — no
      webhook-id/webhook-timestamp headers, no timestamp in the signed content. IMPORTANT: the
      secret is a pseudorandom value of at least 128 bits that YOU generate and supply in the
      `secret` field when creating the webhook (POST /webhooks with url, secret, events array,
      optional authentication headerName/headerValue) — Enode never returns it. The request body is
      a JSON ARRAY of event objects, each with `event`, `createdAt`, and `version` — iterate the
      array rather than treating it as a single object. Event names are colon-delimited
      (user:vehicle:updated, user:charger:updated, user:battery:updated, user:vehicle:discovered,
      user:credentials:invalidated, system:heartbeat, enode:webhook:test, ...). The x-enode-delivery
      header carries a unique delivery ID. Gotchas: MUST verify against the raw body (parsing breaks
      the HMAC); deliveries time out after 5s; production retries over 24h with increasing intervals
      then deletes pending events and marks the webhook inactive; sandbox marks inactive after ~5 min
      of failures. Reactivate via the Test (POST /webhooks/{id}/test) or Update (PUT /webhooks/{id})
      endpoints. No official SDKs — verify manually. Set ENODE_WEBHOOK_SECRET env var.
    testScenario:
      events:
        - user:vehicle:updated
        - user:charger:updated
      prompt: >
        Create a {framework} webhook handler for Enode. Verify the x-enode-signature header by
        computing HMAC-SHA1 (not SHA256) over the RAW request body with the per-webhook secret,
        hex-encoded, and comparing the value after the "sha1=" prefix using a timing-safe comparison.
        The body is a JSON array of events — iterate it and dispatch on each event's colon-delimited
        `event` name (e.g. user:vehicle:updated, user:charger:updated), returning 200 quickly. If you
        use any skills to help with this, add a comment noting which skill(s) you referenced.

  - name: ethoca
    displayName: Ethoca
    docs:
      webhooks: https://developer.mastercard.com/ethoca-alerts-for-merchants/documentation/api-reference/push-api-ref/
      verification: https://developer.mastercard.com/ethoca-alerts-for-merchants/documentation/api-basics/
    notes: >
      Ethoca (a Mastercard company) delivers early fraud and dispute Alerts to merchants. The
      Alerts Push API HTTPS-POSTs JSON to an endpoint registered MANUALLY by the Ethoca Customer
      Delivery Team (no self-serve UI); a legacy pull/queue model also exists. CRITICAL: there is
      NO per-message HMAC/signature header on Push API alerts — do NOT invent an X-Ethoca-Signature
      and this is NOT Standard Webhooks. Trust is established by (1) mutual TLS / MSSL — Ethoca
      presents a client certificate chaining to the Entrust CA, enforced at the TLS terminator /
      load balancer — and (2) HTTP Basic Auth: Ethoca sends Authorization: Basic
      base64(username:password) on every POST using credentials agreed during onboarding. An IP
      allowlist of Ethoca egress ranges is a recommended third layer. The handler verifies the Basic
      Auth credentials with a timing-safe comparison (split the decoded value on the FIRST colon —
      passwords may contain ':'); there is no body signature, so ordinary JSON parsing is safe.
      Set ETHOCA_WEBHOOK_USERNAME and ETHOCA_WEBHOOK_PASSWORD. Two alert categories carried in the
      `alertType` field: fraud and dispute — the exact literal enum values are NOT published publicly
      and have historically been numeric, so normalize (e.g. {"1":"fraud","2":"dispute"}) against the
      onboarding schema. Respond 200 to acknowledge; report outcomes separately via the OUTBOUND
      Outcome API, which uses OAuth 1.0a signed with a PKCS#12 (.p12) keystore and the
      mastercard-oauth1-signer helper (npm + pip) — a different scheme from the inbound Basic Auth.
      Do NOT conflate with the sibling product Ethoca Consumer Clarity, which uses an
      "Authorization: ETHOCA-SHA1 KeyRef=<id>,Signature=<base64url>" HMAC header. No Ethoca-specific
      webhook SDK exists.
    testScenario:
      events:
        - fraud
        - dispute
      prompt: >
        Create a {framework} webhook handler for Ethoca (Mastercard) Alerts Push API. There is NO
        HMAC/signature header — authenticate each delivery by verifying the HTTP Basic Auth
        credentials (Authorization: Basic base64(username:password)) with a timing-safe comparison,
        splitting the decoded value on the first colon, and return 401 on failure. Note in comments
        that transport security is mutual TLS (MSSL, Entrust CA) configured at the load balancer.
        Parse the JSON alert and dispatch on `alertType` for the fraud and dispute categories,
        returning 200 to acknowledge. If you use any skills to help with this, add a comment noting
        which skill(s) you referenced.

  - name: exact-online
    displayName: Exact Online
    docs:
      webhooks: https://support.exactonline.com/community/s/article/All-All-DNO-Content-webhooksc?language=en_GB
      verification: https://support.exactonline.com/community/s/article/All-All-DNO-Content-webhookstut?language=en_GB
    notes: >
      Cloud accounting/ERP platform. Does NOT use the Standard Webhooks spec and sends
      NO signature header — the signature is the HashCode field INSIDE the JSON body:
      {"Content":{...},"HashCode":"<hex>"}. Verify by computing HMAC-SHA256 over the raw
      JSON of the Content node (the exact substring between {"Content": and ,"HashCode":,
      braces included — do NOT re-serialize the parsed object), keyed with the app's
      Webhook secret from the App Center (NOT the OAuth client secret), hex-encoded and
      UPPERCASED, then compare timing-safe to HashCode. Subscribe with an OAuth2 bearer via
      POST /api/v1/{division}/webhooks/WebhookSubscriptions passing Topic + CallbackURL;
      one subscription per topic per app per division. Payloads are thin — Content carries
      only Topic, Action (Create/Update/Delete), Key (entity GUID), Division, ClientId — so
      call the REST API to fetch the full record. Return 2xx quickly; Exact retries failures.
      GoodsDeliveries supports near-instant delivery via the IsInstant flag. No official SDK.
      *** SIGNING SCHEME VERIFIED (Jul 2026, live Accounts/Update delivery): HMAC-SHA256 over
      the raw substring between {"Content": and ,"HashCode":, hex, UPPERCASED, reproduced the
      delivered HashCode exactly. Lowercase hex and base64 both failed, so uppercasing is
      required. Caveat: Exact sends compact JSON, so raw-substring and re-serialized-compact
      forms were byte-identical for that delivery and both matched — keep the raw substring,
      it is the only form that survives whitespace or key reordering. ***
      *** CALLBACK VALIDATION: ~1s after the subscription is created Exact sends an EMPTY POST
      (content-length: 0) to the callback. Handlers MUST acknowledge it with 2xx rather than
      running verification and 401ing, or the subscription can be left unvalidated. ***
      *** DELIVERY IS BATCHED: subscriptions default to IsInstant false and a change observed
      with EventCreatedOn 17:20:55 arrived several minutes later. Drive freshness logic off
      Content.EventCreatedOn, not receipt time. ***
      Content also carries ExactOnlineEndpoint (a ready-made API URL for the changed record —
      use it instead of hand-building the fetch URL) and EventCreatedOn.
      Confirmed topics: Accounts, Items, StockPositions, FinancialTransactions,
      GoodsDeliveries, Contacts (docs list ~30 topics).
    testScenario:
      events:
        - Accounts
        - Items

  - name: tokenio
    displayName: Token.io
    docs:
      webhooks: https://docs.token.io/products/tpp/integration-considerations/webhooks
      verification: https://docs.token.io/products/tpp/integration-considerations/webhooks
    notes: >
      Open banking / account-to-account (A2A) payments platform. Uses an ASYMMETRIC
      Ed25519 signature — NOT HMAC and NOT Standard Webhooks/JWS. Two headers arrive on
      every delivery: token-signature (the Ed25519 signature of the EXACT raw POST body,
      base64url) and token-event (the event type, e.g. PAYMENT_STATUS_CHANGED — a separate
      header, not a body field). Verify with your member's Ed25519 PUBLIC key from the Token
      Dashboard (Settings > Member Information), which is base64url with no padding (the raw
      32-byte key = the `x` value of an OKP/Ed25519 JWK). There is NO shared secret. The
      signed message is the raw body bytes — capture them before JSON parsing; any
      re-serialization (key reorder/whitespace) breaks verification. Node verifies with
      built-in crypto (createPublicKey JWK + crypto.verify(null, ...)); Python with the
      cryptography package (Ed25519PublicKey.from_public_bytes + verify). Subscribe with
      PUT /webhook/config {"config":{"type":[...],"url":"..."}}; read via GET, remove via
      DELETE; ONE config per member/account (a second PUT replaces it). Endpoint MUST return
      200; non-200 retried with exponential backoff (~10, 30, 70, 150 min) for up to 72h
      (~10 attempts) — handle idempotently. PAYMENT_STATUS_CHANGED carries a `payment` object
      with normalized status (INITIATION_PROCESSING, INITIATION_COMPLETED, INITIATION_REJECTED,
      SUCCESS) plus raw ISO 20022 bankPaymentStatus. Official npm SDK `token-io` is a broad API
      client (use it to subscribe), NOT a webhook verifier — verify manually. No pip SDK.
    testScenario:
      events:
        - PAYMENT_STATUS_CHANGED
        - REFUND_STATUS_CHANGED
  - name: favro
    displayName: Favro
    docs:
      webhooks: https://favro.com/developer/
      verification: https://favro.com/developer/#webhook-signatures
    notes: >
      Planning / collaboration (Kanban) platform. Does NOT use the Standard Webhooks spec.
      The signature is in the X-Favro-Webhook header (NOT X-Favro-Backend-Identifier, an
      unrelated internal header). Value = base64(HMAC-SHA1(key = webhook secret,
      msg = payloadId + the URL exactly as provided at webhook creation)). The signed
      message is payloadId (a base64 string in the body) concatenated with the target URL —
      NOT the raw request body — and the algorithm is SHA1, base64-encoded (not SHA256/hex).
      *** SCHEME QUOTED VERBATIM from favro.com/developer (Jul 2026): "The header is a base64
      digest of an HMAC-SHA1 hash. The hashed content is the concatenation of the payloadId
      and the URL exactly as it was provided during webhook creation. The key used to sign
      this text is the secret you entered when setting up the webhook." ***
      Store the registered URL (FAVRO_WEBHOOK_URL) byte-identically or every signature fails —
      the #1 gotcha. Webhooks are created per board/widget via POST create-webhook (name,
      widgetCommonId, postToUrl, secret) or via Favro UI automations. On creation Favro sends
      a Ping the endpoint must accept (2xx) to validate setup; the ping carries a payloadId and
      is signed with the same scheme: {"payloadId":"<base64=>","action":"ping","hookId":"<id>",
      "hook":{"url":"<postToUrl>"}}. Payloads carry an `action` field; the object type is
      inferred from the card/comment object present (handlers dispatch on <type>.<action>):
      card created/committed/moved/updated/deleted, comment created/updated/deleted.
      UI-automation-triggered webhooks send partial data with no pre-update state. Retry
      behavior is not documented. No official SDK (community Node @bscotch/bravo implements it).
    testScenario:
      events:
        - card.created
        - card.moved

  - name: frontapp
    displayName: Front
    docs:
      webhooks: https://dev.frontapp.com/docs/webhooks-1
      verification: https://dev.frontapp.com/docs/application-webhooks
      events: https://dev.frontapp.com/reference/events
    notes: >
      Shared inbox / customer communication platform. Front has TWO webhook systems.
      Application webhooks (partner / Core API apps — the modern system this skill targets)
      sign with X-Front-Signature = base64(HMAC-SHA256(key = app signing key,
      msg = X-Front-Request-Timestamp value + ":" + RAW request body)). Always use the raw
      body. On subscription Front sends a validation request with an X-Front-Challenge header;
      echo the value within 10s as a 200 (text/plain, form challenge=<v>, or JSON
      {"challenge":"<v>"}). Retries up to 3x on 408/429/500/timeout, then auto-disables. NOT
      Standard Webhooks. The older "rule webhooks" (settings > rule action) differ: HMAC-SHA1
      (base64) over the body only, keyed with the Webhooks app "API Secret", 5s timeout, no
      retries — do not conflate the two. Event name is in the top-level `type` field:
      inbound, outbound, move, assign, archive, tag, comment, message_bounce_error, etc. No
      official server SDK (front-sdk npm / py-front pip are community projects).
    testScenario:
      events:
        - inbound
        - assign
  - name: fireblocks
    displayName: Fireblocks
    docs:
      webhooks: https://developers.fireblocks.com/reference/webhooks-v2
      verification: https://developers.fireblocks.com/reference/validating-webhooks
      events: https://developers.fireblocks.com/reference/webhooks-structures-eventtypes-transaction
    notes: >
      Two signature schemes exist. Legacy (webhooks v1): "Fireblocks-Signature" header,
      base64-encoded RSA PKCS#1 v1.5 signature over the SHA-512 hash of the raw request
      body, verified against a static per-environment RSA public key published in the docs
      (separate PEM keys for US, EU/EU2, and sandbox). New (webhooks v2):
      "Fireblocks-Webhook-Signature" header carrying a detached JWS (RS512); the kid maps to
      auto-rotated keys at regional JWKS endpoints (e.g.
      https://keys.fireblocks.io/.well-known/jwks.json, cache max-age 3600). Both headers
      were sent during the migration period; v1 deprecation was slated for March 2026 —
      RE-VERIFY current state before shipping. Does NOT follow the Standard Webhooks spec.
      Verify against raw body bytes. Configure in Console (Developer Center) or via the
      Webhooks v2 API; v2 adds event subscriptions and resend of events up to 30 days.
      Retries: expects HTTP 200; 5xx/429/408 retried with exponential backoff at
      10/30/120/300/900/1800/3600/7200/14400s, max 10 attempts. Official SDKs cover webhook
      management but do not ship signature-verification helpers — docs provide
      TypeScript/Python/Go/Java verification snippets. v2 event names are dotted lowercase
      (transaction.created, transaction.status.updated); v1 names are uppercase
      (TRANSACTION_CREATED).
    testScenario:
      events:
        - transaction.created
        - transaction.status.updated
    sdks:
      npm: ["@fireblocks/ts-sdk", "fireblocks-sdk"]
      pip: ["fireblocks", "fireblocks-sdk"]
  - name: facebook
    displayName: Facebook
    docs:
      webhooks: https://developers.facebook.com/docs/graph-api/webhooks
      verification: https://developers.facebook.com/docs/graph-api/webhooks/getting-started
      events: https://developers.facebook.com/docs/graph-api/webhooks/reference
    notes: >
      Verify POST deliveries via X-Hub-Signature-256 header: "sha256=" prefix followed by a
      hex-encoded HMAC-SHA256 of the RAW request body keyed with the App Secret (legacy
      X-Hub-Signature carries SHA1). Compute over the raw bytes before any JSON parsing —
      Meta signs an escaped-unicode form of the payload, so re-serialized JSON will not match.
      Endpoint registration requires a GET handshake: Meta sends hub.mode=subscribe,
      hub.verify_token (must match the Verify Token set in App Dashboard > Webhooks), and
      hub.challenge, which must be echoed back with 200. Does NOT follow the Standard
      Webhooks spec. Payloads are JSON with {object, entry[]} and may batch up to 1000
      updates per POST — handle each entry individually. Respond 200 OK quickly; failed
      deliveries are retried immediately then with decreasing frequency for 36 hours, after
      which they are dropped. Optional mTLS (Meta client cert CN
      client.webhooks.fbclientcerts.com). Apps in Development mode only receive test
      notifications; Page subscriptions also need pages_manage_metadata granted via
      /{page-id}/subscribed_apps. Events are (object, field) pairs, not dotted names.
    testScenario:
      events:
        - page.feed
        - page.messages
        - page.leadgen
    sdks:
      npm: [facebook-nodejs-business-sdk]
      pip: [facebook-business]

  - name: flexport
    displayName: Flexport
    docs:
      webhooks: https://apidocs.flexport.com/v2/tag/Webhook-Endpoints/
      verification: https://developers.flexport.com/faq/webhooks/
      events: https://apidocs.flexport.com/v2/tag/Webhook-Endpoints/
    notes: >
      Freight forwarding and logistics platform (classic Flexport v2 API). Signs each
      delivery with an HMAC of the RAW request body keyed on a per-endpoint secret token,
      sent in two GitHub/X-Hub-style headers: X-Hub-Signature-256 (HMAC-SHA256, "sha256="
      + hex digest, RECOMMENDED) and X-Hub-Signature (HMAC-SHA1, "sha1=" + hex, legacy,
      being deprecated). Compute over the raw bytes before JSON parsing; use timing-safe
      compare. NOT the Standard Webhooks spec. The payload is a Flexport Event object;
      dispatch on the `type` field, a milestone identifier in /object#event format
      (e.g. /shipment#created, /shipment_leg#departed) — NOT object.event. The affected
      object is under `data` (resource, shipment, location, containers, exception).
      Endpoints and their secret token are configured in the account Settings UI (no
      public POST /webhook_endpoints). Endpoint must return HTTP 200 (respond fast, process
      async; Flexport retries otherwise). Some milestones are "available upon request".
