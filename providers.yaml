        - wake hook

  - name: orb
    displayName: Orb
    docs:
      webhooks: https://docs.withorb.com/integrations-and-exports/webhooks
      summary_webhooks: https://docs.withorb.com/integrations-and-exports/summary-webhooks
      api: https://docs.withorb.com/api-reference
    notes: >
      Usage-based billing platform (Orb / withorb.com). Uses HMAC-SHA256 in hex with
      a `v1=` prefix in the `X-Orb-Signature` header (e.g. `X-Orb-Signature: v1=<hex>`).
      Timestamp delivered separately in `X-Orb-Timestamp` (ISO 8601). Signed content
      format is the literal string `v1:{X-Orb-Timestamp}:{raw-body}` — concatenate
      version literal "v1", colon, ISO timestamp, colon, raw body bytes; HMAC-SHA256
      with the per-endpoint signing secret (configured in Orb dashboard, one secret
      per webhook endpoint, NOT the account API key). Always pass the raw request
      body — don't JSON.parse and re-stringify before verifying.

      No documented replay tolerance — Orb recommends comparing X-Orb-Timestamp to a
      threshold the integrator picks. Recommend a 5-minute window in handlers plus
      idempotency keyed on the event `id` field for at-least-once delivery safety.

      Common events span customer lifecycle (`customer.created`,
      `customer.credit_balance_dropped`, `customer.accounting_sync_succeeded`),
      subscriptions (`subscription.created`, `subscription.started`,
      `subscription.ended`, `subscription.plan_changed`, `subscription.edited`,
      `subscription.usage_exceeded`), invoices (`invoice.issued`,
      `invoice.payment_succeeded`, `invoice.payment_failed`, `invoice.edited`),
      and data exports (`data_exports.transfer_success`).

      "Summary webhooks" are an opt-in variant covering the same event types with
      smaller payloads (line_items omitted from invoices; customer/plan minified
      to identification fields only). Same signature scheme; consumers should fetch
      full resources via API when detail is needed.

      Official SDKs: orb-billing (npm + PyPI; same package name on both registries).
      Neither SDK exposes a Stripe-style unwrap()/constructEvent() helper at the
      time of writing — manual HMAC verification is the canonical path.
    sdks:
      npm:
        - orb-billing
      pip:
        - orb-billing
    testScenario:
      events:
        - invoice.payment_succeeded
        - subscription.created

  - name: lithic
    displayName: Lithic
    docs:
      webhooks: https://docs.lithic.com/docs/events-api
      verification: https://docs.lithic.com/docs/events-api#verifying-webhooks
      events: https://docs.lithic.com/docs/types-of-events
    notes: >
      Card issuing and money-movement platform. Webhooks implement the Standard
      Webhooks spec (powered by Svix). Each delivery carries webhook-id,
      webhook-timestamp, and webhook-signature headers (svix-* aliases are also
      sent). Signature is HMAC-SHA256, base64-encoded, over the string
      `{webhook-id}.{webhook-timestamp}.{rawBody}`; the signing secret is
      per-subscription and prefixed whsec_ (base64-decode the part after the
      prefix to form the HMAC key). The signature header is a space-delimited
      list of `v1,<base64sig>` entries. Reject timestamps outside a ~5-minute
      tolerance. Always verify the raw request body — don't JSON.parse and
      re-stringify first.

      The official SDKs verify AND parse in one call:
      lithic.webhooks.unwrap(rawBody, headers, secret) (Node) and
      client.webhooks.unwrap(body, headers, secret=...) (Python; needs the
      optional standardwebhooks package via `pip install "lithic[webhooks]"`).
      verifySignature/verify_signature verify without parsing. Event objects
      carry an `event_type` field in resource.action form (e.g. card.created,
      card_transaction.updated, payment_transaction.created, dispute.updated).
      Subscriptions are per-event-type and secrets rotate in the Lithic
      dashboard; failed deliveries retry with backoff and auto-disable after 5
      continuous days of failures.

      Official SDKs: lithic (npm + PyPI; same package name on both registries).
    sdks:
      npm:
        - lithic
      pip:
        - lithic
    testScenario:
      events:
        - card.created
        - payment_transaction.created
  - name: oura
    displayName: Oura
    docs:
      webhooks: https://cloud.ouraring.com/v2/docs#tag/Webhook-Subscription-Routes
      verification: https://cloud.ouraring.com/v2/docs#tag/Webhook-Subscription-Routes
      api: https://cloud.ouraring.com/v2/docs
    notes: >
      Oura Ring health data platform. Custom scheme (NOT Standard Webhooks) with
      two-part security. (1) Subscription handshake: on create/update/renew Oura sends
      a GET to callback_url with query params `verification_token` and `challenge`; the
      endpoint checks the token matches and responds 200 with JSON
      `{"challenge": "<value>"}`. (2) Per-event: POST events carry headers
      `x-oura-signature` and `x-oura-timestamp`. Verify
      HMAC-SHA256(key=client_secret, msg=timestamp + rawBody), hex digest UPPERCASE,
      compared to `x-oura-signature`. Oura's docs show `timestamp + JSON.stringify(body)`;
      use the raw request body instead — it is byte-identical and avoids cross-language
      JSON serialization differences (Python `json.dumps` inserts spaces).

      Subscriptions managed via POST/GET/PUT/DELETE `/v2/webhook/subscription` (+ PUT
      `/v2/webhook/subscription/renew/{id}`), authed with `x-client-id` + `x-client-secret`
      headers. Create body requires `callback_url`, `verification_token`, `event_type`,
      `data_type` — one subscription per data_type+event_type combo. Payloads are thin
      (`event_type`, `data_type`, `object_id`, `event_time`, `user_id`); fetch the full
      record via API using `object_id`. Subscriptions have an `expiration_time` and must
      be renewed. Respond 2xx within 10s; 10 retries on 4xx/5xx/timeout; respond 410 to
      auto-cancel.

      data_type enum (17): tag, enhanced_tag, workout, session, sleep, daily_sleep,
      daily_readiness, daily_activity, daily_spo2, sleep_time, rest_mode_period,
      ring_configuration, daily_stress, daily_cardiovascular_age, daily_resilience,
      vo2_max, meal. event_type: create, update, delete. No official SDK.
    testScenario:
      events:
        - sleep
        - daily_readiness

  - name: paddle
    displayName: Paddle
    docs:
      webhooks: https://developer.paddle.com/webhooks/overview
      verification: https://developer.paddle.com/webhooks/signature-verification
      api: https://developer.paddle.com/api-reference/overview
    notes: >
      Payment and subscription platform. Uses Paddle-Signature header with HMAC-SHA256.
      Signature format includes timestamp (ts) and hash (h1). Secret starts with pdl_ntfset_.
      Official SDKs: @paddle/paddle-node-sdk (Node), paddle-python-sdk (Python).
    sdks:
