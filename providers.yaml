  - name: paymob
    displayName: Paymob
    docs:
      webhooks: https://developers.paymob.com/paymob-docs/developers/webhook-callbacks-and-hmac
      verification: https://developers.paymob.com/paymob-docs/developers/webhook-callbacks-and-hmac/hmac/hmac-transaction-callback
    notes: >
      MENA payments platform. NOT Standard Webhooks and NOT signed over the raw body.
      Paymob computes HMAC-SHA512 over a fixed, ordered concatenation of 20 selected
      transaction fields (no separators), hex-encoded, delivered as the `hmac` QUERY
      parameter (?hmac=<hex>) — there is no signature header. Field order:
      amount_cents, created_at, currency, error_occured, has_parent_transaction,
      obj.id, integration_id, is_3d_secure, is_auth, is_capture, is_refunded,
      is_standalone_payment, is_voided, order.id, owner, pending, source_data.pan,
      source_data.sub_type, source_data.type, success. Booleans concatenate as
      lowercase "true"/"false". HMAC secret comes from Dashboard → Settings →
      Account Info → HMAC. Two callback kinds per integration: Transaction Processed
      Callback (server-to-server POST, JSON, nested keys obj.id/order.id/source_data.*)
      and Transaction Response Callback (client redirect GET, flattened query params
      id/order_id/source_data_pan/...). Single callback `type` value "TRANSACTION" —
      no discrete event names; read state from booleans success/error_occured/pending/
      is_refunded/is_voided/is_capture/is_auth. No usable first-party SDK verifier;
      roll your own HMAC. Gotchas: SHA512 (not 256), hex (not base64), exact field
      ordering, POST vs GET key-path differences.
    testScenario:
      events:
        - TRANSACTION.success
        - TRANSACTION.refunded

  - name: paypal
    displayName: PayPal
    docs:
      webhooks: https://developer.paypal.com/api/rest/webhooks/
      verification: https://developer.paypal.com/api/rest/webhooks/rest/
      events: https://developer.paypal.com/api/rest/webhooks/event-names/
    notes: >
      Payments platform. Uses certificate-based RSA-SHA256 signature verification — not
      HMAC. Required request headers: paypal-transmission-id, paypal-transmission-time,
      paypal-transmission-sig (the signature), paypal-cert-url (public cert location,
      must resolve to a paypal.com domain), and paypal-auth-algo (e.g. "SHA256withRSA").
      Two verification paths:
      (1) Recommended postback: POST the captured headers, your webhook_id, and the
      raw event body to PayPal's /v1/notifications/verify-webhook-signature endpoint
      (requires an OAuth access token). PayPal returns verification_status.
      (2) Offline self-verify: download the cert from paypal-cert-url, compute CRC32
      of the raw body, build the message
      transmissionId|transmissionTime|webhookId|crc32(body), and verify the signature
      against the cert's public key with RSA-SHA256. Common events:
      PAYMENT.CAPTURE.COMPLETED, PAYMENT.SALE.COMPLETED, PAYMENT.CAPTURE.REFUNDED,
      BILLING.SUBSCRIPTION.CREATED, CHECKOUT.ORDER.APPROVED.
    testScenario:
      events:
        - PAYMENT.CAPTURE.COMPLETED
        - BILLING.SUBSCRIPTION.CREATED

  - name: pipedrive
    displayName: Pipedrive
    docs:
      webhooks: https://pipedrive.readme.io/docs/guide-for-webhooks-v2
      verification: https://developers.pipedrive.com/docs/api/v1/Webhooks
    notes: >
      CRM platform. Webhooks are NOT signed — no HMAC, no signature header, not
      Standard Webhooks compliant. Security is HTTP Basic Auth only: set
      http_auth_user / http_auth_password when creating the webhook and Pipedrive
      sends them in the Authorization header of every delivery; verify with a
      timing-safe comparison. HTTPS required (self-signed certs unsupported).
      Event types are "action.entity" (e.g. create.deal, change.person,
      delete.activity) — build the string from meta.action + meta.entity in the
      payload. Actions: create, change, delete, * (wildcard). Entities: activity,
      deal, lead, note, organization, person, pipeline, product, stage, user
      (v2 added lead), plus board, deal_product, phase, project, task. Create via
      POST /v1/webhooks with event_action + event_object + version=2.0 (default).
      Payload has meta, data (current state), previous (changed fields on change,
      last state on delete, null on create). Retries at 3/30/150s (max 4 attempts,
      any 2XX = success); 10 first-attempt failures -> 30-min suspension; no
      successful delivery for 3 consecutive days auto-deletes the webhook. Node
      SDK "pipedrive" is an API client (WebhooksApi.addWebhook) — it does NOT
      verify deliveries.
    sdks:
      npm:
        - pipedrive
    testScenario:
      events:
        - create.deal
        - change.person
  - name: persona
    displayName: Persona
    docs:
      webhooks: https://docs.withpersona.com/webhooks
      verification: https://docs.withpersona.com/webhooks-best-practices#checking-signatures
      events: https://docs.withpersona.com/events
    notes: >
      Verify via Persona-Signature header (casing varies): "t=<unix_ts>,v1=<hex>",
      HMAC-SHA256 over "{t}.{raw body}" keyed with the webhook secret (wbhsec_...
      prefix, per-webhook, revealed in Dashboard > Webhooks). During secret rotation the
      header carries two space-separated t/v1 pairs — accept if ANY v1 matches; use
      timing-safe compare and the raw body. Stripe-style scheme; does NOT follow the
      Standard Webhooks spec. Payloads are JSON:API envelopes: event name at
      data.attributes.name, full affected object at data.attributes.payload.data (same
      schema as API responses); each webhook is pinned to a configurable API version.
      Retries: 5s response timeout, then up to 7 more attempts with exponential backoff;
      200/201/202/204 count as success. Ordering not guaranteed and duplicates possible
      — process idempotently, order by data.attributes.created-at; events retained 30
      days with manual Dashboard redelivery. No documented timestamp tolerance — replay
      checking is up to the consumer. Event subscription is per-event-type at webhook
      creation; report events use slash form (report/<type>.<action>). IP allowlisting
      available. No official server-side SDK (npm persona is the frontend embedded
      inquiry SDK).
    testScenario:
      events:
        - inquiry.completed
        - inquiry.approved
        - verification.passed
  - name: recharge
    displayName: Recharge
    docs:
      webhooks: https://docs.getrecharge.com/docs/webhooks-overview
      verification: https://docs.getrecharge.com/docs/webhooks-overview#validating-webhooks
      events: https://developer.rechargepayments.com/2021-11/webhooks_endpoints/webhooks_available
    notes: >
      Two signature schemes, both keyed with the API Client Secret (NOT the API token;
      Dashboard -> Integrations -> API Tokens -> Edit token page). (1) RECOMMENDED
      timestamp-bound scheme (verified live 2021-11 API reference, July 2026): headers
      X-Recharge-Webhook-Timestamp (epoch seconds) and X-Recharge-Webhook-Signature
      ("t=<epoch>,v1=<hex>"); signing input "<timestamp>.<raw_body>"; HMAC-SHA256, hex,
      constant-time compare vs v1; reject if abs(now - t) > 172800s (48h). (2) LEGACY
      X-Recharge-Hmac-Sha256, still sent on every delivery: NOT a true HMAC — plain
      SHA-256 of client_secret + raw_body (secret first), hex. Raw body must be
      byte-exact for both schemes ("validation will fail even if one space is lost").
      Does NOT follow the Standard Webhooks spec. No topic header is documented —
      dispatch on the payload's single top-level resource key, or register one endpoint
      path per topic. Webhooks are created via the Admin API (POST
      https://api.rechargeapps.com/webhooks with address + topic, optional
      included_objects); API versions 2021-01 and 2021-11 share the same token and topic
      names. The paid-charge topic is charge/paid (charge/success is legacy, though
      order/success IS current). Respond 200 within 5 seconds; no response, 408, 429, or
      5xx counts as failure. Recharge retries 20 times over 48 hours, then DELETES the
      webhook subscription. No webhook-relevant official SDK
      (@rechargeapps/storefront-client covers the Storefront API only).
    testScenario:
      events:
        - subscription/created
        - charge/paid
        - order/created
  - name: paystack
    displayName: Paystack
    docs:
      webhooks: https://paystack.com/docs/payments/webhooks/
      verification: https://paystack.com/docs/payments/webhooks/#verify-event-origin
      events: https://paystack.com/docs/payments/webhooks/#supported-events
    notes: >
      Verify via x-paystack-signature header: HMAC-SHA512 (not SHA256) of the event
      payload signed with your Paystack secret key, hex-encoded. Official docs example
      hashes JSON.stringify(req.body); in practice hash the raw request body bytes to
      avoid re-serialization mismatches. Does NOT follow the Standard Webhooks spec (no
      timestamp, no replay-window guidance). Configure the webhook URL in Dashboard >
      Settings > API Keys & Webhooks (test and live modes configured separately);
      optionally whitelist Paystack source IPs: 52.31.139.75, 52.49.173.169,
      52.214.14.220 (same for test and live). Respond 200 immediately and defer work;
      non-200 triggers retries — live: every 3 minutes for the first 4 tries, then
      hourly for up to 72 hours; test: hourly for 10 hours; request timeout 30 seconds.
      Retries mean duplicate deliveries — dedupe on event + data.id/reference (no
      idempotency header documented). Events are JSON with top-level "event"
      (dot-separated name) and "data". Official SDKs (@paystack/paystack-sdk npm,
      paystack-sdk pip) are general API clients, minimally maintained, no verification
      helpers.
    testScenario:
      events:
        - charge.success
        - transfer.success
        - subscription.create
    sdks:
      npm: ["@paystack/paystack-sdk"]
      pip: ["paystack-sdk"]
  - name: polar
    displayName: Polar
    docs:
      webhooks: https://polar.sh/docs/integrate/webhooks/endpoints
      verification: https://polar.sh/docs/integrate/webhooks/delivery
      events: https://polar.sh/docs/integrate/webhooks/events
    notes: >
      Follows the Standard Webhooks spec: HMAC-SHA256 signature over
      "{webhook-id}.{webhook-timestamp}.{body}" delivered via webhook-id, webhook-timestamp,
      and webhook-signature headers. Gotcha: the webhook secret is expected to be
      base64-encoded before signing — the official SDKs handle this, but custom/
      standard-webhooks verifiers must base64-encode the dashboard secret first (Polar
      secrets are user-set or randomly generated, NOT whsec_-prefixed). Verify against the
      raw request body (e.g. express.raw). SDK helpers: validateEvent /
      WebhookVerificationError from "@polar-sh/sdk/webhooks" (Node) and validate_event from
      polar_sdk.webhooks (Python). Endpoints configured in organization settings with
      per-event subscription and a Raw/Discord/Slack format choice — only "Raw" sends the
      JSON payload for verification. Delivery: 10s request timeout (respond fast, ideally
      <2s), up to 10 retries with exponential backoff, auto-disabled after 10 consecutive
      failures (manual re-enable). Sandbox environment and "polar listen" CLI tunnel
      available for local testing.
    testScenario:
      events:
        - order.created
        - subscription.active
        - checkout.updated
    sdks:
      npm: ["@polar-sh/sdk"]
      pip: ["polar-sdk"]
  - name: picqer
    displayName: Picqer
    docs:
      webhooks: https://picqer.com/en/api/webhooks
      verification: https://picqer.com/en/api/webhooks#validating-webhooks
    notes: >
      Signature: HMAC-SHA256 of the entire raw request body using the optional per-hook
      `secret` set at registration, base64-encoded (not hex), sent in the X-Picqer-Signature
      header (constant-time compare; raw body required). Secret is OPTIONAL at hook creation
      — if omitted, no signature verification is possible; flag this in skill docs. Does NOT
      follow the Standard Webhooks spec. Hooks are created via POST /api/v1/hooks (fields:
      name, event, address, optional secret); DELETE deactivates (not deletes),
      POST /hooks/{id}/reactivate re-enables. Endpoint must respond 200/201/202 within 10s;
      failures retried 15 times over ~17 hours, and a hook is auto-deactivated after 5
      complete failures within 24h. API auth is HTTP Basic (API key as username); rate limit
      normally 500 req/min (dynamic), 429 + Picqer error code 28 on excess. Official SDK is
      PHP-only (picqer/api-client on Packagist); no official npm or pip package.
    testScenario:
      events:
        - orders.created
        - orders.status_changed
        - picklists.closed
        - picklists.shipments.created

  - name: replicate
    displayName: Replicate
    docs:
      webhooks: https://replicate.com/docs/webhooks
    notes: >
      ML platform for running AI models. Uses Standard Webhooks (Svix) format with headers:
      webhook-id, webhook-timestamp, webhook-signature. Secret format is whsec_<base64>.
      HMAC-SHA256 with base64 encoding. Events: start, output, logs, completed.
    testScenario:
