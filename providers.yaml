  - name: clio
    displayName: Clio
    docs:
      webhooks: https://docs.developers.clio.com/api-reference/#tag/Webhooks
      verification: https://docs.developers.clio.com/api-reference/#tag/Webhooks
    notes: >
      Legal practice management (Clio Manage). Plain REST API, no official server
      SDK. Two-step security: (1) On creation or URL change, Clio POSTs an
      activation handshake carrying an X-Hook-Secret header with a generated
      shared secret; the endpoint must echo the same X-Hook-Secret back with 200
      (or PUT /api/v4/webhooks/:id/activate). The webhook is disabled until the
      handshake succeeds. (2) Each event delivery is signed: Clio computes
      HMAC-SHA256(shared_secret, raw_body), HEX-encodes it (no prefix), and sends
      it in the X-Hook-Signature header. Verify against the RAW body with a
      constant-time compare. Event name is in the payload at meta.event (plus
      meta.webhook_id); models are activity, bill, calendar_entry,
      clio_payments_payment, communication, contact, document, folder, matter,
      task. IMPORTANT: webhooks EXPIRE — 3 days by default, max 31 days via
      expires_at; renew before expiry. HTTPS-only URLs.
      *** VERIFIED against a live EU delivery (Jul 2026): X-Hook-Signature is
      lowercase hex, 64 chars — confirmed by recomputing HMAC-SHA256 over the raw
      body with the webhook's shared_secret and matching the header exactly. Clio's
      docs never state the encoding, so handlers may accept base64 as a safety net,
      but hex is what real deliveries use. ***
      *** REGIONAL HOSTS ARE MANDATORY: an app exists only in its registration
      region, and calling /oauth/token on the wrong host returns invalid_client,
      which masquerades as a bad client secret and sends you hunting in the wrong
      place. An app created at eu.developers.clio.com must use eu.app.clio.com for
      OAuth AND API; likewise ca./au. ***
      *** HANDSHAKE MAY AUTO-COMPLETE: the docs say a webhook stays disabled until
      the X-Hook-Secret handshake succeeds, but an EU test saw it flip pending ->
      enabled within ~90s and begin delivering with no handshake request ever
      arriving. Implement the echo (it is the documented path and how you receive
      the secret) but do not block on it; shared_secret can also be read back via
      GET /api/v4/webhooks/:id.json?fields=shared_secret. ***
    testScenario:
      events:
        - created
        - matter_closed

  - name: cloudinary
    displayName: Cloudinary
    docs:
      webhooks: https://cloudinary.com/documentation/notifications
      verification: https://cloudinary.com/documentation/notification_signatures
      sdk: https://github.com/cloudinary/cloudinary_npm
    notes: >
      Cloudinary sends webhook "notifications" (JSON) to a registered Notification URL.
      Authentication uses TWO headers: `x-cld-signature` (hex digest) and
      `x-cld-timestamp` (unix seconds). The signature is a PLAIN digest (NOT a keyed
      HMAC, despite the docs loosely saying "HMAC-SHA1") computed as
      hexdigest(ALGORITHM(raw_body + timestamp + api_secret)), where ALGORITHM is sha1
      (Cloudinary default) or sha256 (opt-in account setting). The signing secret is the
      ACCOUNT API Secret (Console → Settings → API Keys; the api_secret in
      CLOUDINARY_URL=cloudinary://<api_key>:<api_secret>@<cloud_name>) — there is NO
      separate per-webhook signing secret. Set CLOUDINARY_API_SECRET (and
      CLOUDINARY_SIGNATURE_ALGORITHM=sha256 if enabled). CRITICAL: verify the RAW body
      byte-for-byte — do NOT JSON.parse then re-stringify before verifying. The body also
      contains its own `timestamp` and `signature` fields, but authenticate using the
      HEADERS, not the body fields. Prefer the official SDK: Node
      cloudinary.utils.verifyNotificationSignature(body, Number(timestamp), signature,
      7200); Python cloudinary.utils.verify_notification_signature(body,
      int(timestamp), signature, valid_for=7200). Both enforce a 7200s (2h) freshness
      window on the timestamp — keep the default in a synchronous handler. Common
      notification_type values: upload, eager, delete, rename, moderation,
      resource_tags_changed, resource_context_changed, resource_metadata_changed,
      access_control_changed, create_folder, delete_folder, move. Return HTTP 2xx to
      acknowledge; a non-2xx makes Cloudinary retry.
    testScenario:
      events:
        - upload
        - moderation

  - name: cloudsignal
    displayName: CloudSignal (Cloudprinter.com)
    docs:
      webhooks: https://docs.cloudprinter.com/client/cloudsignal-webhooks-v2-0
      verification: https://docs.cloudprinter.com/connected-apps/cloudsignal-webhooks/
    notes: >
      CloudSignal is Cloudprinter.com's OUTBOUND webhook product for print-fulfilment
      order/item status notifications — NOT the unrelated cloudsignal.io MQTT platform.
      CRITICAL: authentication is NOT an HMAC signature and NOT Standard Webhooks. Each
      POST carries a plaintext per-endpoint "Webhook API key" in the JSON body's `apikey`
      field (distinct from the account API key); the receiver matches it against the
      configured key with a timing-safe compare. There is NO signature header, no
      timestamp, no HMAC — do NOT invent an X-CloudSignal-Signature. Because the apikey
      lives inside the body, ordinary JSON parsing IS the verification step (no raw body
      needed). Set CLOUDSIGNAL_WEBHOOK_APIKEY. Nine signal types (case-sensitive
      PascalCase): CloudprinterOrderValidated, ItemValidated, ItemProduce, ItemProduced,
      ItemPacked, ItemShipped (adds tracking, shipping_option), ItemError (adds cause),
      ItemCanceled (adds cause), CloudprinterOrderCanceled. Common fields: apikey, type,
      order, item, order_reference, item_reference, datetime. Return HTTP 200/204 to
      acknowledge; anything else triggers retries — up to 100 attempts over 7 days. The
      official SDK @cloudprinter/cloudsignal (npm; no pip) is a STANDALONE Node http
      server (new CloudSignal.EventHandler(apikey, port) emitting events), so it cannot
      mount on an Express/Next.js/FastAPI route — the examples verify manually (its
      internal check is exactly body.apikey === expectedKey, and it returns 500 on a bad
      key where the examples return 401).
    testScenario:
      events:
        - CloudprinterOrderValidated
        - ItemShipped

  - name: cursor
    displayName: Cursor
    docs:
      webhooks: https://docs.cursor.com/account/cloud-agent-webhooks
    notes: >
      AI code editor. Uses x-webhook-signature header with HMAC-SHA256 (hex encoded).
      Signature format is sha256=<hex_digest>. Cloud Agent webhooks notify of
      agent status changes (ERROR, FINISHED).
    testScenario:
      events:
        - FINISHED
        - ERROR

  - name: customerio
    displayName: Customer.io
    docs:
      webhooks: https://docs.customer.io/integrations/data-out/connections/webhooks/
      verification: https://docs.customer.io/integrations/api/webhooks/
    notes: >
      Verify with X-CIO-Signature: build the string "v0:<X-CIO-Timestamp>:<raw body>"
      (version always v0), HMAC-SHA256 with the webhook signing key (shown on the
      Reporting Webhooks integration page in account settings), hex digest compare.
      Requires the raw, unmodified body. Does NOT follow the Standard Webhooks spec
      (Slack-style scheme). Payloads carry no single event-name string: each POST is ONE
      event object with event_id, object_type (customer|email|push|sms|in_app|slack|
      webhook), metric (sent, delivered, opened, clicked, bounced, dropped, spammed,
      failed, converted, unsubscribed, ...), timestamp (unix), and data — identify events
      by the object_type + metric pair, not a dotted name. Endpoint must 2xx within 4
      seconds or Customer.io retries with exponential backoff for 7 days and backlogs
      subsequent events (ordering pressure); 400/401/403/404/429/5xx-class errors add a
      1-hour delay. Setup: Journeys > Data & Integrations > Integrations > Reporting
      Webhooks; events opt-in per subscription. No official SDK provides verification
      helpers (customerio-node / customerio pip are API clients only).
    testScenario:
      events:
        - "object_type: email, metric: delivered"
        - "object_type: email, metric: opened"
        - "object_type: customer, metric: unsubscribed"

  - name: deepgram
    displayName: Deepgram
    docs:
      webhooks: https://developers.deepgram.com/reference
    notes: >
      Speech-to-text transcription platform. Uses callback URLs with optional
      Basic Auth or token-based verification via dg-token header.
