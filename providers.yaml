  - name: pylon
    displayName: Pylon
    docs:
      webhooks: https://getpylon.com/developers/guides/using-webhooks/
      verification: https://getpylon.com/developers/guides/using-webhooks/#event-signatures
    notes: >
      B2B customer support platform. No official SDK — verify manually. Signs each delivery
      with HMAC-SHA256: the Pylon-Webhook-Signature header is "hs256=<hex-digest>" where the
      digest is HMAC-SHA256 over concat(Pylon-Webhook-Timestamp, ".", raw body), keyed with the
      destination's signing secret (shown ONCE at destination creation). Companion headers:
      Pylon-Webhook-Timestamp (unix seconds) and Pylon-Webhook-Version (e.g. 2021-07). Verify
      against the RAW body — do not re-serialize; include the "timestamp." prefix in the signed
      content; keep/compare the "hs256=" prefix; compare timing-safe. NOT Standard Webhooks
      (custom hs256= prefix and Pylon-Webhook-* headers). A legacy support-article scheme uses
      X-Pylon-Signature (hex HMAC-SHA256 of the raw body only, no timestamp) — mention as legacy,
      do not implement as the main path. Retries: up to 5 attempts with exponential backoff, final
      ~31h after event creation; a destination flips to "inactive" after 7 days with no successful
      deliveries — process idempotently. IMPORTANT: event-type names are UNCONFIRMED — the canonical
      list is auth-gated at app.getpylon.com/docs/api#event-types. issue.created / issue.updated are
      known to exist but the token format is not publicly verified; present event names as
      illustrative and tell readers to confirm against their own destination configuration.
    testScenario:
      events:
        - issue.created
        - issue.updated
      prompt: >
        Create a {framework} webhook handler for Pylon. Verify the Pylon-Webhook-Signature header:
        compute "hs256=" + hex HMAC-SHA256 over Pylon-Webhook-Timestamp + "." + the raw request body
        using the destination signing secret, and compare timing-safe. Verify against the raw body
        (do not parse first). Return 400 for a missing/invalid signature and 200 once verified, then
        dispatch on the payload's event-type field (e.g. issue.created, issue.updated) — treat the
        event names as illustrative and note they must be confirmed against the Pylon destination
        configuration. If you use any skills to help with this, add a comment noting which skill(s)
        you referenced.

  - name: revolut
    displayName: Revolut
    docs:
      webhooks: https://developer.revolut.com/docs/guides/merchant/monitor-and-observe/webhooks/using-webhooks
      verification: https://developer.revolut.com/docs/guides/merchant/monitor-and-observe/webhooks/verify-the-payload-signature
      events: https://developer.revolut.com/docs/merchant/create-webhook
    notes: >
      Verification: HMAC-SHA256, hex-encoded, sent in Revolut-Signature header as
      "v1=<hex>"; signed payload is "v1.{Revolut-Request-Timestamp}.{raw body}"
      (period-separated), keyed with the webhook signing secret (wsk_... prefix,
      returned on webhook creation/retrieval, rotatable via
      POST .../webhooks/{webhook_id}/rotate-signing-secret). Revolut-Signature may
      contain multiple comma-separated signatures during rotation — accept if any
      matches. Docs recommend a 5-minute timestamp tolerance vs UTC; NOTE the timestamp
      example (1683650202360) is milliseconds though docs say "UNIX timestamp". Does NOT
      follow the Standard Webhooks spec. Webhooks are configured via API only (Merchant
      API webhooks endpoints with Revolut-Api-Version header; legacy POST
      /api/1.0/webhooks deprecated; max 10 webhook URLs). Hosts: merchant.revolut.com
      (prod) / sandbox-merchant.revolut.com (sandbox); source IPs documented (prod
      35.246.21.235, 34.89.70.170; sandbox 35.242.130.242, 35.242.162.241). Retries: 3
      more attempts at 10-minute intervals. Business API has a separate webhook system
      using the same v1 signature scheme. Use the raw request body — re-serialized JSON
      breaks verification. No official npm/pip SDK with webhook helpers
      (@revolut/checkout is a frontend widget).
    testScenario:
      events:
        - ORDER_COMPLETED
        - ORDER_AUTHORISED
        - ORDER_PAYMENT_DECLINED
  - name: sanity
    displayName: Sanity
    docs:
      webhooks: https://www.sanity.io/docs/webhooks
      verification: https://github.com/sanity-io/webhook-toolkit
    notes: >
      GROQ-powered webhooks fire on document create/update/delete in the Content Lake;
      there are no fixed event names — triggers are defined per-webhook with a GROQ filter
      (incl. delta::changedAny/changedOnly, before()/after()) and the payload is
      user-defined via a GROQ projection (defaults to the full document). Configured at
      sanity.io/manage. Signature: sanity-webhook-signature header, Stripe-style
      "t=<ms-timestamp>,v1=<sig>", HMAC-SHA256 over "<timestamp>.<rawBody>" with the
      webhook secret, base64url-encoded (no padding) — NOT Standard Webhooks compliant.
      Verify against the raw body. Delivery: 1 concurrent request, 2 retries at 30s
      intervals, 30s timeout; use the idempotency-key header for dedup; webhooks ignore
      draft and version events by default; no strict delivery guarantee — don't rely solely
      on webhooks. Official helper: @sanity/webhook (isValidSignature, assertValidSignature,
      requireSignedRequest middleware; v4 needs Node 18+). No official pip package.
    testScenario:
      events:
        - document created (GROQ filter _type == "post", create trigger)
        - document updated (delta::changedAny(title))
    sdks:
      npm: ["@sanity/webhook"]

  - name: scrapfly
    displayName: Scrapfly
    docs:
      scrape_webhook: https://scrapfly.io/docs/scrape-api/webhook
      extraction_webhook: https://scrapfly.io/docs/extraction-api/webhook
      screenshot_webhook: https://scrapfly.io/docs/screenshot-api/webhook
      scrape_getting_started: https://scrapfly.io/docs/scrape-api/getting-started
      extraction_getting_started: https://scrapfly.io/docs/extraction-api/getting-started
      screenshot_getting_started: https://scrapfly.io/docs/screenshot-api/getting-started
    notes: >
      Web-scraping API platform with three products that share a single async-job +
      webhook system: Scrape API, Extraction API, Screenshot API. One webhook URL
      registered in the dashboard (https://scrapfly.io/dashboard/webhook) receives
      deliveries from all three products. PAID PLAN REQUIRED (first paid tier).

      No API exists for creating/updating/deleting webhooks programmatically. The
      destination URL CANNOT be passed per-call. Instead, each API call references
      an already-registered webhook by name via the `webhook_name` query parameter
      (e.g. `…/scrape?…&webhook_name=samples-capture`).

      Signature verification: HMAC-SHA256 over the RAW request body bytes (do not
      JSON.parse and re-stringify — that changes the byte sequence). Compare against
      either `X-Scrapfly-Webhook-Signature` (uppercase hex) or
      `X-Scrapfly-Webhook-Signature-Lowercase` (lowercase hex) using constant-time
      equality. The secret is per-webhook, displayed in the dashboard alongside the
      webhook configuration (NOT the account API key).

      Dispatch by `X-Scrapfly-Webhook-Resource-Type` header (one of `scrape`,
      `extraction`, `screenshot`). Other headers: `X-Scrapfly-Webhook-Job-Id` (UUID,
      use as idempotency key for at-least-once delivery), `X-Scrapfly-Webhook-Env`
      (`test`|`live`), `X-Scrapfly-Webhook-Project`, `X-Scrapfly-Webhook-Name`,
      `X-Scrapfly-Webhook-Id`, optional `X-Scrapfly-Log-Uuid`/`X-Scrapfly-Log-Url`.

      No timestamp/replay envelope (unlike Stripe). Recommend idempotency by job-id;
      do NOT invent a `t=…` window.

      Payload = the full response body of the corresponding API plus a `context`
      overlay: `context.webhook` (`{ name, secret, consecutive_failed_count, … }` —
      WARN handlers: `secret` field exposes the signing secret in the payload, do
      not log or echo) and `context.job` (`{ uuid, … }`). Product-specific shapes
      documented in the getting-started pages above.

      Delivery: retry 30s → 1min → 5min → 30min → 1h → 1d. A webhook is DISABLED
      after 100 consecutive failures — handlers should return 2xx fast and surface
      errors out-of-band.

      No official SDK construct for verification (plain HMAC is correct). Do NOT
      pull in a third-party HMAC library; use the stdlib (`crypto.createHmac` in
      Node, `hmac` / `hashlib` in Python).
    testScenario:
      events:
        - scrape
        - extraction
        - screenshot

  - name: sendgrid
    displayName: SendGrid
    docs:
      webhooks: https://www.twilio.com/docs/sendgrid/for-developers/tracking-events/event
      verification: https://www.twilio.com/docs/sendgrid/for-developers/tracking-events/getting-started-event-webhook-security-features
    notes: >
      Email delivery platform. Uses ECDSA signatures with public key verification.
      Signature in X-Twilio-Email-Event-Webhook-Signature header. Timestamp in
      X-Twilio-Email-Event-Webhook-Timestamp header. Verify using SendGrid's public key.
    testScenario:
