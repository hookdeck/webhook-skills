      verification: https://help.quoter.com/hc/en-us/articles/32085971955355-Integrate-with-Webhooks
    notes: >
      Quoter (sales quoting / CPQ) fires webhooks when a Quote, Person, or Payment object is
      created or updated. Configured under Settings > Integrations (target URL, "Applies To"
      object type, JSON or XML format, optional Hash Key). CRITICAL: the verification is a WEAK
      legacy MD5 shared-secret scheme — NOT HMAC-SHA256 and NOT Standard Webhooks — and the hash
      key is OPTIONAL, so a webhook can run with NO verification at all (flag this). Deliveries are
      POSTed as application/x-www-form-urlencoded with exactly three fields: hash, timestamp, and
      data. The `data` field is a JSON (or XML) STRING; `timestamp` is GMT UNIX seconds. Verify by
      computing md5(HASH_KEY + timestamp + data) and comparing (timing-safe) to the `hash` field —
      the signature is a FORM FIELD named `hash`, NOT an HTTP header (do NOT invent an
      X-Quoter-Signature). Optionally reject requests where now - timestamp > 300s. GOTCHA: hash the
      `data` string EXACTLY as received — never JSON.parse then re-stringify before hashing, or the
      MD5 will not match. There are NO dotted event names (no quote.published/won/lost); you
      subscribe an OBJECT TYPE (Quote, Person, or Payment) that fires on create OR update. The
      request does not identify the object type, so configure a distinct target URL per object type
      and pass a hint like ?object=quote for the handler to dispatch on. There is NO official Quoter
      SDK, so verify manually in every framework. Retry behavior is not documented — process
      idempotently keyed on the record id. Set QUOTER_HASH_KEY.
    testScenario:
      events:
        - quote
        - payment
      prompt: >
        Create a {framework} webhook handler for Quoter. Quoter POSTs
        application/x-www-form-urlencoded with three fields: hash, timestamp, and data (data is a
        JSON string). Verify by computing md5(QUOTER_HASH_KEY + timestamp + data) and comparing it
        timing-safe to the `hash` FORM FIELD (this is a weak MD5 scheme, NOT HMAC and NOT Standard
        Webhooks; there is no signature header). Hash the raw `data` string exactly as received —
        do not re-serialize it. Reject requests older than 300 seconds and return 400 for an invalid
        hash. There are no dotted event names — read the object type (quote, person, or payment)
        from the ?object= query parameter and dispatch on it, returning 200 on success. If you use
        any skills to help with this, add a comment noting which skill(s) you referenced.
  - name: paypro-global
    displayName: PayPro Global
    docs:
      webhooks: https://developers.payproglobal.com/docs/integrate-with-paypro-global/webhook-ipn/
      verification: https://developers.payproglobal.com/docs/integrate-with-paypro-global/webhook-ipn/
    notes: >
      PayPro Global (merchant-of-record billing) calls its webhooks IPN (Instant Payment
      Notification). Deliveries are HTTP POST with an application/x-www-form-urlencoded body
      (NOT JSON) to an IPN URL set per product (Store Settings -> Product Setup) or store-wide
      (Store Settings -> Notifications). Verification is bespoke — NOT an HMAC header and NOT
      Standard Webhooks — with three independent layers: (1) an IP allowlist of fixed PayPro
      Global source IPs (IPv4 198.199.123.239, 157.230.8.40; IPv6 2604:a880:400:d0::1843:7001,
      2604:a880:400:d1::b6c:c001); (2) the SIGNATURE field = SHA256 (hex) over seven field
      values concatenated in this EXACT order: ORDER_ID + ORDER_STATUS + ORDER_TOTAL_AMOUNT +
      CUSTOMER_EMAIL + VALIDATION_KEY + TEST_MODE + IPN_TYPE_NAME; (3) the HASH field = MD5 of
      ORDER_ID + SecretKey for real orders, or MD5("1") for test orders (TEST_MODE=1). CRITICAL:
      SecretKey (for HASH) and VALIDATION_KEY (for SIGNATURE) are TWO DIFFERENT keys, both under
      Store Settings -> General Settings -> Integration — swapping them is the most common bug.
      The SIGNATURE covers specific field VALUES, not the raw body, so parsing the form first is
      correct (unlike HMAC-over-raw-body providers). Recompute server-side and constant-time
      compare (normalize hex to lowercase). The event name is in IPN_TYPE_NAME — note the
      non-standard spelling SubscriptionChargeSucceed (not "Succeeded"). Events include
      OrderCharged, OrderRefunded, OrderPartiallyRefunded, OrderChargedBack, OrderChargedBackWon,
      OrderDeclined, OrderOnWaiting, SubscriptionChargeSucceed, SubscriptionChargeFailed,
      SubscriptionSuspended, SubscriptionRenewed, SubscriptionTerminated, SubscriptionFinished,
      SubscriptionPaymentInfoChanged, TrialCharge, LicenseRequested, InstantLeadNotification.
      Respond 200 to acknowledge; non-200 responses are retried every 30 minutes for up to 3
      attempts, so handle idempotently. No official SDK exists — the npm/pip "paypro" packages
      belong to the unrelated PayPro B.V. / paypro.nl. Set PAYPRO_VALIDATION_KEY and
      PAYPRO_SECRET_KEY.
    testScenario:
      events:
        - OrderCharged
        - SubscriptionChargeSucceed
      prompt: >
        Create a {framework} webhook handler for PayPro Global IPN. Deliveries are
        application/x-www-form-urlencoded (NOT JSON). Verify the SIGNATURE field: recompute
        SHA256 over ORDER_ID + ORDER_STATUS + ORDER_TOTAL_AMOUNT + CUSTOMER_EMAIL +
        VALIDATION_KEY + TEST_MODE + IPN_TYPE_NAME (exact order) and constant-time compare
        against the SIGNATURE field. Optionally also verify the HASH field = MD5(ORDER_ID +
        SecretKey), or MD5("1") for test orders (TEST_MODE=1); note SecretKey and VALIDATION_KEY
        are two different keys. Dispatch on IPN_TYPE_NAME (e.g. OrderCharged,
        SubscriptionChargeSucceed), return 400 for an invalid signature and 200 to acknowledge.
        If you use any skills to help with this, add a comment noting which skill(s) you
        referenced.
  - name: zift
    displayName: Zift
    docs:
      webhooks: https://api.zift.io/#webhooks
      verification: https://api.zift.io/#webhooks
    notes: >
      Zift (a payments platform / gateway) delivers billing and processing notifications
      as plain HTTPS POST + JSON to an endpoint registered OUT-OF-BAND (email Zift support
      the HTTPS endpoint URL and desired events; webhooks are set at the integrator/reseller
      level, NOT per-merchant — there is no self-serve dashboard UI). CRITICAL: there is NO
      signature/HMAC header, NO signing secret, and NO Basic/token auth on delivery — this is
      confirmed from the full rendered docs, not just "couldn't find it". Do NOT invent an
      X-Zift-Signature and this is NOT Standard Webhooks. Authenticity relies only on HTTPS +
      endpoint-URL secrecy (recommend IP allowlisting Zift's egress ranges at the load
      balancer). A tunnel/gateway (e.g. Hookdeck's ZIFT source) cannot cryptographically
      verify these — treat as unverified/passthrough. Because there is no body signature,
      ordinary JSON parsing is safe. The ONE protocol requirement is the ACKNOWLEDGEMENT: to
      ack a delivery the endpoint MUST return a JSON body echoing the received notificationId,
      e.g. {"notificationId": 272638} — Zift accepts an int OR a string, so pass the value
      straight through to preserve its type. Returning "OK"/empty/{"received":true} is NOT an
      ack and triggers retries at +5min, +15min, +60min, +24h, then status "Failed" (no further
      redelivery) — so make handling idempotent (dedupe on notificationId). Payload envelope:
      notificationId, eventCode (dotted category.entity-action, e.g. "billing.subscription-created"),
      eventDate (epoch-MILLISECONDS), dataType (names the shape of data), data{}. Two event
      families keyed by the eventCode prefix — billing.* and processing.* — dispatch on the
      prefix (robust) then branch on the specific code. Only billing.subscription-created is
      documented verbatim; other eventCodes are derived from the setup TRIGGER names (billing:
      subscription~create, payment-option~create, allocation~create, payment~process; processing:
      chargeback, return, reversal, NOC) using the category.entity-action pattern — confirm exact
      literals with Zift support at onboarding. processing.return and processing.noc carry ACH
      detail (return reason codes; NOC token/routing/account-type changes). No official Zift
      webhook SDKs.
    testScenario:
      events:
        - billing.subscription-created
        - processing.chargeback
      prompt: >
        Create a {framework} webhook handler for Zift. There is NO HMAC/signature header and
        NO signing secret — do NOT invent an X-Zift-Signature or a Standard Webhooks check.
        Parse the JSON body (notificationId, eventCode, eventDate, dataType, data) and ACKNOWLEDGE
        the delivery by returning a JSON body echoing the received notificationId, e.g.
        {"notificationId": 272638} — accept an int OR a string and pass it straight through so the
        echoed type matches. Returning "OK"/empty is NOT an ack and causes retries. Dispatch on the
        eventCode prefix (billing.* vs processing.*) then branch on the specific code such as
        billing.subscription-created and processing.chargeback; make handling idempotent (dedupe on
        notificationId). Return 400 when notificationId is missing (cannot ack) and 200 with the
        acknowledgement body on success. If you use any skills to help with this, add a comment
        noting which skill(s) you referenced.

  - name: vapi
    displayName: Vapi
    docs:
      webhooks: https://docs.vapi.ai/server-url
      verification: https://docs.vapi.ai/server-url/server-authentication
      events: https://docs.vapi.ai/server-url/events
    notes: >
      Voice-AI agent platform. Its webhook endpoint is the "Server URL" and is
      BIDIRECTIONAL. CRITICAL: there is NO fixed signature scheme — auth is opt-in and
      per-endpoint via dashboard "Custom Credentials" (referenced by credentialId on the
      server object). By default a Server URL has NO auth. Four credential types: (1)
      Bearer Token — Authorization: Bearer <token>, a LITERAL shared-secret compare, not
      an HMAC; (2) legacy X-Vapi-Secret header — same shared secret, reproduces the old
      inline server.secret field; (3) OAuth 2.0 client-credentials — Vapi presents a token
      it fetched from your token endpoint; (4) HMAC — FULLY user-configurable (algorithm,
      signature header name, optional timestamp header, payload format all chosen by the
      customer; docs pin NO defaults). Do NOT hardcode an HMAC header/algorithm/signed-string
      as "the" Vapi scheme — that is fabrication. The skill's primary example is the
      shared-secret path (VAPI_WEBHOOK_SECRET; read Authorization Bearer or X-Vapi-Secret,
      timing-safe compare). No official SDK verify helper; a `verifyVapiSignature` name in a
      CLI tutorial is an unimplemented placeholder — do not use it. No documented source-IP
      allowlist. ENVELOPE: every POST is { "message": { "type": "<type>", "call": {...}, ... } }
      — the event type is NESTED at message.type, NOT top-level. (A CLI tutorial page shows a
      flatter top-level `type`/`transcript` shape with names like call-started — informal
      example code, NOT the wire format; trust /server-url/events.) FOUR message types REQUIRE
      a JSON RESPONSE BODY (not just 200): assistant-request (respond assistantId | assistant |
      destination | error; HARD ~7.5s timeout), tool-calls (respond { results: [{name, toolCallId,
      result}] }, one per toolCallList entry), transfer-destination-request (respond
      { destination, message }), knowledge-base-request (respond { documents: [{content, similarity,
      uuid}] }). All other types (status-update, end-of-call-report, hang, conversation-update,
      transcript, speech-update, model-output, transfer-update, user-interrupted,
      language-change-detected, phone-call-control, chat.*/session.*) are informational — a bare
      200 is enough. voice-request (raw PCM response) and call.endpointing.request go to separate
      dedicated URLs, not the main Server URL. Server URL priority (most specific wins, one URL
      per event): Custom Tool > Assistant > Phone Number > Account-wide.
    testScenario:
      events:
        - assistant-request
        - tool-calls
        - status-update
        - end-of-call-report

  - name: baselinker
    displayName: BaseLinker
    docs:
      api: https://api.baselinker.com/
      events: https://base.com/en-EN/help/knowledgebase/automatic-actions-system-events-for-orders/
    notes: >
      Polish multichannel e-commerce / warehouse and order-management platform (rebranded
      Base.com) integrating marketplaces, stores and couriers. THIS IS NOT A NORMAL WEBHOOK
      SOURCE — three things must be reflected in every example. (1) TRANSPORT IS HTTP HEAD,
      NOT POST. A HEAD request has NO BODY by definition: never read req.body /
      await request.json() / await request.body() — the body is always empty and parsing it
      throws or yields null. Express needs app.head(...) (app.get() also answers HEAD, but be
      explicit); Next.js needs an exported HEAD route handler; FastAPI needs @app.head(...).
      No JSON body parser on the route. Hookdeck seeds a Baselinker Source's
      allowed_http_methods to ["HEAD"] when the type is chosen — an UNMANAGED default that
      seeds the initial selection only, stays editable, and is not re-applied on later
      updates. (2) THE ENTIRE PAYLOAD IS IN THE QUERY STRING — req.query (Express),
      request.nextUrl.searchParams (Next.js), typed query args / request.query_params
      (FastAPI). Query values are ALWAYS STRINGS: coerce numerics explicitly (Number(order_id)
      / int(order_id)) and never assume a param is present. (3) THERE IS NO SIGNATURE
      VERIFICATION. NONE. Do NOT invent an HMAC verifier, a signature header, a
      timestamp/replay check, or a shared secret — there is nothing to verify with. Hookdeck's
      SourceConfigBaselinkerAuth is {properties: {}, additionalProperties: false} (accepts no
      secret at all), whereas every HMAC source there carries webhook_secret_key; BaseLinker
      sits in the zero-property auth cohort with AWS SNS, Microsoft Graph, Microsoft
      SharePoint, Monday, Strava, Tikkie, Ethoca and Zift. There is also NO
      handshake/challenge/ack step: unlike Trello (which uses HEAD as a verification probe), a
      Baselinker HEAD request resolves no challenge controller and goes straight to ingestion.
      Security guidance must be honest — endpoint-URL secrecy, network controls, or a shared
      token the user themselves appends to the endpoint URL as a query param — and say plainly
      that the platform provides no cryptographic authentication. RESPONDING: a HEAD response
      MUST NOT carry a body (RFC 9110 section 9.3.2) — reply with a bare 200 and no payload
      (res.sendStatus(200) / new Response(null, {status: 200}) / Response(status_code=200)),
      never res.json(...). Because of that rule Hookdeck returns the request id in the
      x-hookdeck-request-id RESPONSE header (exposed via Access-Control-Expose-Headers) rather
      than in a body — that is how a delivery is correlated with its dashboard entry. PAYLOAD
      SHAPE — HEDGE HONESTLY: BaseLinker publishes NO webhook documentation whatsoever. Its
      public API (api.baselinker.com, ~195 methods) is strictly request/response over
      connector.php with change tracking by polling (getJournalList,
      getOrderReturnJournalList, getInventoryProductLogs), and neither the English nor the
      Polish help centre documents an outbound webhook or a "send HTTP request" automatic
      action. The only query params actually observed are order_id (e.g. 42) and state (e.g.
      packed), from Hookdeck's own ingestion fixtures — present these as OBSERVED EXAMPLES,
      explicitly not as a documented or exhaustive parameter list. Do not fabricate additional
      param names, and do not claim an event-type discriminator exists. NOTE X-BLToken is
      BaseLinker's REQUEST auth header (client -> BaseLinker API for outbound calls such as
      getOrders, 100 req/min). It is NOT a webhook signature and must never be presented as
      one. For context on what state changes exist, BaseLinker's Automatic Actions system
      events cover order fetched / paid / confirmed, status set, shipment created or deleted,
      courier parcel status changed, invoices and receipts issued, returns
      created/accepted/completed/rejected, PickPack collecting and packing, and marketplace
      cancellations — these are panel UI labels, NOT confirmed wire values, and must be
      referenced only as background, never as event-name constants.
    testScenario:
      events:
        - order_id
        - state
      prompt: >
        Create a {framework} webhook handler for BaseLinker (Base.com). CRITICAL: BaseLinker
        only ever sends HTTP HEAD requests, which have NO BODY — do NOT read req.body /
        await request.json() / await request.body(), and do NOT mount a JSON body parser.
        Register the route for HEAD explicitly (app.head in Express, an exported HEAD function
        in Next.js, @app.head in FastAPI). The ENTIRE payload is in the QUERY STRING; the only
        observed params are order_id (e.g. 42) and state (e.g. packed) — treat them as observed
        examples, not a documented list, guard for absence, and coerce order_id explicitly
        because query values are always strings. There is NO signature verification: do NOT
        invent an HMAC check, a signature header, a timestamp/replay window, or a shared
        secret, and do NOT treat X-BLToken (the outbound API request header) as a signature.
        Respond with a bare 200 and NO body — a HEAD response must not carry one — so never
        res.json(...) / NextResponse.json(...) / return a dict. If you use any skills to help
        with this, add a comment noting which skill(s) you referenced.

  - name: cronofy
    displayName: Cronofy
    docs:
      webhooks: https://docs.cronofy.com/developers/api/push-notifications/
      verification: https://docs.cronofy.com/developers/push-notifications/authentication/
      events: https://docs.cronofy.com/developers/api/push-notifications/
      api: https://docs.cronofy.com/developers/api/
    notes: >
      Cronofy is a calendar API / scheduling infrastructure platform (cronofy.com,
      docs.cronofy.com). DO NOT confuse it with Calendly (calendly.com), which is a
      DIFFERENT company and already has its own `calendly-webhooks` skill in this
      repo — the two share a category (calendar scheduling) and a similar name but
      nothing else: different signing scheme, different headers, different payloads.
      Never cite Calendly headers, event names, or docs in this skill.

      SURFACE (variant resolved): Hookdeck's CRONOFY source type links directly to
      https://docs.cronofy.com/developers/push-notifications/authentication/ —
      verified 2026-08-27 from the hookdeck.com/docs/sources listing. So this skill
      targets Cronofy PUSH NOTIFICATIONS (notification channels), not Smart Invites,
      not Real-Time Scheduling, not the Embedded Scheduler. Cronofy's docs state
      "HMACs are generated in the same way for all callback events", so the same
      verification code also covers Cronofy's other callback surfaces (Event
      Triggers, Smart Invite callbacks, Meeting Agent callback notifications) — say
      so, but keep the skill's examples and event list centred on push notifications.

      VERIFICATION SCHEME (confirmed verbatim against the docs, and the docs' own
      test vectors were reproduced locally on 2026-08-27):
      Header name: `Cronofy-HMAC-SHA256` (case-insensitive on the wire; Node
      lowercases it to `cronofy-hmac-sha256` in req.headers).
      Algorithm: HMAC-SHA256.
      Key: your Cronofy application's CLIENT SECRET (the OAuth client secret,
      prefixed `CRN_`). There is NO separate webhook signing secret. Not the client
      ID, not an access token.
      Signed content: the RAW request body bytes, exactly as received, unparsed.
      Re-serializing the JSON breaks the digest. There is NO timestamp, NO nonce,
      NO channel id, NO URL and NO method mixed into the signed string — body only.
      Encoding: standard base64 (NOT base64url, NOT hex). Includes `+`, `/` and `=`
      padding — the docs' own second example digest is `BmQmWVuZ70ILWjr1CAt5oC7YOolgnku4WZtlrKfx/6k=`,
      which contains a `/`, so a base64url implementation is wrong.

      MULTI-SECRET HEADER — THE LOAD-BEARING QUIRK. The header value is a
      COMMA-SEPARATED LIST of base64 digests, one per ACTIVE client secret, because
      Cronofy supports secret rotation (an application can have two active secrets at
      once). Docs: "Check that the signature value exists in the comma-separated list
      of HMACs passed in the Cronofy-HMAC-SHA256 header." Verification MUST split the
      header on "," and pass if ANY element matches the computed digest. A naive
      `header === computed` comparison will reject every delivery made while a secret
      rotation is in flight. Trim whitespace around each element defensively. Compare
      each candidate in constant time (crypto.timingSafeEqual / hmac.compare_digest),
      guarding the length check first so timingSafeEqual does not throw on a
      length mismatch. Do NOT short-circuit out of the loop in a way that leaks
      timing beyond what a per-candidate constant-time compare already gives.

      DOC TEST VECTORS (verified reproducing locally — use these as unit-test
      fixtures, they are published by Cronofy and safe to embed):
      secret  = CRN_NggYusqPGLxwjw5FHOJYOqSrTPNXy8WQf14OID
      body    = {"example":"well-known"}
      digest  = 5DxentQi5YSXODEzTVv06sRwJ3pULIz1KrYv20qxEK0=
      second secret CRN_nGlYDFXwfSXgB9rvGNBJyfE454GGPtWIbNuPwr over the same body
      gives BmQmWVuZ70ILWjr1CAt5oC7YOolgnku4WZtlrKfx/6k=, and the multi-secret
      header is the two joined with a comma and no space.

      Cronofy explicitly sends NO other authentication credentials with the
      notification. The docs suggest embedding a token in the callback_url itself as
      an optional extra layer (callback_url may differ per channel). Mention that as
      defence in depth; it is not a signature.

      The docs describe the header as one that "can optionally be used to verify"
      — treat verification as REQUIRED in the skill anyway; an unauthenticated POST
      endpoint is the whole reason the header exists.

      TRANSPORT / DELIVERY:
      Method POST. Content-Type: `application/json; charset=utf-8`.
      Response must be 2xx AND returned within 5 SECONDS, or the delivery is treated
      as failed. Cronofy retries for 24 HOURS; if nothing succeeds in that window the
      channel is closed automatically and no further notifications are sent. This
      makes ack-fast-then-process-async the correct pattern and worth calling out
      prominently — a slow handler does not just drop one event, it eventually kills
      the channel. (Event Triggers, the separate beta surface, use a 7-second
      timeout instead of 5 — do not generalize the 5s figure to that surface.)
      Cronofy does NOT send push notifications for changes caused by your own API
      calls, so do not build reconciliation logic that assumes echo-back.

      PAYLOAD ENVELOPE (verbatim from the API reference):
      {
        "notification": {
          "type": "change",
          "changes_since": "2026-08-26T09:24:16Z"
        },
        "channel": {
          "channel_id": "chn_54cf7c7cb4ad4c1027000001",
          "callback_url": "{CALLBACK_URL}",
          "filters": {
            "calendar_ids": ["cal_n23kjnwrw2_sakdnawerd3"],
            "only_managed": false
          }
        }
      }
      The discriminator is `notification.type` — a top-level BODY FIELD, not a
      header. There is no event-type header at all. `notification.changes_since` is
      ONLY present on `change` notifications; other types carry `notification.type`
      plus the `channel` object. `channel.filters` reflects any non-default filters
      set on the channel, so it may be absent/empty.

      EVENT TYPES (documented list, verbatim names):
        verification                     - sent right after a channel is created, to
                                           test the callback URL is valid. This is
                                           the closest thing to a handshake: just
                                           return 2xx. There is NO token to echo and
                                           NO challenge value to reflect — do not
                                           invent one.
        change                           - something changed in the user's events;
                                           carries changes_since, which you pass as
                                           `last_modified` to Read Events to fetch
                                           the delta. The payload does NOT contain
                                           the changed events themselves — this is a
                                           thin/ping notification, always followed by
                                           an API read. Say this explicitly; it is
                                           the single most misunderstood thing about
                                           Cronofy push notifications.
        profile_disconnected             - one or more of the user's calendar
                                           profiles disconnected; the user must
                                           reauthorize. Only fires when Cronofy next
                                           tries to access the profile, not at the
                                           moment of disconnection. Current state via
                                           UserInfo, under ["cronofy.data"]["profiles"].
        conferencing_profile_disconnected - same, for conferencing profiles; state
                                           under ["cronofy.data"]["conferencing_profiles"].
        profile_initial_sync_completed   - initial calendar sync finished; worth a
                                           follow-up sync. NOT sent if the initial
                                           sync completed before the channel existed.
        gdpr_requested                   - the account invoked GDPR right-to-be-
                                           forgotten and wants their data removed.

      IMPORTANT: the docs sentence says "There are currently five types" and then
      lists SIX. The prose count is stale; the enumerated list is authoritative. Use
      all six names above and do NOT repeat the "five" figure. Cronofy explicitly
      instructs: "your code should be tolerant of others, by ignoring them, so if
      more are introduced in future your integration will not fail" — the handler
      MUST have a default branch that ignores unknown types and still returns 2xx.

      SETUP: notification channels are created per-account via
      POST {data_center_url}/v1/channels with an OAuth access token, supplying
      callback_url and optional filters (calendar_ids, only_managed). Channels can be
      listed and closed via the same API. There is NO dashboard-configured global
      webhook URL — the callback URL is a property of the channel, which is why it
      can vary per channel.

      DATA CENTERS: Cronofy is multi-region and the API host differs per data
      center: api.cronofy.com (US), api-uk.cronofy.com (UK), api-de.cronofy.com (DE),
      api-au.cronofy.com (AU), api-ca.cronofy.com (CA), api-sg.cronofy.com (SG).
      Channel creation and the follow-up Read Events call must hit the SAME data
      center the account belongs to. This matters for the change-notification
      follow-up read and should be surfaced.

      DO NOT ASSERT (nothing in the docs supports these — hedge or omit):
      - Any source IP allowlist / CIDR ranges for Cronofy's senders.
      - Any header other than Cronofy-HMAC-SHA256 and Content-Type. There is no
        Cronofy-Signature, no X-Cronofy-*, no delivery-id / request-id header, and no
        timestamp header. Do not invent one.
      - Any replay-protection mechanism. Because there is no timestamp and no nonce
        in the signed content, Cronofy push notifications are REPLAYABLE by design.
        Say so honestly and recommend idempotency keyed on channel_id +
        changes_since (or on the downstream Read Events result) rather than
        pretending a timestamp check is possible.
      - Payload fields beyond notification.type, notification.changes_since,
        channel.channel_id, channel.callback_url, channel.filters.calendar_ids and
        channel.filters.only_managed.

      Official API libraries exist and include a verify helper (cronofy-ruby,
      cronofy-node, cronofy-python, etc.), and Cronofy publishes worked examples at
      github.com/cronofy/notification-hmac-examples (node, php, ruby). Do NOT add an
      SDK to package.json/requirements.txt just to verify a signature — stdlib
      crypto/hmac is sufficient and is what the examples show.
    testScenario:
      events:
        - verification
        - change
        - profile_disconnected
        - profile_initial_sync_completed
