# Webhook Providers - Source of Truth
#
# This file is the authoritative list of all webhook providers supported by this repository.
# Used for: skill generation, periodic reviews, CI validation, agent testing, documentation.
#
# Usage:
#   # Review all providers against their official docs
#   ./scripts/generate-skills.sh review --config providers.yaml
#
#   # Generate a specific provider from this config
#   ./scripts/generate-skills.sh generate stripe --config providers.yaml
#
#   # Run agent test scenario
#   ./scripts/test-agent-scenario.sh stripe express
#
#   # List available providers for testing
#   ./scripts/generate-skills.sh list-providers --config providers.yaml
#
# Provider fields:
#   name          - kebab-case name (e.g., "stripe", "hookdeck-event-gateway")
#   displayName   - Human-readable name (e.g., "Stripe", "Hookdeck Event Gateway")
#   docs          - Documentation URLs (webhooks, verification, events, api)
#   notes         - Context for AI agents during skill generation
#   testScenario  - Configuration for agent testing (optional):
#     events      - Array of event types to test with
#     prompt      - Custom prompt template (uses default if not specified)
#     skillName   - Override skill directory name (default: {name}-webhooks)
#   sdks          - Provider-specific SDK packages to version-track (optional):
#     npm         - Array of npm package names (e.g., ["@paddle/paddle-node-sdk"])
#     pip         - Array of PyPI package names (e.g., ["paddle-python-sdk"])
#     The generator queries these alongside the generic framework deps so the
#     AI sees current SDK versions in the {{VERSIONS_TABLE}} and can flag
#     stale pins in package.json/requirements.txt during review.
#
# When adding a new provider skill:
#   1. Add provider entry here with documentation URLs and testScenario
#   2. Generate or create the skill
#   3. Update README.md Provider Skills table

providers:
  - name: chargebee
    displayName: Chargebee
    docs:
      webhooks: https://www.chargebee.com/docs/2.0/events_and_webhooks.html
      events: https://apidocs.chargebee.com/docs/api/events#event_types
    notes: >
      Subscription billing platform. Uses Basic Auth for webhook verification (not HMAC).
      Username and password are configured in Chargebee webhook settings.
    testScenario:
      events:
        - subscription_created
        - payment_succeeded

  - name: claude-managed-agents
    displayName: Claude Managed Agents
    docs:
      webhooks: https://platform.claude.com/docs/en/managed-agents/webhooks
      overview: https://platform.claude.com/docs/en/managed-agents/overview
      cookbook: https://platform.claude.com/cookbook/managed-agents-cma-operate-in-production
    notes: >
      Anthropic Claude Managed Agents (CMA) webhooks notify your app of long-running
      agent session state changes without holding an HTTP connection open. Uses
      X-Webhook-Signature header with HMAC-SHA256. Signing secret is a 32-byte
      whsec_-prefixed value generated at endpoint creation (shown only once).
      Set ANTHROPIC_WEBHOOK_SIGNING_KEY env var. The official Anthropic SDK provides
      client.beta.webhooks.unwrap() (Python/TS/Go/C#/Java/PHP/Ruby) which verifies the
      signature, rejects payloads older than 5 minutes, and parses the event in one step.
      Event payloads return only event type + id — fetch the full object via GET.
      Endpoint must return 2xx; anything else (including 3xx) triggers retry.
      Common events:
      session.status_run_started, session.status_idled, session.status_rescheduled,
      session.status_terminated, session.thread_created, session.thread_idled,
      session.thread_terminated, session.outcome_evaluation_ended,
      vault.created, vault.archived, vault.deleted,
      vault_credential.created, vault_credential.archived, vault_credential.deleted,
      vault_credential.refresh_failed.
    testScenario:
      events:
        - session.status_idled
        - session.outcome_evaluation_ended

  - name: clerk
    displayName: Clerk
    docs:
      webhooks: https://clerk.com/docs/integrations/webhooks/overview
      events: https://clerk.com/docs/integrations/webhooks/overview#event-types
    notes: >
      User management platform. Uses Standard Webhooks (Svix) format with headers:
      webhook-id, webhook-timestamp, webhook-signature. Secret format is whsec_<base64>.
      HMAC-SHA256 with base64 encoding.
    testScenario:
      events:
        - user.created
        - session.created

  - name: cursor
    displayName: Cursor
    docs:
      webhooks: https://docs.cursor.com/account/cloud-agent-webhooks
    notes: >
      AI code editor. Uses x-webhook-signature header with HMAC-SHA256 (hex encoded).
      Signature format is sha256=<hex_digest>. Cloud Agent webhooks notify of
      agent status changes (ERROR, FINISHED).
    testScenario:
      events:
        - FINISHED
        - ERROR

  - name: deepgram
    displayName: Deepgram
    docs:
      webhooks: https://developers.deepgram.com/reference
    notes: >
      Speech-to-text transcription platform. Uses callback URLs with optional
      Basic Auth or token-based verification via dg-token header.
      Not traditional webhooks - these are transcription completion callbacks.
    testScenario:
      events:
        - transcription callback
      prompt: >
        Add Deepgram webhook handling to my {framework} app. I want to receive 
        transcription callbacks and verify the dg-token header. If you use any 
        skills to help with this, add a comment in the code noting which skill(s) 
        you referenced.

  - name: discord
    displayName: Discord
    docs:
      webhooks: https://docs.discord.com/developers/events/webhook-events
      verification: https://docs.discord.com/developers/interactions/overview#setting-up-an-endpoint-validating-security-request-headers
    notes: >
      Communications platform. Outgoing webhook events (and Interactions endpoints) are
      verified using Ed25519 asymmetric signatures with X-Signature-Ed25519 (hex) and
      X-Signature-Timestamp headers. Signed content is the concatenation of
      X-Signature-Timestamp + raw request body. Use tweetnacl/discord-interactions
      (Node) or PyNaCl (Python). Endpoint must respond to PING events for endpoint
      validation. Common events: APPLICATION_AUTHORIZED, APPLICATION_DEAUTHORIZED,
      ENTITLEMENT_CREATE, LOBBY_MESSAGE_CREATE, GAME_DIRECT_MESSAGE_CREATE.
    testScenario:
      events:
        - APPLICATION_AUTHORIZED
        - ENTITLEMENT_CREATE

  - name: elevenlabs
    displayName: ElevenLabs
    docs:
      webhooks: https://elevenlabs.io/docs/overview/administration/webhooks
    notes: >
      Voice AI platform. Uses Standard Webhooks (Svix) format with headers:
      webhook-id, webhook-timestamp, webhook-signature. Secret format is whsec_<base64>.
      HMAC-SHA256 with base64 encoding.
    testScenario:
      events:
        - voice.generation.completed
        - voice.clone.completed

  - name: fusionauth
    displayName: FusionAuth
    docs:
      webhooks: https://fusionauth.io/docs/extend/events-and-webhooks/
      events: https://fusionauth.io/docs/extend/events-and-webhooks/events/
      verification: https://fusionauth.io/docs/extend/events-and-webhooks/signing
    notes: >
      Identity and access management platform. Uses JWT-based signature verification.
      Signatures are RSA-signed JWTs in the X-FusionAuth-Signature header.
      Verify using FusionAuth's public key from /.well-known/jwks.json endpoint.
    testScenario:
      events:
        - user.create
        - user.login.success

  - name: github
    displayName: GitHub
    docs:
      webhooks: https://docs.github.com/en/webhooks
      events: https://docs.github.com/en/webhooks/webhook-events-and-payloads
      verification: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
    notes: >
      Code hosting platform. Uses X-Hub-Signature-256 header with HMAC-SHA256 (hex encoded).
      Signature format is sha256=<hex_digest>. Always use timing-safe comparison.
      Common events: push, pull_request, issues, release.
    testScenario:
      events:
        - push
        - pull_request

  - name: gitlab
    displayName: GitLab
    docs:
      webhooks: https://docs.gitlab.com/ee/user/project/integrations/webhooks.html
      events: https://docs.gitlab.com/ee/user/project/integrations/webhook_events.html
    notes: >
      Code hosting platform. Uses X-Gitlab-Token header for secret token verification
      (simple string comparison, not HMAC). Use timing-safe comparison.
      Common events: push, merge_request, issue, pipeline, release.
    testScenario:
      events:
        - push
        - merge_request

  - name: gemini
    displayName: Google Gemini
    docs:
      webhooks: https://ai.google.dev/gemini-api/docs/webhooks
      cookbook: https://github.com/google-gemini/cookbook/blob/main/quickstarts/Webhooks.ipynb
      announcement: https://blog.google/innovation-and-ai/technology/developers-tools/event-driven-webhooks/
    notes: >
      Google Gemini API event-driven webhooks (launched May 4, 2026) push notifications
      when long-running operations (batch jobs, video generation, Interactions API
      function-calling LROs) complete, replacing polling. Strictly follows the Standard
      Webhooks (Svix) spec with headers: webhook-id, webhook-timestamp, webhook-signature.
      Two signing modes:
      (1) Static webhooks — symmetric HMAC-SHA256 over webhook-id.webhook-timestamp.body
      using a shared secret returned once at creation (project-level integration). Use
      the standardwebhooks library.
      (2) Dynamic webhooks — asymmetric RS256 JWTs verified against Google's JWKS
      endpoint at https://generativelanguage.googleapis.com/.well-known/jwks.json
      (per-job binding, supports user_metadata for custom routing). Reject payloads
      older than 5 minutes. At-least-once delivery with 24-hour exponential backoff
      retries. Common events: batch.succeeded, batch.failed, video.generated,
      interaction.completed, interaction.requires_action.
    testScenario:
      events:
        - batch.succeeded
        - video.generated

  - name: hubspot
    displayName: HubSpot
    docs:
      webhooks: https://developers.hubspot.com/docs/apps/legacy-apps/authentication/validating-requests
      changelog_v3: https://developers.hubspot.com/changelog/introducing-version-3-of-webhook-signatures
    notes: >
      CRM platform. Uses X-HubSpot-Signature-v3 header — HMAC-SHA256 then base64
      encoded. Signed content for v3 is the UTF-8 concatenation of HTTP method +
      request URI (with URL-decoded chars except '?') + raw request body +
      X-HubSpot-Request-Timestamp value. Reject requests with timestamp older than
      5 minutes. v1 and v2 (SHA-256 of clientSecret+body, no timestamp) are deprecated
      — new integrations should use v3 only. Signing key is the App's Client Secret
      (Application Secret). Common subscription types: contact.creation,
      contact.propertyChange, contact.deletion, deal.creation, deal.propertyChange,
      company.creation, ticket.creation. (Note: the v3 validation page is canonically
      hosted under /docs/apps/legacy-apps/authentication/validating-requests — the
      legacy-apps label refers to HubSpot's pre-2026 app platform, but v3 signature
      verification itself is current. A v4 webhooks API is in beta on the new
      developer platform but uses different mechanics; pin to v3 for stability.)
    testScenario:
      events:
        - contact.creation
        - deal.creation

  - name: huggingface
    displayName: Hugging Face
    docs:
      webhooks: https://huggingface.co/docs/hub/webhooks
      verification: https://huggingface.co/docs/hub/webhooks#webhook-secret
    notes: >
      AI model hub. Webhooks notify on repository changes (models, datasets, Spaces),
      discussions, Pull Requests, and comments. Uses a shared secret token sent in
      the X-Webhook-Secret request header — verify with timing-safe string comparison
      (NOT HMAC; the secret is sent verbatim). The secret can alternatively be passed
      as a ?secret= query parameter on the handler URL. Configure in webhook settings.
      Payload shape: top-level "event" object with "action" (create/update/delete/move)
      and "scope" (repo, repo.content, repo.config, discussion, discussion.comment),
      plus "repo", optional "discussion", "comment", "updatedRefs", "updatedConfig",
      and "webhook" (with version). Rate limit: 1,000 triggers per 24 hours.
    testScenario:
      events:
        - repo update (scope=repo, action=update)
        - new discussion comment (scope=discussion.comment, action=create)

  - name: intercom
    displayName: Intercom
    docs:
      webhooks: https://developers.intercom.com/docs/webhooks
      events: https://developers.intercom.com/docs/references/2.13/webhooks/webhook-models
    notes: >
      Customer messaging platform. Uses X-Hub-Signature header (Facebook-style)
      with HMAC-SHA1 (40-byte hex). Signature format is sha1=<hex_digest>.
      Computed over the raw JSON request body using the app's client_secret as
      the key (from Developer Hub → Basic Information). Subscribe to topics
      such as conversation.user.created, conversation.admin.replied,
      contact.user.created, ticket.created, and ping (handshake).
    testScenario:
      events:
        - conversation.user.created
        - conversation.admin.replied

  - name: linear
    displayName: Linear
    docs:
      webhooks: https://linear.app/developers/webhooks
    notes: >
      Issue tracking platform. Uses Linear-Signature header with HMAC-SHA256 (hex
      encoded) computed over the raw body using the webhook's signing secret (shown
      once when the webhook is created in Linear settings). Additional headers:
      Linear-Event identifies the entity type (Issue, Comment, Project, Cycle,
      Issue SLA, Issue attachment, Issue label, Comment reaction, Document, Initiative,
      Customer, User), Linear-Delivery is a UUID v4 for idempotency, plus
      Content-Type: application/json and User-Agent: Linear-Webhook. Payload includes
      a webhookTimestamp field — reject if it's more than 1 minute old. Payload action
      values: create, update, remove.
    testScenario:
      events:
        - Issue create
        - Comment create

  - name: mailgun
    displayName: Mailgun
    docs:
      webhooks: https://documentation.mailgun.com/docs/mailgun/user-manual/webhooks/webhooks
      verification: https://documentation.mailgun.com/docs/mailgun/user-manual/webhooks/securing-webhooks
      events: https://documentation.mailgun.com/docs/mailgun/user-manual/events/events
    notes: >
      Email delivery platform. Webhooks can be configured at account level (all domains) or
      domain level (per-sending-domain); both use the same signature scheme and the same HTTP
      Webhook Signing Key — one skill, not two. Signature is delivered INSIDE the request body
      as a top-level "signature" object with three fields: timestamp (epoch seconds), token
      (50-char random string), signature (hex). Verify by computing
      HMAC-SHA256(signing_key, timestamp + token) — concatenate with NO separator — and
      comparing the hex digest to signature.signature with timing-safe comparison. For
      subaccounts, payloads may include a parent-signature field signed with the parent
      account's key. Cache tokens for replay protection. Events: accepted, rejected, delivered,
      failed (with severity: permanent or temporary), opened, clicked, unsubscribed, complained,
      stored, list_member_uploaded.
    testScenario:
      events:
        - delivered
        - failed

  - name: notion
    displayName: Notion
    docs:
      webhooks: https://developers.notion.com/reference/webhooks
    notes: >
      Productivity workspace. Webhooks launched in the 2026-03-01 API release. Uses
      X-Notion-Signature header with HMAC-SHA256, formatted as "sha256=<hex_digest>",
      computed over the raw request body using your integration's verification_token
      as the signing key. Subscription activation requires a one-time handshake: the
      first delivery is a POST containing a verification_token in the body — extract
      and store it (do NOT verify a signature on this first message), then use it as
      the signing key for all subsequent signature verifications. Notion provides
      code examples in JavaScript, Python, and Ruby. Common events:
      page.content_updated, page.properties_updated, page.locked, page.moved,
      comment.created, data_source.schema_updated, database.schema_updated.
    testScenario:
      events:
        - page.content_updated
        - comment.created

  - name: openai
    displayName: OpenAI
    docs:
      webhooks: https://platform.openai.com/docs/guides/webhooks
      events: https://platform.openai.com/docs/guides/webhooks/events
    notes: >
      AI platform webhooks for fine-tuning jobs, batch completions, and async events.
      Uses Standard Webhooks (Svix) format with headers: webhook-id, webhook-timestamp,
      webhook-signature. Secret format is whsec_<base64>. HMAC-SHA256 with base64 encoding.
    testScenario:
      events:
        - fine_tuning.job.succeeded
        - batch.completed

  - name: openclaw
    displayName: OpenClaw
    docs:
      webhooks: https://docs.openclaw.ai/automation/webhook
      hooks: https://docs.openclaw.ai/automation/hooks
      configuration: https://docs.openclaw.ai/gateway/configuration
    notes: >
      Open-source autonomous AI agent platform. Uses token-based authentication
      (not HMAC signatures). Token sent via Authorization: Bearer <token> or
      x-openclaw-token header. Two hook types: agent hooks (/hooks/agent) trigger
      isolated agent turns, wake hooks (/hooks/wake) enqueue system events.
      No official webhook verification SDK — use timing-safe string comparison.
    testScenario:
      events:
        - agent hook
        - wake hook

  - name: orb
    displayName: Orb
    docs:
      webhooks: https://docs.withorb.com/integrations-and-exports/webhooks
      summary_webhooks: https://docs.withorb.com/integrations-and-exports/summary-webhooks
      api: https://docs.withorb.com/api-reference
    notes: >
      Usage-based billing platform (Orb / withorb.com). Uses HMAC-SHA256 in hex with
      a `v1=` prefix in the `X-Orb-Signature` header (e.g. `X-Orb-Signature: v1=<hex>`).
      Timestamp delivered separately in `X-Orb-Timestamp` (ISO 8601). Signed content
      format is the literal string `v1:{X-Orb-Timestamp}:{raw-body}` — concatenate
      version literal "v1", colon, ISO timestamp, colon, raw body bytes; HMAC-SHA256
      with the per-endpoint signing secret (configured in Orb dashboard, one secret
      per webhook endpoint, NOT the account API key). Always pass the raw request
      body — don't JSON.parse and re-stringify before verifying.

      No documented replay tolerance — Orb recommends comparing X-Orb-Timestamp to a
      threshold the integrator picks. Recommend a 5-minute window in handlers plus
      idempotency keyed on the event `id` field for at-least-once delivery safety.

      Common events span customer lifecycle (`customer.created`,
      `customer.credit_balance_dropped`, `customer.accounting_sync_succeeded`),
      subscriptions (`subscription.created`, `subscription.started`,
      `subscription.ended`, `subscription.plan_changed`, `subscription.edited`,
      `subscription.usage_exceeded`), invoices (`invoice.issued`,
      `invoice.payment_succeeded`, `invoice.payment_failed`, `invoice.edited`),
      and data exports (`data_exports.transfer_success`).

      "Summary webhooks" are an opt-in variant covering the same event types with
      smaller payloads (line_items omitted from invoices; customer/plan minified
      to identification fields only). Same signature scheme; consumers should fetch
      full resources via API when detail is needed.

      Official SDKs: orb-billing (npm + PyPI; same package name on both registries).
      Neither SDK exposes a Stripe-style unwrap()/constructEvent() helper at the
      time of writing — manual HMAC verification is the canonical path.
    sdks:
      npm:
        - orb-billing
      pip:
        - orb-billing
    testScenario:
      events:
        - invoice.payment_succeeded
        - subscription.created

  - name: paddle
    displayName: Paddle
    docs:
      webhooks: https://developer.paddle.com/webhooks/overview
      verification: https://developer.paddle.com/webhooks/signature-verification
      api: https://developer.paddle.com/api-reference/overview
    notes: >
      Payment and subscription platform. Uses Paddle-Signature header with HMAC-SHA256.
      Signature format includes timestamp (ts) and hash (h1). Secret starts with pdl_ntfset_.
      Official SDKs: @paddle/paddle-node-sdk (Node), paddle-python-sdk (Python).
    sdks:
      npm:
        - "@paddle/paddle-node-sdk"
      pip:
        - paddle-python-sdk
    testScenario:
      events:
        - subscription.created
        - transaction.completed

  - name: paypal
    displayName: PayPal
    docs:
      webhooks: https://developer.paypal.com/api/rest/webhooks/
      verification: https://developer.paypal.com/api/rest/webhooks/rest/
      events: https://developer.paypal.com/api/rest/webhooks/event-names/
    notes: >
      Payments platform. Uses certificate-based RSA-SHA256 signature verification — not
      HMAC. Required request headers: paypal-transmission-id, paypal-transmission-time,
      paypal-transmission-sig (the signature), paypal-cert-url (public cert location,
      must resolve to a paypal.com domain), and paypal-auth-algo (e.g. "SHA256withRSA").
      Two verification paths:
      (1) Recommended postback: POST the captured headers, your webhook_id, and the
      raw event body to PayPal's /v1/notifications/verify-webhook-signature endpoint
      (requires an OAuth access token). PayPal returns verification_status.
      (2) Offline self-verify: download the cert from paypal-cert-url, compute CRC32
      of the raw body, build the message
      transmissionId|transmissionTime|webhookId|crc32(body), and verify the signature
      against the cert's public key with RSA-SHA256. Common events:
      PAYMENT.CAPTURE.COMPLETED, PAYMENT.SALE.COMPLETED, PAYMENT.CAPTURE.REFUNDED,
      BILLING.SUBSCRIPTION.CREATED, CHECKOUT.ORDER.APPROVED.
    testScenario:
      events:
        - PAYMENT.CAPTURE.COMPLETED
        - BILLING.SUBSCRIPTION.CREATED

  - name: replicate
    displayName: Replicate
    docs:
      webhooks: https://replicate.com/docs/webhooks
    notes: >
      ML platform for running AI models. Uses Standard Webhooks (Svix) format with headers:
      webhook-id, webhook-timestamp, webhook-signature. Secret format is whsec_<base64>.
      HMAC-SHA256 with base64 encoding. Events: start, output, logs, completed.
    testScenario:
      events:
        - prediction.completed
        - prediction.output

  - name: resend
    displayName: Resend
    docs:
      webhooks: https://resend.com/docs/webhooks
    notes: >
      Email API platform. Uses Standard Webhooks (Svix) format with headers:
      webhook-id, webhook-timestamp, webhook-signature. Secret format is whsec_<base64>.
      HMAC-SHA256 with base64 encoding. Events: email.sent, email.delivered, email.bounced.
    testScenario:
      events:
        - email.delivered
        - email.bounced

  - name: postmark
    displayName: Postmark
    docs:
      webhooks: https://postmarkapp.com/developer/webhooks/webhooks-overview
      events: https://postmarkapp.com/developer/webhooks/webhooks-overview
    notes: >
      Email delivery platform. Uses Basic Auth or token-based authentication in the webhook URL
      (not signature verification). Configure webhook URL with credentials like
      https://username:password@yourdomain.com/webhooks/postmark or use a token query parameter.
      Events: Bounce, Delivery, Open, Click, SpamComplaint, SubscriptionChange.
    testScenario:
      events:
        - Bounce
        - Delivery

  - name: scrapfly
    displayName: Scrapfly
    docs:
      scrape_webhook: https://scrapfly.io/docs/scrape-api/webhook
      extraction_webhook: https://scrapfly.io/docs/extraction-api/webhook
      screenshot_webhook: https://scrapfly.io/docs/screenshot-api/webhook
      scrape_getting_started: https://scrapfly.io/docs/scrape-api/getting-started
      extraction_getting_started: https://scrapfly.io/docs/extraction-api/getting-started
      screenshot_getting_started: https://scrapfly.io/docs/screenshot-api/getting-started
    notes: >
      Web-scraping API platform with three products that share a single async-job +
      webhook system: Scrape API, Extraction API, Screenshot API. One webhook URL
      registered in the dashboard (https://scrapfly.io/dashboard/webhook) receives
      deliveries from all three products. PAID PLAN REQUIRED (first paid tier).

      No API exists for creating/updating/deleting webhooks programmatically. The
      destination URL CANNOT be passed per-call. Instead, each API call references
      an already-registered webhook by name via the `webhook_name` query parameter
      (e.g. `…/scrape?…&webhook_name=samples-capture`).

      Signature verification: HMAC-SHA256 over the RAW request body bytes (do not
      JSON.parse and re-stringify — that changes the byte sequence). Compare against
      either `X-Scrapfly-Webhook-Signature` (uppercase hex) or
      `X-Scrapfly-Webhook-Signature-Lowercase` (lowercase hex) using constant-time
      equality. The secret is per-webhook, displayed in the dashboard alongside the
      webhook configuration (NOT the account API key).

      Dispatch by `X-Scrapfly-Webhook-Resource-Type` header (one of `scrape`,
      `extraction`, `screenshot`). Other headers: `X-Scrapfly-Webhook-Job-Id` (UUID,
      use as idempotency key for at-least-once delivery), `X-Scrapfly-Webhook-Env`
      (`test`|`live`), `X-Scrapfly-Webhook-Project`, `X-Scrapfly-Webhook-Name`,
      `X-Scrapfly-Webhook-Id`, optional `X-Scrapfly-Log-Uuid`/`X-Scrapfly-Log-Url`.

      No timestamp/replay envelope (unlike Stripe). Recommend idempotency by job-id;
      do NOT invent a `t=…` window.

      Payload = the full response body of the corresponding API plus a `context`
      overlay: `context.webhook` (`{ name, secret, consecutive_failed_count, … }` —
      WARN handlers: `secret` field exposes the signing secret in the payload, do
      not log or echo) and `context.job` (`{ uuid, … }`). Product-specific shapes
      documented in the getting-started pages above.

      Delivery: retry 30s → 1min → 5min → 30min → 1h → 1d. A webhook is DISABLED
      after 100 consecutive failures — handlers should return 2xx fast and surface
      errors out-of-band.

      No official SDK construct for verification (plain HMAC is correct). Do NOT
      pull in a third-party HMAC library; use the stdlib (`crypto.createHmac` in
      Node, `hmac` / `hashlib` in Python).
    testScenario:
      events:
        - scrape
        - extraction
        - screenshot

  - name: sendgrid
    displayName: SendGrid
    docs:
      webhooks: https://www.twilio.com/docs/sendgrid/for-developers/tracking-events/event
      verification: https://www.twilio.com/docs/sendgrid/for-developers/tracking-events/getting-started-event-webhook-security-features
    notes: >
      Email delivery platform. Uses ECDSA signatures with public key verification.
      Signature in X-Twilio-Email-Event-Webhook-Signature header. Timestamp in
      X-Twilio-Email-Event-Webhook-Timestamp header. Verify using SendGrid's public key.
    testScenario:
