  - name: knock
    displayName: Knock
    docs:
      webhooks: https://docs.knock.app/developer-tools/outbound-webhooks/overview
      events: https://docs.knock.app/developer-tools/outbound-webhooks/event-types
      api: https://docs.knock.app/reference
    notes: >
      Notification infrastructure platform (Knock / knock.app). Outbound webhooks
      fire on message lifecycle and resource change events. Uses HMAC-SHA256 with
      base64 encoding in the `x-knock-signature` header, formatted as
      `t=<timestamp>,s=<base64-signature>`.

      CRITICAL: the timestamp is in MILLISECONDS, not seconds. Knock explicitly
      deviates from Stripe's seconds-based scheme — anyone porting a Stripe
      verifier will silently fail signature checks if they forget this. Surface
      this prominently in the verification reference.

      Signed content format: `{timestamp_ms}.{stringified_body}` (period
      separator). HMAC-SHA256 over that string using the per-endpoint signing
      secret (one secret per webhook in the dashboard — NOT the account API
      key). Always pass the raw request body; do not JSON.parse and re-serialize
      before verifying.

      Replay protection: docs recommend rejecting payloads whose timestamp is
      more than 5 minutes old. Apply this on top of the signature check.

      No SDK helper. Confirmed: @knocklabs/node (npm, v1.32.0+) and knockapi
      (PyPI, v1.25.0+) do not expose webhooks.unwrap()/constructEvent()/verify()
      — the source contains no inbound webhook verification path. The official
      JavaScript example uses crypto.createHmac directly. Manual HMAC-SHA256
      verification is the canonical path; do not pull in a third-party library.

      Event taxonomy (23 events across 6 categories):
      - Message lifecycle (13): message.sent, message.delivered,
        message.delivery_attempted, message.undelivered, message.bounced,
        message.seen, message.unseen, message.read, message.unread,
        message.archived, message.unarchived, message.interacted,
        message.link_clicked
      - Workflow (2): workflow.updated, workflow.committed
      - Email layout (2): email_layout.updated, email_layout.committed
      - Translation (2): translation.updated, translation.committed
      - Source event action (2): source_event_action.updated,
        source_event_action.committed
      - Partial (2): partial.updated, partial.committed

      Payload includes top-level `data` (typed by event — for message events
      this is a Message object) plus optional `event_data` with additional
      metadata. Retries: up to 8 attempts on any non-2xx response. At-least-once
      delivery — recommend idempotency keyed on the event `id` field.
    testScenario:
      events:
        - message.sent
        - message.delivered

  - name: linear
    displayName: Linear
    docs:
      webhooks: https://linear.app/developers/webhooks
    notes: >
      Issue tracking platform. Uses Linear-Signature header with HMAC-SHA256 (hex
      encoded) computed over the raw body using the webhook's signing secret (shown
      once when the webhook is created in Linear settings). Additional headers:
      Linear-Event identifies the entity type (Issue, Comment, Project, Cycle,
      Issue SLA, Issue attachment, Issue label, Comment reaction, Document, Initiative,
      Customer, User), Linear-Delivery is a UUID v4 for idempotency, plus
      Content-Type: application/json and User-Agent: Linear-Webhook. Payload includes
      a webhookTimestamp field — reject if it's more than 1 minute old. Payload action
      values: create, update, remove.
    testScenario:
      events:
        - Issue create
        - Comment create

  - name: linkedin
    displayName: LinkedIn
    docs:
      webhooks: https://learn.microsoft.com/en-us/linkedin/shared/api-guide/developer-webhooks
      verification: https://learn.microsoft.com/en-us/linkedin/shared/api-guide/webhook-validation
    notes: >
      Two-part verification, both HMAC-SHA256 keyed with the app clientSecret. (1) Endpoint
      validation: LinkedIn GETs your URL with ?challengeCode=<uuid>; respond within 3s with
      JSON {challengeCode, challengeResponse} where challengeResponse =
      hex(HMACSHA256(challengeCode, clientSecret)). Endpoints are re-validated every 2 hours
      and blocked after 3 consecutive failures (unblock via portal or the developerWebhooks
      revalidateWebhook action). (2) Per-request X-LI-Signature header =
      hex(HMACSHA256("hmacsha256=" + raw JSON body, clientSecret)) — the "hmacsha256="
      prefix is only in the string-to-sign, not the header; raw body + constant-time
      compare. Does NOT follow the Standard Webhooks spec. Webhooks exist per-product,
      gated behind partner programs: Lead Sync (POST /rest/leadNotifications; payload type
      LEAD_ACTION; requires r_marketing_leadgen_automation + Lead Sync program), Community
      Management (PUT /rest/eventSubscriptions, eventType
      ORGANIZATION_SOCIAL_ACTION_NOTIFICATIONS; requires rw_organization_admin), and Talent
      (Apply Connect job status + resync). Gotchas: HTTPS only, ngrok explicitly
      unsupported; duplicates expected — dedupe on notificationId; redelivery every 5
      minutes for up to 8 hours (documented for org social actions), missed notifications
      retrievable via pull API for 60 days; from 2026-03-16 unvalidated Lead Sync webhooks
      stop receiving notifications.
    testScenario:
      events:
        - LEAD_ACTION
        - ORGANIZATION_SOCIAL_ACTION_NOTIFICATIONS
    sdks:
      npm: [linkedin-api-client]
      pip: [linkedin-api-client]

  - name: mailersend
    displayName: MailerSend
    docs:
      webhooks: https://developers.mailersend.com/api/v1/account/webhooks.html
      verification: https://developers.mailersend.com/api/v1/account/webhooks.html#security
      events: https://developers.mailersend.com/api/v1/account/webhooks.html
      api: https://developers.mailersend.com/api/v1/webhooks
    notes: >
      Transactional email and SMS API from the MailerLite group. NOT MailerLite (the
      marketing-email product, separate API and separate webhook scheme), NOT Mailgun,
      Mailchimp or Resend. Signature is a `Signature` header (exactly that — no X- prefix,
      no vendor prefix) containing the BARE lowercase hex HMAC-SHA256 of the RAW request
      body, keyed with the per-webhook Signing Secret generated when the webhook is created
      (NOT the API token). No timestamp, no nonce, no version prefix, no `t=,v1=` element
      list, no field concatenation — the body alone is signed. Not Standard Webhooks.
      CRITICAL: MailerSend sends a URL-validation request on webhook create/update that must
      return 2xx or the webhook will not save. It has type `webhook.test`, a DIFFERENT
      envelope carrying `message` instead of `data`, and is signed with the FIXED, PUBLICLY
      DOCUMENTED secret `test_Am3L1GuOIc4blLUuHqAPxxwkZaJyEk8G` rather than the webhook's own
      signing secret. Handlers must accept both secrets, but because the test secret is public
      a test-secret signature must only ever authorise a `webhook.test` payload — never
      privileged work. Real envelope is {type, created_at, data}. `created_at` has TWO
      documented formats: microsecond ISO-8601 with Z for activity/inbound events, and
      space-separated `2025-08-05 22:27:14` for sender_identity.verified and maintenance.*.
      `data.meta` is an empty ARRAY `[]` when empty (not an object), which breaks naive typed
      deserialisation. `data.type` is the bare activity name (`sent`) without the `activity.`
      prefix. Delivery: respond within 3 seconds or the attempt fails; exponential backoff
      retries for ~3 days. SEPARATELY, a webhook whose endpoint "stays down too long" is
      auto-paused and must be re-enabled from the dashboard — the docs never tie that threshold
      to the retry window, so do not assert they are the same deadline. 4xx other than 429 and
      DNS failures are never retried. No delivery-id header, no source-IP allowlist, no X-MailerSend-*
      headers — dedupe on data.id. The official Node SDK ships MailerSendUtils.verifyWebHook
      but it is NOT exported from the package entry point and calls timingSafeEqual without a
      length guard (throws RangeError); the Python SDK has no verification helper — verify
      manually. SMS webhooks (SMS -> Webhooks, /v1/sms-webhooks) use an identical security
      model and add sms.sent, sms.delivered, sms.failed. Inbound Routing is a separate
      surface with its own `secret` field and is out of scope. Events: activity.sent,
      activity.delivered, activity.soft_bounced, activity.hard_bounced, activity.deferred
      (paid plans only), activity.opened, activity.opened_unique, activity.clicked,
      activity.clicked_unique, activity.unsubscribed, activity.spam_complaint,
      activity.survey_opened, activity.survey_submitted, sender_identity.verified,
      maintenance.start, maintenance.end, inbound_forward.failed, inbound_message.rejected,
      email_single.verified, email_list.verified, bulk_email.completed,
      recipient.on_hold_added, recipient.on_hold_removed, plus webhook.test.
    sdks:
      npm: ["mailersend"]
      pip: ["mailersend"]
    testScenario:
      events:
        - activity.delivered
        - activity.hard_bounced

  - name: mailgun
    displayName: Mailgun
    docs:
      webhooks: https://documentation.mailgun.com/docs/mailgun/user-manual/webhooks/webhooks
      verification: https://documentation.mailgun.com/docs/mailgun/user-manual/webhooks/securing-webhooks
      events: https://documentation.mailgun.com/docs/mailgun/user-manual/events/events
    notes: >
      Email delivery platform. Webhooks can be configured at account level (all domains) or
      domain level (per-sending-domain); both use the same signature scheme and the same HTTP
      Webhook Signing Key — one skill, not two. Signature is delivered INSIDE the request body
      as a top-level "signature" object with three fields: timestamp (epoch seconds), token
      (50-char random string), signature (hex). Verify by computing
      HMAC-SHA256(signing_key, timestamp + token) — concatenate with NO separator — and
      comparing the hex digest to signature.signature with timing-safe comparison. For
      subaccounts, payloads may include a parent-signature field signed with the parent
      account's key. Cache tokens for replay protection. Events: accepted, rejected, delivered,
      failed (with severity: permanent or temporary), opened, clicked, unsubscribed, complained,
      stored, list_member_uploaded.
    testScenario:
      events:
        - delivered
        - failed

  - name: meraki
    displayName: Cisco Meraki
    docs:
      webhooks: https://developer.cisco.com/meraki/webhooks/
      verification: https://developer.cisco.com/meraki/webhooks/introduction/#shared-secret
      events: https://developer.cisco.com/meraki/webhooks/
    notes: >
      Cisco Meraki Dashboard webhook alerts. Does NOT use an HMAC signature header and does NOT
      follow the Standard Webhooks spec. Verification is a plaintext "sharedSecret" field carried
      INSIDE the JSON request body: compare payload.sharedSecret against the shared secret set on
      the HTTP server (Dashboard > Network-wide > Alerts > Webhooks / HTTP servers) with a
      timing-safe string compare. The secret is optional and unencrypted — TLS (HTTPS, CA-trusted
      cert; no self-signed) is the real transport protection. Payloads carry alertType (human
      label) plus alertTypeId (stable machine id) — dispatch on alertTypeId. Common ids:
      motion_alert ("Motion detected"), settings_changed ("Settings changed"), sensor_alert
      ("Sensor change detected"), stopped_reporting ("APs went down"). Other fields: version,
      sharedSecret, sentAt, occurredAt, organizationId, networkId, deviceSerial, alertId,
      alertData. Custom payload templates use the Liquid template language and can reshape the
      body/headers — don't assume the default schema when templates are enabled. Delivery ~90s
      post-event; receiver auto-disables after >100 failed attempts in 24h; "Send test" posts a
      sample. Live alert list via GET /organizations/{organizationId}/webhooks/alertTypes. The
      Meraki SDKs are Dashboard-API clients only — none verify webhooks (there is no signature).
    testScenario:
      events:
        - motion_alert
        - sensor_alert
  - name: monday
    displayName: monday.com
    docs:
      webhooks: https://developer.monday.com/api-reference/reference/webhooks
      verification: https://developer.monday.com/apps/docs/integration-authorization
    notes: >
      Webhooks are created per-board via the Webhooks integration in the board's
      Integrations center or via the GraphQL create_webhook mutation (board_id, url, event,
      optional config). On creation monday.com POSTs a JSON body with a "challenge" token;
      the endpoint must echo it back as {"challenge": "<token>"} or registration fails.
      Requests MAY carry a JWT in the Authorization header — verify with a JWT library
      against the app's Signing Secret (board/integration webhooks) or Client Secret (app
      lifecycle webhooks); JWT auth is only guaranteed for webhooks created with an
      integration app token — webhooks created with a personal API token or the no-code
      board integration may not include it, leaving the challenge handshake as the only
      creation-time check. Does NOT follow the Standard Webhooks spec. Payload wraps data in
      an "event" object (userId, boardId, pulseId, pulseName, columnValues, triggerTime,
      subscriptionId, triggerUuid; subitem events add parentItemId/parentItemBoardId).
      Retries: once a minute for 30 minutes.
    testScenario:
      events:
        - create_item
        - change_column_value
        - create_update
    sdks:
      npm: [monday-sdk-js]
  - name: microsoft-graph
    displayName: Microsoft Graph
    docs:
      webhooks: https://learn.microsoft.com/en-us/graph/webhooks
      verification: https://learn.microsoft.com/en-us/graph/change-notifications-delivery-webhooks
      events: https://learn.microsoft.com/en-us/graph/api/resources/subscription?view=graph-rest-1.0
    notes: >
      No HMAC signatures and does NOT follow the Standard Webhooks spec; three-part
      validation model: (1) endpoint validation — on subscription create, Graph POSTs
      ?validationToken={token} and you must echo the URL-decoded token back as text/plain
      with HTTP 200 within 10 seconds; (2) clientState — opaque shared secret set at
      subscription time, echoed in every notification, reject mismatches; (3) for rich
      notifications (includeResourceData: true), each POST carries a validationTokens array
      of JWTs — validate via Microsoft identity platform OIDC keys, audience = your app ID,
      caller appid = 0bf30f3b-4a52-48df-9a82-234910c4a086; resource data is AES-encrypted
      (CBC/PKCS7) with an RSA-wrapped dataKey plus HMAC-SHA256 dataSignature, requiring
      encryptionCertificate at subscribe time. Subscriptions via POST
      https://graph.microsoft.com/v1.0/subscriptions with changeType
      (created/updated/deleted, comma-combinable), resource, notificationUrl,
      expirationDateTime. Short max lifetimes force renewal via PATCH: presence 1 hour,
      Teams messages 3 days, Outlook ~7 days (~1 day with resource data), driveItem and
      SharePoint list ~30 days, user/group ~29 days. Must return 2xx within 3 seconds
      (202 recommended, process async) or Graph retries up to 4 hours. Handle lifecycle
      notifications on a separate lifecycleNotificationUrl: reauthorizationRequired,
      subscriptionRemoved, missed (resync via delta query). SDKs manage subscriptions only —
      no official verification helper.
    testScenario:
      events:
        - "changeType: created,updated on resource /me/mailFolders('inbox')/messages"
        - "changeType: updated,deleted on resource /users"
    sdks:
      npm: ["@microsoft/microsoft-graph-client"]
      pip: ["msgraph-sdk"]

  - name: microsoft-sharepoint
    displayName: Microsoft SharePoint
    docs:
      webhooks: https://learn.microsoft.com/en-us/sharepoint/dev/apis/webhooks/overview-sharepoint-webhooks
      verification: https://learn.microsoft.com/en-us/sharepoint/dev/apis/webhooks/lists/create-subscription
      events: https://learn.microsoft.com/en-us/sharepoint/dev/apis/webhooks/lists/overview-sharepoint-list-webhooks
    notes: >
      No HMAC / no request signatures and NOT Standard Webhooks. Two-part model:
      (a) Validation handshake — when a subscription is created (or its notificationUrl
      changes), SharePoint POSTs ?validationtoken={token} with an empty body; the endpoint
      must echo that exact token back as an HTTP 200 text/plain body within ~5 seconds or
      creation fails. (b) Optional clientState — a string set at subscription time that
      SharePoint echoes in the clientState field of every notification; compare timing-safe
      as a shared-secret sanity check (the only per-message identity signal, not a signature).
      Notifications are THIN and batched under a "value" array: subscriptionId, clientState,
      expirationDateTime, resource (list GUID), tenantId, siteUrl, webId — NO change details.
      Call the list GetChanges API with a stored change token to learn what changed
      (ChangeType: Add/Update/DeleteObject/Rename/Restore/Move, i.e. ItemAdded/ItemUpdated/etc.).
      Create via POST /_api/web/lists('{list-guid}')/subscriptions with { resource,
      notificationUrl, expirationDateTime, clientState? }; expiration max 180 days, renew via
      PATCH before it lapses. Scope is list-item / document-library events only. SharePoint
      retries 5x at 5-min intervals on non-2xx. SDKs (@pnp/sp, PnP) manage subscriptions and
      GetChanges only — there is no inbound verification helper, so verify manually.
    testScenario:
      events:
        - ItemAdded
        - ItemUpdated
      prompt: >
        Create a {framework} webhook handler for Microsoft SharePoint list webhooks. There is
        NO signature — first answer the validation handshake by echoing the validationtoken
        query-string parameter back as an HTTP 200 text/plain body (before any body parsing,
        within ~5 seconds). Then parse the thin batched notification payload (value array) and
        timing-safe compare each notification's clientState to your stored SHAREPOINT_CLIENT_STATE
        secret, rejecting mismatches with 400. Notifications carry no change details, so note that
        you would call the list GetChanges API with a stored change token to resolve ItemAdded/
        ItemUpdated/ItemDeleted changes. Do NOT use HMAC or Standard Webhooks. If you use any
        skills to help with this, add a comment noting which skill(s) you referenced.

  - name: notion
    displayName: Notion
    docs:
      webhooks: https://developers.notion.com/reference/webhooks
    notes: >
      Productivity workspace. Webhooks launched in the 2026-03-01 API release. Uses
      X-Notion-Signature header with HMAC-SHA256, formatted as "sha256=<hex_digest>",
      computed over the raw request body using your integration's verification_token
      as the signing key. Subscription activation requires a one-time handshake: the
      first delivery is a POST containing a verification_token in the body — extract
      and store it (do NOT verify a signature on this first message), then use it as
      the signing key for all subsequent signature verifications. Notion provides
      code examples in JavaScript, Python, and Ruby. Common events:
      page.content_updated, page.properties_updated, page.locked, page.moved,
      comment.created, data_source.schema_updated, database.schema_updated.
    testScenario:
      events:
        - page.content_updated
        - comment.created

  - name: nylas
    displayName: Nylas
    docs:
      webhooks: https://developer.nylas.com/docs/v3/notifications/webhooks/
      verification: https://developer.nylas.com/docs/cookbook/use-cases/build/verify-webhook-signatures/
      events: https://developer.nylas.com/docs/v3/notifications/notification-schemas/
    notes: >
      Signature: x-nylas-signature header (casing varies — treat as case-insensitive) =
      hex-encoded HMAC-SHA256 of the RAW request body keyed with the webhook_secret
      (unique per destination, returned on creation/rotation). Verify raw bytes before
      JSON parsing; if Content-Encoding: gzip, verify against the compressed bytes. Not
      Standard Webhooks; payloads follow CloudEvents 1.0 (specversion, type, source, id,
      time, webhook_delivery_attempt, data.{application_id, grant_id, object}). Creation
      (Dashboard or POST /v3/webhooks) triggers a challenge handshake: Nylas GETs
      ?challenge=<value> and the endpoint must echo the exact value (nothing else) with
      200 within 10s, no chunked encoding. Retries only on temporary errors
      (408/429/502/503/504/507): 2 retries for 3 total attempts with exponential backoff,
      last 10-20 min after first. 95% non-200s over 15 min marks the webhook "failing";
      72h of that marks it "failed" — manual reactivation required. Official SDKs expose
      webhook CRUD, rotateSecret, ipAddresses, and extractChallengeParameter, but NO
      signature-verify helper — implement the HMAC check with constant-time comparison.
    testScenario:
      events:
        - message.created
        - grant.expired
        - calendar.updated
    sdks:
      npm: [nylas]
      pip: [nylas]

  - name: openai
    displayName: OpenAI
    docs:
      webhooks: https://platform.openai.com/docs/guides/webhooks
      events: https://platform.openai.com/docs/guides/webhooks/events
    notes: >
      AI platform webhooks for fine-tuning jobs, batch completions, and async events.
      Uses Standard Webhooks (Svix) format with headers: webhook-id, webhook-timestamp,
      webhook-signature. Secret format is whsec_<base64>. HMAC-SHA256 with base64 encoding.
    testScenario:
      events:
        - fine_tuning.job.succeeded
        - batch.completed

